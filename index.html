function renderCatalogProductsTable() {
  const { products, components, componentVendors, invSnapshot, bundleCompositions } = window._catalogProductsCache || { products: [], components: [], componentVendors: [], invSnapshot: [], bundleCompositions: [] };
  const el = document.getElementById('catalog-accordion-body-products');
  if (!el) return;
  const canAct = canEdit();

  // Alex (2026-11-04, taste-checklist item 9): a single-field edit (rename, UoM) must not
  // collapse rows the user had open elsewhere in the table -- snapshot which product/component
  // rows are currently expanded before rebuilding, then restore them below, so this re-render
  // behaves like the accordion fix (state changes don't touch state the user isn't editing).
  const openProductIds = Array.from(el.querySelectorAll('[id^="cp-detail-"]')).filter(r => r.style.display !== 'none').map(r => r.id.replace('cp-detail-', ''));
  const openComponentIds = Array.from(el.querySelectorAll('[id^="cc-vendors-"]')).filter(r => r.style.display !== 'none').map(r => r.id.replace('cc-vendors-', ''));

  // Alex (2026-11-04): "Bundles should maybe have their own container instead of being lumped
  // into the products container." -- this table is root products only now; bundle-type products
  // and their contents live entirely in renderCatalogBundles() below. The "In bundle: X" jump
  // pills still show here (a root product needs to know it's used by a bundle), just pointing at
  // the separate Bundles accordion instead of another row of this same table.
  const rootProducts = products.filter(p => p.product_type === 'root');
  // Alex (2026-11-10): "I want active products to be sorted first in the products container."
  rootProducts.sort((a, b) => (a.is_active ? 0 : 1) - (b.is_active ? 0 : 1) || a.sku_code.localeCompare(b.sku_code));
  window._catalogAllProducts = products;
  window._catalogRootProducts = rootProducts;
  const productById = {};
  products.forEach(p => { productById[p.id] = p; });
  const bundlesContainingProduct = {};
  bundleCompositions.forEach(bc => { (bundlesContainingProduct[bc.root_product_id] = bundlesContainingProduct[bc.root_product_id] || []).push(bc); });

  const liveQtyByProduct = {};
  invSnapshot.forEach(s => { liveQtyByProduct[s.product_id] = s.qty; });
  const componentsByProduct = {};
  components.forEach(c => { (componentsByProduct[c.product_id] = componentsByProduct[c.product_id] || []).push(c); });
  const vendorsByComponent = {};
  componentVendors.forEach(cv => { (vendorsByComponent[cv.component_id] = vendorsByComponent[cv.component_id] || []).push(cv); });

  const renderComponentVendorsBlock = (component) => {
    const links = (vendorsByComponent[component.id] || []).slice().sort((a, b) => (b.is_preferred ? 1 : 0) - (a.is_preferred ? 1 : 0));
    if (!links.length) return `<div class="muted" style="font-size:13px; padding:3px 0 6px 22px;">No vendors assigned yet.</div>`;
    return `
      <div style="padding:2px 0 6px 22px;">
        ${links.map(l => `
          <div style="font-size:13px; padding:2px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <span style="min-width:130px;">${l.vendors?.vendor_name || '—'}${l.is_preferred ? ' <span class="pill good" style="font-size:11px; padding:1px 6px;">Preferred</span>' : ''}</span>
            <span class="muted">${l.lead_days ?? l.vendors?.default_lead_days ?? '—'}d lead</span>
            ${l.moq != null ? `<span class="muted">MOQ ${l.moq}</span>` : ''}
            ${l.unit_cost != null ? `<span class="muted">${fmtMoney2(l.unit_cost)}/unit</span>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  };

  // Alex (2026-11-04): "I want the product name to be not an open text field, but when clicking
  // you can edit... All of the open text fields need to be converted on this Products tab." --
  // every bare <input> in this table (component name, UoM) becomes a click-to-edit pill that
  // opens the existing showPromptModal, matching the On File/Missing pattern already used for
  // notes/COGS/safety stock elsewhere in this tab.
  const renderComponentsBlock = (product) => {
    const comps = componentsByProduct[product.id] || [];
    if (!comps.length) return `<div class="muted" style="font-size:13px; padding:4px 0;">No components on file for this product.</div>`;
    return comps.map(c => {
      const vendorNames = (vendorsByComponent[c.id] || []).map(l => l.vendors?.vendor_name).filter(Boolean);
      const nameHtml = canAct
        ? `<span class="pill clickable-pill good" style="font-size:13px;" onclick="event.stopPropagation(); editComponentNameInline('${c.id}')">${c.component_name}</span>`
        : `<strong style="font-size:14px;">${c.component_name}</strong>`;
      const uomHtml = canAct
        ? `<span class="pill clickable-pill ${c.unit_of_measure ? 'good' : 'watch'}" style="font-size:12px;" onclick="event.stopPropagation(); editComponentUomInline('${c.id}')">${c.qty_per_unit ?? 1} ${c.unit_of_measure || 'each'}</span>`
        : `<span class="muted" style="font-size:13px;">${c.qty_per_unit ?? 1} ${c.unit_of_measure || 'each'}</span>`;
      return `
        <div style="border-bottom:1px solid var(--border); padding:5px 0;">
          <div style="display:flex; align-items:center; gap:8px; cursor:pointer; flex-wrap:wrap;" onclick="toggleCatalogComponentExpand('${c.id}')">
            <span class="muted" id="cc-caret-${c.id}" style="width:12px; display:inline-block;">▸</span>
            <span style="flex:1; min-width:110px;" onclick="event.stopPropagation();">${nameHtml}</span>
            <span onclick="event.stopPropagation();">${uomHtml}</span>
            <span class="muted" style="font-size:13px; min-width:120px; text-align:right;">${vendorNames.length ? vendorNames.join(', ') : 'No vendors'}</span>
            ${canAct ? `<button class="btn btn-ghost" style="padding:2px 7px; font-size:12px;" onclick="event.stopPropagation(); showComponentVendorsModal('${c.id}', '${(c.component_name || '').replace(/'/g, "\\'")}')">Manage vendors</button>` : ''}
          </div>
          <div id="cc-vendors-${c.id}" style="display:none;">${renderComponentVendorsBlock(c)}</div>
        </div>
      `;
    }).join('');
  };

  const rows = rootProducts.map(p => {
    const nameHtml = canAct
      ? `<span class="pill clickable-pill good" style="font-size:14px;" onclick="event.stopPropagation(); editProductNameInline('${p.id}')">${p.display_name}</span>`
      : `<span style="font-size:14px;">${p.display_name}</span>`;
    const activeCell = canAct
      ? `<input type="checkbox" id="cp-active-${p.id}" ${p.is_active ? 'checked' : ''} onchange="saveCatalogProductActive('${p.id}')" onclick="event.stopPropagation();" />`
      : (p.is_active ? '<span class="pill good">Active</span>' : '<span class="pill bad">Inactive</span>');
    const cogsCell = canAct
      ? `<span class="pill clickable-pill ${p.unit_cogs ? 'good' : 'watch'}" onclick="event.stopPropagation(); showProductCogsModal('${p.id}')">${p.unit_cogs ? fmtMoney2(p.unit_cogs) : 'Missing'}</span>`
      : (p.unit_cogs ? fmtMoney2(p.unit_cogs) : '—');
    // Alex (2026-11-10, round 2): "I'd like to have the PC1, PC2, and PC3 as columns in the
    // Catalog tab for the products & bundles." -- each margin-waterfall step gets its own
    // column (not folded into one "View breakdown" pill); any of the three opens the same
    // editable breakdown modal (showProductProfitModal).
    const pcCell = (key, pctKey) => {
      const d = p.cogs_breakdown;
      if (!d || d[key] == null) return `<span class="muted" style="font-size:13px;">—</span>`;
      const pctStr = d[pctKey] != null ? ` <span class="muted" style="font-size:12px;">(${(d[pctKey] * 100).toFixed(0)}%)</span>` : '';
      return `<span class="pill clickable-pill good" onclick="event.stopPropagation(); showProductProfitModal('${p.id}')">${fmtMoney2(d[key])}${pctStr}</span>`;
    };
    const pc1Cell = pcCell('PC 1 ($)', 'PC 1 (%)');
    const pc2Cell = pcCell('PC 2 ($)', 'PC 2 (%)');
    const pc3Cell = pcCell('PC 3 ($)', 'PC 3 (%)');

    // Alex (2026-11-04): "the sku nomenclature should be there upon clicking the button alongside
    // some preliminary stock information" -- SKU + live Shopify qty + safety stock as a compact
    // strip at the TOP of the expanded detail, before Components. Live qty mirrors the same
    // Shopify-is-truth rule the Overview/Revenue tabs use (product_inventory_snapshot), falling
    // back to "—" for products never live in Shopify (e.g. unlaunched SKUs).
    const liveQty = liveQtyByProduct[p.id];
    const memberOf = bundlesContainingProduct[p.id] || [];
    const statStripHtml = `
      <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; padding:6px 0 10px; border-bottom:1px solid var(--border); margin-bottom:8px;">
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">SKU</span><br><strong style="font-size:14px;">${p.sku_code}</strong></div>
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Live Stock</span><br><strong style="font-size:14px;">${liveQty != null ? liveQty.toLocaleString() + ' units' : '—'}</strong></div>
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Safety Stock</span><br><strong style="font-size:14px;">${p.safety_stock_qty ? p.safety_stock_qty.toLocaleString() + ' units' : '—'}</strong></div>
        ${memberOf.length ? `<div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">In Bundle${memberOf.length > 1 ? 's' : ''}</span><br>${memberOf.map(bc => `<span class="pill clickable-pill watch" style="font-size:11px; margin-right:3px;" onclick="jumpToCatalogBundle('${bc.bundle_id}')">${(productById[bc.bundle_id]?.display_name || 'Unknown').replace(/"/g, '&quot;')}</span>`).join('')}</div>` : ''}
        ${canAct ? `<div style="margin-left:auto;"><button class="btn btn-ghost" style="font-size:12px; color:var(--bad-text);" onclick="event.stopPropagation(); deleteProduct('${p.id}', '${(p.display_name || '').replace(/'/g, "\\'")}')">Delete Product</button></div>` : ''}
      </div>
    `;

    const nestedHtml = `
      ${statStripHtml}
      <div class="section-label" style="margin:0 0 6px;">Components</div>
      ${renderComponentsBlock(p)}
    `;

    return `
      <tr id="cp-row-${p.id}" style="cursor:pointer;" onclick="toggleCatalogProductExpand('${p.id}')">
        <td style="padding:6px 6px; border-bottom:1px solid var(--border);"><span class="muted" id="cp-caret-${p.id}">▸</span></td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);" onclick="event.stopPropagation();">${nameHtml}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${activeCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${cogsCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${pc1Cell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${pc2Cell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${pc3Cell}</td>
      </tr>
      <tr id="cp-detail-${p.id}" style="display:none;"><td colspan="7" style="padding:2px 10px 14px 32px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.015);" onclick="event.stopPropagation();">${nestedHtml}</td></tr>
    `;
  }).join('');

  el.innerHTML = `
    <div class="muted" style="font-size:12px; margin-bottom:6px;">
      Click a name to rename it; click a row to expand SKU, live stock, and components. Click PC1/PC2/PC3 to view or edit the full profit breakdown.
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%; font-size:14px; border-collapse:collapse;">
        <thead><tr>
          <th style="padding:6px 6px; width:18px;"></th>
          ${['Name', 'Active', 'COGS', 'PC1', 'PC2', 'PC3'].map(h => `<th style="padding:6px 10px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="muted" style="padding:10px;">No products found.</td></tr>'}</tbody>
      </table>
    </div>
  `;

  // Restore whichever rows were expanded before this render -- see the taste-checklist note
  // above the snapshot. Component-vendor rows only exist once their parent product row is open,
  // so products are restored first.
  openProductIds.forEach(id => toggleCatalogProductExpand(id));
  openComponentIds.forEach(id => toggleCatalogComponentExpand(id));
}

// Alex (2026-11-10): "when clicking new product... there should be separate screenflows to help
// with product setup." Replaced the single-form modal with a 4-step wizard: Basics -> Components
// (each with a vendor right there, not deferred) -> COGS -> Review & Create. Per Alex: safety
// stock is intentionally OUT of this flow -- it's an auto-generated demand_engine.py output for
// products with real sales history, not something a brand-new product (zero history) can get a
// real value for; the wizard shouldn't pretend otherwise by asking for a number anyway.
window._npWizard = null;

function npWizardInit() {
  window._npWizard = { step: 1, sku_code: '', display_name: '', is_active: true, components: [], cogs: {} };
}

async function showNewProductModal() {
  document.getElementById('detail-modal-backdrop')?.remove();
  npWizardInit();
  const [{ data: vendors }] = await Promise.all([sb.from('vendors').select('id, vendor_name').eq('is_active', true).order('vendor_name')]);
  window._npWizardVendors = vendors || [];
  renderNpWizard();
}

function npStepLabel(n, label) {
  const w = window._npWizard;
  const active = w.step === n;
  const done = w.step > n;
  return `<span style="display:flex; align-items:center; gap:5px; font-size:12px; ${active ? 'font-weight:700; color:var(--ink);' : 'color:var(--muted);'}">
    <span style="width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; ${done ? 'background:var(--good-text); color:#fff;' : active ? 'background:var(--accent); color:#fff;' : 'background:var(--border); color:var(--muted);'}">${done ? '✓' : n}</span>${label}
  </span>`;
}

function renderNpWizard() {
  const w = window._npWizard;
  document.getElementById('detail-modal-backdrop')?.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };

  const stepperHtml = `
    <div style="display:flex; justify-content:space-between; gap:6px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border);">
      ${npStepLabel(1, 'Basics')}${npStepLabel(2, 'Components')}${npStepLabel(3, 'COGS')}${npStepLabel(4, 'Review')}

  let bodyHtml = '';
  if (w.step === 1) {
    bodyHtml = `
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">SKU Code</label>

      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Display Name</label>
      <input type="text" id="np-name-input" placeholder="e.g. Night Oil 100ml" value="${w.display_name}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-bottom:14px;" />
      <label style="font-size:13px; display:flex; align-items:center; gap:6px; margin-bottom:4px;">

      </label>
    `;
  } else if (w.step === 2) {
    const compRows = w.components.map((c, i) => `
      <div style="border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
        <span style="flex:1; min-width:120px; font-size:14px;">${c.component_name}</span>
        <span class="muted" style="font-size:12px;">${c.qty_per_unit} ${c.unit_of_measure || 'each'}</span>
        <span class="muted" style="font-size:12px;">${(window._npWizardVendors.find(v => v.id === c.vendor_id) || {}).vendor_name || 'No vendor'}</span>

    bodyHtml = `
      <div class="muted" style="font-size:12px; margin-bottom:8px;">Add every component this product is made of. At least one is recommended -- you can also add more later from the Catalog tab.</div>
      ${compRows || '<div class="muted" style="font-size:13px; margin-bottom:8px;">No components added yet.</div>'}
      <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:4px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Component Name</label>
        <input type="text" id="np-comp-name" placeholder="e.g. Amber glass bottle, 2oz" style="width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--border); margin-bottom:8px;" />
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <div style="flex:1;">
            <label style="display:block; font-size:12px; font-weight:600; margin-bottom:3px;">Qty per Unit</label>
            <input type="number" id="np-comp-qty" value="1" step="any" style="width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--border);" />
          </div>
          <div style="flex:1;">
            <label style="display:block; font-size:12px; font-weight:600; margin-bottom:3px;">UoM</label>
            <input type="text" id="np-comp-uom" placeholder="each, mL, g" style="width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--border);" />
          </div>
        </div>
        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:3px;">Vendor</label>
        <select id="np-comp-vendor" style="width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--border); margin-bottom:8px;">
          <option value="">No vendor yet</option>
          ${window._npWizardVendors.map(v => `<option value="${v.id}">${v.vendor_name}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" style="font-size:13px;" onclick="npAddComponent()">+ Add Component</button>
      </div>
    `;
  } else if (w.step === 3) {
    // Alex (2026-11-10, round 2): "I need a way to set up the full margin profile upon creating
    // a product as well." -- step 3 is now the same editable breakdown as the Catalog Profit
    // modal (computeProfitWaterfall), not just a single COGS number. Freight/other costs start
    // as a blank line item the user can rename; component costs default to $0 (no per-component
    // cost was captured in step 2, which only asked for qty/UoM/vendor, not a dollar figure) --
    // editable here before the product is created, exactly like the post-creation modal.
    w.cogsLineItems = w.cogsLineItems || w.components.map(c => ({ key: c.component_name, value: 0 }));
    w.cogsExtra = w.cogsExtra || { price: 0, logistics: 0, shipping: 0, marketing: 0 };
    const wf = npComputeWizardWaterfall();
    const lineItemRows = w.cogsLineItems.map((li, i) => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
        <span class="muted">${li.key}</span>
        <input type="number" step="0.01" id="np-li-${i}" value="${li.value}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="npUpdateMarginPreview()" />
      </div>
    `).join('');
    bodyHtml = `
      <div class="muted" style="font-size:12px; margin-bottom:8px;">Optional -- can be filled in later from the Catalog tab. Component costs default from Step 2; add Price/Logistics/Shipping/Marketing to see the full margin waterfall now.</div>
      <div class="section-label" style="margin-bottom:2px;">Component costs</div>
      ${lineItemRows || '<div class="muted" style="font-size:13px;">No components added in Step 2.</div>'}
      <div style="display:flex; justify-content:space-between; padding:3px 0; font-weight:700; border-top:1px solid var(--border); margin-top:2px;">
        <span>Total COGS</span><span id="np-cogs-total">${fmtMoney2(wf.cogs)}</span>
      </div>
      <div class="section-label" style="margin:10px 0 2px;">Margin waterfall</div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
        <span class="muted">Price</span>
        <input type="number" step="0.01" id="np-margin-price" value="${w.cogsExtra.price}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="npUpdateMarginPreview()" />
      </div>
      <div style="display:flex; justify-content:space-between; padding:3px 0; font-weight:700; border-top:1px solid var(--border);">
        <span>= Gross profit (PC1)</span><span id="np-pc1">${fmtMoney2(wf.pc1)}</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
        <span class="muted">Logistics</span>
        <input type="number" step="0.01" id="np-margin-logistics" value="${w.cogsExtra.logistics}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="npUpdateMarginPreview()" />
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
        <span class="muted">Shipping</span>
        <input type="number" step="0.01" id="np-margin-shipping" value="${w.cogsExtra.shipping}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="npUpdateMarginPreview()" />
      </div>
      <div style="display:flex; justify-content:space-between; padding:3px 0; font-weight:700; border-top:1px solid var(--border);">
        <span>= Contribution margin (PC2)</span><span id="np-pc2">${fmtMoney2(wf.pc2)}</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
        <span class="muted">Marketing</span>
        <input type="number" step="0.01" id="np-margin-marketing" value="${w.cogsExtra.marketing}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="npUpdateMarginPreview()" />
      </div>
      <div style="display:flex; justify-content:space-between; padding:3px 0; font-weight:700; border-top:1px solid var(--border);">
        <span>= Net margin after marketing (PC3)</span><span id="np-pc3">${fmtMoney2(wf.pc3)}</span>
      </div>
    `;
  } else if (w.step === 4) {
    const w3 = npComputeWizardWaterfall();
    bodyHtml = `
      <div style="font-size:14px; line-height:1.7;">
        <div><span class="muted">SKU</span> <strong>${w.sku_code}</strong></div>
        <div><span class="muted">Name</span> <strong>${w.display_name}</strong></div>
        <div><span class="muted">Active</span> <strong>${w.is_active ? 'Yes' : 'No'}</strong></div>
        <div><span class="muted">Components</span> <strong>${w.components.length}</strong>${w.components.length ? ': ' + w.components.map(c => c.component_name).join(', ') : ''}</div>
        <div><span class="muted">Unit COGS</span> <strong>${fmtMoney2(w3.cogs)}</strong></div>
        <div><span class="muted">Price / PC1 / PC2 / PC3</span> <strong>${fmtMoney2(w3.price)} / ${fmtMoney2(w3.pc1)} / ${fmtMoney2(w3.pc2)} / ${fmtMoney2(w3.pc3)}</strong></div>
      </div>

  }

  const canBack = w.step > 1;
  const isLast = w.step === 4;
  el.innerHTML = `
    <div class="detail-modal" style="max-width:460px;">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">New Product</div>
      ${stepperHtml}
      <div style="min-height:140px;">${bodyHtml}</div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        ${canBack ? `<button class="btn btn-ghost" onclick="npWizardBack()">Back</button>` : ''}
        ${isLast
          ? `<button class="btn btn-primary" onclick="npWizardCreate()">Create Product</button>`
          : `<button class="btn btn-primary" onclick="npWizardNext()">Next</button>`}
        <button class="btn btn-ghost" id="np-cancel-btn" style="margin-left:auto;">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  document.getElementById('np-cancel-btn').onclick = () => { el.remove(); window._npWizard = null; };
}

async function npAddComponent() {
  const name = document.getElementById('np-comp-name')?.value.trim();
  if (!name) { await showConfirmModal('Check your input', 'Component name is required.', { okOnly: true }); return; }
  const qty_per_unit = Number(document.getElementById('np-comp-qty')?.value) || 1;
  const unit_of_measure = document.getElementById('np-comp-uom')?.value.trim() || null;
  const vendor_id = document.getElementById('np-comp-vendor')?.value || null;
  window._npWizard.components.push({ component_name: name, qty_per_unit, unit_of_measure, vendor_id });
  renderNpWizard();
}

function npRemoveComponent(i) {
  window._npWizard.components.splice(i, 1);
  renderNpWizard();
}

function npComputeWizardWaterfall() {
  const w = window._npWizard;
  const breakdown = {
    ...Object.fromEntries(w.cogsLineItems.map(li => [li.key, li.value])),
    'Price': w.cogsExtra.price, 'Logistics Cost': w.cogsExtra.logistics,
    'Shipping Cost': w.cogsExtra.shipping, 'Marketing Cost': w.cogsExtra.marketing,
  };
  return computeProfitWaterfall(breakdown);
}

// Live-updates the Step 3 margin waterfall preview as the user types, reading current input
// values straight off the DOM (mirrors recomputeProfitModalPreview's pattern for the post-
// creation Catalog modal) without re-rendering the whole wizard body on every keystroke.
function npUpdateMarginPreview() {
  const w = window._npWizard;
  w.cogsLineItems.forEach((li, i) => { li.value = Number(document.getElementById(`np-li-${i}`)?.value) || 0; });
  w.cogsExtra = {
    price: Number(document.getElementById('np-margin-price')?.value) || 0,
    logistics: Number(document.getElementById('np-margin-logistics')?.value) || 0,
    shipping: Number(document.getElementById('np-margin-shipping')?.value) || 0,
    marketing: Number(document.getElementById('np-margin-marketing')?.value) || 0,
  };
  const r = npComputeWizardWaterfall();
  const setText = (id, text) => { const node = document.getElementById(id); if (node) node.textContent = text; };
  setText('np-cogs-total', fmtMoney2(r.cogs));
  setText('np-pc1', fmtMoney2(r.pc1));
  setText('np-pc2', fmtMoney2(r.pc2));
  setText('np-pc3', fmtMoney2(r.pc3));
}

async function npWizardNext() {
  const w = window._npWizard;
  if (w.step === 1) {
    const sku_code = document.getElementById('np-sku-input')?.value.trim();
    const display_name = document.getElementById('np-name-input')?.value.trim();
    const is_active = document.getElementById('np-active-input')?.checked ?? true;
    if (!sku_code || !display_name) { await showConfirmModal('Check your input', 'SKU code and display name are both required.', { okOnly: true }); return; }
    w.sku_code = sku_code; w.display_name = display_name; w.is_active = is_active;
  } else if (w.step === 3) {
    // Alex (2026-11-10, round 2): capture the full margin profile, not just unit_cogs. Build the
    // same flat breakdown dict shape computeProfitWaterfall()/the Catalog profit modal expect
    // (component line items by name + Price/Logistics Cost/Shipping Cost/Marketing Cost), store
    // it as cogs_breakdown so the Catalog tab's COGS/profit popup works immediately post-creation
    // instead of needing the numbers re-entered there.
    w.cogsLineItems.forEach((li, i) => { li.value = Number(document.getElementById(`np-li-${i}`)?.value) || 0; });
    w.cogsExtra = {
      price: Number(document.getElementById('np-margin-price')?.value) || 0,
      logistics: Number(document.getElementById('np-margin-logistics')?.value) || 0,
      shipping: Number(document.getElementById('np-margin-shipping')?.value) || 0,
      marketing: Number(document.getElementById('np-margin-marketing')?.value) || 0,
    };
    const breakdown = npComputeWizardWaterfall();
    w.cogs = { unit_cogs: breakdown.cogs };
    w.cogsBreakdown = {
      ...Object.fromEntries(w.cogsLineItems.map(li => [li.key, li.value])),
      'Price': w.cogsExtra.price, 'Logistics Cost': w.cogsExtra.logistics,
      'Shipping Cost': w.cogsExtra.shipping, 'Marketing Cost': w.cogsExtra.marketing,
    };
  }
  w.step += 1;
  renderNpWizard();
}

function npWizardBack() {
  const w = window._npWizard;
  w.step -= 1;
  renderNpWizard();
}

async function npWizardCreate() {
  const w = window._npWizard;
  const logIds = [];
  const { data: product, error } = await sb.from('products').insert({
    sku_code: w.sku_code, display_name: w.display_name, product_type: 'root', is_active: w.is_active,
    unit_cogs: w.cogs.unit_cogs, cogs_breakdown: w.cogsBreakdown || null,
  }).select().single();
  if (error) { await showConfirmModal('Something went wrong', 'Create failed: ' + error.message, { okOnly: true, danger: true }); return; }
  const productLogId = await logAction('products', product.id, 'create', `Created new product ${w.display_name} (${w.sku_code}) via setup wizard`, null, product, { silent: true });
  if (productLogId) logIds.push(productLogId);

  for (const c of w.components) {
    const { data: comp, error: compError } = await sb.from('components').insert({
      component_name: c.component_name, product_id: product.id, unit_of_measure: c.unit_of_measure, qty_per_unit: c.qty_per_unit,
    }).select().single();
    if (compError) { await showConfirmModal('Something went wrong', `Product created, but failed to add component "${c.component_name}": ${compError.message}`, { okOnly: true, danger: true }); continue; }
    const compLogId = await logAction('components', comp.id, 'create', `Created component ${c.component_name} for ${w.display_name} via setup wizard`, null, comp, { silent: true });
    if (compLogId) logIds.push(compLogId);
    if (c.vendor_id) {
      const { data: cv, error: cvError } = await sb.from('component_vendors').insert({ component_id: comp.id, vendor_id: c.vendor_id, is_preferred: true }).select().single();
      if (cvError) { await showConfirmModal('Something went wrong', `Component "${c.component_name}" created, but failed to link its vendor: ${cvError.message}`, { okOnly: true, danger: true }); continue; }

// Styled replacement for window.confirm()/alert() -- Alex (2026-11-10): "instead of a screen
// popup after 'delete product' is hit, it should be a pop up box." Reused anywhere a plain
// browser confirm()/alert() would otherwise show (block/success message with just an OK button,
// or a real confirm with OK/Cancel) -- same detail-modal visual language as showPromptModal.
// Accepts either the
// legacy 3rd-arg string (a custom confirm-button label, used by the original call sites) or an
// options object ({okLabel, danger, okOnly}, added in round 13 for cascade-delete confirmations)
// -- found as a real regression during the round-14 popup audit: a second showConfirmModal
// definition silently overrode this one, so every pre-existing call passing a string label
// (Cancel Order, Delete, Remove, Commit, ...) got treated as an options object instead and
// always fell back to the default "Confirm" label.
function showConfirmModal(title, message, opts) {
  if (typeof opts === 'string') opts = { okLabel: opts };
  return new Promise(resolve => {
    document.getElementById('detail-modal-backdrop')?.remove();
    const el = document.createElement('div');
    el.id = 'detail-modal-backdrop';
    el.className = 'detail-modal-backdrop';
    const finish = (val) => { el.remove(); resolve(val); };
    el.onclick = (e) => { if (e.target === el) finish(opts?.okOnly ? true : false); };
    el.innerHTML = `
      <div class="detail-modal" style="max-width:460px;">
        <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px; ${opts?.danger ? 'color:var(--bad-text);' : ''}">${title}</div>
        <div style="font-size:14px; line-height:1.5; margin-bottom:16px;">${message}</div>
        <div style="display:flex; gap:8px;">
          ${opts?.okOnly
            ? `<button class="btn btn-primary" id="confirm-modal-ok">OK</button>`
            : `<button class="btn ${opts?.danger ? 'btn-primary' : 'btn-primary'}" style="${opts?.danger ? 'background:var(--bad-text);' : ''}" id="confirm-modal-ok">${opts?.okLabel || 'Confirm'}</button>
               <button class="btn btn-ghost" id="confirm-modal-cancel">Cancel</button>`}
        </div>
      </div>
    `;
    document.body.appendChild(el);
    document.getElementById('confirm-modal-ok').onclick = () => finish(true);
    document.getElementById('confirm-modal-cancel')?.addEventListener('click', () => finish(false));
  });
}

// Alex (2026-11-10): "I also need a way to delete a product if need be." A product has 13 other
// tables with FKs into it (inventory_ledger, historical_revenue_pct, purchase_orders,
// agent_recommendations, etc.) -- Alex explicitly chose (over cascade-delete or UI-checkbox-only):
// hard delete only when the product has genuinely zero real activity across every one of those,
// otherwise block it and point at the existing Active toggle instead. Checks the handful that
// matter in practice (a brand-new/test product created in error would show zero everywhere; any
// real product will have landed at least one of these the moment it's live).
// Alex (2026-11-10, round 13): "I need the ability to delete components & products at will and
// when deleting ensure I'm sure and then delete from database." Full cascade delete -- confirmed
// explicitly with Alex: delete should wipe ALL related rows (ledger, revenue, POs, bundle links,
// forecasts, etc.), not just block on them like the old "clean delete only" rule did. Still
// checks and SHOWS what it's about to wipe (open orders / vendor links, same "blockers" idea as
// before) so "ensure I'm sure" is a real review step, not just a generic warning -- and requires
// typing the exact name to confirm, since this is now genuinely irreversible-feeling (though it
// IS still undoable via the Activity Log's bulk-undo, like every other delete here).
async function cascadeDeleteProduct(productId, displayName) {
  const [
    { data: ledgerRows }, { data: revenueRows }, { data: poRows },
    { data: bundleAsRoot }, { data: bundleAsMember }, { data: componentRows },
    { data: agentRecRows }, { data: forecastRows }, { data: forecastMonthlyRows },
    { data: adjRows }, { data: projRows }, { data: snapshotRows },
    { data: scenarioMixRows }, { data: scenarioPoRows },
  ] = await Promise.all([
    sb.from('inventory_ledger').select('*').eq('product_id', productId),
    sb.from('historical_revenue_pct').select('*').eq('product_id', productId),
    sb.from('purchase_orders').select('*').eq('product_id', productId),
    sb.from('bundle_compositions').select('*').eq('root_product_id', productId),
    sb.from('bundle_compositions').select('*').eq('bundle_id', productId),
    sb.from('components').select('*').eq('product_id', productId),
    sb.from('agent_recommendations').select('*').eq('product_id', productId),
    sb.from('forecast_params').select('*').eq('product_id', productId),
    sb.from('forecast_params_monthly').select('*').eq('product_id', productId),
    sb.from('manual_throughput_adjustments').select('*').eq('product_id', productId),
    sb.from('monthly_projections').select('*').eq('product_id', productId),
    sb.from('product_inventory_snapshot').select('*').eq('product_id', productId),
    sb.from('revenue_scenario_mix').select('*').eq('product_id', productId),
    sb.from('revenue_scenario_po').select('*').eq('product_id', productId),
  ]);
  const componentIds = (componentRows || []).map(c => c.id);
  let componentVendorRows = [];
  let componentLedgerRows = [];
  let componentPoRows = [];
  if (componentIds.length) {
    const [{ data: cv }, { data: cl }, { data: cp }] = await Promise.all([
      sb.from('component_vendors').select('*').in('component_id', componentIds),
      sb.from('inventory_ledger').select('*').in('component_id', componentIds),
      sb.from('purchase_orders').select('*').in('component_id', componentIds),
    ]);
    componentVendorRows = cv || []; componentLedgerRows = cl || []; componentPoRows = cp || [];
  }
  const summary = [
    { label: 'inventory ledger rows (finished good)', rows: ledgerRows },
    { label: 'months of revenue history', rows: revenueRows },
    { label: 'purchase orders (finished good)', rows: poRows },
    { label: 'bundle compositions (as a bundle root)', rows: bundleAsRoot },
    { label: 'bundle compositions (as a bundle member)', rows: bundleAsMember },
    { label: 'components', rows: componentRows },
    { label: 'component-vendor links', rows: componentVendorRows },
    { label: 'component inventory ledger rows', rows: componentLedgerRows },
    { label: 'component purchase orders', rows: componentPoRows },
    { label: 'agent recommendations', rows: agentRecRows },
    { label: 'forecast params', rows: forecastRows },
    { label: 'monthly forecast params', rows: forecastMonthlyRows },
    { label: 'manual throughput adjustments', rows: adjRows },
    { label: 'monthly projections', rows: projRows },
    { label: 'inventory snapshots', rows: snapshotRows },
    { label: 'revenue scenario mix rows', rows: scenarioMixRows },
    { label: 'revenue scenario PO rows', rows: scenarioPoRows },
  ].filter(s => s.rows && s.rows.length);

  const bodyMsg = summary.length
    ? `This will PERMANENTLY delete "${displayName}" AND everything tied to it:<br><br>` +
      summary.map(s => `&nbsp;&nbsp;• ${s.rows.length} ${s.label}`).join('<br>') +
      `<br><br>Type the product name below to confirm.`
    : `"${displayName}" has no related records on file -- this will permanently delete just the product itself.<br><br>Type the product name below to confirm.`;
  const typed = await showPromptModal(`Delete "${displayName}"?`, bodyMsg, '');
  if (typed === null || typed.trim() !== displayName) {
    if (typed !== null) await showConfirmModal('Not deleted', 'The name you typed didn\'t match exactly, so nothing was deleted.', { okOnly: true, danger: true });
    return;
  }

  const { data: before } = await sb.from('products').select('*').eq('id', productId).single();
  const logIds = [];
  const logDelete = async (table, row) => {
    const id = await logAction(table, row.id, 'delete', `Cascade-deleted ${table} row (product "${displayName}" delete)`, row, null, { silent: true });
    if (id) logIds.push(id);
  };
  // Children first, in dependency order, so no FK violation occurs mid-delete.
  for (const row of componentVendorRows) { await sb.from('component_vendors').delete().eq('id', row.id); await logDelete('component_vendors', row); }
  for (const row of componentLedgerRows) { await sb.from('inventory_ledger').delete().eq('id', row.id); await logDelete('inventory_ledger', row); }
  for (const row of componentPoRows) { await sb.from('purchase_orders').delete().eq('id', row.id); await logDelete('purchase_orders', row); }
  for (const row of (componentRows || [])) { await sb.from('components').delete().eq('id', row.id); await logDelete('components', row); }
  for (const row of (bundleAsRoot || [])) { await sb.from('bundle_compositions').delete().eq('id', row.id); await logDelete('bundle_compositions', row); }
  for (const row of (bundleAsMember || [])) { await sb.from('bundle_compositions').delete().eq('id', row.id); await logDelete('bundle_compositions', row); }
  for (const row of (ledgerRows || [])) { await sb.from('inventory_ledger').delete().eq('id', row.id); await logDelete('inventory_ledger', row); }
  for (const row of (poRows || [])) { await sb.from('purchase_orders').delete().eq('id', row.id); await logDelete('purchase_orders', row); }
  for (const row of (revenueRows || [])) { await sb.from('historical_revenue_pct').delete().eq('id', row.id); await logDelete('historical_revenue_pct', row); }
  for (const row of (agentRecRows || [])) { await sb.from('agent_recommendations').delete().eq('id', row.id); await logDelete('agent_recommendations', row); }
  for (const row of (forecastRows || [])) { await sb.from('forecast_params').delete().eq('id', row.id); await logDelete('forecast_params', row); }
  for (const row of (forecastMonthlyRows || [])) { await sb.from('forecast_params_monthly').delete().eq('id', row.id); await logDelete('forecast_params_monthly', row); }
  for (const row of (adjRows || [])) { await sb.from('manual_throughput_adjustments').delete().eq('id', row.id); await logDelete('manual_throughput_adjustments', row); }
  for (const row of (projRows || [])) { await sb.from('monthly_projections').delete().eq('id', row.id); await logDelete('monthly_projections', row); }
  for (const row of (snapshotRows || [])) { await sb.from('product_inventory_snapshot').delete().eq('id', row.id); await logDelete('product_inventory_snapshot', row); }
  for (const row of (scenarioMixRows || [])) { await sb.from('revenue_scenario_mix').delete().eq('id', row.id); await logDelete('revenue_scenario_mix', row); }
  for (const row of (scenarioPoRows || [])) { await sb.from('revenue_scenario_po').delete().eq('id', row.id); await logDelete('revenue_scenario_po', row); }

  const { error } = await sb.from('products').delete().eq('id', productId);
  if (error) { await showConfirmModal('Delete failed', `Cleared ${logIds.length} related row(s), but the product itself failed to delete: ${error.message}. Check the Activity Log -- you may need to undo the related-row deletes manually.`, { okOnly: true, danger: true }); return; }
  const productLogId = await logAction('products', productId, 'delete', `Deleted product ${displayName} (cascade: ${logIds.length} related row${logIds.length === 1 ? '' : 's'})`, before, null, { silent: true });
  if (productLogId) logIds.push(productLogId);

  showBulkUndoToast(logIds, `Deleted ${displayName}${logIds.length > 1 ? ` and ${logIds.length - 1} related row${logIds.length - 1 === 1 ? '' : 's'}` : ''}`);
  await renderCatalogProducts();
  await renderCatalogBundles();
  await renderCatalogComponents();
}

// Alex (2026-11-10): "I want a column that has the COGs breakdown and profit profiles per each
// product that I can click on and a box pops out with the information." Shows the full
// line-item breakdown synced from the sheet's "COGs Active" tab (per-component costs, freight,
// logistics, shipping, marketing) plus the margin waterfall (PC1/PC2/PC3) exactly as the sheet
// computes it: PC1 = Price - COGS; PC2 = PC1 - Logistics - Shipping; PC3 = PC2 - Marketing.
// Alex (2026-11-10, round 2): "I also should be able to edit the inputs on the profit
// breakdown. I'd like for there to be a better visual for the breakdown." -- every line item,
// Price, Logistics, Shipping, and Marketing are now editable number inputs; PC1/PC2/PC3 recompute
// live as you type (computeProfitWaterfall, shared with the save handler so the preview and the
// persisted numbers can never drift from each other); Save writes both unit_cogs (= recomputed
// COGS total, used elsewhere for cash-at-risk math) and the full cogs_breakdown JSON. Visual is a
// horizontal stacked bar per waterfall step (width proportional to Price) instead of plain text
// rows, so the relative size of COGS/logistics/shipping/marketing/margin is visible at a glance.
function computeProfitWaterfall(d) {
  const summaryKeys = new Set(['COGs', 'COGs as %', 'Price', 'Logistics Cost', 'Shipping Cost', 'Shipping',
    'Marketing Cost', 'PC 1 ($)', 'PC 1 (%)', 'PC 2 ($)', 'PC 2 (%)', 'PC 3 ($)', 'PC 3 (%)',
    'Breakeven ROAS', 'Breakeven CAC', 'sheet_product_name', 'source', 'Total']);
  const lineItemKeys = Object.keys(d).filter(k => !summaryKeys.has(k) && typeof d[k] === 'number');
  const cogs = lineItemKeys.reduce((sum, k) => sum + (Number(d[k]) || 0), 0);
  const price = Number(d['Price']) || 0;
  const logistics = Number(d['Logistics Cost']) || 0;
  const shipping = Number(d['Shipping Cost'] ?? d['Shipping']) || 0;
  const marketing = Number(d['Marketing Cost']) || 0;
  const pc1 = price - cogs;
  const pc2 = pc1 - logistics - shipping;
  const pc3 = pc2 - marketing;
  return {
    lineItemKeys, cogs, price, logistics, shipping, marketing, pc1, pc2, pc3,
    cogsPct: price ? cogs / price : null, pc1Pct: price ? pc1 / price : null,
    pc2Pct: price ? pc2 / price : null, pc3Pct: price ? pc3 / price : null,
    breakevenRoas: pc2 > 0 ? price / pc2 : null, breakevenCac: pc2,
  };
}

function recomputeProfitModalPreview(productId) {
  const el = document.getElementById('detail-modal-backdrop');
  if (!el) return;
  const d = window._profitModalBreakdown[productId];
  const lineItemKeys = window._profitModalLineItemKeys;
  lineItemKeys.forEach(k => { d[k] = Number(document.getElementById(`pp-input-${cssEscape(k)}`)?.value) || 0; });
  ['Price', 'Logistics Cost', 'Marketing Cost'].forEach(k => { d[k] = Number(document.getElementById(`pp-input-${cssEscape(k)}`)?.value) || 0; });
  const shipKey = d['Shipping Cost'] != null ? 'Shipping Cost' : 'Shipping';
  d[shipKey] = Number(document.getElementById(`pp-input-${cssEscape(shipKey)}`)?.value) || 0;
  const w = computeProfitWaterfall(d);
  const money = (v) => fmtMoney2(v);
  const pct = (v) => (v == null ? '—' : (v * 100).toFixed(1) + '%');
  const setText = (id, text) => { const node = document.getElementById(id); if (node) node.textContent = text; };
  setText('pp-cogs-total', `${money(w.cogs)} (${pct(w.cogsPct)} of price)`);
  setText('pp-pc1', `${money(w.pc1)} (${pct(w.pc1Pct)})`);
  setText('pp-pc2', `${money(w.pc2)} (${pct(w.pc2Pct)})`);
  setText('pp-pc3', `${money(w.pc3)} (${pct(w.pc3Pct)})`);
  setText('pp-breakeven-roas', w.breakevenRoas != null ? `${w.breakevenRoas.toFixed(2)}x` : '—');
  setText('pp-breakeven-cac', money(w.breakevenCac));
}

function cssEscape(key) { return key.replace(/[^a-zA-Z0-9]/g, '_'); }

async function saveProductProfitModal(productId) {
  const d = window._profitModalBreakdown[productId];
  const w = computeProfitWaterfall(d);
  const breakdown = {
    ...d,
    'COGs': w.cogs, 'COGs as %': w.cogsPct, 'Price': w.price,
    'Logistics Cost': w.logistics, [d['Shipping Cost'] != null ? 'Shipping Cost' : 'Shipping']: w.shipping,
    'Marketing Cost': w.marketing,
    'PC 1 ($)': w.pc1, 'PC 1 (%)': w.pc1Pct, 'PC 2 ($)': w.pc2, 'PC 2 (%)': w.pc2Pct,
    'PC 3 ($)': w.pc3, 'PC 3 (%)': w.pc3Pct,
    'Breakeven ROAS': w.breakevenRoas, 'Breakeven CAC': w.breakevenCac,
  };
  const { data: before } = await sb.from('products').select('display_name, unit_cogs, cogs_breakdown').eq('id', productId).single();
  let decision = null;
  if (before && Number(before.unit_cogs) !== w.cogs) {
    decision = await showRecalcDecisionModal(['Unit COGS']);
    if (decision === null) return;
  }
  const { error } = await sb.from('products').update({ unit_cogs: w.cogs, cogs_breakdown: breakdown }).eq('id', productId);
  if (error) { await showConfirmModal('Something went wrong', 'Save failed: ' + error.message, { okOnly: true, danger: true }); return; }
  await logAction('products', productId, 'update', `Edited profit breakdown for ${before?.display_name || 'product'} (unit_cogs ${before?.unit_cogs} -> ${w.cogs})`, before, { ...before, unit_cogs: w.cogs, cogs_breakdown: breakdown });
  document.getElementById('detail-modal-backdrop')?.remove();
  if (decision === 'now') await requestRecalc('product', productId);
  renderCatalogProducts();
  renderCatalogBundles();
}

async function showProductProfitModal(productId) {
  document.getElementById('detail-modal-backdrop')?.remove();
  const { data: p } = await sb.from('products').select('display_name, cogs_breakdown').eq('id', productId).single();
  if (!p || !p.cogs_breakdown) return;
  window._profitModalBreakdown = window._profitModalBreakdown || {};
  window._profitModalBreakdown[productId] = { ...p.cogs_breakdown };
  const d = window._profitModalBreakdown[productId];
  const w = computeProfitWaterfall(d);
  window._profitModalLineItemKeys = w.lineItemKeys;
  const canAct = canEdit();
  // Alex (2026-11-10, round 3): "I want dollar signs and commas." -- fmtMoney2 already does
  // both ($ + thousands separators via toLocaleString); this modal's own `money()` just wraps it
  // so every PC/breakeven value (not only the already-fixed line items) gets the same treatment.
  const money = (v) => (v == null ? '—' : fmtMoney2(v));
  const pct = (v) => (v == null ? '—' : (v * 100).toFixed(1) + '%');
  const shipKey = d['Shipping Cost'] != null ? 'Shipping Cost' : 'Shipping';

  // Alex (2026-11-10, round 3): "it shouldn't require scrolling." Tightened row padding
  // (6px->3px gaps collapsed further) and dropped the bar chart ("I don't hate it but it's not
  // necessary, remove it") -- the modal's own scroll was almost entirely that bar's height plus
  // its margins; removing it is the single change that gets this under the 88vh cap on a normal
  // viewport instead of fighting every row's padding individually.
  const inputRow = (key, label) => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:13px; gap:8px;">
      <span class="muted">${label || key.trim()}</span>
      ${canAct
        ? `<input type="number" step="0.01" id="pp-input-${cssEscape(key)}" value="${Number(d[key]) || 0}" style="width:90px; padding:2px 6px; border-radius:6px; border:1px solid var(--border); text-align:right;" oninput="recomputeProfitModalPreview('${productId}')" />`
        : `<span>${money(d[key])}</span>`}
    </div>`;

  const lineItemsHtml = w.lineItemKeys.length
    ? w.lineItemKeys.map(k => inputRow(k)).join('')
    : '<div class="muted" style="font-size:13px;">No per-component breakdown on file.</div>';

  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };

// ---------- Components section ----------
async function renderCatalogComponents() {
  const el = document.getElementById('catalog-accordion-body-components');
  if (!el) return;
  const [{ data: components }, { data: products }, { data: componentVendors }] = await Promise.all([
    sb.from('components').select('*').order('component_name'),
    sb.from('products').select('id, display_name').order('display_name'),
    sb.from('component_vendors').select('*, vendors(vendor_name, default_lead_days)'),
  ]);
  window._catalogComponentsCache = { components: components || [], products: products || [], componentVendors: componentVendors || [] };
  renderCatalogComponentsTable();
}

function toggleCatalogComponentExpand(componentId) {
  const row = document.getElementById(`cc-detail-${componentId}`);
  const caret = document.getElementById(`cc-caret-${componentId}`);
  if (!row) return;
  const nowOpen = row.style.display === 'none';
  row.style.display = nowOpen ? '' : 'none';
  if (caret) caret.textContent = nowOpen ? '▾' : '▸';
}

// Alex (2026-11-04): "let's extrapolate the interaction to the vendors and components within
// this tab" -- same click-row-to-expand pattern as Products/Vendors: collapsed row shows name,
// parent product, UoM, qty/unit; expand reveals notes + the vendors supplying this component
// inline (reusing the existing Manage-Vendors modal for editing).
function renderCatalogComponentsTable() {
  const { components, products, componentVendors } = window._catalogComponentsCache || { components: [], products: [], componentVendors: [] };
  const el = document.getElementById('catalog-accordion-body-components');
  if (!el) return;
  const canAct = canEdit();
  const openComponentIds = Array.from(el.querySelectorAll('[id^="cc-detail-"]')).filter(r => r.style.display !== 'none').map(r => r.id.replace('cc-detail-', ''));

  const productById = {};
  products.forEach(p => { productById[p.id] = p.display_name; });
  const vendorsByComponent = {};
  componentVendors.forEach(cv => { (vendorsByComponent[cv.component_id] = vendorsByComponent[cv.component_id] || []).push(cv); });

  const rows = components.map(c => {
    const componentNameSafe = (c.component_name || '').replace(/'/g, "\\'");
    const nameHtml = canAct
      ? `<span class="pill clickable-pill good" style="font-size:14px;" onclick="event.stopPropagation(); editComponentNameInline('${c.id}')">${c.component_name}</span>`
      : `<span style="font-size:14px;">${c.component_name}</span>`;
    const productCell = productById[c.product_id] || '<span class="muted">—</span>';
    const uomCell = canAct
      ? `<span class="pill clickable-pill ${c.unit_of_measure ? 'good' : 'watch'}" style="font-size:13px;" onclick="event.stopPropagation(); editComponentUomInline('${c.id}')">${c.unit_of_measure || 'Missing'}</span>`
      : (c.unit_of_measure || '—');
    const qtyPerCell = c.qty_per_unit ?? '—';
    const vendors = vendorsByComponent[c.id] || [];
    const notesHtml = canAct
      ? `<span class="pill clickable-pill ${c.notes ? 'good' : 'watch'}" onclick="showComponentNotesModal('${c.id}', '${componentNameSafe}')">${c.notes ? 'On File' : 'Missing'}</span>`
      : (c.notes || '—');
    const vendorsListHtml = vendors.length
      ? vendors.map(cv => `<span class="pill ${cv.is_preferred ? 'good' : ''}" style="margin:0 4px 4px 0;">${cv.vendors?.vendor_name || '—'}${cv.is_preferred ? ' ★' : ''}${cv.lead_days ? ` · ${cv.lead_days}d` : ''}</span>`).join('')
      : '<span class="muted">No vendors linked yet.</span>';
    const manageVendorsHtml = canAct
      ? `<button class="btn btn-ghost" style="padding:3px 9px; font-size:12px;" onclick="showComponentVendorsModal('${c.id}', '${componentNameSafe}')">Manage Vendors</button>`
      : '';
    const deleteComponentHtml = canAct
      ? `<button class="btn btn-ghost" style="padding:3px 9px; font-size:12px; color:var(--bad-text); margin-left:8px;" onclick="cascadeDeleteComponent('${c.id}', '${componentNameSafe}')">Delete Component</button>`
      : '';

    const nestedHtml = `
      <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; padding:6px 0 10px; border-bottom:1px solid var(--border); margin-bottom:8px;">
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Notes</span><br>${notesHtml}</div>
      </div>
      <div class="section-label" style="margin:0 0 6px;">Vendors</div>
      <div style="margin-bottom:8px;">${vendorsListHtml}</div>
      ${manageVendorsHtml}${deleteComponentHtml}
    `;

    return `
      <tr id="cc-row-${c.id}" style="cursor:pointer;" onclick="toggleCatalogComponentExpand('${c.id}')">
        <td style="padding:6px 6px; border-bottom:1px solid var(--border);"><span class="muted" id="cc-caret-${c.id}">▸</span></td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);" onclick="event.stopPropagation();">${nameHtml}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${productCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);" onclick="event.stopPropagation();">${uomCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${qtyPerCell}</td>
      </tr>
      <tr id="cc-detail-${c.id}" style="display:none;"><td colspan="5" style="padding:2px 10px 14px 32px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.015);" onclick="event.stopPropagation();">${nestedHtml}</td></tr>
    `;
  }).join('');

  el.innerHTML = `
    <div class="muted" style="font-size:12px; margin-bottom:6px;">
      Click a name or unit of measure to edit it; click a row to expand notes and vendors.
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%; font-size:14px; border-collapse:collapse;">
        <thead><tr>
          <th style="padding:6px 6px; width:18px;"></th>
          ${['Component', 'Finished Good', 'Unit of Measure', 'Qty per Unit'].map(h => `<th style="padding:6px 10px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="muted" style="padding:10px;">No components found.</td></tr>'}</tbody>
      </table>
    </div>
  `;
  openComponentIds.forEach(id => toggleCatalogComponentExpand(id));
}

// Reuses the exact same insert/update/delete-against-component_vendors logic as
// showManageComponentsModal (vendor-first entry point) -- just the other direction into the
// same junction table, so edits made from either screen are visible from both immediately.
async function showComponentVendorsModal(componentId, componentName) {
  document.getElementById('detail-modal-backdrop')?.remove();
  const [{ data: allVendors }, { data: linked }] = await Promise.all([
    sb.from('vendors').select('id, vendor_name').eq('vendor_type', 'component_supplier').order('vendor_name'),
    sb.from('component_vendors').select('*').eq('component_id', componentId),
  ]);
  const linkedByVendor = {};
  (linked || []).forEach(l => { linkedByVendor[l.vendor_id] = l; });

  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const rowsHtml = (allVendors || []).map(v => {
    const link = linkedByVendor[v.id];
    return `
      <div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border);">
        <input type="checkbox" id="cv-check-${v.id}" ${link ? 'checked' : ''} onchange="document.getElementById('cv-lead-${v.id}').disabled = !this.checked;" />
        <div style="flex:1;">${v.vendor_name}</div>
        <label style="font-size:13px; color:var(--muted);">Lead days:
          <input type="number" id="cv-lead-${v.id}" value="${link?.lead_days ?? ''}" ${link ? '' : 'disabled'}
            style="width:60px; padding:3px 6px; border-radius:6px; border:1px solid var(--border); margin-left:4px;"
            placeholder="vendor default" />
        </label>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="detail-modal" style="max-width:480px;">
      <div style="font-weight:700; margin-bottom:4px; font-family:'Playfair Display'; font-size:17px;">Vendors — ${componentName}</div>
      <div class="muted" style="font-size:13px; margin-bottom:10px;">
        Check every vendor that supplies this component. Same data as each vendor's own "Manage
        components" button.
      </div>
      <div style="max-height:360px; overflow-y:auto;">${rowsHtml || '<div class="muted">No component-supplier vendors found.</div>'}</div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-primary" id="cv-save-btn">Save</button>
        <button class="btn btn-ghost" id="cv-cancel-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  document.getElementById('cv-cancel-btn').onclick = () => el.remove();
  document.getElementById('cv-save-btn').onclick = async () => {
    const toInsert = [];
    const toUpdate = [];
    const toDeleteIds = [];
    for (const v of (allVendors || [])) {
      const checked = document.getElementById(`cv-check-${v.id}`).checked;
      const leadVal = document.getElementById(`cv-lead-${v.id}`).value;
      const lead_days = leadVal === '' ? null : Number(leadVal);
      const existing = linkedByVendor[v.id];
      if (checked && !existing) {
        toInsert.push({ component_id: componentId, vendor_id: v.id, lead_days, is_preferred: true });
      } else if (checked && existing) {
        if (existing.lead_days !== lead_days) toUpdate.push({ id: existing.id, lead_days });
      } else if (!checked && existing) {
        toDeleteIds.push(existing.id);
      }
    }
    if (toInsert.length) await sb.from('component_vendors').insert(toInsert);
    for (const u of toUpdate) await sb.from('component_vendors').update({ lead_days: u.lead_days }).eq('id', u.id);
    if (toDeleteIds.length) await sb.from('component_vendors').delete().in('id', toDeleteIds);
    await logAction('component_vendors', componentId, 'update', `Updated vendor assignments for ${componentName} (${toInsert.length} added, ${toUpdate.length} lead-time changes, ${toDeleteIds.length} removed)`, linked, null);
    el.remove();
    await renderCatalogComponents();
    await renderCatalogVendors();
  };
}

  const { data: v } = await sb.from('vendors').select('vendor_name, default_lead_days, default_cadence_days').eq('id', vendorId).single();
  if (!v) return;
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  el.innerHTML = `
    <div class="detail-modal" style="max-width:420px;">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">Lead Time &amp; Cadence — ${v.vendor_name}</div>
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Default lead time (days)</label>
      <input type="number" id="vl-leaddays-input" value="${v.default_lead_days ?? ''}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-bottom:12px;" />
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Default contact cadence (days)</label>
      <input type="number" id="vl-cadence-input" value="${v.default_cadence_days ?? ''}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-bottom:14px;" />
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="vl-save-btn">Save</button>
        <button class="btn btn-ghost" id="vl-cancel-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  document.getElementById('vl-cancel-btn').onclick = () => el.remove();
  document.getElementById('vl-save-btn').onclick = async () => {
    const after = {
      default_lead_days: Number(document.getElementById('vl-leaddays-input').value) || null,
      default_cadence_days: Number(document.getElementById('vl-cadence-input').value) || null,
    };
    const changed = VENDOR_RECALC_FIELDS.filter(f => v[f] !== after[f]);
    el.remove();
    let decision = null;
    if (changed.length) {
      const labels = { default_lead_days: 'Lead Time', default_cadence_days: 'Contact Cadence' };
      decision = await showRecalcDecisionModal(changed.map(f => labels[f] || f));
      if (decision === null) return;
    }
    const { error } = await sb.from('vendors').update(after).eq('id', vendorId);
    if (error) { await showConfirmModal('Something went wrong', 'Save failed: ' + error.message, { okOnly: true, danger: true }); return; }
    await logAction('vendors', vendorId, 'update', `Edited lead time/cadence for ${v.vendor_name}`, v, after);
    if (decision === 'now') await requestRecalc('vendor', vendorId);
    renderCatalogVendors();
  };
}

    <div class="card" id="vc-row-${c.id}" style="padding:10px 12px; margin-bottom:8px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;">

        <input type="email" id="vc-email-${c.id}" value="${(c.email || '').replace(/"/g, '&quot;')}" placeholder="Email" style="flex:1; min-width:150px; padding:6px 8px; border-radius:6px; border:1px solid var(--border);" />
        <input type="tel" id="vc-phone-${c.id}" value="${(c.phone || '').replace(/"/g, '&quot;')}" placeholder="Phone" style="width:140px; padding:6px 8px; border-radius:6px; border:1px solid var(--border);" />
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="vc-slack-${c.id}" value="${(c.slack_user_id || '').replace(/"/g, '&quot;')}" placeholder="Slack member ID (e.g. U012AB3CD)" style="flex:1; min-width:170px; padding:6px 8px; border-radius:6px; border:1px solid var(--border);" />
        <select id="vc-channel-${c.id}" style="padding:6px 8px; border-radius:6px; border:1px solid var(--border);">

        </select>
        <button class="btn btn-ghost" style="padding:4px 8px; font-size:12px; color:var(--bad-text);" onclick="document.getElementById('vc-row-${c.id}').remove()" title="Remove this contact">Remove</button>
      </div>
    </div>`;

  el.innerHTML = `
    <div class="detail-modal" style="max-width:560px;">
      <div style="font-weight:700; margin-bottom:4px; font-family:'Playfair Display'; font-size:17px;">Contacts — ${vendorName}</div>
      <div class="muted" style="font-size:13px; margin-bottom:10px;">
        Add every contact point at this vendor. More than one can be "Primary POC" if updates
        should reach multiple people. For Slack, you need the person's member ID (not just their
        name) — find it on their Slack profile.
      </div>
      <div id="vc-contacts-list" style="max-height:360px; overflow-y:auto;">${(contacts || []).map(contactRowHtml).join('')}</div>
      <button class="btn btn-ghost" id="vc-add-btn" style="margin-top:4px; font-size:13px;">+ Add another contact</button>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-primary" id="vc-save-btn">Save</button>
        <button class="btn btn-ghost" id="vc-cancel-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  document.getElementById('vc-cancel-btn').onclick = () => el.remove();
  document.getElementById('vc-add-btn').onclick = () => {
    const tempId = 'new-' + Math.random().toString(36).slice(2);
    document.getElementById('vc-contacts-list').insertAdjacentHTML('beforeend', contactRowHtml({ id: tempId, name: '', email: '', phone: '', slack_user_id: '', preferred_contact_channel: 'email', is_primary_poc: false }));
  };
  document.getElementById('vc-save-btn').onclick = async () => {
    const rows = Array.from(document.getElementById('vc-contacts-list').children);
    const existingIds = new Set((contacts || []).map(c => c.id));
    const keptIds = new Set();
    const toInsert = [];
    const toUpdate = [];
    for (const row of rows) {
      const id = row.id.replace('vc-row-', '');
      const name = document.getElementById(`vc-name-${id}`).value.trim();
      if (!name) continue; // skip blank rows rather than saving an empty contact
      const record = {
        name,
        email: document.getElementById(`vc-email-${id}`).value.trim() || null,
        phone: document.getElementById(`vc-phone-${id}`).value.trim() || null,
        slack_user_id: document.getElementById(`vc-slack-${id}`).value.trim() || null,
        preferred_contact_channel: document.getElementById(`vc-channel-${id}`).value,
        is_primary_poc: document.getElementById(`vc-primary-${id}`).checked,
      };
      if (id.startsWith('new-')) {
        toInsert.push({ ...record, vendor_id: vendorId });
      } else {
        keptIds.add(id);
        toUpdate.push({ id, ...record });
      }
    }
    const toDeleteIds = [...existingIds].filter(id => !keptIds.has(id));

    if (toInsert.length) await sb.from('vendor_contacts').insert(toInsert);
    for (const u of toUpdate) { const { id, ...rest } = u; await sb.from('vendor_contacts').update(rest).eq('id', id); }
    if (toDeleteIds.length) await sb.from('vendor_contacts').delete().in('id', toDeleteIds);

    // Keep the legacy single-contact fields on vendors in sync (open_orders_by_product and the
    // Components-tab vendor list still read these directly -- see migrations/040 for the
    // follow-up note about moving those call sites onto vendor_contacts directly).
    const { data: refreshed } = await sb.from('vendor_contacts').select('*').eq('vendor_id', vendorId).order('created_at');
    const primary = (refreshed || []).find(c => c.is_primary_poc) || (refreshed || [])[0] || null;
    await sb.from('vendors').update({
      contact_name: primary?.name || null,
      contact_email: primary?.email || null,
      slack_user_id: primary?.slack_user_id || null,
      preferred_contact_channel: primary?.preferred_contact_channel || null,
    }).eq('id', vendorId);

    await logAction('vendor_contacts', vendorId, 'update', `Updated contacts for ${vendorName} (${toInsert.length} added, ${toUpdate.length} edited, ${toDeleteIds.length} removed)`, contacts, refreshed);
    el.remove();
    renderCatalogVendors();
  };
}

async function splitOrder(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const splitQtyStr = await showPromptModal('Split Order', `Total: ${o.qty.toLocaleString()} units. How many go into the NEW (second) order?`, Math.floor((o.qty || 0) / 2), 'number');
  if (!splitQtyStr) return;
  const splitQty = Number(splitQtyStr);
  if (!splitQty || splitQty <= 0 || splitQty >= o.qty) { await showConfirmModal('Check your input', 'Enter a quantity less than the current total.', { okOnly: true }); return; }
  const newEta = await promptDateMMDDYYYY('ETA for the new (split-off) order', o.eta);
  const newOrderNumber = await showPromptModal('Order # for the new (split-off) order', 'Defaults to the original\'s.', o.internal_ref || '');
  if (newOrderNumber === null) return;
  const newTracking = await showPromptModal('Tracking info for the new (split-off) order', 'Defaults to the original\'s.', o.tracking_info || '');
  if (newTracking === null) return;

  const { data: before } = await sb.from('inventory_ledger').select('*').eq('id', ledgerId).single();
  // Reduce the original row, then insert a new ledger row carrying the remainder.
  const { error: err1 } = await sb.from('inventory_ledger').update({ qty_in: o.qty - splitQty }).eq('id', ledgerId);
  if (err1) { await showConfirmModal('Something went wrong', 'Failed: ' + err1.message, { okOnly: true, danger: true }); return; }
  const { data: inserted, error: err2 } = await sb.from('inventory_ledger').insert({
    event_date: new Date().toISOString().slice(0, 10),
    event_type: o.order_type === 'componentry' ? 'component_order' : 'production_run',
    product_id: o.order_type === 'componentry' ? null : o.product_id,
    component_id: null, // component_id can't be resolved client-side reliably; left for manual follow-up if componentry
    po_id: o.po_id,
    vendor_id: before?.vendor_id || null,
    qty_in: splitQty,
    landed: false,
    order_status: 'open',
    eta: newEta || o.eta,
    order_number: newOrderNumber || null,
    tracking_info: newTracking || null,
    notes: `Split from original order ${ledgerId} via dashboard`,
  }).select().single();
  if (err2) { await showConfirmModal('Something went wrong', 'Original order was reduced, but creating the split-off order failed: ' + err2.message, { okOnly: true, danger: true }); }
  else if (before) {
    await logAction('inventory_ledger', ledgerId, 'split', `Split ${o.product_name} into ${(o.qty - splitQty).toLocaleString()} + ${splitQty.toLocaleString()} units`, before, { new_row_id: inserted?.id });
  }
  await renderOverview();
}

async function editRevenueForecast(channel) {
  const monthStartIso = new Date().toISOString().slice(0, 7) + '-01';
  const monthLabel = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
  const current = (window._revenuePacing || {})[channel];

  const existingVal = (current && !current.noForecast) ? current.forecastFullMonth : (fallback || '');
  const input = await showPromptModal(`${channel === 'shopify' ? 'Shopify' : 'Amazon'} Revenue Forecast`, `Full-month forecast for ${monthLabel} ($)`, existingVal, 'number');

  const val = Number(String(input).replace(/[^0-9.]/g, ''));

    { channel, forecast_month: monthStartIso, forecast_revenue: val, created_by: currentUserRow?.email || 'dashboard' },
    { onConflict: 'channel,forecast_month' }

  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  await Promise.all([renderOverview(), renderRevenue()]);
}
