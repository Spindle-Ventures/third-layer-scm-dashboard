async function splitOrder(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const splitQtyStr = await showPromptModal('Split Order', `Total: ${o.qty.toLocaleString()} units. How many go into the NEW (second) order?`, Math.floor((o.qty || 0) / 2), 'number');
  if (!splitQtyStr) return;
  const splitQty = Number(splitQtyStr);
  if (!splitQty || splitQty <= 0 || splitQty >= o.qty) { alert('Enter a quantity less than the current total.'); return; }
  const newEta = await promptDateMMDDYYYY('ETA for the new (split-off) order', o.eta);
  const newOrderNumber = await showPromptModal('Order # for the new (split-off) order', 'Defaults to the original\'s.', o.internal_ref || '');
  if (newOrderNumber === null) return;
  const newTracking = await showPromptModal('Tracking info for the new (split-off) order', 'Defaults to the original\'s.', o.tracking_info || '');
  if (newTracking === null) return;

  const { data: before } = await sb.from('inventory_ledger').select('*').eq('id', ledgerId).single();
  // Reduce the original row, then insert a new ledger row carrying the remainder.
  const { error: err1 } = await sb.from('inventory_ledger').update({ qty_in: o.qty - splitQty }).eq('id', ledgerId);
  if (err1) { alert('Failed: ' + err1.message); return; }
  const { data: inserted, error: err2 } = await sb.from('inventory_ledger').insert({
    event_date: new Date().toISOString().slice(0, 10),
    event_type: o.order_type === 'componentry' ? 'component_order' : 'production_run',
    product_id: o.order_type === 'componentry' ? null : o.product_id,
    component_id: null, // component_id can't be resolved client-side reliably; left for manual follow-up if componentry
    po_id: o.po_id,
    vendor_id: before?.vendor_id || null,
    qty_in: splitQty,
    landed: false,
    order_status: 'open',
    eta: newEta || o.eta,
    order_number: newOrderNumber || null,
    tracking_info: newTracking || null,
    notes: `Split from original order ${ledgerId} via dashboard`,
  }).select().single();
  if (err2) { alert('Original order was reduced, but creating the split-off order failed: ' + err2.message); }
  else if (before) {
    await logAction('inventory_ledger', ledgerId, 'split', `Split ${o.product_name} into ${(o.qty - splitQty).toLocaleString()} + ${splitQty.toLocaleString()} units`, before, { new_row_id: inserted?.id });
  }
  await renderOverview();
}

// ---------- Revenue (scenario modeling) ----------
function monthKey(d) { return d.toISOString().slice(0, 7); }
function monthLabelShort(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'short', year: '2-digit' }); }
function monthLabelLong(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'long', year: 'numeric' }); }
function nextSixMonths() {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < 6; i++) { out.push(monthKey(d)); d.setMonth(d.getMonth() + 1); }
  return out;
}

async function renderRevenue() {
  const el = document.getElementById('tab-revenue');
  el.innerHTML = `<div class="card empty-state">Loading revenue data…</div>`;

  const todayIso = new Date().toISOString().slice(0, 10);
  const histStartIso = (() => { const d = new Date(); d.setMonth(d.getMonth() - 5); d.setDate(1); return d.toISOString().slice(0, 10); })();
  const months = nextSixMonths();

  const [{ data: products }, { data: revActuals }, { data: revForecasts }, { data: forecastParams }, { data: openOrders }, { data: scenarios }, { data: vendors }, { data: componentQoh }, { data: activeRecs }, { data: invSnapshot }, { data: committedScenarioPOs }, { data: historicalPct }] = await Promise.all([
    sb.from('product_qoh').select('*'),
    sb.from('revenue_actuals').select('channel, gross_revenue, shipping_revenue, revenue_date').gte('revenue_date', histStartIso),
    sb.from('revenue_forecasts').select('channel, forecast_month, forecast_revenue').gte('forecast_month', months[0] + '-01'),
    sb.from('forecast_params').select('channel, revenue_pct, avg_selling_price, revenue_pct_rationale, asp_rationale, product_id, products(sku_code, display_name)').eq('is_active', true),
    sb.from('open_orders_by_product').select('product_sku, qty, eta, order_type').not('eta', 'is', null).eq('order_type', 'finished_good'),
    sb.from('revenue_scenarios').select('*').order('created_at', { ascending: false }),
    sb.from('vendors').select('*').eq('is_active', true).order('vendor_name'),
    sb.from('component_qoh').select('*'),
    sb.from('agent_recommendations').select('product_id, urgency, shortfall_month, shortfall_qty, last_responsible_date, recommended_order_qty, problem_type, decision').eq('is_test', false),
    sb.from('product_inventory_snapshot').select('channel, qty, products(sku_code)').eq('channel', 'shopify'),
    sb.from('purchase_orders').select('*, vendors(vendor_name, default_lead_days), products(sku_code, display_name), revenue_scenarios(name)').not('source_scenario_id', 'is', null).order('created_at', { ascending: false }),
    sb.from('historical_revenue_pct').select('product_id, channel, month, gross_sales, net_items_sold').gte('month', histStartIso).eq('channel', 'shopify'),
  ]);

  // Shopify's live inventory API is the canonical source of truth for finished-good QOH (same
  // rule demand_engine.py and the Overview tab follow, per Alex's 2026-10-20 decision) --
  // product_qoh.qty_on_hand only reflects inventory_ledger rows, which several live Shopify SKUs
  // (e.g. Day Spray, Night Oil 50ml) never had an opening-balance entry for and would otherwise
  // read as a false 0. Override qty_on_hand with the live snapshot wherever one exists; fall back
  // to the ledger-derived value only for products not yet live in Shopify (e.g. unlaunched
  // deodorant SKUs), which have no snapshot row at all.
  const liveQtyBySku = {};
  (invSnapshot || []).forEach(s => {
    const sku = s.products?.sku_code;
    if (sku) liveQtyBySku[sku] = s.qty;
  });
  const productsWithLiveQty = (products || []).map(p =>
    liveQtyBySku[p.sku_code] != null ? { ...p, qty_on_hand: liveQtyBySku[p.sku_code] } : p
  );

  const monthlyActual = {};
  let shopifyGrossTrailing = 0, shopifyShippingTrailing = 0;
  (revActuals || []).forEach(r => {
    const m = r.revenue_date.slice(0, 7);
    if (!monthlyActual[m]) monthlyActual[m] = { shopify: 0, amazon: 0 };
    monthlyActual[m][r.channel] = (monthlyActual[m][r.channel] || 0) + Number(r.gross_revenue || 0);
    if (r.channel === 'shopify') {
      shopifyGrossTrailing += Number(r.gross_revenue || 0);
      shopifyShippingTrailing += Number(r.shipping_revenue || 0);
    }
  });
  // Alex (2026-10-22): "Why in the % of Revenue aren't the percentages equal to 100%? Is it due
  // to shipping as a % of revenue?" -- yes, almost entirely. forecast_params.revenue_pct is each
  // product's share of TOTAL (gross) Shopify revenue, same basis as the source spreadsheet, and
  // gross revenue includes shipping -- which isn't attributed to any product line. So the SKUs'
  // percentages summing to ~92% rather than 100% is expected, not a data error; the gap is the
  // trailing-6-month actual shipping share. Surfaced on the Total row instead of silently
  // flagging it red. Amazon has no separate shipping line in the ledger (already gross-only), so
  // its gap is just rounding and is held to a tighter tolerance.
  const shippingShareByChannel = {
    shopify: window.RevenueLogic.computeShippingShare(shopifyGrossTrailing, shopifyShippingTrailing),
    amazon: 0,
  };
  // Historical ASP, from real Shopify order data (not an assumption) -- Alex (2026-10-22): "you
  // should have historical information to drive average selling price projections and put
  // context into the pop up box." historical_revenue_pct already records gross_sales and
  // net_items_sold per product per month (computed via ShopifyQL); actual ASP = gross/units.
  const historicalAspByProduct = {}; // product_id -> [{month, asp, units}] oldest..newest, Shopify only
  (historicalPct || []).forEach(h => {
    if (!h.net_items_sold) return;
    if (!historicalAspByProduct[h.product_id]) historicalAspByProduct[h.product_id] = [];
    historicalAspByProduct[h.product_id].push({ month: h.month.slice(0, 7), asp: Number(h.gross_sales) / Number(h.net_items_sold), units: h.net_items_sold });
  });
  Object.values(historicalAspByProduct).forEach(arr => arr.sort((a, b) => a.month.localeCompare(b.month)));
  const liveForecast = {};
  (revForecasts || []).forEach(r => {
    const m = r.forecast_month.slice(0, 7);
    if (!liveForecast[m]) liveForecast[m] = {};
    liveForecast[m][r.channel] = Number(r.forecast_revenue);
  });
  const liveMix = { shopify: {}, amazon: {} };
  (forecastParams || []).forEach(fp => {
    liveMix[fp.channel] = liveMix[fp.channel] || {};
    liveMix[fp.channel][fp.product_id] = { revenue_pct: Number(fp.revenue_pct), avg_selling_price: Number(fp.avg_selling_price), revenue_pct_rationale: fp.revenue_pct_rationale || null, asp_rationale: fp.asp_rationale || null };
  });
  // Real receipts for the Inventory Outlook -- FINISHED GOOD production runs only. Alex
  // (2026-10-22): flagged "Night Oil 415ml showing 132k landing" and "46k of Armpit Mud in
  // January" as entirely incorrect, with no real POs placed/in the works for 2027. Root cause:
  // open_orders_by_product mixes finished-good production runs AND raw COMPONENT orders (bottles,
  // lids, jars, corks -- which still need to go through production before becoming finished
  // units) in one view with an order_type column, and this fetch was pulling ALL rows regardless
  // of type. Verified against live data: Armpit Mud's "46k" was exactly 23,000 (Black Lid
  // component order) + 23,000 (Glass Jar component order) for the SAME finished-good PO, with
  // ZERO real finished-good quantity -- confirming Alex's "no real 2027 POs" claim for that
  // product. Night Oil's "132k" was 55,000 (bottle) + 55,000 (cork) + the one real 22,000
  // finished-good run. Now filtered server-side to order_type='finished_good' in the fetch above.
  const receipts = {}; // { product_sku: { month: qty } }, finished-good only
  (openOrders || []).forEach(o => {
    const m = o.eta.slice(0, 7);
    if (!receipts[o.product_sku]) receipts[o.product_sku] = {};
    receipts[o.product_sku][m] = (receipts[o.product_sku][m] || 0) + (o.qty || 0);
  });

  window._revState = {
    products: productsWithLiveQty || [], monthlyActual, liveForecast, liveMix, receipts, months,
    scenarios: scenarios || [], selectedScenarioId: window._revState?.selectedScenarioId || 'live',
    draftChannel: null, draftMix: null,
    vendors: vendors || [], componentQoh: componentQoh || [],
    // activeRecFullByProduct/activeRecByProduct: ACTIVE (non-dismissed) only -- drives urgency
    // sort/pills and the "engine disagrees" flag. anyRecFullByProduct: every rec regardless of
    // decision, including dismissed -- so the Status popup can always show "the real engine found
    // this, here's what happened to it" rather than silently hiding a dismissed finding (Alex,
    // 2026-10-22: "why doesn't it show up in the Product Mix Inventory outlook as an issue").
    activeRecByProduct: Object.fromEntries((activeRecs || []).filter(r => r.decision !== 'dismissed').map(r => [r.product_id, r.urgency])),
    activeRecFullByProduct: Object.fromEntries((activeRecs || []).filter(r => r.decision !== 'dismissed').map(r => [r.product_id, r])),
    anyRecFullByProduct: Object.fromEntries((activeRecs || []).map(r => [r.product_id, r])),
    draftPOs: [],
    committedScenarioPOs: committedScenarioPOs || [],
    shippingShareByChannel, historicalAspByProduct,
  };

  await selectRevenueScenario(window._revState.selectedScenarioId, true);
}

async function selectRevenueScenario(scenarioId, skipFetch) {
  const S = window._revState;
  S.selectedScenarioId = scenarioId;

  if (scenarioId === 'live') {
    S.draftPOs = [];
    S.draftChannel = {};
    S.months.forEach(m => { S.draftChannel[m] = { shopify: S.liveForecast[m]?.shopify ?? null, amazon: S.liveForecast[m]?.amazon ?? null }; });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        if (!base) return;
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => { S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price, revenue_pct_rationale: base.revenue_pct_rationale || null, asp_rationale: base.asp_rationale || null }; });
      });
    });
  } else if (!skipFetch || !S.draftChannel) {
    const [{ data: chanRows }, { data: mixRows }, { data: poRows }] = await Promise.all([
      sb.from('revenue_scenario_channel').select('*').eq('scenario_id', scenarioId),
      sb.from('revenue_scenario_mix').select('*').eq('scenario_id', scenarioId),
      sb.from('revenue_scenario_po').select('*').eq('scenario_id', scenarioId).order('eta_month'),
    ]);
    S.draftPOs = poRows || [];
    S.draftChannel = {};
    S.months.forEach(m => {
      const shopRow = (chanRows || []).find(r => r.channel === 'shopify' && r.forecast_month.slice(0, 7) === m);
      const amzRow = (chanRows || []).find(r => r.channel === 'amazon' && r.forecast_month.slice(0, 7) === m);
      S.draftChannel[m] = {
        shopify: shopRow ? Number(shopRow.forecast_revenue) : (S.liveForecast[m]?.shopify ?? null),
        amazon: amzRow ? Number(amzRow.forecast_revenue) : (S.liveForecast[m]?.amazon ?? null),
      };
    });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => {
          const row = (mixRows || []).find(r => r.channel === ch && r.product_id === p.product_id && r.forecast_month.slice(0, 7) === m);
          if (row) S.draftMix[ch][p.product_id][m] = { revenue_pct: Number(row.revenue_pct), avg_selling_price: Number(row.avg_selling_price), revenue_pct_rationale: row.revenue_pct_rationale || null, asp_rationale: row.asp_rationale || null };
          else if (base) S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price, revenue_pct_rationale: base.revenue_pct_rationale || null, asp_rationale: base.asp_rationale || null };
        });
      });
    });
  }
  renderRevenueBody();
}

function currentScenario() {
  const S = window._revState;
  if (S.selectedScenarioId === 'live') return null;
  return S.scenarios.find(s => s.id === S.selectedScenarioId);
}

function isEditable() {
  const sc = currentScenario();
  return canEdit() && sc && sc.status === 'draft';
}

function canEditChannel() {
  const S = window._revState;
  return canEdit() && (S.selectedScenarioId === 'live' || isEditable());
}

async function createRevenueScenario() {
  if (!canEdit()) return;
  const name = await showPromptModal('New Scenario', 'e.g. "Holiday push", "Conservative Q1"', '');
  if (!name) return;
  const { data, error } = await sb.from('revenue_scenarios').insert({ name, status: 'draft', created_by: currentUserRow?.email || 'dashboard' }).select().single();
  if (error) { alert('Failed: ' + error.message); return; }
  // Seed from the live numbers currently in window._revState so it starts as an exact copy.
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ scenario_id: data.id, channel: ch, forecast_month: m + '-01', forecast_revenue: val });
  }));
  if (chanRows.length) await sb.from('revenue_scenario_channel').insert(chanRows);
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    const base = S.liveMix[ch]?.[p.product_id];
    if (!base) return;
    S.months.forEach(m => mixRows.push({ scenario_id: data.id, product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price }));
  }));
  if (mixRows.length) await sb.from('revenue_scenario_mix').insert(mixRows);
  S.scenarios.unshift(data);
  await selectRevenueScenario(data.id);
}

async function deleteRevenueScenario(scenarioId) {
  if (!(await showConfirmModal('Delete this draft scenario?', 'This cannot be undone.', 'Delete'))) return;
  const { error } = await sb.from('revenue_scenarios').delete().eq('id', scenarioId);
  if (error) { alert('Failed: ' + error.message); return; }
  window._revState.scenarios = window._revState.scenarios.filter(s => s.id !== scenarioId);
  await selectRevenueScenario('live');
}

async function commitRevenueScenario() {
  const sc = currentScenario();
  if (!sc) return;
  if (!(await showConfirmModal(`Commit "${sc.name}" as the live forecast?`, 'This will update revenue_forecasts and the monthly product-mix assumptions that drive PO/component recommendations. Changes take full effect on the next pipeline run.', 'Commit'))) return;
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ channel: ch, forecast_month: m + '-01', forecast_revenue: val, created_by: currentUserRow?.email || 'dashboard' });
  }));
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    S.months.forEach(m => {
      const v = S.draftMix[ch][p.product_id]?.[m];
      if (v) mixRows.push({ product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: v.revenue_pct, avg_selling_price: v.avg_selling_price, revenue_pct_rationale: v.revenue_pct_rationale || null, asp_rationale: v.asp_rationale || null, source_scenario_id: sc.id, committed_at: new Date().toISOString() });
    });
  }));
  const [{ error: e1 }, { error: e2 }, { error: e3 }] = await Promise.all([
    chanRows.length ? sb.from('revenue_forecasts').upsert(chanRows, { onConflict: 'channel,forecast_month' }) : Promise.resolve({ error: null }),
    mixRows.length ? sb.from('forecast_params_monthly').upsert(mixRows, { onConflict: 'product_id,channel,forecast_month' }) : Promise.resolve({ error: null }),
    sb.from('revenue_scenarios').update({ status: 'committed', committed_at: new Date().toISOString() }).eq('id', sc.id),
  ]);
  if (e1 || e2 || e3) { alert('Commit failed: ' + (e1 || e2 || e3).message); return; }

  // Materialize any draft POs modeled in this scenario into real purchase_orders +
  // inventory_ledger rows (landed=false, scheduled production_run) -- per Alex's explicit choice
  // (2026-10-22): draft POs commit together with the scenario they were modeled against, becoming
  // real open orders the Overview tab / demand engine pick up from here on.
  let poMaterializeError = null;
  for (const po of (S.draftPOs || [])) {
    const product = S.products.find(pr => pr.product_id === po.product_id);
    const internalRef = `SCEN-${sc.id.slice(0, 8)}-${(product?.sku_code || po.product_id).toString().slice(0, 12)}-${po.eta_month}`;
    const { data: poRow, error: poErr } = await sb.from('purchase_orders').insert({
      internal_ref: internalRef, vendor_id: po.vendor_id, product_id: po.product_id,
      qty_ordered: po.qty, status: 'draft', eta_date: po.eta_month, source_scenario_id: sc.id,
      notes: `Created from Revenue tab scenario "${sc.name}" (committed ${new Date().toISOString().slice(0, 10)}).${po.notes ? ' ' + po.notes : ''}`,
      created_by: currentUserRow?.email || 'dashboard',
    }).select().single();
    if (poErr) { poMaterializeError = poErr; continue; }
    const { error: ledgerErr } = await sb.from('inventory_ledger').insert({
      event_date: po.eta_month, event_type: 'production_run', product_id: po.product_id,
      vendor_id: po.vendor_id, po_id: poRow.id, qty_in: po.qty, landed: false, eta: po.eta_month,
      notes: `Scheduled via Revenue tab scenario "${sc.name}".`,
      created_by: currentUserRow?.email || 'dashboard',
    });
    if (ledgerErr) poMaterializeError = ledgerErr;
  }
  if (poMaterializeError) {
    alert(`Scenario committed, but one or more draft POs failed to materialize into real purchase orders: ${poMaterializeError.message}. Check the Purchase Orders / Overview tabs and re-create them manually if needed.`);
  }

  alert(`"${sc.name}" is now the live forecast${S.draftPOs?.length ? `, and ${S.draftPOs.length} draft PO(s) are now real (status: draft) purchase orders` : ''}. Overview-tab recommendations and inventory projections will reflect it after the next daily pipeline run.`);
  await renderRevenue();
  await renderOverview();
}

function channelMonthBasis(month, channel) {
  const S = window._revState;
  const now = new Date();
  const currentKey = now.toISOString().slice(0, 7);
  const hasActual = !!(S.monthlyActual[month] && S.monthlyActual[month][channel]);
  if (month < currentKey) return hasActual ? { tag: 'actual', detail: 'Closed month — full actual revenue.' } : { tag: 'no data', detail: 'No actuals recorded for this month yet.' };
  if (month === currentKey) return hasActual ? { tag: 'MTD actual', detail: 'Blends actual revenue so far this month with the assumption for the remainder — tightens daily as more actuals land.' } : { tag: 'assumption', detail: 'No actuals yet this month — this is a manual assumption.' };
  return { tag: 'assumption', detail: 'Future month — manual assumption until it becomes the current month, at which point actuals start anchoring it.' };
}

function computeProjection(channelData, mixData) {
  // Delegates to the unit-tested dashboard/lib/revenue-logic.js (window.RevenueLogic) -- this
  // wrapper only adapts the live dashboard's window._revState into the plain arguments that pure
  // function expects. See test/revenue-logic.test.js for the real coverage of the math itself.
  //
  // monthlyActualToDate = S.monthlyActual: for the CURRENT (in-progress) month this holds actual
  // revenue recorded so far; future months have no entry. Passing it through makes the demand
  // calc count only the REMAINING (not-yet-happened) portion of the current month against the
  // starting inventory -- which is a LIVE "as of today" QOH, not an official month-start count,
  // and therefore already reflects whatever has sold so far this month. Without this, the current
  // month's demand would be double-counted (Alex, 2026-10-22: flagged this exact mismatch between
  // the source spreadsheet's month-start model and the dashboard's live QOH).
  const S = window._revState;
  return window.RevenueLogic.computeProjection({
    products: S.products,
    months: S.months,
    channelData,
    mixData,
    realReceipts: S.receipts,
    draftPOs: S.draftPOs,
    monthlyActualToDate: S.monthlyActual,
  });
}

function showThroughputDetail(productId, month) {
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  const monthIdx = S.months.indexOf(month);
  const isCurrentMonth = monthIdx === 0;
  const projection = computeProjection(S.draftChannel, S.draftMix);
  // "Starting inventory" for the CURRENT month is a LIVE count as of right now -- not an official
  // month-start snapshot the way the source spreadsheet modeled it (Alex, 2026-10-22). Label it
  // explicitly as "as of today" so it's never confused with a month-start figure. For every later
  // month, "starting inventory" genuinely IS last month's calculated end-of-month result.
  const startingInv = isCurrentMonth ? p.qty_on_hand : projection[p.sku_code][monthIdx - 1];
  const realReceipts = (S.receipts[p.sku_code] || {})[month] || 0;
  const draftReceiptsHere = (S.draftPOs || []).filter(po => po.product_id === productId && po.eta_month.slice(0, 7) === month);
  const draftReceiptsQty = draftReceiptsHere.reduce((s, po) => s + po.qty, 0);
  const receipts = realReceipts + draftReceiptsQty;

  const channelRows = ['shopify', 'amazon'].map(ch => {
    const mix = S.draftMix[ch][productId]?.[month];
    const chanRev = S.draftChannel[month]?.[ch];
    if (!mix || chanRev == null) return null;
    const basis = channelMonthBasis(month, ch);
    const actualToDate = isCurrentMonth ? (S.monthlyActual[month]?.[ch] || 0) : 0;
    // Only the REMAINING (not-yet-happened) revenue drives remaining demand for the current
    // month, since today's live QOH already reflects whatever already sold this month.
    const remainingChanRev = isCurrentMonth ? Math.max(chanRev - actualToDate, 0) : chanRev;
    const units = (remainingChanRev * mix.revenue_pct) / mix.avg_selling_price;
    const pace = isCurrentMonth
      ? window.RevenueLogic.computeMtdPaceUnits({ mtdActualRevenue: actualToDate, revenuePct: mix.revenue_pct, avgSellingPrice: mix.avg_selling_price, fullMonthProjectedUnits: (chanRev * mix.revenue_pct) / mix.avg_selling_price })
      : null;
    return { channel: ch === 'shopify' ? 'Shopify' : 'Amazon', chanRev, remainingChanRev, pct: mix.revenue_pct, asp: mix.avg_selling_price, units, basis, pace };
  }).filter(Boolean);
  const totalUnits = channelRows.reduce((s, r) => s + r.units, 0);
  const totalRemainingRevenue = channelRows.reduce((s, r) => s + r.remainingChanRev * r.pct, 0);
  const endingInv = startingInv - totalUnits + receipts;
  // Alex (2026-10-22): "it's a little unclear to me as to what was the full month's throughput vs
  // what's been sold so far vs what's planned to be sold with any inventory landing ... I'd love
  // for it to be a little more simply said." One plain summary line, computed once, shown before
  // the per-channel math detail (kept below for anyone who wants to see how it was built).
  const soldSoFarUnits = isCurrentMonth ? channelRows.reduce((s, r) => s + (r.pace?.impliedUnits || 0), 0) : null;
  const fullMonthUnits = isCurrentMonth ? soldSoFarUnits + totalUnits : null;

  const body = `
    <div style="font-size:13px; line-height:1.5;">
      ${isCurrentMonth ? `
        <div style="margin-bottom:10px; padding:10px; background:#F7F4EE; border-radius:8px;">
          <div style="font-weight:600; margin-bottom:6px; font-size:12px;">This month, in plain terms:</div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">Full month's target</span><strong>${Math.round(fullMonthUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">— Already sold so far this month</span><strong>${Math.round(soldSoFarUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0; border-top:1px solid var(--border); margin-top:2px; padding-top:4px;"><span class="muted">= Still planned to sell (rest of month)</span><strong>${Math.round(totalUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">+ Inventory landing this month</span><strong>${receipts.toLocaleString()} units</strong></div>
        </div>
      ` : ''}
      <div style="padding:6px 0; display:flex; justify-content:space-between; font-size:15px;"><span><strong>Projected end-of-month</strong></span><strong style="color:${endingInv < (p.safety_stock_qty || 0) ? 'var(--bad-text)' : 'var(--good-text)'};">${Math.round(endingInv).toLocaleString()}</strong></div>
      <div class="muted" style="font-size:11px;">Starting (${isCurrentMonth ? 'today, live' : 'prior month EOM'}): ${Math.round(startingInv).toLocaleString()} · Safety stock: ${(p.safety_stock_qty || 0).toLocaleString()}</div>

      ${draftReceiptsHere.length ? `
        <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
          <div class="section-label" style="margin:0 0 4px; font-size:11px;">Draft POs landing this month (${currentScenario()?.name || ''})</div>
          ${draftReceiptsHere.map(po => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:12px;">
              <span>${po.qty.toLocaleString()} units${po.notes ? ` — <span class="muted">${po.notes}</span>` : ''}</span>
              ${isEditable() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:11px; color:var(--bad-text);" onclick="deleteDraftPo('${po.id}')">Remove</button>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <details>
        <summary>Show the math${isCurrentMonth ? ' ("already sold so far" is implied from actual revenue at the assumed mix %, not a measured count)' : ''}</summary>
        ${channelRows.map(r => `
          <div style="padding:5px 0; border-bottom:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between;"><strong>${r.channel}</strong><span class="pill ${r.basis.tag === 'actual' ? 'good' : (r.basis.tag === 'MTD actual' ? 'watch' : '')}" title="${r.basis.detail}">${r.basis.tag}</span></div>
            <div class="muted" style="font-size:11px; margin-top:2px;">
              ${isCurrentMonth
                ? `${fmtMoney(r.chanRev)} full-month forecast − ${fmtMoney(S.monthlyActual[month]?.[r.channel === 'Shopify' ? 'shopify' : 'amazon'] || 0)} already actual = ${fmtMoney(r.remainingChanRev)} remaining × ${(r.pct * 100).toFixed(1)}% mix share ÷ ${fmtMoney2(r.asp)} ASP = <strong>${Math.round(r.units).toLocaleString()} units still to come</strong>`
                : `${fmtMoney(r.chanRev)} channel revenue × ${(r.pct * 100).toFixed(1)}% mix share ÷ ${fmtMoney2(r.asp)} ASP = <strong>${Math.round(r.units).toLocaleString()} units</strong> (${fmtMoney(r.chanRev * r.pct)})`
              }
            </div>
          </div>
        `).join('')}
        <div style="padding:5px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:12px;">
          <span>${isCurrentMonth ? 'Remaining demand (rest of month)' : 'Total implied demand'}</span><strong>${Math.round(totalUnits).toLocaleString()} units (${fmtMoney(totalRemainingRevenue)})</strong>
        </div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:12px;"><span>Starting inventory (${isCurrentMonth ? 'today, live' : 'prior month EOM'})</span><strong>${Math.round(startingInv).toLocaleString()}</strong></div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:12px;"><span>+ Incoming receipts${isCurrentMonth ? ' (rest of month)' : ' this month'}${draftReceiptsQty ? ' <span class="pill watch" style="margin-left:4px;">incl. draft PO</span>' : ''}</span><strong>${receipts.toLocaleString()}${realReceipts && draftReceiptsQty ? ` <span class="muted" style="font-weight:400;">(${realReceipts.toLocaleString()} confirmed + ${draftReceiptsQty.toLocaleString()} draft)</span>` : ''}</strong></div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:12px;"><span>− Units sold (above)</span><strong>${Math.round(totalUnits).toLocaleString()}</strong></div>
        <div style="padding:6px 0 0; display:flex; justify-content:space-between; font-size:13px;"><span><strong>= Projected end-of-month</strong></span><strong>${Math.round(endingInv).toLocaleString()}</strong></div>
      </details>

      ${isEditable() ? `
        <div style="margin-top:10px;">
          <button class="btn btn-primary" style="padding:6px 12px; font-size:12px;" onclick="document.getElementById('detail-modal-backdrop').remove(); openDraftPoModal('${productId}', '${month}')">+ Draft a PO landing in ${monthLabelShort(month)}</button>
        </div>
      ` : ''}
    </div>
  `;
  showDetail(`${p.display_name} — ${monthLabelLong(month)}${isCurrentMonth ? ' (in progress)' : ' (projected EOM)'}`, body);
}

function showOutlookStatusDetail(productId) {
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  const months = S.months;
  const projections = computeProjection(S.draftChannel, S.draftMix);
  const series = projections[p.sku_code] || [];
  const safety = p.safety_stock_qty || 0;
  const outlookStatus = window.RevenueLogic.computeOutlookStatus({ series, safetyStock: safety });
  const backendRec = S.anyRecFullByProduct?.[productId];
  const backendRecIsActive = backendRec && backendRec.decision !== 'dismissed';
  const isLiveView = S.selectedScenarioId === 'live';
  // Prefer the real PO-recommendation engine's numbers when an ACTIVE one exists; otherwise fall
  // back to this tab's own quick estimate (computeRecommendedPoQty) -- either way, "If the Status
  // is Issue it should come with a recommended PO initiation with all info filled out" (Alex). A
  // DISMISSED backend rec is shown for context only (see body below) -- a human already decided
  // it needs no action, so it must never silently drive what this button pre-fills.
  const fallbackQty = window.RevenueLogic.computeRecommendedPoQty({ series, firstIssueIndex: outlookStatus.firstIssueIndex, safetyStock: safety });
  const recommendedQty = backendRecIsActive ? (backendRec.recommended_order_qty || 0) : fallbackQty;
  const recommendedMonth = backendRecIsActive && backendRec.shortfall_month
    ? backendRec.shortfall_month.slice(0, 7)
    : (outlookStatus.firstIssueIndex != null ? months[outlookStatus.firstIssueIndex] : months[0]);

  const narrative = outlookStatus.status === 'HEALTHY'
    ? `Projected inventory stays at or above safety stock (${safety.toLocaleString()} units) across the full 6-month outlook — no action needed right now.`
    : (outlookStatus.reason === 'negative'
        ? `Projected to go <strong>negative</strong> by ${monthLabelLong(months[outlookStatus.firstIssueIndex])} (${Math.round(series[outlookStatus.firstIssueIndex]).toLocaleString()} units) — a stockout, not just a dip below safety stock.`
        : `Projected to fall <strong>below safety stock</strong> (${safety.toLocaleString()} units) by ${monthLabelLong(months[outlookStatus.firstIssueIndex])} (${Math.round(series[outlookStatus.firstIssueIndex]).toLocaleString()} units projected).`);

  const seriesRows = months.map((m, i) => {
    const v = series[i];
    const flag = v == null ? '' : (v < 0 ? ' ⚠ negative' : (v < safety ? ' ⚠ below safety' : ''));
    return `<tr><td style="padding:3px 8px;">${monthLabelShort(m)}</td><td style="padding:3px 8px; text-align:right; ${v < safety ? 'color:var(--bad-text);' : ''}">${v == null ? '—' : Math.round(v).toLocaleString()}${flag}</td></tr>`;
  }).join('');

  const body = `
    <div style="font-size:13px; line-height:1.5;">
      <div style="margin-bottom:6px;"><span class="pill ${outlookStatus.status === 'HEALTHY' ? 'good' : 'bad'}" style="font-size:12px;">${outlookStatus.status === 'HEALTHY' ? 'Healthy' : 'Issue'}</span></div>
      <div class="muted" style="font-size:12px; margin-bottom:8px;">${narrative} Safety stock: ${safety.toLocaleString()} units.</div>
      <div class="section-label" style="margin:10px 0 4px; font-size:11px;">Recommendation</div>
      ${backendRec ? `
        <div class="muted" style="font-size:12px; margin-bottom:4px;">
          The full PO-recommendation engine (Overview tab) ${backendRecIsActive ? 'already has an active' : 'found a'}
          <span class="urgency-badge urgency-${backendRec.urgency}" style="font-size:9px;">${backendRec.urgency}</span>
          recommendation — shortfall of ${(backendRec.shortfall_qty || 0).toLocaleString()} units by
          ${fmtDate(backendRec.shortfall_month)}${backendRecIsActive ? '.' : `, but it was <strong>dismissed</strong> — a human already reviewed this and decided no action is needed. Shown here for context only; the button below uses this tab's own quick estimate instead.`}
        </div>
        ${backendRecIsActive ? `<div style="font-size:12px; margin-bottom:8px;">Place by <strong>${fmtDate(backendRec.last_responsible_date)}</strong> · Suggested order: <strong>${(backendRec.recommended_order_qty || 0).toLocaleString()} units</strong></div>` : ''}
      ` : outlookStatus.status === 'ISSUE' ? `
        <div class="muted" style="font-size:12px; margin-bottom:8px;">No recommendation from the Overview tab's engine yet — the ${recommendedQty.toLocaleString()}-unit suggestion below is this tab's own quick estimate (enough to bring ${monthLabelShort(months[outlookStatus.firstIssueIndex])}'s projection back up to safety stock).</div>
      ` : ''}
      ${canEdit() && outlookStatus.status === 'ISSUE' ? `
        <button class="btn btn-primary" style="padding:6px 12px; font-size:12px; margin-bottom:4px;" onclick="document.getElementById('detail-modal-backdrop').remove(); ${
          isLiveView
            ? `initiateLivePoFromOutlook('${productId}', ${recommendedQty || 'null'}, '${recommendedMonth}', null)`
            : `openDraftPoModal('${productId}', '${recommendedMonth}')`
        }">${isLiveView ? '+ Initiate Recommended PO' : '+ Draft a PO'}</button>
      ` : ''}
      <details>
        <summary>Show the 6-month projection</summary>
        <table style="width:100%; font-size:12px; border-collapse:collapse;">
          <thead><tr><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Month (EOM)</th><th style="text-align:right; padding:3px 8px; border-bottom:1px solid var(--border);">Projected</th></tr></thead>
          <tbody>${seriesRows}</tbody>
        </table>
      </details>
    </div>
  `;
  showDetail(`${p.display_name} — Status`, body);
}

function showPacingTrendDetail(channel) {
  const p = (window._revenuePacing || {})[channel];
  const label = channel === 'shopify' ? 'Shopify' : 'Amazon';
  const monthLabel = window._revenuePacingMonthLabel || '';
  if (!p || p.noForecast || p.pctOfPaceYesterday == null) {
    showDetail(`${label} — Pacing Trend`, `<div class="muted">No day-over-day comparison available yet (either no forecast is set for ${monthLabel}, or it's the 1st of the month — there's no same-basis "yesterday" to compare against; that would be last month's different goal).</div>`);
    return;
  }
  const delta = p.pctOfPace - p.pctOfPaceYesterday;
  const direction = delta > 0.5 ? 'improved' : (delta < -0.5 ? 'slipped' : 'held steady');
  const narrative = `As of today (day ${p.daysElapsed} of ${p.daysInMonth}), ${label} is pacing at <strong>${p.pctOfPace.toFixed(0)}%</strong> of where it should be to hit the ${monthLabel} goal of ${fmtMoney(p.forecastFullMonth)}. Yesterday (day ${p.daysElapsed - 1}), that same figure was <strong>${p.pctOfPaceYesterday.toFixed(0)}%</strong>. So pace has <strong>${direction}</strong> by ${Math.abs(delta).toFixed(1)} point${Math.abs(delta) >= 1.5 ? 's' : ''} in the last 24 hours.`;
  const methodNote = `"Pace" compares actual MTD revenue to what you'd expect if the month's revenue landed perfectly evenly across every day (full-month goal ÷ days in month × days elapsed). 100% means exactly on track; above 100% means ahead; below means behind. The day-over-day number is the same calculation run one day apart, so it isolates whether the LAST day specifically helped or hurt your pace — not just whether you're ahead or behind overall.`;
  const body = `
    <div style="font-size:13px; line-height:1.6; margin-bottom:10px;">${narrative}</div>
    <table style="width:100%; font-size:12px; border-collapse:collapse; margin-bottom:10px;">
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">MTD revenue (today)</td><td style="padding:3px 8px; text-align:right; font-weight:700;">${fmtMoney(p.mtd)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">MTD revenue (yesterday)</td><td style="padding:3px 8px; text-align:right; font-weight:700;">${fmtMoney(p.mtdYesterday)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">Expected pace (today)</td><td style="padding:3px 8px; text-align:right;">${fmtMoney(p.expectedPace)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">Expected pace (yesterday)</td><td style="padding:3px 8px; text-align:right;">${fmtMoney(p.expectedPaceYesterday)}</td></tr>
    </table>
    <details><summary>How "pace" is calculated</summary><div class="muted" style="font-size:12px; margin-top:6px; line-height:1.5;">${methodNote}</div></details>
  `;
  showDetail(`${label} — Pacing Trend`, body);
}

function checkComponentFeasibility(productSku, qty) {
  // Delegates to window.RevenueLogic.checkComponentFeasibility (dashboard/lib/revenue-logic.js,
  // unit-tested with 100% coverage -- see test/revenue-logic.test.js).
  const S = window._revState;
  return window.RevenueLogic.checkComponentFeasibility(S.componentQoh, productSku, qty);
}

// Draft PO modal -- Alex's ask (2026-10-22): model a hypothetical finished-good PO against the
// current draft scenario, see its effect on the 6-month projection immediately, and see (but
// never be blocked by, per Alex's explicit decision) whether componentry on hand/in-flight is
// enough to actually support it.
function openDraftPoModal(productId, defaultMonth) {
  if (!isEditable()) { alert('Select or create a draft scenario to add a draft PO.'); return; }
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  document.getElementById('detail-modal-backdrop')?.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const monthOptions = S.months.map(m => `<option value="${m}" ${m === defaultMonth ? 'selected' : ''}>${monthLabelLong(m)}</option>`).join('');
  const defaultVendor = (S.vendors || []).find(v => v.vendor_name === 'Private Label') || (S.vendors || [])[0];
  const vendorOptions = (S.vendors || []).map(v => `<option value="${v.id}" ${v.id === defaultVendor?.id ? 'selected' : ''}>${v.vendor_name}</option>`).join('');
  el.innerHTML = `
    <div class="detail-modal" style="max-width:480px;">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">Draft PO — ${p.display_name}</div>
      <div class="muted" style="font-size:12px; margin-bottom:12px;">Added to scenario "${currentScenario()?.name}". Only affects real inventory once this scenario is committed to live.</div>
      <label class="muted" style="font-size:11px;">Quantity</label>
      <input id="draft-po-qty" type="number" min="1" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;" />
      <label class="muted" style="font-size:11px;">Landing month</label>
      <select id="draft-po-month" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;">${monthOptions}</select>
      <label class="muted" style="font-size:11px;">Vendor</label>
      <select id="draft-po-vendor" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;">${vendorOptions}</select>
      <div id="draft-po-place-date" class="muted" style="font-size:11px; margin:-6px 0 10px;"></div>
      <label class="muted" style="font-size:11px;">Notes (optional)</label>
      <input id="draft-po-notes" type="text" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;" />
      <div id="draft-po-feasibility" style="margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="draft-po-save">Save Draft PO</button>
        <button class="btn btn-ghost" id="draft-po-cancel">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  const qtyInput = document.getElementById('draft-po-qty');
  qtyInput.focus();
  const updateFeasibility = () => {
    const qty = Number(qtyInput.value) || 0;
    const feasEl = document.getElementById('draft-po-feasibility');
    if (!qty) { feasEl.innerHTML = ''; return; }
    const checks = checkComponentFeasibility(p.sku_code, qty);
    const shortages = checks.filter(c => c.short > 0);
    if (!checks.length) {
      feasEl.innerHTML = `<div class="muted" style="font-size:11px;">No componentry tracked against this product's SKU.</div>`;
    } else if (shortages.length === 0) {
      feasEl.innerHTML = `<div class="pill good" style="font-size:11px;">✓ Enough componentry on hand/in-flight for ${qty.toLocaleString()} units</div>`;
    } else {
      feasEl.innerHTML = `
        <div class="pill bad" style="font-size:11px; margin-bottom:6px;">⚠ Short on componentry for ${qty.toLocaleString()} units — you can still save this draft, but you'll also need component PO(s)</div>
        ${shortages.map(c => `<div class="muted" style="font-size:11px;">${c.component_name}: need ${c.required.toLocaleString()}, have ${c.available.toLocaleString()} on hand/in-flight — short ${c.short.toLocaleString()}</div>`).join('')}
      `;
    }
  };
  qtyInput.addEventListener('input', updateFeasibility);
  const monthSelect = document.getElementById('draft-po-month');
  const vendorSelect = document.getElementById('draft-po-vendor');
  const updatePlaceDate = () => {
    const month = monthSelect.value;
    const vendor = (S.vendors || []).find(v => v.id === vendorSelect.value);
    const placeDateEl = document.getElementById('draft-po-place-date');
    if (!vendor) { placeDateEl.innerHTML = ''; return; }
    const placeBy = window.RevenueLogic.computePlaceByDate(month, vendor.default_lead_days);
    const isPast = placeBy < new Date().toISOString().slice(0, 10);
    placeDateEl.innerHTML = `Place by <strong style="color:${isPast ? 'var(--bad-text)' : 'inherit'};">${fmtDate(placeBy)}</strong> to land in ${monthLabelShort(month)} (${vendor.vendor_name}'s ${vendor.default_lead_days}-day lead time)${isPast ? ' — already past, place immediately' : ''}.`;
  };
  monthSelect.addEventListener('change', updatePlaceDate);
  vendorSelect.addEventListener('change', updatePlaceDate);
  updatePlaceDate();
  const finish = () => el.remove();
  document.getElementById('draft-po-cancel').onclick = finish;
  document.getElementById('draft-po-save').onclick = async () => {
    const qty = Number(qtyInput.value);
    if (!qty || qty <= 0) { alert('Enter a positive quantity.'); return; }
    const month = document.getElementById('draft-po-month').value;
    const vendorId = document.getElementById('draft-po-vendor').value;
    if (!vendorId) { alert('Select a vendor — required to commit this PO later.'); return; }
    const notes = document.getElementById('draft-po-notes').value || null;
    const { data, error } = await sb.from('revenue_scenario_po').insert({
      scenario_id: S.selectedScenarioId, product_id: productId, vendor_id: vendorId,
      qty, eta_month: month + '-01', notes, created_by: currentUserRow?.email || 'dashboard',
    }).select().single();
    if (error) { alert('Failed: ' + error.message); return; }
    S.draftPOs.push(data);
    await logAction('revenue_scenario_po', data.id, 'create', `Added draft PO: ${p.display_name}, ${qty.toLocaleString()} units landing ${monthLabelShort(month)} (${currentScenario()?.name})`, null, data);
    finish();
    renderRevenueBody();
  };
}

async function deleteDraftPo(id) {
  if (!(await showConfirmModal('Remove this draft PO?', 'This only removes it from the scenario draft — nothing real has been placed or changed.', 'Remove'))) return;
  const S = window._revState;
  const before = (S.draftPOs || []).find(po => po.id === id);
  const { error } = await sb.from('revenue_scenario_po').delete().eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  if (before) {
    const product = S.products.find(p => p.product_id === before.product_id);
    await logAction('revenue_scenario_po', id, 'delete', `Removed draft PO: ${product?.display_name || 'product'}, ${before.qty.toLocaleString()} units`, before, null);
  }
  window._revState.draftPOs = window._revState.draftPOs.filter(po => po.id !== id);
  document.getElementById('detail-modal-backdrop')?.remove();
  renderRevenueBody();
}

function renderRevenueBody() {
  const S = window._revState;
  const el = document.getElementById('tab-revenue');
  const sc = currentScenario();
  const editable = isEditable();
  const months = S.months;

  const scenarioOptions = [
    `<option value="live" ${S.selectedScenarioId === 'live' ? 'selected' : ''}>Live Forecast</option>`,
    ...S.scenarios.map(s => `<option value="${s.id}" ${S.selectedScenarioId === s.id ? 'selected' : ''}>${s.name} (${s.status})</option>`),
  ].join('');

  // Shared column widths so Top-Line Revenue, Product Mix, and Inventory Outlook tables' month
  // columns line up vertically down the page (Alex, 2026-10-22) -- all three use kpiTable with
  // this exact same width array for the label/product column + each month column.
  const monthColWidths = ['150px', '105px', '105px', '105px', '105px', '105px', '105px'];

  const chanEditable = canEditChannel();
  const channelCell = (channel, m) => {
    const basis = channelMonthBasis(m, channel);
    return `
      <button class="btn ${chanEditable ? 'btn-ghost' : ''}" style="width:100%; padding:8px 4px; font-size:11px; display:flex; flex-direction:column; align-items:center; line-height:1.3; ${chanEditable ? '' : 'cursor:default; background:transparent; border-color:transparent;'}"
        onclick="${chanEditable ? `editDraftChannelMonth('${channel}','${m}')` : ''}" title="${monthLabelLong(m)} — ${basis.detail}">
        <span>${S.draftChannel[m]?.[channel] != null ? fmtMoney(S.draftChannel[m][channel]) : '<span class="muted">—</span>'}</span>
        <span class="muted" style="font-size:9px;">${basis.tag}</span>
      </button>
    `;
  };
  const channelTable = kpiTable(
    ['Channel', ...months.map(monthLabelShort)],
    [
      ['<strong>Shopify</strong>', ...months.map(m => channelCell('shopify', m))],
      ['<strong>Amazon</strong>', ...months.map(m => channelCell('amazon', m))],
    ],
    null, monthColWidths, [1, 2, 3, 4, 5, 6]
  );

  const mixView = S.mixView || 'units';
  const viewTabs = [
    { key: 'pct', label: '% of Revenue' },
    { key: 'asp', label: 'Avg Selling Price' },
    { key: 'units', label: 'Units (Throughput)' },
    { key: 'outlook', label: 'Inventory Outlook' },
  ].map(v => `<button class="btn ${mixView === v.key ? 'btn-primary' : 'btn-ghost'}" style="padding:5px 10px; font-size:12px;" onclick="setRevenueMixView('${v.key}')">${v.label}</button>`).join(' ');

  if (!S.mixSort) S.mixSort = { shopify: { key: 'revenue', dir: 'desc' }, amazon: { key: 'revenue', dir: 'desc' } };
  const mixFilterText = (S.mixFilterText || '').trim().toLowerCase();

  function productMixMetrics(channel, p) {
    return window.RevenueLogic.productMixMetrics({ channel, product: p, months, draftMix: S.draftMix, draftChannel: S.draftChannel });
  }

  // Alex (2026-10-22): "the sort by picklist values don't make sense in combination with some of
  // the different views" -- e.g. sorting by "% Share" while looking at the Units view doesn't
  // correspond to what's on screen. Options are now scoped to what's actually visible in the
  // current view (plus Revenue/Name, which are always meaningful regardless of view), and the
  // sort key auto-follows the view when you switch views (see setRevenueMixView) unless you've
  // deliberately picked something else since.
  const mixSortOptionsByView = {
    pct: [{ key: 'pct', label: '% Share (current month)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
    asp: [{ key: 'asp', label: 'Avg Selling Price (current)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
    units: [{ key: 'units', label: 'Units (6-mo total)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
  };
  const mixSortOptions = mixSortOptionsByView[mixView] || mixSortOptionsByView.units;

  const mixFilterBar = `
    <input id="mix-filter-input" type="text" placeholder="Filter products by name or SKU…" value="${(S.mixFilterText || '').replace(/"/g, '&quot;')}"
      style="padding:5px 8px; font-size:12px; border-radius:6px; border:1px solid var(--border); min-width:200px;"
      oninput="setMixFilterText(this.value)">
    ${mixFilterText ? `<button class="btn btn-ghost" style="padding:4px 8px; font-size:11px;" onclick="setMixFilterText('')">Clear</button>` : ''}
  `;

  const mixSortControls = (channel) => {
    const sort = S.mixSort[channel];
    return `
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <span class="muted" style="font-size:11px;">Sort by:</span>
        <select style="padding:3px 6px; font-size:11px; border-radius:6px; border:1px solid var(--border);" onchange="setMixSortKey('${channel}', this.value)">
          ${mixSortOptions.map(o => `<option value="${o.key}" ${sort.key === o.key ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="toggleMixSortDir('${channel}')">${sort.dir === 'desc' ? '↓ High → Low' : '↑ Low → High'}</button>
      </div>
    `;
  };

  const mixTable = (channel) => {
    const sort = S.mixSort[channel];
    let prods = S.products.filter(p => S.liveMix[channel]?.[p.product_id]);
    if (mixFilterText) prods = prods.filter(p => p.display_name.toLowerCase().includes(mixFilterText) || (p.sku_code || '').toLowerCase().includes(mixFilterText));
    const withMetrics = prods.map(p => ({ p, metrics: productMixMetrics(channel, p) }));
    // sort.key may be left over from a different view (e.g. 'pct' while now viewing ASP) if the
    // user switched views via setRevenueMixView's "don't clobber a deliberate choice" rule after
    // having picked something odd; fall back to this view's primary metric rather than erroring.
    const effectiveSortKey = mixSortOptions.some(o => o.key === sort.key) ? sort.key : mixSortOptions[0].key;
    const orderedProds = window.RevenueLogic.sortByMetric(
      withMetrics.map(x => ({ item: x.p, metrics: x.metrics })),
      { key: effectiveSortKey, dir: sort.dir, nameOf: (item) => item.display_name, fallbackRank: (item) => productSortRank(item.display_name) }
    );
    if (!orderedProds.length) return mixSortControls(channel) + `<div class="empty-state" style="padding:10px; font-size:12px;">No products match this filter.</div>`;
    const rows = orderedProds.map(p => [
      `<strong>${p.display_name}</strong>`,
      ...months.map(m => {
        const mix = S.draftMix[channel][p.product_id]?.[m];
        const chanRev = S.draftChannel[m]?.[channel];
        if (!mix) return '<span class="muted">—</span>';
        if (mixView === 'pct') {
          return `<button class="btn btn-ghost" style="padding:3px 6px; font-size:11px;" onclick="showMixCellDetail('pct','${channel}','${p.product_id}','${m}')"><strong>${(mix.revenue_pct * 100).toFixed(1)}%</strong></button>`;
        }
        if (mixView === 'asp') {
          return `<button class="btn btn-ghost" style="padding:3px 6px; font-size:11px;" onclick="showMixCellDetail('asp','${channel}','${p.product_id}','${m}')"><strong>${fmtMoney2(mix.avg_selling_price)}</strong></button>`;
        }
        if (chanRev == null) return '<span class="muted">—</span>';
        const units = Math.round((chanRev * mix.revenue_pct) / mix.avg_selling_price);
        return `<button class="btn btn-ghost" style="padding:3px 6px; font-size:11px;" onclick="showThroughputDetail('${p.product_id}','${m}')"><strong>${units.toLocaleString()}</strong></button>`;
      }),
    ]);
    if (mixView === 'pct') {
      const totals = months.map(m => orderedProds.reduce((s, p) => s + (S.draftMix[channel][p.product_id]?.[m]?.revenue_pct || 0), 0) * 100);
      // Alex (2026-10-22): "Why ... aren't the percentages equal to 100%? Is it due to shipping?"
      // Yes (for Shopify) -- revenue_pct is each product's share of TOTAL gross revenue, and gross
      // revenue includes shipping, which no product line claims a share of. Show the expected
      // shipping/other share alongside the product total instead of just flagging a bare "bad" pill
      // whenever product-only % falls short of 100 by roughly that amount.
      const shippingPct = (S.shippingShareByChannel?.[channel] || 0) * 100;
      const expectedTotal = 100 - shippingPct;
      rows.push([
        `<em>Product Total</em>${shippingPct > 0.5 ? `<br><span class="muted" style="font-size:10px;">+ ~${shippingPct.toFixed(1)}% shipping/other (trailing actual, not in any product's %)</span>` : ''}`,
        ...totals.map(t => {
          const diffFromExpected = Math.abs(t - expectedTotal);
          const ok = diffFromExpected < 2.5;
          const title = shippingPct > 0.5
            ? `${t.toFixed(1)}% product + ~${shippingPct.toFixed(1)}% shipping ≈ ${(t + shippingPct).toFixed(1)}% of gross revenue`
            : `${t.toFixed(1)}% of gross revenue`;
          return `<span class="pill ${ok ? 'good' : 'bad'}" title="${title}">${t.toFixed(1)}%</span>`;
        }),
      ]);
    }
    return mixSortControls(channel) + kpiTable(['Product', ...months.map(monthLabelShort)], rows, null, monthColWidths, [1, 2, 3, 4, 5, 6]);
  };

  // ---------- Inventory Outlook & Draft POs (compact, one row per product) ----------
  // Root products only -- Alex (2026-10-22): "this should only be for the root products, not
  // bundles ... we don't create POs per the bundle." Bundles (product_type='bundle', e.g. the
  // Day+Night Set) have no QOH/PO of their own; their inventory depends entirely on the root
  // products they're built from, which already appear in this table on their own rows.
  let outlookProducts = S.products
    .filter(p => p.product_type === 'root')
    .filter(p => S.liveMix.shopify?.[p.product_id] || S.liveMix.amazon?.[p.product_id]);
  if (mixFilterText) outlookProducts = outlookProducts.filter(p => p.display_name.toLowerCase().includes(mixFilterText) || (p.sku_code || '').toLowerCase().includes(mixFilterText));
  outlookProducts = outlookProducts
    .slice()
    .sort((a, b) => {
      const ua = window.RevenueLogic.urgencyRank(S.activeRecByProduct[a.product_id]);
      const ub = window.RevenueLogic.urgencyRank(S.activeRecByProduct[b.product_id]);
      return ua - ub || (productSortRank(a.display_name) - productSortRank(b.display_name));
    });
  const projections = computeProjection(S.draftChannel, S.draftMix);
  // Alex (2026-10-22): "it's unclear to me what those numbers represent — are they ending month
  // inventory numbers? ... [and confusion about] starting month inventory and now you can pull
  // starting inventory as of today." Answer: yes, every month column is a projected
  // END-of-month figure (headers now say "EOM" explicitly) -- and a separate, non-projected
  // "Today" column shows the live current QOH those projections start from, so the live snapshot
  // is never confused with either a month-start or month-end number.
  const outlookRows = outlookProducts.map(p => {
    const series = projections[p.sku_code] || [];
    const urgency = S.activeRecByProduct[p.product_id];
    const nameCell = `<strong>${p.display_name}</strong>${urgency ? ` <span class="urgency-badge urgency-${urgency}" style="margin-left:4px; font-size:9px; padding:1px 5px;">${urgency}</span>` : ''}`;
    const todayCell = `<div style="text-align:center; font-size:11px;"><strong>${Math.round(p.qty_on_hand || 0).toLocaleString()}</strong><br><span class="muted" style="font-size:9px;">live, today</span></div>`;
    const cells = months.map((m, i) => {
      const eom = series[i];
      const hasDraft = (S.draftPOs || []).some(po => po.product_id === p.product_id && po.eta_month.slice(0, 7) === m);
      if (eom == null) return '<span class="muted">—</span>';
      const safety = p.safety_stock_qty || 0;
      const bg = eom < 0 ? 'var(--bad-bg)' : (eom < safety ? '#EFEAE2' : 'transparent');
      const color = eom < 0 ? 'var(--bad-text)' : (eom < safety ? 'var(--accent-light)' : 'inherit');
      return `<button class="btn btn-ghost" style="padding:4px 6px; font-size:11px; display:flex; flex-direction:column; align-items:center; line-height:1.25; background:${bg}; color:${color}; border-color:transparent;" onclick="showThroughputDetail('${p.product_id}','${m}')" title="${monthLabelLong(m)}${i === 0 ? ' — month in progress, projected from today' : ' — projected end-of-month'}">
        <span><strong>${Math.round(eom).toLocaleString()}</strong></span>
        ${i === 0 ? '<span style="font-size:9px;">in progress</span>' : ''}
        ${hasDraft ? '<span style="font-size:9px;">+draft</span>' : ''}
      </button>`;
    });
    // Alex (2026-10-22): "to the right of EOM Mar 27 let's have a Status where it'll show healthy
    // or an issue and then a pop up box with the recommendations."
    const outlookStatus = window.RevenueLogic.computeOutlookStatus({ series, safetyStock: p.safety_stock_qty || 0 });
    // "Why doesn't it show up in the Product Mix Inventory outlook as an issue" (Alex, 2026-10-22)
    // -- this tab's own quick continuous-demand estimate and the real lead-time/MOQ-aware
    // PO-recommendation engine (Overview tab) can genuinely disagree. When the real engine has an
    // ACTIVE (non-dismissed) finding but this tab's own quick check says Healthy, flag it visibly
    // right on the pill rather than only in the popup -- so a disagreement is never silently
    // invisible at a glance.
    const activeBackendRec = S.activeRecFullByProduct?.[p.product_id];
    const disagrees = outlookStatus.status === 'HEALTHY' && !!activeBackendRec;
    const statusCell = `<button class="btn btn-ghost" style="padding:0;" onclick="showOutlookStatusDetail('${p.product_id}')" title="${disagrees ? 'The Overview tab recommendation engine has an active finding for this product that this quick check does not catch -- click for details.' : ''}">
      <span class="pill ${outlookStatus.status === 'HEALTHY' ? 'good' : 'bad'}">${outlookStatus.status === 'HEALTHY' ? 'Healthy' : 'Issue'}</span>${disagrees ? ' <span class="pill watch" style="margin-left:2px;">⚠ engine disagrees</span>' : ''}
    </button>`;
    // Alex (2026-10-22): "Outside of scenarios I should be able to initiate a draft and commit a
    // PO to see how that solves the problem" -- answered via clarify: committed directly against
    // live (no scenario wrapper), as its own separate path from the scenario-based draft PO flow
    // above. On "Live Forecast" this button creates a REAL order immediately; on a draft scenario
    // it still models a hypothetical via openDraftPoModal as before.
    const isLiveView = S.selectedScenarioId === 'live';
    const actionCell = !canEdit()
      ? '<span class="muted" style="font-size:10px;">—</span>'
      : isLiveView
      ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="initiateLivePoFromOutlook('${p.product_id}', null, '${months[0]}', null)">+ Initiate PO</button>`
      : (isEditable() ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="openDraftPoModal('${p.product_id}', '${months[0]}')">+ Draft PO</button>` : '<span class="muted" style="font-size:10px;">—</span>');
    return [nameCell, todayCell, ...cells, statusCell, actionCell];
  });
  const outlookTable = outlookRows.length
    ? kpiTable(['Product', 'Today', ...months.map(m => `EOM ${monthLabelShort(m)}`), 'Status', ''], outlookRows, null, [monthColWidths[0], '80px', ...monthColWidths.slice(1), '80px', '110px'], [1, 2, 3, 4, 5, 6, 7, 8, 9])
    : `<div class="empty-state" style="padding:10px; font-size:12px;">No products match this filter.</div>`;

  // ---------- Committed POs record (Alex, 2026-10-22: "I'd like to see a record of it") ----------
  // Every real purchase_orders row ever materialized by committing a Revenue tab scenario,
  // regardless of which scenario is currently selected above -- a persistent audit trail, not
  // just something visible while re-viewing the exact scenario that created it.
  const committedPoRows = (S.committedScenarioPOs || []).map(po => {
    const placeBy = po.eta_date && po.vendors?.default_lead_days != null
      ? window.RevenueLogic.computePlaceByDate(po.eta_date, po.vendors.default_lead_days)
      : null;
    return [
      po.revenue_scenarios?.name || '<span class="muted">—</span>',
      `<strong>${po.products?.display_name || '—'}</strong><br><span class="muted" style="font-size:10px;">${po.internal_ref}</span>`,
      (po.qty_ordered || 0).toLocaleString(),
      po.vendors?.vendor_name || '—',
      `<span class="pill ${po.status === 'landed' ? 'good' : 'watch'}">${po.status}</span>`,
      fmtDate(po.eta_date),
      placeBy ? fmtDate(placeBy) : '—',
    ];
  });
  const committedPoTable = committedPoRows.length
    ? kpiTable(['Scenario', 'Product', 'Qty', 'Vendor', 'Status', 'ETA', 'Was due by'], committedPoRows, null, null, [2, 3, 4, 5, 6])
    : null; // card only renders when there's at least one committed PO to show

  el.innerHTML = `
    <div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="section-label" style="margin:0;">Scenario:</div>
      <select id="scenario-select" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:13px;" onchange="selectRevenueScenario(this.value)">
        ${scenarioOptions}
      </select>
      ${sc ? `<span class="pill ${sc.status === 'draft' ? 'watch' : 'good'}">${sc.status}</span>` : `<span class="muted" style="font-size:12px;">read-only — create a scenario to model changes</span>`}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="createRevenueScenario()">+ New Scenario</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:12px;" onclick="commitRevenueScenario()">Commit to Live</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:12px; color:var(--bad-text);" onclick="deleteRevenueScenario('${sc.id}')">Delete Draft</button>` : ''}
    </div>

    <div class="card" style="padding:14px 16px; margin-bottom:12px;">
      <div class="section-label" style="margin:0 0 2px;">Top-Line Revenue by Channel</div>
      <div class="muted" style="font-size:11px; margin-bottom:8px;">${chanEditable ? 'Click a month to edit.' : 'You do not have permission to edit.'} Tag under each value shows whether it's real actuals, blended MTD, or a manual assumption — assumptions sharpen into actuals as each month closes.</div>
      ${channelTable}
    </div>

    <div class="card" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; gap:6px; margin:0 0 8px;">
        <div class="section-label" style="margin:0;">Product Mix → Inventory Throughput &amp; Outlook</div>
        ${infoIcon(`Every number here is derived from the top-line revenue above. Switch views to see how it was built; click any value for the rationale behind it, and — on a draft scenario — to edit it. <strong>Inventory Outlook</strong> is root products only (bundles have no QOH/PO of their own); "Today" is each product's live QOH, and every "EOM" column is a projected end-of-month figure built forward from it (the first EOM month is still in progress, so it only counts remaining demand for the rest of the month). ${isEditable() ? 'Click "+ Draft PO" to model a hypothetical order.' : ''} Sorted CRITICAL/WARNING/WATCH first in the Outlook view.`)}
      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">${viewTabs}${mixFilterBar}</div>
      ${mixView === 'outlook' ? outlookTable : `
        <div style="font-weight:600; font-size:12px; margin:8px 0 4px;">Shopify</div>
        ${mixTable('shopify')}
        <div style="font-weight:600; font-size:12px; margin:12px 0 4px;">Amazon</div>
        ${mixTable('amazon')}
      `}
    </div>

    ${committedPoTable ? `
    <div class="card" style="padding:14px 16px; margin-top:12px;">
      <div class="section-label" style="margin:0 0 2px;">Purchase Orders Committed From This Tab</div>
      <div class="muted" style="font-size:11px; margin-bottom:8px;">
        Every real PO materialized by committing a Revenue tab scenario, across all scenarios —
        a permanent record, independent of which scenario is selected above. "Was due by" is the
        last-responsible placement date given the vendor's lead time; a date in the past means it
        should have already been placed.
      </div>
      ${committedPoTable}
    </div>
    ` : ''}
  `;
}

function setRevenueMixView(view) {
  const S = window._revState;
  // Alex (2026-10-22): sort should make sense for the view you're looking at -- auto-switch the
  // sort key to match the newly selected view's primary metric, so the picklist and the visible
  // numbers are in sync by default. (Direction is left as-is; user can still override the key.)
  const primaryKeyByView = { pct: 'pct', asp: 'asp', units: 'units' };
  const newPrimaryKey = primaryKeyByView[view];
  if (S.mixSort && newPrimaryKey) {
    ['shopify', 'amazon'].forEach(ch => { if (S.mixSort[ch]) S.mixSort[ch].key = newPrimaryKey; });
  }
  S.mixView = view;
  renderRevenueBody();
}

function setMixSortKey(channel, key) {
  const S = window._revState;
  if (!S.mixSort) S.mixSort = { shopify: { key: 'revenue', dir: 'desc' }, amazon: { key: 'revenue', dir: 'desc' } };
  S.mixSort[channel].key = key;
  renderRevenueBody();
}

function toggleMixSortDir(channel) {
  const S = window._revState;
  if (!S.mixSort) S.mixSort = { shopify: { key: 'revenue', dir: 'desc' }, amazon: { key: 'revenue', dir: 'desc' } };
  S.mixSort[channel].dir = S.mixSort[channel].dir === 'desc' ? 'asc' : 'desc';
  renderRevenueBody();
}

function setMixFilterText(text) {
  const S = window._revState;
  S.mixFilterText = text;
  // Re-render only the body, and restore focus/cursor on the filter input since innerHTML replace drops it.
  renderRevenueBody();
  const input = document.getElementById('mix-filter-input');
  if (input) {
    input.focus();
    const pos = input.value.length;
    input.setSelectionRange(pos, pos);
  }
}

// ---------- Inventory ----------
async function renderInventory() {
  const el = document.getElementById('tab-inventory');
  const { data: products } = await sb.from('product_qoh').select('*').order('sku_code');
  const { data: projections } = await sb.from('monthly_projections').select('*').order('projection_month');

  el.innerHTML = `
    <div class="section-label">Finished Goods — Quantity on Hand &amp; Safety Stock</div>
    <div class="kpi-grid" id="inventory-cards"></div>
  `;
  const cardsEl = document.getElementById('inventory-cards');
  const sortedProducts = [...(products || [])].sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name));
  cardsEl.innerHTML = sortedProducts.map(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const belowSafety = p.qty_on_hand < p.safety_stock_qty;
    const canvasId = 'spark-' + p.product_id;
    return `
      <div class="card kpi-card">
        <div class="kpi-label">${p.display_name}<br><span style="font-weight:400;">${p.sku_code}</span></div>
        <div class="kpi-value">${p.qty_on_hand.toLocaleString()}</div>
        <div class="pill ${belowSafety ? 'bad' : 'good'}">safety stock ${p.safety_stock_qty.toLocaleString()}</div>
        <div class="sparkline-wrap"><canvas id="${canvasId}"></canvas></div>
      </div>
    `;
  }).join('') || `<div class="empty-state">No products found.</div>`;

  (products || []).forEach(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const canvas = document.getElementById('spark-' + p.product_id);
    if (!canvas || projRows.length === 0) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: projRows.map(r => r.projection_month),
        datasets: [{
          data: projRows.map(r => r.eom_inventory),
          borderColor: '#8A7257', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  });
}

// ---------- Purchase Orders ----------
async function renderPOs() {
  const el = document.getElementById('tab-pos');
  const { data: pos } = await sb.from('purchase_orders').select('*, vendors(vendor_name)').order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="section-label">Purchase Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Ref</th><th>Vendor</th><th>Status</th><th>Qty</th><th>Total Cost</th><th>ETA</th><th></th></tr></thead>
        <tbody id="pos-body"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('pos-body');
  if (!pos || pos.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="empty-state">No purchase orders yet.</td></tr>`;
    return;
  }
  body.innerHTML = pos.map(po => `
    <tr>
      <td><strong>${po.internal_ref}</strong>${po.vendor_po_number ? `<br><span class="muted" style="font-size:12px;">vendor#: ${po.vendor_po_number}</span>` : ''}</td>
      <td>${po.vendors ? po.vendors.vendor_name : '—'}</td>
      <td><span class="pill watch">${po.status}</span></td>
      <td>${po.qty_ordered ?? '—'}</td>
      <td>${po.total_cost ? fmtMoney2(po.total_cost) : '—'}</td>
      <td>${fmtDate(po.eta_date)}</td>
      <td>
        ${canEdit() && po.status === 'draft' ? `<button class="btn btn-primary" onclick="approvePO('${po.id}')">Approve</button>` : ''}
        ${canDelete() ? `<button class="btn btn-ghost" onclick="cancelPO('${po.id}')" style="margin-left:6px;">Cancel</button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function approvePO(id) {
  const { error } = await sb.from('purchase_orders').update({ status: 'approved', approved_by: currentUserRow.display_name || currentUserRow.email }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}
async function cancelPO(id) {
  if (!(await showConfirmModal('Cancel this PO?', '', 'Cancel PO'))) return;
  const { error } = await sb.from('purchase_orders').update({ status: 'cancelled' }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}

// ---------- Vendors & Comms ----------
async function renderVendors() {
  const el = document.getElementById('tab-vendors');
  const { data: vendors } = await sb.from('vendors').select('*').order('vendor_name');
  const { data: ledger } = await sb.from('inventory_ledger').select('*, components(component_name), vendors(vendor_name)').eq('event_type', 'component_order').eq('landed', false).order('next_contact');

  el.innerHTML = `
    <div class="section-label">Vendors</div>
    <div class="card" style="padding:0; margin-bottom:24px;">
      <table>
        <thead><tr><th>Vendor</th><th>Contact</th><th>Lead Time</th><th>Cadence</th><th>Channel</th></tr></thead>
        <tbody>
          ${(vendors || []).map(v => `
            <tr>
              <td><strong>${v.vendor_name}</strong></td>
              <td>${v.contact_name || '—'}<br><span class="muted" style="font-size:12px;">${v.contact_email || 'no email on file'}</span></td>
              <td>${v.default_lead_days} days</td>
              <td>every ${v.default_cadence_days} days</td>
              <td><span class="pill watch">${v.preferred_contact_channel}</span></td>
            </tr>
          `).join('') || `<tr><td colspan="5" class="empty-state">No vendors found.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-label">Planned Actions &amp; Comms — In-Flight Component Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Component</th><th>Vendor</th><th>ETA</th><th>Next Contact</th><th>Status</th></tr></thead>
        <tbody>
          ${(ledger || []).map(l => {
            const overdue = l.next_contact && new Date(l.next_contact) < new Date();
            return `
            <tr>
              <td>${l.components ? l.components.component_name : '—'}</td>
              <td>${l.vendors ? l.vendors.vendor_name : '—'}</td>
              <td>${fmtDate(l.eta)}</td>
              <td>${fmtDate(l.next_contact)}</td>
              <td><span class="pill ${overdue ? 'bad' : 'good'}">${overdue ? 'overdue for contact' : 'on track'}</span></td>
            </tr>
          `}).join('') || `<tr><td colspan="5" class="empty-state">No in-flight component orders.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

// ---------- Boot ----------
// Only (re)render the whole app on an actual sign-in — NOT on every auth event. Supabase fires
// TOKEN_REFRESHED periodically (including when the browser tab regains focus/visibility), and
// re-running loadApp() on that event was wiping all filter selections every time Alex switched
// away and back to the tab (found 2026-10-21). SIGNED_IN/INITIAL_SESSION only fire once per
// actual login, which is the only time we need a full rebuild.
sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) loadApp(session);
});
checkSession();
</script>
</body>
</html>
