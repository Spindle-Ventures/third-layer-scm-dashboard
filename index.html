<html lang="en">
<head>

<style>
  :root {
    --bg: #F2EFE9;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --muted: #8C867D;
    --border: #E5E0D8;
    --accent: #5C4A36;
    --accent-light: #8A7257;
    --good-bg: #E5EEE0;
    --good-text: #3F6B35;
    --bad-bg: #F3E2E0;
    --bad-text: #A33B2E;
    --watch-bg: #FBF0DD;
    --watch-text: #96631A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Playfair Display', serif; }
  header {
    padding: 18px 40px 0 40px;
  }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
  h1.title { font-size: 26px; font-weight: 600; margin: 2px 0 2px 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .snapshot-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; color: var(--muted);
  }
  nav.tabs {
    display: flex; gap: 24px; border-bottom: 1px solid var(--border);
    padding: 0 40px; margin-top: 6px;
  }
  nav.tabs button {
    background: none; border: none; font-family: 'Inter'; font-size: 14px; font-weight: 500;
    color: var(--muted); padding: 9px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 18px 40px 40px 40px; max-width: 1500px; margin: 0 auto; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
    margin: 18px 0 8px 0; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
  }
  .kpi-card { display: flex; flex-direction: column; gap: 4px; }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; width: fit-content;
  }
  .pill.good { background: var(--good-bg); color: var(--good-text); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
  .pill.watch { background: var(--watch-bg); color: var(--watch-text); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase;
       letter-spacing: 0.04em; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .urgency-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.03em; }
  .urgency-CRITICAL { background: var(--bad-bg); color: var(--bad-text); }
  .urgency-WARNING { background: var(--watch-bg); color: var(--watch-text); }
  .urgency-WATCH { background: #EFEAE2; color: var(--accent-light); }
  .urgency-OK { background: var(--good-bg); color: var(--good-text); }
  .btn {
    font-family: 'Inter'; font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    cursor: pointer; color: var(--ink);
  }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #4a3c2c; }
  .btn-ghost:hover { background: #F7F4EE; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 360px; text-align: center; }
  input[type=email] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'Inter'; font-size: 14px; margin: 14px 0; box-sizing: border-box;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .sparkline-wrap { width: 100%; height: 36px; margin-top: 6px; }
  .hidden { display: none !important; }
  .role-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 30px; text-align: center; }
  .clickable-pill { cursor: pointer; }
  .clickable-pill:hover { filter: brightness(0.95); }
  .detail-modal-backdrop {
    position: fixed; inset: 0; background: rgba(44,42,38,0.35); display: flex; align-items: center;
    justify-content: center; z-index: 1000;
  }
  .detail-modal {
    background: var(--card); border-radius: 14px; padding: 22px 26px; max-width: 640px;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
</style>

async function sendMagicLink() {

function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtMoney2(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y}`;
}
function fmtDateTime(ts) {
  const dt = new Date(ts);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  const time = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${mm}/${dd}/${yyyy} ${time}`;
}
// Prompts the user for a date in MM/DD/YYYY (matching Alex's display-format requirement) and
// converts it to the ISO YYYY-MM-DD format Postgres date columns need internally.
function promptDateMMDDYYYY(message, currentIso) {
  const defaultVal = currentIso ? fmtDate(currentIso) : '';
  const input = prompt(`${message} (MM/DD/YYYY):`, defaultVal);
  if (!input) return null;
  const match = input.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!match) { alert('Please enter a date as MM/DD/YYYY, e.g. 11/30/2026.'); return null; }
  const [, mm, dd, yyyy] = match;
  return `${yyyy}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}`;
}
function monthName(isoDate) {
  const [y, m] = isoDate.split('-');
  return new Date(Number(y), Number(m) - 1, 1).toLocaleString('en-US', { month: 'long' });
}

function buildRecommendationNarrative(r) {
  const outlook = r.monthly_outlook || [];
  if (outlook.length === 0) {
    return `${r.shortfall_qty} units projected short by ${fmtDate(r.shortfall_month)}. Place an order by ${fmtDate(r.last_responsible_date)} (lead time ${r.lead_days} days).`;
  }

  const current = r.current_qoh != null ? r.current_qoh.toLocaleString() : 'an unknown number of';
  let sentence = `We currently have ${current} units on hand.`;

  // Any planned receipt between now and the shortfall month, in order.
  const receipts = outlook.filter(m => m.receipts > 0 && m.month <= r.shortfall_month);
  receipts.forEach(rec => {
    sentence += ` We're planning on a receipt of ${rec.receipts.toLocaleString()} units landing by ${fmtDate(rec.month)}.`;
  });

  // Demand for each month up to and including the shortfall month, in plain language.
  const relevantMonths = outlook.filter(m => m.month <= r.shortfall_month);
  if (relevantMonths.length > 0) {
    const demandPhrases = relevantMonths.map(m => `${m.demand.toLocaleString()} in ${monthName(m.month)}`);
    sentence += ` Based on current revenue projections, we expect to sell through ${demandPhrases.join(', ')}.`;
  }

  sentence += ` At that pace, we'll fall ${r.shortfall_qty.toLocaleString()} units below the ${outlook[0].safety_stock ? outlook[0].safety_stock.toLocaleString() : ''} unit safety stock target by ${fmtDate(r.shortfall_month)} unless more is ordered. Recommended: place ${r.recommended_order_qty.toLocaleString()} units by ${fmtDate(r.last_responsible_date)}${r.days_until_deadline < 0 ? ` (already ${-r.days_until_deadline} day(s) overdue)` : ` (${r.days_until_deadline} day(s) from now)`}.`;

  return sentence;
}

const PROBLEM_LABELS = {
  shortfall: 'Shortfall',
  vendor_delay: 'Vendor Delay',
  safety_stock_review: 'Review Due',
  overdue_contact: 'Contact Due',
};

function showDetail(title, body, size) {
  const existing = document.getElementById('detail-modal-backdrop');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const maxWidth = size === 'wide' ? '1180px' : '640px';
  el.innerHTML = `
    <div class="detail-modal" style="max-width:${maxWidth};">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">${title}</div>
      <div style="font-size:14px; color:var(--ink); line-height:1.5;">${body}</div>
      <button class="btn btn-ghost" style="margin-top:16px;" onclick="document.getElementById('detail-modal-backdrop').remove()">Close</button>
    </div>
  `;
  document.body.appendChild(el);
}

function showOpenOrderDetail(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const orderTypeLabel = o.order_type === 'componentry' ? 'Component' : 'Finished Good';
  const body = `${buildActionDetail(o)}<div style="margin-top:14px;"><button class="btn btn-ghost" onclick="scrollToOrderRow('${ledgerId}')">Take me there</button></div>`;
  showDetail(`${o.product_name} — ${orderTypeLabel}`, body);

function scrollToOrderRow(ledgerId) {
  const modal = document.getElementById('detail-modal-backdrop');
  if (modal) modal.remove();
  // Override whatever filters are active so the target row is guaranteed visible, per Alex's
  // explicit request -- "Take me there" should never land on a filtered-out empty result.
  const overviewTabBtn = document.querySelector('.tab-btn[data-tab="overview"]');
  if (overviewTabBtn && !overviewTabBtn.classList.contains('active')) overviewTabBtn.click();
  document.getElementById('filter-product').value = 'all';
  document.getElementById('filter-type').value = 'all';
  window._needsActionFilter = false;
  const toggleBtn = document.getElementById('needs-action-toggle-btn');
  if (toggleBtn) { toggleBtn.textContent = '⚑ Show Needs-Attention Only'; toggleBtn.className = 'btn btn-ghost'; }

  const row = document.getElementById('row-' + ledgerId);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.style.transition = 'background-color 0.3s';
  const prevBg = row.style.backgroundColor;
  row.style.backgroundColor = 'var(--watch-bg)';
  setTimeout(() => { row.style.backgroundColor = prevBg; }, 1800);
}

function scrollToRecCard(recId) {

  const card = document.getElementById('rec-card-' + recId);

}

function kpiTable(headers, rows, wrapIdx, colWidths, noWrapCols) {
  if (rows.length === 0) return '<div class="muted">Nothing here right now.</div>';
  const idx = wrapIdx != null ? wrapIdx : headers.length - 1;
  const noWrapSet = new Set(noWrapCols || []);
  const colgroup = colWidths ? `<colgroup>${colWidths.map(w => `<col style="width:${w || 'auto'};">`).join('')}</colgroup>` : '';
  const cellStyle = (ci) => {
    if (noWrapSet.has(ci)) return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;`;
    if (colWidths && colWidths[ci]) return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:normal; word-break:break-word;`;
    return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:${ci === idx ? 'normal' : 'nowrap'}; ${ci === idx ? 'min-width:380px;' : ''}`;
  };
  return `
    <table style="width:100%; font-size:13px; border-collapse:collapse; table-layout:${colWidths ? 'fixed' : 'auto'};">
      ${colgroup}
      <thead><tr>${headers.map(h => `<th style="padding:8px 10px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr style="background:${i % 2 === 0 ? 'transparent' : 'rgba(0,0,0,0.02)'};">${r.map((c, ci) => `<td style="${cellStyle(ci)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
}

function showRecsKpiDetail() {

    r.products.display_name,

function showContactsKpiDetail() {
  const { contactsDueOrSoon } = window._kpiContext || { contactsDueOrSoon: [] };
  const today = new Date().toISOString().slice(0, 10);
  const rows = contactsDueOrSoon
    .slice()

        o.vendor_name || '—',

        `<button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="scrollToOrderRow('${o.ledger_id}')">Take me there</button>`,
      ];
    });
  showDetail('Vendor Contacts Due — next 7 days', kpiTable(['Vendor', 'Product', 'Order #', 'ETA', 'Next Contact', 'Why', ''], rows, 5, null, [3]), 'wide');
}

function showQcKpiDetail() {
  const { lastQc } = window._kpiContext || { lastQc: null };
  if (!lastQc) { showDetail('Data Last Updated', 'No QC run has been logged yet.'); return; }
  const checks = lastQc.checks && lastQc.checks.length > 0
    ? lastQc.checks
    : (lastQc.failures || []).map(f => ({ check: f.check, passed: false, detail: f.detail }));
  const rows = checks.map(c => [
    c.check,
    `<span class="pill ${c.passed ? 'good' : 'bad'}">${c.passed ? 'Pass' : 'Fail'}</span>`,
    c.detail || '',
  ]);
  showDetail(`QC Run — ${fmtDateTime(lastQc.run_at)}`, kpiTable(['Check', 'Result', 'Detail'], rows));
}

// ---------- Overview ----------
async function renderOverview() {
  const el = document.getElementById('tab-overview');
  const todayIso = new Date().toISOString().slice(0, 10);
  const monthStartIso = todayIso.slice(0, 7) + '-01';
  const [{ data: recs }, { data: pos }, { data: openOrders }, { data: qcRuns }, { data: invSnapshot }, { data: qohRows }, { data: revActuals }, { data: revForecasts }] = await Promise.all([
    sb.from('agent_recommendations').select('*, products(sku_code, display_name)').neq('decision', 'dismissed').order('days_until_deadline', { ascending: true }),
    sb.from('purchase_orders').select('*').in('status', ['draft', 'pending_approval', 'approved', 'placed', 'in_transit']),
    sb.from('open_orders_by_product').select('*'),
    sb.from('qc_runs').select('*').order('run_at', { ascending: false }).limit(1),
    sb.from('product_inventory_snapshot').select('*, products(sku_code)'),
    sb.from('product_qoh').select('sku_code, safety_stock_qty, safety_stock_basis'),
    sb.from('revenue_actuals').select('channel, gross_revenue, revenue_date').gte('revenue_date', monthStartIso).lte('revenue_date', todayIso),
    sb.from('revenue_forecasts').select('channel, forecast_revenue').eq('forecast_month', monthStartIso),
  ]);

  window._invSnapshotBySku = {};
  (invSnapshot || []).forEach(s => {
    const sku = s.products?.sku_code;
    if (!sku) return;
    if (!window._invSnapshotBySku[sku]) window._invSnapshotBySku[sku] = {};
    window._invSnapshotBySku[sku][s.channel] = s.qty;
  });
  window._safetyStockBySku = {};
  window._safetyStockBasisBySku = {};
  (qohRows || []).forEach(r => {
    window._safetyStockBySku[r.sku_code] = r.safety_stock_qty;
    window._safetyStockBasisBySku[r.sku_code] = r.safety_stock_basis;
  });

  // Revenue MTD vs forecast pace -- same methodology as daily_digest.py's get_revenue_pacing():
  // pro-rate the full-month forecast by days-elapsed-so-far and compare to actual MTD gross
  // revenue. Never fabricates a baseline if no forecast row exists for the current month.
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysElapsed = now.getDate();
  const revenuePacing = {};
  ['shopify', 'amazon'].forEach(channel => {
    const mtd = (revActuals || []).filter(r => r.channel === channel).reduce((sum, r) => sum + Number(r.gross_revenue || 0), 0);
    const forecastRow = (revForecasts || []).find(r => r.channel === channel);
    if (!forecastRow) {
      revenuePacing[channel] = { mtd, noForecast: true };
      return;
    }
    const forecastFullMonth = Number(forecastRow.forecast_revenue);
    const expectedPace = daysInMonth ? (forecastFullMonth / daysInMonth) * daysElapsed : 0;
    const pctOfGoal = forecastFullMonth > 0 ? (mtd / forecastFullMonth) * 100 : 0;
    const pctOfPace = expectedPace > 0 ? (mtd / expectedPace) * 100 : 0;
    revenuePacing[channel] = { mtd, forecastFullMonth, expectedPace, pctOfGoal, pctOfPace };
  });
  window._revenuePacing = revenuePacing;

  const today = new Date().toISOString().slice(0, 10);
  const in7Days = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);

  const activeRecs = (recs || []).filter(r => r.urgency !== 'OK');
  const criticalCount = activeRecs.filter(r => r.urgency === 'CRITICAL').length;
  const overdueOrders = (openOrders || []).filter(o => o.action_needed === 'Overdue');
  const overdueCount = overdueOrders.length;
  // "Vendor Contacts Due" = overdue contacts + anything coming up in the next 7 days, so Alex can
  // see what communications are coming, not just what's already late.
  const contactsDueOrSoon = (openOrders || []).filter(o => o.order_status !== 'paused' && o.next_contact && o.next_contact <= in7Days);
  const contactDueCount = contactsDueOrSoon.length;
  const lastQc = (qcRuns && qcRuns[0]) || null;
  const needsActionCount = (openOrders || []).filter(o => o.action_needed !== 'On Track').length;

  const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  window._kpiContext = { activeRecs, overdueOrders, contactsDueOrSoon, lastQc };
  const pacingRow = (channel, label) => {
    const p = revenuePacing[channel];
    if (p.noForecast) {
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
          <div style="width:70px; font-size:12px; font-weight:600;">${label}</div>
          <div style="flex:1; font-size:12px;" class="muted">No forecast set for ${monthLabel} — MTD actual ${fmtMoney(p.mtd)}</div>
          <button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="editRevenueForecast('${channel}')">+ Set forecast</button>
        </div>
      `;
    }
    const barColor = p.pctOfPace >= 95 ? 'var(--good-text)' : (p.pctOfPace >= 80 ? 'var(--watch-text)' : 'var(--bad-text)');
    const fillPct = Math.min(100, p.pctOfGoal);
    const paceLabel = p.pctOfPace >= 100 ? `${(p.pctOfPace - 100).toFixed(0)}% ahead of pace` : `${(100 - p.pctOfPace).toFixed(0)}% behind pace`;
    return `
      <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
        <div style="width:70px; font-size:12px; font-weight:600;">${label}</div>
        <div style="flex:1; background:var(--border); border-radius:6px; height:10px; overflow:hidden;">
          <div style="width:${fillPct}%; background:${barColor}; height:100%;"></div>
        </div>
        <div style="width:42px; text-align:right; font-size:13px; font-weight:700; color:${barColor};">${p.pctOfGoal.toFixed(0)}%</div>
        <div class="muted" style="font-size:11px; width:230px;">${fmtMoney(p.mtd)} of ${fmtMoney(p.forecastFullMonth)} goal — ${paceLabel}</div>
        <button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="editRevenueForecast('${channel}')">✎</button>
      </div>
    `;
  };

  el.innerHTML = `
    <div class="card" style="padding:10px 14px; margin-bottom:14px;">
      <div class="section-label" style="margin:0 0 2px;">Revenue Pacing — ${monthLabel}</div>
      ${pacingRow('shopify', 'Shopify')}
      ${pacingRow('amazon', 'Amazon')}
    </div>

    <div class="section-label">At a Glance</div>
    <div class="kpi-grid">
      <div class="card kpi-card clickable-pill" onclick="showRecsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Open Recommendations</div>
          <div class="kpi-value" style="font-size:20px;">${activeRecs.length}</div>
        </div>
        <div class="pill ${criticalCount > 0 ? 'bad' : 'good'}">${criticalCount} critical</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showOverdueKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Overdue Orders</div>
          <div class="kpi-value" style="font-size:20px;">${overdueCount}</div>
        </div>
        <div class="pill ${overdueCount > 0 ? 'bad' : 'good'}">${overdueCount > 0 ? 'past ETA, not landed' : 'none overdue'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showContactsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Vendor Contacts Due</div>
          <div class="kpi-value" style="font-size:20px;">${contactDueCount}</div>
        </div>
        <div class="pill ${contactDueCount > 0 ? 'watch' : 'good'}">${contactDueCount > 0 ? 'due now or within 7 days' : 'none in next 7 days'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showQcKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Data Last Updated</div>
          <div class="kpi-value" style="font-size:14px;">${lastQc ? fmtDateTime(lastQc.run_at) : '—'}</div>
        </div>
        <div class="pill ${lastQc && lastQc.all_clear ? 'good' : 'bad'}">${lastQc ? (lastQc.all_clear ? 'QC: all clear' : 'QC: discrepancy found') : 'no QC run yet'}</div>
      </div>
    </div>

    <div class="section-label">Agentic Recommendations — Validate or Dismiss</div>
    <div id="recs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:18px;"></div>

    <div class="section-label">Open Orders by Product — ${needsActionCount} need attention</div>
    <div class="card" style="padding: 12px 16px; margin-bottom: 10px;">
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:13px; font-weight:500;">Product:
          <select id="filter-product" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All products</option>
          </select>
        </label>
        <label style="font-size:13px; font-weight:500;">Order Type:
          <select id="filter-type" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All types</option>
            <option value="finished_good">Finished Good</option>
            <option value="componentry">Component</option>
          </select>
        </label>
        <button class="btn ${window._needsActionFilter !== false ? 'btn-primary' : 'btn-ghost'}" id="needs-action-toggle-btn" style="padding:5px 10px; font-size:12px;" onclick="toggleNeedsActionFilter()" title="${window._needsActionFilter !== false ? 'Currently filtered to items needing attention' : 'Currently showing every open order'}">⚑ ${window._needsActionFilter !== false ? 'Show All Orders' : 'Show Needs-Attention Only'}</button>
        <button class="btn btn-ghost" id="reveal-order-data-btn" style="padding:5px 10px; font-size:12px;" onclick="toggleRevealOrderData()" title="Show/hide Order # and Tracking values inline">👁 ${window._revealOrderData ? 'Hide' : 'Reveal'} Order # / Tracking</button>
      </div>
    </div>
    <div id="open-orders-groups"></div>
  `;

  window._openOrdersCache = openOrders || [];
  const productSelect = document.getElementById('filter-product');
  const uniqueProducts = [...new Map((openOrders || []).map(o => [o.product_sku, o.product_name])).entries()];
  uniqueProducts.sort((a, b) => productSortRank(a[1]) - productSortRank(b[1]) || a[1].localeCompare(b[1]));
  // Preserve filter selections across re-renders (e.g. after an action) instead of resetting them.
  const prevProduct = window._filterState?.product || 'all';
  const prevType = window._filterState?.type || 'all';
  productSelect.innerHTML = '<option value="all">All products</option>' + uniqueProducts.map(([sku, name]) => `<option value="${sku}" ${sku === prevProduct ? 'selected' : ''}>${name} (${sku})</option>`).join('');
  document.getElementById('filter-type').value = prevType;
  if (window._needsActionFilter === undefined) window._needsActionFilter = true;

  applyOpenOrdersFilter();

  window._recsCache = recs || [];
  const grid = document.getElementById('recs-grid');
  if (!recs || recs.length === 0) {
    grid.innerHTML = `<div class="card empty-state" style="grid-column: 1 / -1;">No open recommendations — nothing needs a decision today.</div>`;
  } else {
    grid.innerHTML = recs.map(r => `
      <div class="card" id="rec-card-${r.id}" style="padding:12px 14px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
          <div><strong>${r.products.display_name}</strong> <span class="muted" style="font-size:12px;">${r.products.sku_code}</span></div>
          <span class="urgency-badge urgency-${r.urgency}">${r.urgency}</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
          <span class="pill clickable-pill watch" onclick="showRecommendationDetail('${r.id}')">${PROBLEM_LABELS[r.problem_type] || r.problem_type}</span>
          <span style="font-size:12px;">Current inventory: <strong style="font-size:14px; color:${(() => { const ss = (window._safetyStockBySku || {})[r.products.sku_code]; if (r.current_qoh == null || ss == null) return 'var(--ink)'; if (r.current_qoh < ss) return 'var(--bad-text)'; if (r.current_qoh < ss * 1.25) return 'var(--watch-text)'; return 'var(--good-text)'; })()};">${r.current_qoh != null ? r.current_qoh.toLocaleString() : '—'}</strong></span>
        </div>
        ${canEdit() ? `
          <select onchange="decideRecommendation('${r.id}', this.value)" style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="pending" ${r.decision === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="approved" ${r.decision === 'approved' ? 'selected' : ''}>Approved</option>
            <option value="dismissed" ${r.decision === 'dismissed' ? 'selected' : ''}>Dismissed</option>
          </select>
        ` : `<span class="pill ${r.decision === 'approved' ? 'good' : r.decision === 'dismissed' ? 'bad' : 'watch'}">${r.decision}</span>`}
      </div>
    `).join('');
  }
}

function canEdit() {
  return currentUserRow && (currentUserRow.role === 'editor' || currentUserRow.role === 'admin');
}
function canDelete() {
  return currentUserRow && currentUserRow.role === 'admin';
}

function applyOpenOrdersFilter() {
  const all = window._openOrdersCache || [];
  const productFilter = document.getElementById('filter-product').value;
  const typeFilter = document.getElementById('filter-type').value;
  const onlyAction = window._needsActionFilter !== false;
  window._filterState = { product: productFilter, type: typeFilter };

  const filtered = all.filter(o => {
    if (productFilter !== 'all' && o.product_sku !== productFilter) return false;
    if (typeFilter !== 'all' && o.order_type !== typeFilter) return false;
    if (onlyAction && o.action_needed === 'On Track') return false;
    return true;
  });

  const groupsEl = document.getElementById('open-orders-groups');
  if (filtered.length === 0) {
    groupsEl.innerHTML = `<div class="card empty-state">Nothing matches these filters${onlyAction ? ' — try the "Show All Orders" button' : ''}.</div>`;
    return;
  }

  const byProduct = new Map();
  filtered.forEach(o => {
    if (!byProduct.has(o.product_sku)) byProduct.set(o.product_sku, { name: o.product_name, rows: [] });
    byProduct.get(o.product_sku).rows.push(o);
  });

  groupsEl.innerHTML = [...byProduct.entries()].sort((a, b) => productSortRank(a[1].name) - productSortRank(b[1].name) || a[1].name.localeCompare(b[1].name)).map(([sku, group]) => {
    const inv = (window._invSnapshotBySku || {})[sku] || {};
    const safetyStock = (window._safetyStockBySku || {})[sku];
    const invColor = (qty) => {
      if (qty == null || safetyStock == null) return 'var(--ink)';
      if (qty < safetyStock) return 'var(--bad-text)';
      if (qty < safetyStock * 1.25) return 'var(--watch-text)';
      return 'var(--good-text)';
    };
    const shopifyQty = inv.shopify != null ? inv.shopify.toLocaleString() : '—';
    const amazonQty = inv.amazon != null ? inv.amazon.toLocaleString() : 'not connected';
    const shopifyColor = invColor(inv.shopify);

    return `
    <div class="card" style="padding:0; margin-bottom:10px; overflow-x:auto;">
      <div style="padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; white-space:nowrap; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <div><strong>${group.name}</strong> <span class="muted" style="font-size:12px;">${sku}</span></div>
          <span style="font-size:13px;">Current Inventory — Shopify: <strong style="font-size:15px; color:${shopifyColor};">${shopifyQty}</strong>${safetyStock != null ? ` <span class="pill clickable-pill watch" style="font-size:11px;" onclick="showSafetyStockDetail('${sku}')">safety stock ${safetyStock.toLocaleString()}</span>` : ''}</span>
          <span style="font-size:13px;">Amazon: <strong style="font-size:15px; color:var(--ink);">${amazonQty}</strong></span>
        </div>
        <span class="muted" style="font-size:12px;">${group.rows.length} open order(s)</span>
      </div>
      <table style="white-space:nowrap;">
        <thead><tr><th></th><th>Order Type</th><th>Component</th><th>Order Health</th><th>ETA</th><th>Status</th><th>Order #</th><th>Vendor</th><th>Qty</th><th style="white-space:normal;">Tracking</th><th>Contact Schedule</th></tr></thead>
        <tbody>${group.rows.map(o => renderOpenOrderRow(o)).join('')}</tbody>
      </table>
    </div>
  `;
  }).join('');
}

function showSafetyStockDetail(sku) {
  const basis = (window._safetyStockBasisBySku || {})[sku] || 'No rationale on file — this product may not have enough sales history yet for the calculation.';
  showDetail(`${sku} — Safety Stock Rationale`, basis);
}

function productSortRank(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('night oil')) return 0;
  if (n.includes('day spray')) return 1;
  if (n.includes('mud') || n.includes('armpit mud')) return 2;
  if (n.includes('deodorant')) return 3;
  return 4;
}

function componentShortLabel(name) {
  if (!name) return '—';
  const n = name.toLowerCase();
  if (n.includes('dropper')) return 'Droppers';
  if (n.includes('bottle')) return 'Bottles';
  if (n.includes('jar')) return 'Jars';
  if (n.includes('label')) return 'Labels';
  if (n.includes('lid')) return 'Lids';
  if (n.includes('stopper')) return 'Stoppers';
  if (n.includes('ring')) return 'Rings';
  if (n.includes('cap')) return 'Caps';
  if (n.includes('patch')) return 'Patches';
  if (n.includes('pump')) return 'Pumps';
  return name.split(' ').pop();
}

function actionPillClass(action) {
  if (action === 'Overdue') return 'bad';
  if (action === 'On Track') return 'good';
  if (action === 'Paused') return 'watch';
  return 'watch'; // Contact Due, ETA Soon
}

function buildActionDetail(o) {
  const today = new Date().toISOString().slice(0, 10);
  const itemLabel = o.order_type === 'componentry' ? (o.component_name || 'this component') : o.product_name;
  const vendorLabel = o.vendor_name || 'the vendor';
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const qtyFmt = o.qty != null ? o.qty.toLocaleString() : 'an unknown number of';
  const contactWho = o.vendor_contact_name || o.vendor_contact_email
    ? `${o.vendor_contact_name || ''}${o.vendor_contact_name && o.vendor_contact_email ? ' at ' : ''}${o.vendor_contact_email || ''}`
    : vendorLabel;

  const whatOrder = `${qtyFmt} units of ${itemLabel}`;
  const updateClause = o.notes
    ? `The last update we have${o.last_contacted ? ` (${fmtDate(o.last_contacted)})` : ''} is: "${o.notes}."`
    : `There's no update logged${o.placed_date ? ` since it was placed on ${fmtDate(o.placed_date)}` : ''}.`;

  if (o.order_status === 'paused') {
    return `${whatOrder} — this order is paused, so it won't trigger overdue or contact alerts until it's resumed. ${updateClause}`;
  }

  if (o.eta && o.eta < today && !o.landed) {
    const daysOverdue = daysBetween(o.eta, today);
    return `${whatOrder} were due <strong>${fmtDate(o.eta)}</strong> and still haven't landed — that's <strong>${daysOverdue} day(s) late</strong>. ${updateClause} Worth confirming with ${contactWho} to see what's actually going on.`;
  }

  if (o.next_contact && o.next_contact < today) {
    const daysOverdue = daysBetween(o.next_contact, today);
    return `We were supposed to check in with ${vendorLabel} about ${itemLabel} by <strong>${fmtDate(o.next_contact)}</strong>, and that's now <strong>${daysOverdue} day(s) overdue</strong>. ${updateClause} Worth reaching out to ${contactWho} now.`;
  }

  if (o.eta && daysBetween(today, o.eta) <= 14 && daysBetween(today, o.eta) >= 0) {
    const daysUntil = daysBetween(today, o.eta);
    return `${whatOrder} are expected to land <strong>${fmtDate(o.eta)}</strong> — about ${daysUntil} day(s) out. ${updateClause} Worth confirming shipment/tracking with ${contactWho} before it lands.`;
  }

  // On Track
  const nextContactPhrase = o.next_contact ? `we've got a check-in scheduled for ${fmtDate(o.next_contact)}.` : `there's no next check-in scheduled yet.`;
  return `${whatOrder} are on track${o.eta ? `, expected ${fmtDate(o.eta)}` : ''}. ${updateClause} Looking ahead, ${nextContactPhrase}`;
}

function renderPoNumberCell(o, canAct) {
  const value = o.internal_ref || o.vendor_po_number || null;
  if (window._revealOrderData) {
    return canAct
      ? `<button class="btn btn-ghost" style="padding:4px 10px; font-size:12px;" onclick="editPoNumber('${o.ledger_id}')">${value || '+ Add'}</button>`
      : (value || '—');
  }
  return `<span class="pill clickable-pill ${value ? 'good' : 'watch'}" onclick="showPoNumberDetail('${o.ledger_id}')">${value ? 'On File' : 'Missing'}</span>`;
}

function renderTrackingCell(o, canAct) {
  const value = o.tracking_info || null;
  if (window._revealOrderData) {
    return canAct
      ? `<button class="btn btn-ghost" style="padding:4px 10px; font-size:12px; white-space:normal; word-break:break-word;" onclick="editTracking('${o.ledger_id}')">${value || '+ Add'}</button>`
      : (value || '—');
  }
  return `<span class="pill clickable-pill ${value ? 'good' : 'watch'}" onclick="showTrackingDetail('${o.ledger_id}')">${value ? 'On File' : 'Missing'}</span>`;
}

function renderContactScheduleCell(o) {
  const today = new Date().toISOString().slice(0, 10);
  let label, cls;
  if (o.next_contact) {
    label = fmtDate(o.next_contact);
    cls = o.next_contact < today ? 'bad' : 'watch';
  } else if (o.last_contacted) {
    label = `Last ${fmtDate(o.last_contacted)}`;
    cls = 'watch';
  } else {
    label = 'None scheduled';
    cls = 'watch';
  }
  return `<span class="pill clickable-pill ${cls}" onclick="showContactScheduleDetail('${o.ledger_id}')">${label}</span>`;
}

function showContactScheduleDetail(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const vendorLabel = o.vendor_name || 'the vendor';
  const rows = [];
  if (o.last_contacted || o.notes) {
    rows.push([fmtDate(o.last_contacted), 'Last contact', o.notes || '<span class="muted">No result logged</span>']);
  }
  if (o.next_contact) {
    rows.push([fmtDate(o.next_contact), 'Next contact', '<span class="muted">Upcoming</span>']);
  }
  const ledgerTable = rows.length > 0
    ? kpiTable(['Date', 'Type', 'Result'], rows, 2)
    : '<div class="muted">No contact history logged for this order yet.</div>';
  const body = `
    ${ledgerTable}
    ${canEdit() ? `
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="document.getElementById('detail-modal-backdrop').remove(); editLastContact('${ledgerId}')">Log a contact</button>
        <button class="btn btn-ghost" onclick="document.getElementById('detail-modal-backdrop').remove(); editNextContact('${ledgerId}')">Set next contact</button>
      </div>
    ` : ''}
  `;
  showDetail(`${o.product_name} — Contact Schedule with ${vendorLabel}`, body);
}

async function editLastContact(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const dateVal = promptDateMMDDYYYY('Date of this contact', o.last_contacted);

async function splitOrder(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const splitQtyStr = prompt(`Split ${o.qty} units — how many units go into the NEW (second) order?`, Math.floor((o.qty || 0) / 2));
  if (!splitQtyStr) return;
  const splitQty = Number(splitQtyStr);
  if (!splitQty || splitQty <= 0 || splitQty >= o.qty) { alert('Enter a quantity less than the current total.'); return; }
  const newEta = promptDateMMDDYYYY('ETA for the new (split-off) order', o.eta);

  // Reduce the original row, then insert a new ledger row carrying the remainder.
  const { error: err1 } = await sb.from('inventory_ledger').update({ qty_in: o.qty - splitQty }).eq('id', ledgerId);
  if (err1) { alert('Failed: ' + err1.message); return; }
  const { error: err2 } = await sb.from('inventory_ledger').insert({
    event_date: new Date().toISOString().slice(0, 10),
    event_type: o.order_type === 'componentry' ? 'component_order' : 'production_run',
    product_id: o.order_type === 'componentry' ? null : o.product_id,
    component_id: null, // component_id can't be resolved client-side reliably; left for manual follow-up if componentry
    po_id: o.po_id,
    vendor_id: null,
    qty_in: splitQty,
    landed: false,
    order_status: 'open',
    eta: newEta || o.eta,
    notes: `Split from original order ${ledgerId} via dashboard`,
  });
  if (err2) { alert('Original order was reduced, but creating the split-off order failed: ' + err2.message); }
  await renderOverview();
}

// ---------- Revenue (scenario modeling) ----------
function monthKey(d) { return d.toISOString().slice(0, 7); }
function monthLabelShort(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'short', year: '2-digit' }); }
function monthLabelLong(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'long', year: 'numeric' }); }
function nextSixMonths() {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < 6; i++) { out.push(monthKey(d)); d.setMonth(d.getMonth() + 1); }
  return out;
}

async function renderRevenue() {
  const el = document.getElementById('tab-revenue');
  el.innerHTML = `<div class="card empty-state">Loading revenue data…</div>`;

  const todayIso = new Date().toISOString().slice(0, 10);
  const histStartIso = (() => { const d = new Date(); d.setMonth(d.getMonth() - 5); d.setDate(1); return d.toISOString().slice(0, 10); })();
  const months = nextSixMonths();

  const [{ data: products }, { data: revActuals }, { data: revForecasts }, { data: forecastParams }, { data: openOrders }, { data: scenarios }] = await Promise.all([
    sb.from('product_qoh').select('*'),
    sb.from('revenue_actuals').select('channel, gross_revenue, revenue_date').gte('revenue_date', histStartIso),
    sb.from('revenue_forecasts').select('channel, forecast_month, forecast_revenue').gte('forecast_month', months[0] + '-01'),
    sb.from('forecast_params').select('channel, revenue_pct, avg_selling_price, product_id, products(sku_code, display_name)').eq('is_active', true),
    sb.from('open_orders_by_product').select('product_sku, qty, eta').not('eta', 'is', null),
    sb.from('revenue_scenarios').select('*').order('created_at', { ascending: false }),
  ]);

  const monthlyActual = {};
  (revActuals || []).forEach(r => {
    const m = r.revenue_date.slice(0, 7);
    if (!monthlyActual[m]) monthlyActual[m] = { shopify: 0, amazon: 0 };
    monthlyActual[m][r.channel] = (monthlyActual[m][r.channel] || 0) + Number(r.gross_revenue || 0);
  });
  const liveForecast = {};
  (revForecasts || []).forEach(r => {
    const m = r.forecast_month.slice(0, 7);
    if (!liveForecast[m]) liveForecast[m] = {};
    liveForecast[m][r.channel] = Number(r.forecast_revenue);
  });
  const liveMix = { shopify: {}, amazon: {} };
  (forecastParams || []).forEach(fp => {
    liveMix[fp.channel] = liveMix[fp.channel] || {};
    liveMix[fp.channel][fp.product_id] = { revenue_pct: Number(fp.revenue_pct), avg_selling_price: Number(fp.avg_selling_price) };
  });
  const receipts = {}; // { product_sku: { month: qty } }
  (openOrders || []).forEach(o => {
    const m = o.eta.slice(0, 7);
    if (!receipts[o.product_sku]) receipts[o.product_sku] = {};
    receipts[o.product_sku][m] = (receipts[o.product_sku][m] || 0) + (o.qty || 0);
  });

  window._revState = {
    products: products || [], monthlyActual, liveForecast, liveMix, receipts, months,
    scenarios: scenarios || [], selectedScenarioId: window._revState?.selectedScenarioId || 'live',
    draftChannel: null, draftMix: null,
  };

  await selectRevenueScenario(window._revState.selectedScenarioId, true);
}

async function selectRevenueScenario(scenarioId, skipFetch) {
  const S = window._revState;
  S.selectedScenarioId = scenarioId;

  if (scenarioId === 'live') {
    S.draftChannel = {};
    S.months.forEach(m => { S.draftChannel[m] = { shopify: S.liveForecast[m]?.shopify ?? null, amazon: S.liveForecast[m]?.amazon ?? null }; });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        if (!base) return;
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => { S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price }; });
      });
    });
  } else if (!skipFetch || !S.draftChannel) {
    const [{ data: chanRows }, { data: mixRows }] = await Promise.all([
      sb.from('revenue_scenario_channel').select('*').eq('scenario_id', scenarioId),
      sb.from('revenue_scenario_mix').select('*').eq('scenario_id', scenarioId),
    ]);
    S.draftChannel = {};
    S.months.forEach(m => {
      const shopRow = (chanRows || []).find(r => r.channel === 'shopify' && r.forecast_month.slice(0, 7) === m);
      const amzRow = (chanRows || []).find(r => r.channel === 'amazon' && r.forecast_month.slice(0, 7) === m);
      S.draftChannel[m] = {
        shopify: shopRow ? Number(shopRow.forecast_revenue) : (S.liveForecast[m]?.shopify ?? null),
        amazon: amzRow ? Number(amzRow.forecast_revenue) : (S.liveForecast[m]?.amazon ?? null),
      };
    });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => {
          const row = (mixRows || []).find(r => r.channel === ch && r.product_id === p.product_id && r.forecast_month.slice(0, 7) === m);
          if (row) S.draftMix[ch][p.product_id][m] = { revenue_pct: Number(row.revenue_pct), avg_selling_price: Number(row.avg_selling_price) };
          else if (base) S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price };
        });
      });
    });
  }
  renderRevenueBody();
}

function currentScenario() {
  const S = window._revState;
  if (S.selectedScenarioId === 'live') return null;
  return S.scenarios.find(s => s.id === S.selectedScenarioId);
}

function isEditable() {
  const sc = currentScenario();

async function createRevenueScenario() {
  if (!canEdit()) return;
  const name = prompt('Name this scenario (e.g. "Holiday push", "Conservative Q1"):');
  if (!name) return;
  const { data, error } = await sb.from('revenue_scenarios').insert({ name, status: 'draft', created_by: currentUserRow?.email || 'dashboard' }).select().single();
  if (error) { alert('Failed: ' + error.message); return; }
  // Seed from the live numbers currently in window._revState so it starts as an exact copy.
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ scenario_id: data.id, channel: ch, forecast_month: m + '-01', forecast_revenue: val });
  }));
  if (chanRows.length) await sb.from('revenue_scenario_channel').insert(chanRows);
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    const base = S.liveMix[ch]?.[p.product_id];
    if (!base) return;
    S.months.forEach(m => mixRows.push({ scenario_id: data.id, product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price }));
  }));
  if (mixRows.length) await sb.from('revenue_scenario_mix').insert(mixRows);
  S.scenarios.unshift(data);
  await selectRevenueScenario(data.id);
}

async function deleteRevenueScenario(scenarioId) {

  const { error } = await sb.from('revenue_scenarios').delete().eq('id', scenarioId);
  if (error) { alert('Failed: ' + error.message); return; }
  window._revState.scenarios = window._revState.scenarios.filter(s => s.id !== scenarioId);
  await selectRevenueScenario('live');
}

async function commitRevenueScenario() {
  const sc = currentScenario();
  if (!sc) return;
  if (!confirm(`Commit "${sc.name}" as the live forecast? This will update revenue_forecasts and the monthly product-mix assumptions that drive PO/component recommendations. Changes take full effect on the next pipeline run.`)) return;
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ channel: ch, forecast_month: m + '-01', forecast_revenue: val, created_by: currentUserRow?.email || 'dashboard' });
  }));
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    S.months.forEach(m => {
      const v = S.draftMix[ch][p.product_id]?.[m];
      if (v) mixRows.push({ product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: v.revenue_pct, avg_selling_price: v.avg_selling_price, source_scenario_id: sc.id, committed_at: new Date().toISOString() });
    });
  }));
  const [{ error: e1 }, { error: e2 }, { error: e3 }] = await Promise.all([
    chanRows.length ? sb.from('revenue_forecasts').upsert(chanRows, { onConflict: 'channel,forecast_month' }) : Promise.resolve({ error: null }),
    mixRows.length ? sb.from('forecast_params_monthly').upsert(mixRows, { onConflict: 'product_id,channel,forecast_month' }) : Promise.resolve({ error: null }),
    sb.from('revenue_scenarios').update({ status: 'committed', committed_at: new Date().toISOString() }).eq('id', sc.id),
  ]);
  if (e1 || e2 || e3) { alert('Commit failed: ' + (e1 || e2 || e3).message); return; }
  alert(`"${sc.name}" is now the live forecast. Overview-tab recommendations and inventory projections will reflect it after the next daily pipeline run.`);
  await renderRevenue();
  await renderOverview();
}

async function editDraftChannelMonth(channel, month) {
  if (!isEditable()) { alert('Select or create a draft scenario to edit forecast numbers.'); return; }
  const S = window._revState;
  const current = S.draftChannel[month]?.[channel];
  const input = prompt(`${channel === 'shopify' ? 'Shopify' : 'Amazon'} forecast for ${monthLabelLong(month)} ($):`, current ?? '');
  if (input === null) return;
  const val = Number(input.replace(/[^0-9.]/g, ''));
  if (!val || val <= 0) { alert('Enter a positive number.'); return; }
  S.draftChannel[month][channel] = val;
  await sb.from('revenue_scenario_channel').upsert(
    { scenario_id: S.selectedScenarioId, channel, forecast_month: month + '-01', forecast_revenue: val },
    { onConflict: 'scenario_id,channel,forecast_month' }
  );
  renderRevenueBody();
}

async function editDraftMixProduct(channel, productId) {
  if (!isEditable()) { alert('Select or create a draft scenario to edit product mix.'); return; }
  const S = window._revState;
  const product = S.products.find(p => p.product_id === productId);
  const months = S.months;
  const current = months.map(m => ((S.draftMix[channel][productId]?.[m]?.revenue_pct || 0) * 100).toFixed(1));
  const input = prompt(
    `${product?.display_name} — ${channel === 'shopify' ? 'Shopify' : 'Amazon'} revenue share %, one per month (${months.map(monthLabelShort).join(', ')}), comma-separated:`,
    current.join(', ')
  );
  if (input === null) return;
  const vals = input.split(',').map(s => Number(s.trim()));
  if (vals.length !== months.length || vals.some(v => isNaN(v) || v < 0)) { alert(`Enter exactly ${months.length} non-negative numbers, comma-separated.`); return; }
  const asp = S.draftMix[channel][productId]?.[months[0]]?.avg_selling_price || S.liveMix[channel]?.[productId]?.avg_selling_price;
  const rows = [];
  months.forEach((m, i) => {
    S.draftMix[channel][productId][m] = { revenue_pct: vals[i] / 100, avg_selling_price: asp };
    rows.push({ scenario_id: S.selectedScenarioId, product_id: productId, channel, forecast_month: m + '-01', revenue_pct: vals[i] / 100, avg_selling_price: asp });
  });
  await sb.from('revenue_scenario_mix').upsert(rows, { onConflict: 'scenario_id,product_id,channel,forecast_month' });
  renderRevenueBody();
}

function computeProjection(channelData, mixData) {
  // Returns { [product_sku]: [eom_m0, eom_m1, ...] } using the same direct_units formula as
  // demand_engine.py (channel_revenue * revenue_pct / ASP), without bundle expansion -- a
  // deliberate simplification for this fast preview, noted in the UI.
  const S = window._revState;
  const out = {};
  S.products.forEach(p => {
    let eom = p.qty_on_hand;
    const series = [];
    S.months.forEach(m => {
      let demand = 0;
      ['shopify', 'amazon'].forEach(ch => {
        const mix = mixData[ch][p.product_id]?.[m];
        const chanRev = channelData[m]?.[ch];
        if (mix && chanRev && mix.avg_selling_price) demand += (chanRev * mix.revenue_pct) / mix.avg_selling_price;
      });
      const inReceipts = (S.receipts[p.sku_code] || {})[m] || 0;
      eom = eom - demand + inReceipts;
      series.push(eom);
    });
    out[p.sku_code] = series;
  });
  return out;
}

function renderRevenueBody() {
  const S = window._revState;
  const el = document.getElementById('tab-revenue');
  const sc = currentScenario();
  const editable = isEditable();
  const months = S.months;

  const scenarioOptions = [
    `<option value="live" ${S.selectedScenarioId === 'live' ? 'selected' : ''}>Live Forecast</option>`,
    ...S.scenarios.map(s => `<option value="${s.id}" ${S.selectedScenarioId === s.id ? 'selected' : ''}>${s.name} (${s.status})</option>`),
  ].join('');

  const channelRow = (channel, label) => `
    <div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
      <div style="width:64px; font-size:12px; font-weight:600;">${label}</div>
      ${months.map(m => `
        <button class="btn ${editable ? 'btn-ghost' : ''}" style="padding:4px 8px; font-size:11px; ${editable ? '' : 'cursor:default; background:transparent; border-color:transparent;'}"
          onclick="${editable ? `editDraftChannelMonth('${channel}','${m}')` : ''}" title="${monthLabelLong(m)}">
          ${S.draftChannel[m]?.[channel] != null ? fmtMoney(S.draftChannel[m][channel]) : '<span class="muted">—</span>'}
        </button>
      `).join('')}
    </div>
  `;

  const projection = computeProjection(S.draftChannel, S.draftMix);
  const liveChannel = {}; months.forEach(m => liveChannel[m] = { shopify: S.liveForecast[m]?.shopify ?? null, amazon: S.liveForecast[m]?.amazon ?? null });
  const liveMixByMonth = { shopify: {}, amazon: {} };
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    const base = S.liveMix[ch]?.[p.product_id];
    if (!base) return;
    liveMixByMonth[ch][p.product_id] = {};
    months.forEach(m => liveMixByMonth[ch][p.product_id][m] = base);
  }));
  const liveProjection = computeProjection(liveChannel, liveMixByMonth);

  const impactCards = [...S.products].sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name)).map(p => {
    const scenarioSeries = projection[p.sku_code] || [];
    const liveSeries = liveProjection[p.sku_code] || [];
    const ss = p.safety_stock_qty || 0;
    const firstBreach = (series) => { const i = series.findIndex(v => v < ss); return i === -1 ? null : months[i]; };
    const scenarioBreach = firstBreach(scenarioSeries);
    const liveBreach = firstBreach(liveSeries);
    let compareLine;
    if (!scenarioBreach && !liveBreach) compareLine = `<span class="pill good">No safety-stock breach projected (either forecast)</span>`;
    else if (scenarioBreach && !liveBreach) compareLine = `<span class="pill bad">This scenario introduces a shortfall in ${monthLabelLong(scenarioBreach)} — live forecast shows none</span>`;
    else if (!scenarioBreach && liveBreach) compareLine = `<span class="pill good">This scenario avoids the ${monthLabelLong(liveBreach)} shortfall the live forecast projects</span>`;
    else if (scenarioBreach === liveBreach) compareLine = `<span class="pill watch">Same shortfall timing as live forecast: ${monthLabelLong(scenarioBreach)}</span>`;
    else {
      const sooner = months.indexOf(scenarioBreach) < months.indexOf(liveBreach);
      compareLine = `<span class="pill ${sooner ? 'bad' : 'good'}">Shortfall moves ${sooner ? 'sooner' : 'later'}: ${monthLabelLong(scenarioBreach)} (vs. ${monthLabelLong(liveBreach)} live)</span>`;
    }
    return `
      <div class="card" style="padding:10px 12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <strong style="font-size:13px;">${p.display_name}</strong>
          <span style="font-size:11px;" class="muted">safety stock ${ss.toLocaleString()}</span>
        </div>
        <div style="height:60px;"><canvas id="impact-spark-${p.product_id}"></canvas></div>
        <div style="margin-top:6px;">${compareLine}</div>
      </div>
    `;
  }).join('');

  const mixLegendButtons = (channel) => S.products
    .filter(p => S.liveMix[channel]?.[p.product_id])
    .sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name))
    .map(p => `<button class="btn btn-ghost" style="padding:3px 8px; font-size:11px; ${editable ? '' : 'cursor:default;'}" ${editable ? `onclick="editDraftMixProduct('${channel}','${p.product_id}')"` : 'disabled'}>${editable ? '✎ ' : ''}${p.display_name}</button>`)
    .join(' ');

  el.innerHTML = `
    <div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="section-label" style="margin:0;">Scenario:</div>
      <select id="scenario-select" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:13px;" onchange="selectRevenueScenario(this.value)">
        ${scenarioOptions}
      </select>
      ${sc ? `<span class="pill ${sc.status === 'draft' ? 'watch' : 'good'}">${sc.status}</span>` : `<span class="muted" style="font-size:12px;">read-only — create a scenario to model changes</span>`}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="createRevenueScenario()">+ New Scenario</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:12px;" onclick="commitRevenueScenario()">Commit to Live</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:12px; color:var(--bad-text);" onclick="deleteRevenueScenario('${sc.id}')">Delete Draft</button>` : ''}
    </div>

    <div class="card" style="padding:14px 16px; margin-bottom:12px;">
      <div class="section-label" style="margin:0 0 2px;">Revenue by Channel — next 6 months</div>
      <div class="muted" style="font-size:11px; margin-bottom:8px;">${editable ? 'Click a month to edit this scenario\'s forecast.' : 'Switch to a draft scenario to edit.'}</div>
      <div style="height:170px; margin-bottom:10px;"><canvas id="revenue-channel-chart"></canvas></div>
      ${channelRow('shopify', 'Shopify')}
      ${channelRow('amazon', 'Amazon')}
    </div>

    <div class="card" style="padding:14px 16px; margin-bottom:12px;">
      <div class="section-label" style="margin:0 0 2px;">Product Mix Evolution</div>
      <div class="muted" style="font-size:11px; margin-bottom:8px;">How each product's share of channel revenue is modeled to shift over the next 6 months. ${editable ? 'Click a product below to edit its monthly share.' : 'Switch to a draft scenario to edit.'}</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
        <div>
          <div style="font-weight:600; font-size:12px; margin-bottom:4px;">Shopify</div>
          <div style="height:180px;"><canvas id="mix-chart-shopify"></canvas></div>
          <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">${mixLegendButtons('shopify')}</div>
        </div>
        <div>
          <div style="font-weight:600; font-size:12px; margin-bottom:4px;">Amazon</div>
          <div style="height:180px;"><canvas id="mix-chart-amazon"></canvas></div>
          <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">${mixLegendButtons('amazon')}</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:14px 16px;">
      <div class="section-label" style="margin:0 0 2px;">Projected Impact — this scenario vs. live forecast</div>
      <div class="muted" style="font-size:11px; margin-bottom:10px;">Projected end-of-month inventory per product, using the same channel-revenue × mix-share ÷ ASP math as the demand engine (bundle expansion omitted from this fast preview). Shows whether this scenario pushes a safety-stock breach earlier, later, or avoids/introduces one entirely.</div>
      <div class="kpi-grid">${impactCards}</div>
    </div>
  `;

  renderRevenueCharts(projection, liveProjection);
}

function renderRevenueCharts(projection, liveProjection) {
  const S = window._revState;
  const months = S.months;
  const labels = months.map(monthLabelShort);

  const chanCanvas = document.getElementById('revenue-channel-chart');
  if (chanCanvas) {
    new Chart(chanCanvas, {
      data: {
        labels,
        datasets: [
          { label: 'Shopify', type: 'bar', data: months.map(m => S.draftChannel[m]?.shopify ?? null), backgroundColor: '#C9A876' },
          { label: 'Amazon', type: 'bar', data: months.map(m => S.draftChannel[m]?.amazon ?? null), backgroundColor: '#8A7257' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        scales: { y: { ticks: { callback: v => '$' + (v / 1000) + 'k', font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } },
      },
    });
  }

  const palette = ['#C9A876', '#8A7257', '#A3B18A', '#588157', '#BC6C25', '#606C38', '#DDA15E', '#283618'];
  ['shopify', 'amazon'].forEach(channel => {
    const canvas = document.getElementById(`mix-chart-${channel}`);
    if (!canvas) return;
    const prods = S.products.filter(p => S.liveMix[channel]?.[p.product_id])
      .sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name));
    new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: prods.map((p, i) => ({
          label: p.display_name,
          data: months.map(m => ((S.draftMix[channel][p.product_id]?.[m]?.revenue_pct || 0) * 100)),
          backgroundColor: palette[i % palette.length],
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: true, ticks: { font: { size: 10 } } },
          y: { stacked: true, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } } },
        },
      },
    });
  });

  S.products.forEach(p => {
    const canvas = document.getElementById(`impact-spark-${p.product_id}`);
    if (!canvas) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { data: liveProjection[p.sku_code] || [], borderColor: '#B7B0A6', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false, borderDash: [4, 3] },
          { data: projection[p.sku_code] || [], borderColor: '#8A7257', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { display: false }, y: { display: false } },
      },
    });
  });
}

// ---------- Inventory ----------
async function renderInventory() {
  const el = document.getElementById('tab-inventory');
  const { data: products } = await sb.from('product_qoh').select('*').order('sku_code');
  const { data: projections } = await sb.from('monthly_projections').select('*').order('projection_month');

  el.innerHTML = `
    <div class="section-label">Finished Goods — Quantity on Hand &amp; Safety Stock</div>
    <div class="kpi-grid" id="inventory-cards"></div>
  `;
  const cardsEl = document.getElementById('inventory-cards');
  const sortedProducts = [...(products || [])].sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name));
  cardsEl.innerHTML = sortedProducts.map(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const belowSafety = p.qty_on_hand < p.safety_stock_qty;
    const canvasId = 'spark-' + p.product_id;
    return `
      <div class="card kpi-card">
        <div class="kpi-label">${p.display_name}<br><span style="font-weight:400;">${p.sku_code}</span></div>
        <div class="kpi-value">${p.qty_on_hand.toLocaleString()}</div>
        <div class="pill ${belowSafety ? 'bad' : 'good'}">safety stock ${p.safety_stock_qty.toLocaleString()}</div>
        <div class="sparkline-wrap"><canvas id="${canvasId}"></canvas></div>
      </div>
    `;
  }).join('') || `<div class="empty-state">No products found.</div>`;

  (products || []).forEach(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const canvas = document.getElementById('spark-' + p.product_id);
    if (!canvas || projRows.length === 0) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: projRows.map(r => r.projection_month),
        datasets: [{
          data: projRows.map(r => r.eom_inventory),
          borderColor: '#8A7257', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  });
}

// ---------- Purchase Orders ----------
async function renderPOs() {
  const el = document.getElementById('tab-pos');
  const { data: pos } = await sb.from('purchase_orders').select('*, vendors(vendor_name)').order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="section-label">Purchase Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Ref</th><th>Vendor</th><th>Status</th><th>Qty</th><th>Total Cost</th><th>ETA</th><th></th></tr></thead>
        <tbody id="pos-body"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('pos-body');
  if (!pos || pos.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="empty-state">No purchase orders yet.</td></tr>`;
    return;
  }
  body.innerHTML = pos.map(po => `
    <tr>
      <td><strong>${po.internal_ref}</strong>${po.vendor_po_number ? `<br><span class="muted" style="font-size:12px;">vendor#: ${po.vendor_po_number}</span>` : ''}</td>
      <td>${po.vendors ? po.vendors.vendor_name : '—'}</td>
      <td><span class="pill watch">${po.status}</span></td>
      <td>${po.qty_ordered ?? '—'}</td>
      <td>${po.total_cost ? fmtMoney2(po.total_cost) : '—'}</td>
      <td>${fmtDate(po.eta_date)}</td>
      <td>
        ${canEdit() && po.status === 'draft' ? `<button class="btn btn-primary" onclick="approvePO('${po.id}')">Approve</button>` : ''}
        ${canDelete() ? `<button class="btn btn-ghost" onclick="cancelPO('${po.id}')" style="margin-left:6px;">Cancel</button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function approvePO(id) {
  const { error } = await sb.from('purchase_orders').update({ status: 'approved', approved_by: currentUserRow.display_name || currentUserRow.email }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}
async function cancelPO(id) {
  if (!confirm('Cancel this PO?')) return;
  const { error } = await sb.from('purchase_orders').update({ status: 'cancelled' }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}

        <tbody>
          ${(vendors || []).map(v => `
            <tr>
              <td><strong>${v.vendor_name}</strong></td>

              <td>every ${v.default_cadence_days} days</td>

// ---------- Boot ----------
// Only (re)render the whole app on an actual sign-in — NOT on every auth event. Supabase fires
// TOKEN_REFRESHED periodically (including when the browser tab regains focus/visibility), and
// re-running loadApp() on that event was wiping all filter selections every time Alex switched
// away and back to the tab (found 2026-10-21). SIGNED_IN/INITIAL_SESSION only fire once per
// actual login, which is the only time we need a full rebuild.
sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) loadApp(session);
});
checkSession();
