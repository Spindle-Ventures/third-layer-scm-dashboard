<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Layer · Supply Chain Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F2EFE9;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --muted: #8C867D;
    --border: #E5E0D8;
    --accent: #5C4A36;
    --accent-light: #8A7257;
    --good-bg: #E5EEE0;
    --good-text: #3F6B35;
    --bad-bg: #F3E2E0;
    --bad-text: #A33B2E;
    --watch-bg: #FBF0DD;
    --watch-text: #96631A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Playfair Display', serif; }
  header {
    padding: 28px 40px 0 40px;
  }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
  h1.title { font-size: 32px; font-weight: 600; margin: 4px 0 2px 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .snapshot-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 12px; color: var(--muted);
  }
  nav.tabs {
    display: flex; gap: 28px; border-bottom: 1px solid var(--border);
    padding: 0 40px; margin-top: 10px;
  }
  nav.tabs button {
    background: none; border: none; font-family: 'Inter'; font-size: 14px; font-weight: 500;
    color: var(--muted); padding: 12px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 28px 40px 60px 40px; max-width: 1400px; margin: 0 auto; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
    margin: 28px 0 10px 0; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px;
  }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
  }
  .kpi-card { display: flex; flex-direction: column; gap: 6px; }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 28px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; width: fit-content;
  }
  .pill.good { background: var(--good-bg); color: var(--good-text); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
  .pill.watch { background: var(--watch-bg); color: var(--watch-text); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase;
       letter-spacing: 0.04em; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .urgency-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.03em; }
  .urgency-CRITICAL { background: var(--bad-bg); color: var(--bad-text); }
  .urgency-WARNING { background: var(--watch-bg); color: var(--watch-text); }
  .urgency-WATCH { background: #EFEAE2; color: var(--accent-light); }
  .urgency-OK { background: var(--good-bg); color: var(--good-text); }
  .btn {
    font-family: 'Inter'; font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    cursor: pointer; color: var(--ink);
  }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #4a3c2c; }
  .btn-ghost:hover { background: #F7F4EE; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 360px; text-align: center; }
  input[type=email] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'Inter'; font-size: 14px; margin: 14px 0; box-sizing: border-box;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .sparkline-wrap { width: 100%; height: 36px; margin-top: 6px; }
  .hidden { display: none !important; }
  .role-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 30px; text-align: center; }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="brand">THIRD LAYER</div>
    <h1 class="title" style="font-size:22px;">Supply Chain Manager</h1>
    <p class="muted">Sign in with your @spindle.ventures email — you'll get a magic link, no password needed.</p>
    <input type="email" id="login-email" placeholder="you@spindle.ventures" />
    <button class="btn btn-primary" style="width:100%;" onclick="sendMagicLink()">Send magic link</button>
    <p class="muted" id="login-status" style="margin-top:14px;"></p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="top-row">
    <div>
      <div class="brand">THIRD LAYER</div>
      <h1 class="title serif">Supply Chain Manager</h1>
      <div class="subtitle" id="subtitle-date"></div>
    </div>
    <div class="top-actions">
      <span class="role-badge" id="user-badge"></span>
      <span class="snapshot-pill" id="snapshot-pill">Loading…</span>
      <button class="btn btn-ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="inventory">Inventory</button>
    <button class="tab-btn" data-tab="pos">Purchase Orders</button>
    <button class="tab-btn" data-tab="vendors">Vendors &amp; Comms</button>
  </nav>
</header>

<main>
  <div id="tab-overview" class="tab-panel"></div>
  <div id="tab-inventory" class="tab-panel hidden"></div>
  <div id="tab-pos" class="tab-panel hidden"></div>
  <div id="tab-vendors" class="tab-panel hidden"></div>
</main>
</div>

<script>
// ---- Config: fill in your Supabase project URL + anon (public) key ----
const SUPABASE_URL = "https://rvbferpfrgkayxuujpna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2YmZlcnBmcmdrYXl4dXVqcG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDc2NjUsImV4cCI6MjEwODA4MzY2NX0._UNtJphO40WvJfoDqQ612Vi1Wx78D2S6FVl2-VMt76w";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserRow = null;

// ---------- Auth ----------
async function sendMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  const statusEl = document.getElementById('login-status');
  if (!email) { statusEl.textContent = 'Enter an email address.'; return; }
  statusEl.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  statusEl.textContent = error ? ('Error: ' + error.message) : 'Check your email for a sign-in link.';
}

async function signOut() {
  await sb.auth.signOut();
  window.location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await loadApp(session);
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  }
}

async function loadApp(session) {
  const { data: userRow, error } = await sb.from('users').select('*').eq('auth_user_id', session.user.id).single();
  if (error || !userRow) {
    document.getElementById('login-status').textContent = 'Signed in, but no matching user record found — ask an admin to grant access.';
    document.getElementById('login-screen').classList.remove('hidden');
    return;
  }
  currentUserRow = userRow;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-badge').textContent = `${userRow.display_name || userRow.email} · ${userRow.role}`;
  document.getElementById('subtitle-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('snapshot-pill').textContent = 'Snapshot · updated on page load';

  await Promise.all([renderOverview(), renderInventory(), renderPOs(), renderVendors()]);
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
  });
});

function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtMoney2(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${m}-${day}-${y}`;
}
const PROBLEM_LABELS = {
  shortfall: 'Projected Shortfall',
  vendor_delay: 'Vendor Delay',
  safety_stock_review: 'Safety Stock Review Due',
  overdue_contact: 'Overdue Vendor Contact',
};

// ---------- Overview ----------
async function renderOverview() {
  const el = document.getElementById('tab-overview');
  const [{ data: recs }, { data: pos }, { data: openOrders }, { data: qcRuns }] = await Promise.all([
    sb.from('agent_recommendations').select('*, products(sku_code, display_name)').neq('decision', 'dismissed').order('days_until_deadline', { ascending: true }),
    sb.from('purchase_orders').select('*').in('status', ['draft', 'pending_approval', 'approved', 'placed', 'in_transit']),
    sb.from('open_orders_by_product').select('*'),
    sb.from('qc_runs').select('*').order('run_at', { ascending: false }).limit(1),
  ]);

  const activeRecs = (recs || []).filter(r => r.urgency !== 'OK');
  const criticalCount = activeRecs.filter(r => r.urgency === 'CRITICAL').length;
  const openComponentryCount = (openOrders || []).filter(o => o.order_type === 'componentry').length;
  const lastQc = (qcRuns && qcRuns[0]) || null;
  const needsActionCount = (openOrders || []).filter(o => o.action_needed !== 'On track — no action needed').length;

  el.innerHTML = `
    <div class="section-label">At a Glance</div>
    <div class="kpi-grid">
      <div class="card kpi-card">
        <div class="kpi-label">Open Recommendations</div>
        <div class="kpi-value">${activeRecs.length}</div>
        <div class="pill ${criticalCount > 0 ? 'bad' : 'good'}">${criticalCount} critical</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Open Purchase Orders</div>
        <div class="kpi-value">${(pos || []).length}</div>
        <div class="muted" style="font-size:12px;">draft → in transit</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Open Componentry Orders</div>
        <div class="kpi-value">${openComponentryCount}</div>
        <div class="muted" style="font-size:12px;">not yet landed</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Data Last Updated</div>
        <div class="kpi-value" style="font-size:18px;">${lastQc ? new Date(lastQc.run_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'}</div>
        <div class="pill ${lastQc && lastQc.all_clear ? 'good' : 'bad'}">${lastQc ? (lastQc.all_clear ? 'QC: all clear' : 'QC: discrepancy found') : 'no QC run yet'}</div>
      </div>
    </div>

    <div class="section-label">Open Orders by Product — ${needsActionCount} need attention</div>
    <div class="card" style="padding: 16px 22px; margin-bottom: 14px;">
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:13px; font-weight:500;">Product:
          <select id="filter-product" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All products</option>
          </select>
        </label>
        <label style="font-size:13px; font-weight:500;">Type:
          <select id="filter-type" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All types</option>
            <option value="finished_good">Purchase Orders (finished goods)</option>
            <option value="componentry">Componentry</option>
          </select>
        </label>
        <label style="font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="filter-needs-action" checked onchange="applyOpenOrdersFilter()" /> Only show items needing attention
        </label>
      </div>
    </div>
    <div id="open-orders-groups"></div>

    <div class="section-label" style="margin-top:28px;">Agentic Recommendations — Validate or Dismiss</div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table style="white-space:nowrap;">
        <thead><tr><th>SKU</th><th>Urgency</th><th>Problem</th><th>Decision</th></tr></thead>
        <tbody id="overview-recs-body"></tbody>
      </table>
    </div>
  `;

  window._openOrdersCache = openOrders || [];
  const productSelect = document.getElementById('filter-product');
  const uniqueProducts = [...new Map((openOrders || []).map(o => [o.product_sku, o.product_name])).entries()];
  uniqueProducts.sort((a, b) => a[0].localeCompare(b[0]));
  productSelect.innerHTML = '<option value="all">All products</option>' + uniqueProducts.map(([sku, name]) => `<option value="${sku}">${name} (${sku})</option>`).join('');

  applyOpenOrdersFilter();

  const body = document.getElementById('overview-recs-body');
  if (!recs || recs.length === 0) {
    body.innerHTML = `<tr><td colspan="4" class="empty-state">No open recommendations — nothing needs a decision today.</td></tr>`;
  } else {
    body.innerHTML = recs.map(r => `
      <tr>
        <td><strong>${r.products.display_name}</strong> <span class="muted" style="font-size:12px;">${r.products.sku_code}</span></td>
        <td><span class="urgency-badge urgency-${r.urgency}">${r.urgency}</span></td>
        <td>
          <span class="pill watch">${PROBLEM_LABELS[r.problem_type] || r.problem_type}</span>
          <span class="muted" style="font-size:12px;">— ${r.shortfall_qty} units by ${fmtDate(r.shortfall_month)}, ${fmtMoney2(r.cash_at_risk)} at risk</span>
        </td>
        <td>
          ${canEdit() ? `
            <select onchange="decideRecommendation('${r.id}', this.value)" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
              <option value="pending" ${r.decision === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="approved" ${r.decision === 'approved' ? 'selected' : ''}>Approved</option>
              <option value="dismissed" ${r.decision === 'dismissed' ? 'selected' : ''}>Dismissed</option>
            </select>
          ` : `<span class="pill ${r.decision === 'approved' ? 'good' : r.decision === 'dismissed' ? 'bad' : 'watch'}">${r.decision}</span>`}
        </td>
      </tr>
    `).join('');
  }
}

function canEdit() {
  return currentUserRow && (currentUserRow.role === 'editor' || currentUserRow.role === 'admin');
}
function canDelete() {
  return currentUserRow && currentUserRow.role === 'admin';
}

function applyOpenOrdersFilter() {
  const all = window._openOrdersCache || [];
  const productFilter = document.getElementById('filter-product').value;
  const typeFilter = document.getElementById('filter-type').value;
  const onlyAction = document.getElementById('filter-needs-action').checked;

  const filtered = all.filter(o => {
    if (productFilter !== 'all' && o.product_sku !== productFilter) return false;
    if (typeFilter !== 'all' && o.order_type !== typeFilter) return false;
    if (onlyAction && o.action_needed === 'On track — no action needed') return false;
    return true;
  });

  const groupsEl = document.getElementById('open-orders-groups');
  if (filtered.length === 0) {
    groupsEl.innerHTML = `<div class="card empty-state">Nothing matches these filters${onlyAction ? ' — try unchecking "only show items needing attention"' : ''}.</div>`;
    return;
  }

  const byProduct = new Map();
  filtered.forEach(o => {
    if (!byProduct.has(o.product_sku)) byProduct.set(o.product_sku, { name: o.product_name, rows: [] });
    byProduct.get(o.product_sku).rows.push(o);
  });

  groupsEl.innerHTML = [...byProduct.entries()].map(([sku, group]) => `
    <div class="card" style="padding:0; margin-bottom:14px; overflow-x:auto;">
      <div style="padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; white-space:nowrap;">
        <div><strong>${group.name}</strong> <span class="muted" style="font-size:12px;">${sku}</span></div>
        <span class="muted" style="font-size:12px;">${group.rows.length} open order(s)</span>
      </div>
      <table style="white-space:nowrap;">
        <thead><tr><th>Order Type</th><th>Vendor</th><th>Qty</th><th>ETA</th><th>Tracking</th><th>Last Contact</th><th>Next Contact</th><th>Status</th><th>Action Needed</th><th>Actions</th></tr></thead>
        <tbody>
          ${group.rows.map(o => renderOpenOrderRow(o)).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

function renderOpenOrderRow(o, editing) {
  const needsAction = o.action_needed !== 'On track — no action needed' && o.order_status !== 'paused';
  const orderTypeLabel = o.order_type === 'componentry' ? 'Component' : 'Finished Good';
  const canAct = canEdit();
  if (editing) {
    return `
      <tr id="row-${o.ledger_id}">
        <td><span class="pill watch">${orderTypeLabel}</span></td>
        <td>${o.vendor_name || '—'}</td>
        <td><input type="number" id="edit-qty-${o.ledger_id}" value="${o.qty ?? ''}" style="width:70px; padding:4px; border-radius:6px; border:1px solid var(--border);" /></td>
        <td><input type="date" id="edit-eta-${o.ledger_id}" value="${o.eta || ''}" style="padding:4px; border-radius:6px; border:1px solid var(--border);" /></td>
        <td><input type="text" id="edit-tracking-${o.ledger_id}" value="${o.tracking_info || ''}" style="width:110px; padding:4px; border-radius:6px; border:1px solid var(--border);" /></td>
        <td><input type="date" id="edit-lastcontact-${o.ledger_id}" value="${o.last_contacted || ''}" style="padding:4px; border-radius:6px; border:1px solid var(--border);" /></td>
        <td><input type="date" id="edit-nextcontact-${o.ledger_id}" value="${o.next_contact || ''}" style="padding:4px; border-radius:6px; border:1px solid var(--border);" /></td>
        <td colspan="2"></td>
        <td>
          <button class="btn btn-primary" onclick="saveOrderEdit('${o.ledger_id}')">Save</button>
          <button class="btn btn-ghost" onclick="applyOpenOrdersFilter()">Cancel</button>
        </td>
      </tr>
    `;
  }
  return `
    <tr id="row-${o.ledger_id}">
      <td><span class="pill watch">${orderTypeLabel}</span></td>
      <td>${o.vendor_name || '—'}</td>
      <td>${o.qty ?? '—'}</td>
      <td>${fmtDate(o.eta)}</td>
      <td>${o.tracking_info || '—'}</td>
      <td>${fmtDate(o.last_contacted)}</td>
      <td>${fmtDate(o.next_contact)}</td>
      <td><span class="pill ${o.order_status === 'paused' ? 'watch' : 'good'}">${o.order_status === 'paused' ? 'Paused' : 'Active'}</span></td>
      <td><span class="pill ${needsAction ? (o.action_needed.startsWith('OVERDUE') ? 'bad' : 'watch') : 'good'}">${o.action_needed}</span></td>
      <td>
        ${canAct ? `
          <button class="btn btn-ghost" onclick="editOpenOrderRow('${o.ledger_id}')">Edit</button>
          <button class="btn btn-ghost" onclick="splitOrder('${o.ledger_id}')">Split</button>
          <button class="btn btn-ghost" onclick="delayOrder('${o.ledger_id}')">Delay</button>
          ${o.order_status === 'paused'
            ? `<button class="btn btn-ghost" onclick="resumeOrder('${o.ledger_id}')">Resume</button>`
            : `<button class="btn btn-ghost" onclick="pauseOrder('${o.ledger_id}')">Pause</button>`}
          <button class="btn btn-ghost" onclick="cancelOrder('${o.ledger_id}')">Cancel</button>
          <button class="btn btn-primary" onclick="markLanded('${o.ledger_id}')">Mark Landed</button>
        ` : '<span class="muted" style="font-size:12px;">view only</span>'}
      </td>
    </tr>
  `;
}

function editOpenOrderRow(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  document.getElementById('row-' + ledgerId).outerHTML = renderOpenOrderRow(o, true);
}

async function saveOrderEdit(ledgerId) {
  const payload = {
    qty_in: Number(document.getElementById('edit-qty-' + ledgerId).value) || 0,
    eta: document.getElementById('edit-eta-' + ledgerId).value || null,
    tracking_info: document.getElementById('edit-tracking-' + ledgerId).value || null,
    last_contacted: document.getElementById('edit-lastcontact-' + ledgerId).value || null,
    next_contact: document.getElementById('edit-nextcontact-' + ledgerId).value || null,
  };
  const { error } = await sb.from('inventory_ledger').update(payload).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}

async function splitOrder(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const splitQtyStr = prompt(`Split ${o.qty} units — how many units go into the NEW (second) order?`, Math.floor((o.qty || 0) / 2));
  if (!splitQtyStr) return;
  const splitQty = Number(splitQtyStr);
  if (!splitQty || splitQty <= 0 || splitQty >= o.qty) { alert('Enter a quantity less than the current total.'); return; }
  const newEta = prompt('ETA for the new (split-off) order (YYYY-MM-DD):', o.eta || '');

  // Reduce the original row, then insert a new ledger row carrying the remainder.
  const { error: err1 } = await sb.from('inventory_ledger').update({ qty_in: o.qty - splitQty }).eq('id', ledgerId);
  if (err1) { alert('Failed: ' + err1.message); return; }
  const { error: err2 } = await sb.from('inventory_ledger').insert({
    event_date: new Date().toISOString().slice(0, 10),
    event_type: o.order_type === 'componentry' ? 'component_order' : 'production_run',
    product_id: o.order_type === 'componentry' ? null : o.product_id,
    component_id: null, // component_id can't be resolved client-side reliably; left for manual follow-up if componentry
    po_id: o.po_id,
    vendor_id: null,
    qty_in: splitQty,
    landed: false,
    order_status: 'open',
    eta: newEta || o.eta,
    notes: `Split from original order ${ledgerId} via dashboard`,
  });
  if (err2) { alert('Original order was reduced, but creating the split-off order failed: ' + err2.message); }
  await renderOverview();
}

async function delayOrder(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  const newEta = prompt('New ETA (YYYY-MM-DD):', o ? o.eta : '');
  if (!newEta) return;
  const { error } = await sb.from('inventory_ledger').update({ eta: newEta }).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}

async function pauseOrder(ledgerId) {
  const { error } = await sb.from('inventory_ledger').update({ order_status: 'paused' }).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}
async function resumeOrder(ledgerId) {
  const { error } = await sb.from('inventory_ledger').update({ order_status: 'open' }).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}
async function cancelOrder(ledgerId) {
  if (!confirm('Cancel this order? It will be removed from the open-orders list.')) return;
  const { error } = await sb.from('inventory_ledger').update({ order_status: 'cancelled' }).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}

async function markLanded(ledgerId) {
  const { error } = await sb.from('inventory_ledger').update({ landed: true, date_landed: new Date().toISOString().slice(0, 10) }).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}

async function decideRecommendation(id, decision) {
  const { error } = await sb.from('agent_recommendations').update({
    decision, decided_by: currentUserRow.display_name || currentUserRow.email, decided_at: new Date().toISOString()
  }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderOverview();
}

// ---------- Inventory ----------
async function renderInventory() {
  const el = document.getElementById('tab-inventory');
  const { data: products } = await sb.from('product_qoh').select('*').order('sku_code');
  const { data: projections } = await sb.from('monthly_projections').select('*').order('projection_month');

  el.innerHTML = `
    <div class="section-label">Finished Goods — Quantity on Hand &amp; Safety Stock</div>
    <div class="kpi-grid" id="inventory-cards"></div>
  `;
  const cardsEl = document.getElementById('inventory-cards');
  cardsEl.innerHTML = (products || []).map(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const belowSafety = p.qty_on_hand < p.safety_stock_qty;
    const canvasId = 'spark-' + p.product_id;
    return `
      <div class="card kpi-card">
        <div class="kpi-label">${p.display_name}<br><span style="font-weight:400;">${p.sku_code}</span></div>
        <div class="kpi-value">${p.qty_on_hand.toLocaleString()}</div>
        <div class="pill ${belowSafety ? 'bad' : 'good'}">safety stock ${p.safety_stock_qty.toLocaleString()}</div>
        <div class="sparkline-wrap"><canvas id="${canvasId}"></canvas></div>
      </div>
    `;
  }).join('') || `<div class="empty-state">No products found.</div>`;

  (products || []).forEach(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const canvas = document.getElementById('spark-' + p.product_id);
    if (!canvas || projRows.length === 0) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: projRows.map(r => r.projection_month),
        datasets: [{
          data: projRows.map(r => r.eom_inventory),
          borderColor: '#8A7257', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  });
}

// ---------- Purchase Orders ----------
async function renderPOs() {
  const el = document.getElementById('tab-pos');
  const { data: pos } = await sb.from('purchase_orders').select('*, vendors(vendor_name)').order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="section-label">Purchase Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Ref</th><th>Vendor</th><th>Status</th><th>Qty</th><th>Total Cost</th><th>ETA</th><th></th></tr></thead>
        <tbody id="pos-body"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('pos-body');
  if (!pos || pos.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="empty-state">No purchase orders yet.</td></tr>`;
    return;
  }
  body.innerHTML = pos.map(po => `
    <tr>
      <td><strong>${po.internal_ref}</strong>${po.vendor_po_number ? `<br><span class="muted" style="font-size:12px;">vendor#: ${po.vendor_po_number}</span>` : ''}</td>
      <td>${po.vendors ? po.vendors.vendor_name : '—'}</td>
      <td><span class="pill watch">${po.status}</span></td>
      <td>${po.qty_ordered ?? '—'}</td>
      <td>${po.total_cost ? fmtMoney2(po.total_cost) : '—'}</td>
      <td>${fmtDate(po.eta_date)}</td>
      <td>
        ${canEdit() && po.status === 'draft' ? `<button class="btn btn-primary" onclick="approvePO('${po.id}')">Approve</button>` : ''}
        ${canDelete() ? `<button class="btn btn-ghost" onclick="cancelPO('${po.id}')" style="margin-left:6px;">Cancel</button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function approvePO(id) {
  const { error } = await sb.from('purchase_orders').update({ status: 'approved', approved_by: currentUserRow.display_name || currentUserRow.email }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}
async function cancelPO(id) {
  if (!confirm('Cancel this PO?')) return;
  const { error } = await sb.from('purchase_orders').update({ status: 'cancelled' }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await renderPOs();
}

// ---------- Vendors & Comms ----------
async function renderVendors() {
  const el = document.getElementById('tab-vendors');
  const { data: vendors } = await sb.from('vendors').select('*').order('vendor_name');
  const { data: ledger } = await sb.from('inventory_ledger').select('*, components(component_name), vendors(vendor_name)').eq('event_type', 'component_order').eq('landed', false).order('next_contact');

  el.innerHTML = `
    <div class="section-label">Vendors</div>
    <div class="card" style="padding:0; margin-bottom:24px;">
      <table>
        <thead><tr><th>Vendor</th><th>Contact</th><th>Lead Time</th><th>Cadence</th><th>Channel</th></tr></thead>
        <tbody>
          ${(vendors || []).map(v => `
            <tr>
              <td><strong>${v.vendor_name}</strong></td>
              <td>${v.contact_name || '—'}<br><span class="muted" style="font-size:12px;">${v.contact_email || 'no email on file'}</span></td>
              <td>${v.default_lead_days} days</td>
              <td>every ${v.default_cadence_days} days</td>
              <td><span class="pill watch">${v.preferred_contact_channel}</span></td>
            </tr>
          `).join('') || `<tr><td colspan="5" class="empty-state">No vendors found.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-label">Planned Actions &amp; Comms — In-Flight Component Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Component</th><th>Vendor</th><th>ETA</th><th>Next Contact</th><th>Status</th></tr></thead>
        <tbody>
          ${(ledger || []).map(l => {
            const overdue = l.next_contact && new Date(l.next_contact) < new Date();
            return `
            <tr>
              <td>${l.components ? l.components.component_name : '—'}</td>
              <td>${l.vendors ? l.vendors.vendor_name : '—'}</td>
              <td>${fmtDate(l.eta)}</td>
              <td>${fmtDate(l.next_contact)}</td>
              <td><span class="pill ${overdue ? 'bad' : 'good'}">${overdue ? 'overdue for contact' : 'on track'}</span></td>
            </tr>
          `}).join('') || `<tr><td colspan="5" class="empty-state">No in-flight component orders.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

// ---------- Boot ----------
sb.auth.onAuthStateChange((event, session) => { if (session) loadApp(session); });
checkSession();
</script>
