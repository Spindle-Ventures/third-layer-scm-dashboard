}
function renderBulkContactBar() {
  let bar = document.getElementById('bulk-contact-bar');
  const n = window._selectedOrderIds.size;
  if (!canEdit() || n === 0) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bulk-contact-bar';
    bar.style.cssText = 'position:sticky; bottom:12px; z-index:50; margin:10px 0; padding:10px 14px; border-radius:10px; background:var(--panel, #fff); border:1px solid var(--border); box-shadow:0 4px 16px rgba(0,0,0,0.15); display:flex; align-items:center; gap:12px;';
    document.getElementById('open-orders-groups').appendChild(bar);
  }
  bar.innerHTML = `
    <strong>${n} order${n === 1 ? '' : 's'} selected</strong>
    <button class="btn btn-primary" style="padding:6px 12px; font-size:13px;" onclick="bulkSetContactSchedule()">Set Contact Schedule</button>
    <button class="btn btn-ghost" style="padding:6px 12px; font-size:13px;" onclick="clearOrderSelection()">Clear Selection</button>
  `;
}
function clearOrderSelection() {
  window._selectedOrderIds.clear();
  applyOpenOrdersFilter();
}
async function bulkSetContactSchedule() {
  const ids = [...window._selectedOrderIds];
  if (ids.length === 0) return;
  // Defaults to today per Alex's "it should default the calendar to today" request, applied here too.
  const dateVal = await promptDateMMDDYYYY(`Next contact date for ${ids.length} selected order(s)`, todayIso());
  if (dateVal === null) return;
  const results = await Promise.all(ids.map(id => {
    const o = (window._openOrdersCache || []).find(r => r.ledger_id === id);
    return mutateLedgerRow(id, { next_contact: dateVal }, `Bulk-set next contact date (${fmtDate(dateVal)}) for ${o?.product_name || id}`);
  }));
  const failCount = results.filter(r => !r).length;
  window._selectedOrderIds.clear();
  await renderOverview();
  if (failCount > 0) await showConfirmModal('Something went wrong', `${failCount} of ${ids.length} updates failed.`, { okOnly: true, danger: true });
}

async function showSafetyStockDetail(sku) {
  const product = (window._productBySku || {})[sku];
  const displayName = product?.display_name || sku;
  const basis = (window._safetyStockBasisBySku || {})[sku] || 'No rationale on file — this product may not have enough sales history yet for the calculation.';
  const detail = (window._safetyStockDetailBySku || {})[sku];

  // Alex (2026-10-23): "'Service Level' doesn't make sense as a metric" -- relabeled to say what
  // it means in plain terms ("in-stock target"). "I don't need 'Daily Demand Variance' or 'Sample
  // Window'. Remove so we can simplify" -- both dropped. "Remove the 'full explanation'" -- the
  // collapsible <details> is gone; a short always-visible sentence (conciseExplanation below)
  // replaces it, placed above the recommended action instead.
  const metricsHtml = detail ? `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:10px;">
      <div><div class="muted" style="font-size:11px;">IN-STOCK TARGET ${infoIcon('How often we want to avoid a stockout, assuming demand keeps behaving like it has historically. 98% means we accept roughly a 2% chance of running out before the next restock arrives.')}</div><div style="font-size:15px; font-weight:700;">${detail.service_level_pct}%</div></div>
      <div><div class="muted" style="font-size:11px;">LEAD TIME ${infoIcon('How many days it takes to get more of this product\'s components once an order is placed — the longest lead time across its preferred vendors. The longer this is, the more buffer stock is needed to survive a bad forecast.')}</div><div style="font-size:15px; font-weight:700;">${detail.lead_time} days</div></div>
      <div><div class="muted" style="font-size:11px;">STATISTICAL SAFETY STOCK ${infoIcon('How much buffer is needed to cover demand uncertainty alone, based on the in-stock target, lead time, and how much daily sales actually vary.')}</div><div style="font-size:15px; font-weight:700;">${detail.statistical_qty.toLocaleString()} units</div></div>
      <div><div class="muted" style="font-size:11px;">MOQ BUFFER ${infoIcon('An extra multiplier on top of the statistical figure, because our manufacturer requires minimum order quantities — we can\'t top up in small increments, so a bad read on timing leaves a bigger real-world gap than demand variance alone would suggest.')}</div><div style="font-size:15px; font-weight:700;">${detail.buffer_multiplier}x</div></div>
      <div style="grid-column:1 / -1; border-top:1px solid var(--border); margin-top:2px; padding-top:8px;">
        <div class="muted" style="font-size:11px;">FINAL SAFETY STOCK ${infoIcon('Statistical Safety Stock × MOQ Buffer — the actual number this product\'s inventory is checked against everywhere on the dashboard.')}</div><div style="font-size:19px; font-weight:800; color:var(--accent);">${detail.recommended_qty.toLocaleString()} units</div>
      </div>
    </div>
  ` : `<div style="margin-bottom:12px;">${basis}</div>`;

  const conciseExplanation = detail
    ? `<div class="muted" style="font-size:13px; margin-bottom:10px; line-height:1.5;">We keep <strong>${detail.recommended_qty.toLocaleString()} units</strong> on hand for ${displayName}: enough to cover a ${detail.lead_time}-day resupply at a ${detail.service_level_pct}% in-stock target, then multiplied ${detail.buffer_multiplier}x because our manufacturer requires minimum order quantities.</div>`
    : '';

  let sellThroughBody = '<div class="muted">Loading sell-through data…</div>';
  showDetail(`${displayName} — Safety Stock`, `${metricsHtml}<div id="safety-stock-sellthrough">${sellThroughBody}</div>`);

  if (!product?.product_id) return;
  const todayIso = new Date().toISOString().slice(0, 10);
  const since90 = new Date(); since90.setDate(since90.getDate() - 90);
  const [{ data: histRows }, { data: projRows }] = await Promise.all([
    sb.from('historical_revenue_pct').select('month, net_items_sold').eq('product_id', product.product_id).eq('channel', 'shopify').gte('month', since90.toISOString().slice(0, 7) + '-01'),
    sb.from('monthly_projections').select('projection_month, projected_demand').eq('product_id', product.product_id).gte('projection_month', todayIso.slice(0, 7) + '-01').order('projection_month'),
  ]);

  const actualUnits90 = (histRows || []).reduce((s, r) => s + (Number(r.net_items_sold) || 0), 0);
  const avgDaily = actualUnits90 / 90;

  const monthsSorted = [...(projRows || [])].sort((a, b) => a.projection_month.localeCompare(b.projection_month));
  const next3 = monthsSorted.slice(0, 3).reduce((s, r) => s + (Number(r.projected_demand) || 0), 0);
  const next6 = monthsSorted.slice(0, 6).reduce((s, r) => s + (Number(r.projected_demand) || 0), 0);

  // Alex (2026-10-23): "The average and projected sellthroughs are nice, a line of context right
  // after them would be helpful" -- compares the projected pace against the actual trailing pace
  // in plain terms, so it's clear whether demand is expected to speed up or slow down.
  const projectedDailyNext90 = next3 / 90;
  let trendContext = '';
  if (avgDaily > 0 && isFinite(projectedDailyNext90)) {
    const pctChange = ((projectedDailyNext90 - avgDaily) / avgDaily) * 100;
    const direction = pctChange > 2 ? 'faster' : pctChange < -2 ? 'slower' : 'about the same pace as';
    trendContext = (pctChange > 2 || pctChange < -2)
      ? `<div class="muted" style="font-size:13px; margin-top:2px;">That's ${Math.abs(Math.round(pctChange))}% ${direction} than the last 90 days' actual pace.</div>`
      : `<div class="muted" style="font-size:13px; margin-top:2px;">That's ${direction} the last 90 days' actual pace.</div>`;
  }

  const textHtml = `
    <div style="line-height:1.7; font-size:14px;">
      <div style="margin-bottom:6px;"><strong>Average sell-through (last 90 days):</strong> ${avgDaily.toFixed(1)} units/day — ${Math.round(actualUnits90).toLocaleString()} units total.</div>
      <div style="margin-bottom:6px;"><strong>Projected sell-through (next 90 days):</strong> ${Math.round(next3).toLocaleString()} units.</div>
      <div><strong>Projected sell-through (next 180 days):</strong> ${Math.round(next6).toLocaleString()} units.</div>
      ${trendContext}
    </div>
    <div style="height:110px; margin-top:14px;"><canvas id="safety-stock-chart"></canvas></div>
    ${conciseExplanation ? `<div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">${conciseExplanation}</div>` : ''}
    <div id="safety-stock-action" style="font-size:14px;"></div>
  `;
  const el = document.getElementById('safety-stock-sellthrough');
  if (el) el.innerHTML = textHtml;

  const canvas = document.getElementById('safety-stock-chart');
  if (canvas) {
    // Audit (2026-11-05, knowledge-work-data-viz checklist item "axes carry units"): raw bar
    // values had no unit anywhere on the chart itself (the number alone doesn't say "units").
    // Tooltip and axis tick now both append " units" so the chart stands on its own without
    // requiring the reader to cross-reference the text block above it.
    new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['Last 90d (actual)', 'Next 90d (projected)', 'Next 180d (projected)'],
        datasets: [{
          data: [Math.round(actualUnits90), Math.round(next3), Math.round(next6)],
          backgroundColor: ['#8A7257', '#C9A876', '#C9A876'],
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.x.toLocaleString()} units` } },
        },
        scales: {
          x: { ticks: { font: { size: 10 }, callback: (v) => `${v.toLocaleString()}` }, title: { display: true, text: 'Units', font: { size: 10 } } },
          y: { ticks: { font: { size: 11 } } },
        },
      },
    });
  }

  // Recommended action -- driven by the same recommendation engine behind the Overview tab,
  // so this never disagrees with it; not a separately-derived heuristic.
  const actionEl = document.getElementById('safety-stock-action');
  if (actionEl) {
    const activeRec = (window._recsCache || []).find(r => r.products?.sku_code === sku && r.urgency !== 'OK');
    if (activeRec) {
      actionEl.innerHTML = `<strong>Recommended action:</strong> Consider placing a PO — order ${(activeRec.recommended_order_qty || 0).toLocaleString()} units by ${fmtDate(activeRec.last_responsible_date)}${activeRec.days_until_deadline < 0 ? ` (already ${-activeRec.days_until_deadline} day(s) overdue)` : ''}. <span class="pill clickable-pill watch" onclick="document.getElementById('detail-modal-backdrop').remove(); showRecommendationDetail('${activeRec.id}')">See full recommendation</span>`;
    } else {
      actionEl.innerHTML = `<strong>Recommended action:</strong> None — the recommendation engine isn't flagging a shortfall for this product right now.`;
    }
  }
}

function productSortRank(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('night oil')) return 0;
  if (n.includes('day spray')) return 1;
  if (n.includes('mud') || n.includes('armpit mud')) return 2;
  if (n.includes('deodorant')) return 3;
  return 4;
}

function componentShortLabel(name) {
  if (!name) return '—';
  const n = name.toLowerCase();
  if (n.includes('dropper')) return 'Droppers';
  if (n.includes('bottle')) return 'Bottles';
  if (n.includes('jar')) return 'Jars';
  if (n.includes('label')) return 'Labels';
  if (n.includes('lid')) return 'Lids';
  if (n.includes('stopper')) return 'Stoppers';
  if (n.includes('ring')) return 'Rings';
  if (n.includes('cap')) return 'Caps';
  if (n.includes('patch')) return 'Patches';
  if (n.includes('pump')) return 'Pumps';
  return name.split(' ').pop();
}

function actionPillClass(action) {
  if (action === 'Overdue') return 'bad';
  if (action === 'On Track') return 'good';
  if (action === 'Paused') return 'watch';
  return 'watch'; // Contact Due, ETA Soon
}

// Alex (2026-10-23): "I don't see the vendor contacts due that shows the message prepped to
// send to the vendor." buildActionDetail() explains the situation TO US; this builds the actual
// outreach text ready to copy and send TO the vendor contact -- a separate, shorter, second-
// person message rather than our internal explanation.
function buildVendorMessageDraft(o) {
  const today = new Date().toISOString().slice(0, 10);
  const itemLabel = o.order_type === 'componentry' ? (o.component_name || 'this component') : o.product_name;
  const qtyFmt = o.qty != null ? `${o.qty.toLocaleString()} units of ` : '';
  const orderRef = (o.internal_ref || o.vendor_po_number) ? ` (order ${o.internal_ref || o.vendor_po_number})` : '';
  const greeting = o.vendor_contact_name ? `Hi ${o.vendor_contact_name.split(' ')[0]},` : 'Hi,';

  let ask;
  if (o.eta && o.eta < today && !o.landed) {
    const daysLate = Math.round((new Date(today) - new Date(o.eta)) / 86400000);
    ask = `Checking in on our order${orderRef} for ${qtyFmt}${itemLabel} — it was expected ${fmtDate(o.eta)} and we haven't seen it land yet (${daysLate} day${daysLate === 1 ? '' : 's'} past the original date). Could you send an updated ETA and tracking info when you get a chance?`;
  } else if (o.next_contact && o.next_contact < today) {
    ask = `Following up on our order${orderRef} for ${qtyFmt}${itemLabel}. Could you confirm the current status and let us know if anything's changed?`;
  } else if (o.eta) {
    ask = `Just checking in ahead of our order${orderRef} for ${qtyFmt}${itemLabel}, expected ${fmtDate(o.eta)}. Could you confirm it's still on track and send tracking info once it ships?`;
  } else {
    ask = `Checking in on our order${orderRef} for ${qtyFmt}${itemLabel}. Could you confirm the current status?`;
  }

  return `${greeting}\n\n${ask}\n\nThanks,\nThird Layer`;
}

function showVendorMessagePopup(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const message = buildVendorMessageDraft(o);
  const contactLine = o.vendor_contact_email
    ? `<div class="muted" style="font-size:13px; margin-bottom:8px;">To: ${o.vendor_contact_name ? o.vendor_contact_name + ' — ' : ''}${o.vendor_contact_email}</div>`
    : `<div class="muted" style="font-size:13px; margin-bottom:8px;">No contact email on file for ${o.vendor_name || 'this vendor'} — add one on the Components tab's vendor list.</div>`;

      <span id="vendor-message-copied" class="muted" style="font-size:13px; align-self:center; display:none;">Copied ✓</span>
    </div>

function copyVendorMessage() {
  const el = document.getElementById('vendor-message-text');
  if (!el) return;
  const done = () => {
    const note = document.getElementById('vendor-message-copied');
    if (note) { note.style.display = 'inline'; setTimeout(() => { note.style.display = 'none'; }, 2500); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(done).catch(() => { el.select(); document.execCommand('copy'); done(); });
  } else {
    el.select(); document.execCommand('copy'); done();
  }
}

function buildActionDetail(o) {
  const today = new Date().toISOString().slice(0, 10);
  const itemLabel = o.order_type === 'componentry' ? (o.component_name || 'this component') : o.product_name;
  const vendorLabel = o.vendor_name || 'the vendor';
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const qtyFmt = o.qty != null ? o.qty.toLocaleString() : 'an unknown number of';
  const contactWho = o.vendor_contact_name || o.vendor_contact_email
    ? `${o.vendor_contact_name || ''}${o.vendor_contact_name && o.vendor_contact_email ? ' at ' : ''}${o.vendor_contact_email || ''}`
    : vendorLabel;

  const whatOrder = `${qtyFmt} units of ${itemLabel}`;
  const updateClause = o.notes
    ? `The last update we have${o.last_contacted ? ` (${fmtDate(o.last_contacted)})` : ''} is: "${o.notes}."`
    : `There's no update logged${o.placed_date ? ` since it was placed on ${fmtDate(o.placed_date)}` : ''}.`;

  if (o.order_status === 'paused') {
    return `${whatOrder} — this order is paused, so it won't trigger overdue or contact alerts until it's resumed. ${updateClause}`;
  }

  if (o.eta && o.eta < today && !o.landed) {
    const daysOverdue = daysBetween(o.eta, today);
    return `${whatOrder} were due <strong>${fmtDate(o.eta)}</strong> and still haven't landed — that's <strong>${daysOverdue} day(s) late</strong>. ${updateClause} Worth confirming with ${contactWho} to see what's actually going on.`;
  }

  if (o.next_contact && o.next_contact < today) {
    const daysOverdue = daysBetween(o.next_contact, today);
    return `We were supposed to check in with ${vendorLabel} about ${itemLabel} by <strong>${fmtDate(o.next_contact)}</strong>, and that's now <strong>${daysOverdue} day(s) overdue</strong>. ${updateClause} Worth reaching out to ${contactWho} now.`;
  }

  if (o.eta && daysBetween(today, o.eta) <= 14 && daysBetween(today, o.eta) >= 0) {
    const daysUntil = daysBetween(today, o.eta);
    return `${whatOrder} are expected to land <strong>${fmtDate(o.eta)}</strong> — about ${daysUntil} day(s) out. ${updateClause} Worth confirming shipment/tracking with ${contactWho} before it lands.`;
  }

  // On Track
  const nextContactPhrase = o.next_contact ? `we've got a check-in scheduled for ${fmtDate(o.next_contact)}.` : `there's no next check-in scheduled yet.`;
  return `${whatOrder} are on track${o.eta ? `, expected ${fmtDate(o.eta)}` : ''}. ${updateClause} Looking ahead, ${nextContactPhrase}`;
}

function renderContactScheduleCell(o) {
  const today = new Date().toISOString().slice(0, 10);
  let label, cls;
  if (o.next_contact) {

    cls = o.next_contact < today ? 'bad' : 'watch';
  } else if (o.last_contacted) {
    label = `Last ${fmtDate(o.last_contacted)}`;
    cls = 'watch';
  } else {
    label = 'None scheduled';
    cls = 'watch';

  return `<span class="pill clickable-pill ${cls}" onclick="showContactScheduleDetail('${o.ledger_id}')">${label}</span>`;
}

async function showAddOrderMenu() {
  if (!canEdit()) return;
  // Alex (2026-11-11): "the dropdown should contain all products (right now it's missing the
  // deodorant)" -- root cause: this lookup only loaded `is_active=true` products, and the
  // Deodorant SKUs (+ Silicone Socks) are marked inactive. Now loads every product; inactive

  const [{ data: products }, { data: vendors }] = await Promise.all([
    sb.from('products').select('id, sku_code, display_name, is_active'),
    sb.from('vendors').select('id, vendor_name').order('vendor_name'),
  ]);
  window._addOrderLookups = {
    products: (products || []).sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name)),
    vendors: vendors || [],
  };
  const body = `
    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" style="flex:1; padding:14px;" onclick="document.getElementById('detail-modal-backdrop').remove(); showAddOrderForm('finished_good')">Finished Good</button>
      <button class="btn btn-primary" style="flex:1; padding:14px;" onclick="document.getElementById('detail-modal-backdrop').remove(); showAddOrderForm('componentry')">Component Order</button>
    </div>
  `;
  showDetail('Add Order — Which type?', body);
}

// Alex (2026-11-11): "I should be able to create one PO for multiple products so the picklist
// should be multi-select." Scoped to finished-good orders (where "Initiate PO" actually applies)
// -- component orders stay single-product because each needs ITS OWN specific component
// selected (a multi-select there would need a separate component+qty per product, a bigger
// change not asked for here). inventory_ledger has no native "one PO, many products" concept
// (every row is one product), so this reuses the existing `order_number` field as the shared PO
// identifier: selecting N products and submitting creates N separate inventory_ledger rows, all
// carrying the same order number/vendor/ETA/tracking/notes, one row per product with its own qty.
async function showAddOrderForm(type) {
  const { products, vendors } = window._addOrderLookups || { products: [], vendors: [] };
  let components = [];
  if (type === 'componentry') {
    const { data } = await sb.from('components').select('id, product_id, component_name');
    components = data || [];
  }
  window._addOrderLookups.components = components;

  // Alex (2026-11-11): "the dropdown should contain all products (right now it's missing the
  // deodorant)" -- inactive products (Deodorant SKUs, Silicone Socks) are now included, visibly
  // tagged so it's obvious they're inactive rather than silently indistinguishable from active.
  const productOptionHtml = (p) => `<option value="${p.id}"${p.is_active === false ? ' style="color:var(--muted);"' : ''}>${p.display_name}${p.is_active === false ? ' (inactive)' : ''}</option>`;
  const vendorOptions = vendors.map(v => `<option value="${v.id}">${v.vendor_name}</option>`).join('');

  const productFieldHtml = type === 'finished_good'
    ? `
      <label>Product(s) <span class="muted" style="font-weight:400;">— ctrl/cmd-click to select more than one; add a quantity for each below</span><br>
        <select id="add-order-product" multiple size="6" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" onchange="refreshAddOrderQtyRows()">${products.map(productOptionHtml).join('')}</select>
      </label>
      <div id="add-order-qty-rows" style="display:flex; flex-direction:column; gap:6px;"></div>
    `
    : `
      <label>Product<br>
        <select id="add-order-product" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" onchange="refreshAddOrderComponents()">${products.map(productOptionHtml).join('')}</select>
      </label>
      ${type === 'componentry' ? `
      <label>Component<br>
        <select id="add-order-component" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);"></select>
      </label>` : ''}
      <label>Quantity<br>
        <input id="add-order-qty" type="number" min="1" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" />
      </label>
    `;

  const body = `
    <div style="display:flex; flex-direction:column; gap:10px; font-size:14px;">
      ${productFieldHtml}
      <label>Vendor<br>
        <select id="add-order-vendor" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);"><option value="">— none —</option>${vendorOptions}</select>
      </label>
      <label>ETA<br>
        <input id="add-order-eta" type="date" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" />
      </label>
      <label>Order # (optional)<br>
        <input id="add-order-number" type="text" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" />
      </label>
      <label>Tracking Info (optional)<br>
        <input id="add-order-tracking" type="text" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" />
      </label>
      <label>Notes (optional)<br>
        <input id="add-order-notes" type="text" style="width:100%; padding:6px; border-radius:6px; border:1px solid var(--border);" />
      </label>
      <button class="btn btn-primary" onclick="createNewOrder('${type}')">Create Order${type === 'finished_good' ? '(s)' : ''}</button>
    </div>
  `;
  showDetail(`Add ${type === 'componentry' ? 'Component' : 'Finished Good'} Order`, body);
  if (type === 'componentry') refreshAddOrderComponents();
  if (type === 'finished_good') refreshAddOrderQtyRows();
}

// Builds one quantity input per currently-selected product in the multi-select, preserving any
// quantity already typed for a product that's still selected after the selection changes.
function refreshAddOrderQtyRows() {
  const sel = document.getElementById('add-order-product');
  const rowsEl = document.getElementById('add-order-qty-rows');
  if (!sel || !rowsEl) return;
  const products = window._addOrderLookups?.products || [];
  const selectedIds = Array.from(sel.selectedOptions).map(o => o.value);
  const prevValues = {};
  rowsEl.querySelectorAll('input[data-product-id]').forEach(inp => { prevValues[inp.dataset.productId] = inp.value; });
  rowsEl.innerHTML = selectedIds.map(id => {
    const p = products.find(pr => pr.id === id);
    return `
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="flex:1; font-size:13px;">${p?.display_name || id}</span>
        <input type="number" min="1" placeholder="Qty" data-product-id="${id}" value="${prevValues[id] || ''}" style="width:100px; padding:5px 8px; border-radius:6px; border:1px solid var(--border);" />
      </div>
    `;
  }).join('') || '<div class="muted" style="font-size:13px;">Select one or more products above.</div>';
}

function refreshAddOrderComponents() {
  const sel = document.getElementById('add-order-component');
  if (!sel) return;
  const productId = document.getElementById('add-order-product').value;
  const comps = (window._addOrderLookups.components || []).filter(c => c.product_id === productId);
  sel.innerHTML = comps.map(c => `<option value="${c.id}">${c.component_name}</option>`).join('') || '<option value="">(no components defined for this product)</option>';
}

async function createNewOrder(type) {
  const vendorId = document.getElementById('add-order-vendor').value || null;
  const eta = document.getElementById('add-order-eta').value || null;
  const orderNumber = document.getElementById('add-order-number').value || null;
  const tracking = document.getElementById('add-order-tracking').value || null;
  const notes = document.getElementById('add-order-notes').value || null;

  // Finished-good orders: one or more products, each with its own qty, sharing vendor/ETA/order
  // number/tracking/notes -- this is the "one PO, multiple products" flow.
  if (type === 'finished_good') {
    const qtyInputs = Array.from(document.querySelectorAll('#add-order-qty-rows input[data-product-id]'));
    if (!qtyInputs.length) { await showConfirmModal('Check your input', 'Select at least one product.', { okOnly: true }); return; }
    const lineItems = [];
    for (const inp of qtyInputs) {
      const qty = Number(inp.value);
      if (!qty || qty <= 0) { await showConfirmModal('Check your input', `Enter a quantity greater than 0 for every selected product.`, { okOnly: true }); return; }
      lineItems.push({ productId: inp.dataset.productId, qty });
    }
    const inserted = [];
    for (const { productId, qty } of lineItems) {
      const payload = {
        event_date: new Date().toISOString().slice(0, 10), event_type: 'production_run',
        product_id: productId, component_id: null, vendor_id: vendorId, qty_in: qty, eta,
        landed: false, order_status: 'open', order_number: orderNumber, tracking_info: tracking, notes,
      };
      const { data: row, error } = await sb.from('inventory_ledger').insert(payload).select().single();
      if (error) { await showConfirmModal('Something went wrong', `Created ${inserted.length} of ${lineItems.length} order(s), then failed: ${error.message}`, { okOnly: true, danger: true }); break; }
      inserted.push(row);
    }
    if (!inserted.length) return;
    document.getElementById('detail-modal-backdrop')?.remove();
    const products = window._addOrderLookups.products || [];
    const logIds = [];
    for (const row of inserted) {
      const product = products.find(p => p.id === row.product_id);
      const id = await logAction('inventory_ledger', row.id, 'create', `Added new finished-good order: ${product?.display_name || 'order'}, ${row.qty_in.toLocaleString()} units${orderNumber ? ` (Order # ${orderNumber})` : ''}`, null, row, { silent: inserted.length > 1 });
      if (id) logIds.push(id);
    }
    if (inserted.length > 1) {
      showBulkUndoToast(logIds, `Created ${inserted.length} linked order${inserted.length === 1 ? '' : 's'}${orderNumber ? ` (Order # ${orderNumber})` : ''}`);
    }
    await Promise.all([renderOverview(), renderComponents(), window._revState ? renderRevenue() : null]);
    return;
  }

  // Component orders: unchanged single-product-with-one-component flow.
  const productId = document.getElementById('add-order-product').value;
  const componentId = document.getElementById('add-order-component').value;
  const qty = Number(document.getElementById('add-order-qty').value);

  if (!qty || qty <= 0) { await showConfirmModal('Check your input', 'Enter a quantity greater than 0.', { okOnly: true }); return; }
  if (!componentId) { await showConfirmModal('Check your input', 'Select a component.', { okOnly: true }); return; }

  const payload = {
    event_date: new Date().toISOString().slice(0, 10),
    event_type: 'component_order',
    product_id: null,
    component_id: componentId,
    vendor_id: vendorId,
    qty_in: qty,
    eta,
    landed: false,
    order_status: 'open',
    order_number: orderNumber,
    tracking_info: tracking,
    notes,
  };
  const { data: inserted, error } = await sb.from('inventory_ledger').insert(payload).select().single();
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  document.getElementById('detail-modal-backdrop')?.remove();
  const product = (window._addOrderLookups.products || []).find(p => p.id === productId);
  await logAction('inventory_ledger', inserted.id, 'create', `Added new component order: ${product?.display_name || 'order'}, ${qty.toLocaleString()} units`, null, inserted);
  await Promise.all([renderOverview(), renderComponents(), window._revState ? renderRevenue() : null]);
}

function showRecActionsMenu(recId, btnEl) {

// ---------- Activity log / undo ----------
async function logAction(tableName, recordId, action, description, beforeData, afterData, opts) {
  const { data, error } = await sb.from('activity_log').insert({
    table_name: tableName, record_id: recordId, action, description,
    before_data: beforeData, after_data: afterData, performed_by: currentUserRow?.email || 'dashboard',
  }).select().single();
  // Alex (2026-11-10): "The creation of the new product didn't log into the activity log and so
  // I wasn't able to undo it." Root cause: it WAS logged (confirmed in the DB) -- the real bug is
  // that every multi-row operation (the New Product wizard logs one row for the product, then
  // one MORE per component) calls showUndoToast() every time, and each call replaces whatever
  // toast is currently showing. With even one component, the product's own undo toast got
  // overwritten within milliseconds by the component's toast before anyone could click it --
  // not a logging failure, a toast-clobbering bug. Pass `opts.silent = true` to skip the toast
  // for intermediate rows in a bulk operation; the caller shows ONE consolidated toast at the end
  // instead (see npWizardCreate's bulkUndoToast).
  if (!error && data && !opts?.silent) showUndoToast(data.id, description);
  return !error && data ? data.id : null;
}

// Alex (2026-11-10): same bug class as the toast-clobbering above, generalized -- ANY operation
// that logs more than one activity_log row in one user action needs ONE toast whose Undo button
// reverts every row from that operation, not just the last one logged. logIds is oldest-first
// (the order they were created); undone in REVERSE order so dependent rows (e.g. a component
// that references a product) are undone before the row they depend on.
function showBulkUndoToast(logIds, description) {
  document.getElementById('undo-toast')?.remove();
  if (!logIds.length) return;
  const toast = document.createElement('div');
  toast.id = 'undo-toast';
  toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2b2420; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; display:flex; align-items:center; gap:12px; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,0.35); max-width:520px;';
  toast.innerHTML = `<span>${description}</span><button style="background:#fff; color:#2b2420; padding:4px 10px; font-size:13px; border-radius:6px; border:none; cursor:pointer; white-space:nowrap;" onclick="undoBulkActions(${JSON.stringify(logIds)})">Undo</button>`;
  document.body.appendChild(toast);
  setTimeout(() => { if (document.getElementById('undo-toast') === toast) toast.remove(); }, 10000);
}

async function undoBulkActions(logIds) {
  document.getElementById('undo-toast')?.remove();
  for (const id of [...logIds].reverse()) {
    await undoAction(id, { skipRefresh: true });
  }
  await Promise.all([
    renderOverview(), renderLandedOrders(), renderComponents(),
    window._revState ? renderRevenue() : null,
    document.getElementById('catalog-accordion-body-products') ? renderCatalogProducts() : null,
    document.getElementById('catalog-accordion-body-components') ? renderCatalogComponents() : null,
    document.getElementById('catalog-accordion-body-bundles') ? renderCatalogBundles() : null,
  ]);
  const activityTab = document.getElementById('tab-activity');
  if (activityTab && !activityTab.classList.contains('hidden')) await renderActivityLog();
}

function showUndoToast(logId, description) {
  document.getElementById('undo-toast')?.remove();
  const toast = document.createElement('div');
  toast.id = 'undo-toast';
  toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2b2420; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; display:flex; align-items:center; gap:12px; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,0.35); max-width:520px;';
  toast.innerHTML = `<span>${description}</span><button style="background:#fff; color:#2b2420; padding:4px 10px; font-size:13px; border-radius:6px; border:none; cursor:pointer; white-space:nowrap;" onclick="undoAction('${logId}')">Undo</button>`;
  document.body.appendChild(toast);
  setTimeout(() => { if (document.getElementById('undo-toast') === toast) toast.remove(); }, 10000);
}

async function undoAction(logId, opts) {
  const { data: log, error } = await sb.from('activity_log').select('*').eq('id', logId).single();
  if (error || !log) { await showConfirmModal('Heads up', 'Could not load this action.', { okOnly: true, danger: true }); return; }
  if (log.undone) { if (!opts?.skipRefresh) await showConfirmModal('Heads up', 'This action was already undone.', { okOnly: true }); return; }
  document.getElementById('undo-toast')?.remove();

  if (log.action === 'delete') {
    const { error: insErr } = await sb.from(log.table_name).insert(log.before_data);
    if (insErr) { await showConfirmModal('Something went wrong', 'Undo failed: ' + insErr.message, { okOnly: true, danger: true }); return; }
  } else if (log.action === 'create') {
    await sb.from(log.table_name).delete().eq('id', log.record_id);
  } else if (log.action === 'split') {
    await sb.from(log.table_name).update({ qty_in: log.before_data.qty_in }).eq('id', log.record_id);
    if (log.after_data?.new_row_id) await sb.from(log.table_name).delete().eq('id', log.after_data.new_row_id);
  } else {
    const { id, ...rest } = log.before_data;
    await sb.from(log.table_name).update(rest).eq('id', log.record_id);
  }
  await sb.from('activity_log').update({ undone: true, undone_at: new Date().toISOString(), undone_by: currentUserRow?.email || 'dashboard' }).eq('id', logId);
  if (opts?.skipRefresh) return;
  // Undo now applies everywhere (Alex, 2026-10-22: "The undo button functionality should exist
  // everywhere") -- refresh every tab that might show the reverted data, not just Overview/Landed
  // Orders, since an undo can now originate from the Revenue tab (channel/mix/ASP edits, draft
  // POs) or the Components tab (vendor edits) too.
  await Promise.all([
    renderOverview(),
    renderLandedOrders(),
    renderComponents(),
    window._revState ? renderRevenue() : null,
  ]);
  const activityTab = document.getElementById('tab-activity');
  if (activityTab && !activityTab.classList.contains('hidden')) await renderActivityLog();
}

// ---------- Components ----------
// Alex (2026-10-22): "we want to have the active component levels with a simplified schedule or
// analysis of how to order them." Scope confirmed with Alex: one row per component (QOH,
// in-flight, vendor, lead time, cadence) plus a simple three-tier status flag -- ORDER_NOW /
// ORDER_SOON / OK -- derived from the SAME root-product 6-month revenue projections the Revenue
// tab uses (live forecast only, not scenario-aware), NOT a full expand_to_component_pos()-style
// exact-date netting. See dashboard/lib/revenue-logic.js's computeComponentRunout/
// componentOrderStatus (unit-tested, 100% coverage) for the actual math.
//
// 2026-10-22 follow-up (Alex): filter by product, edit lead times, support multiple vendors per
// component, initiate a component order from here, and a status pop-out explaining the math PLUS
// whatever the real PO-recommendation engine (Overview tab, agent_recommendations.component_recs
// -- already does exact expand_to_component_pos() netting against actual forecasted shortfall
// POs) separately says about this component, surfaced rather than silently merged into one number.
async function renderComponents() {
  const el = document.getElementById('tab-components');
  el.innerHTML = `<div class="card empty-state">Loading component levels…</div>`;

  const months = nextSixMonths();
  const [{ data: componentQoh }, { data: componentVendors }, { data: products }, { data: revForecasts }, { data: forecastParams }, { data: activeRecs }] = await Promise.all([
    sb.from('component_qoh').select('*'),
    sb.from('component_vendors').select('*, vendors(vendor_name, default_lead_days, default_cadence_days)'),
    sb.from('products').select('id, sku_code, display_name, product_type'),
    sb.from('revenue_forecasts').select('channel, forecast_month, forecast_revenue').gte('forecast_month', months[0] + '-01'),
    sb.from('forecast_params').select('channel, revenue_pct, avg_selling_price, product_id').eq('is_active', true),
    sb.from('agent_recommendations').select('product_id, urgency, last_responsible_date, recommended_order_qty, component_recs').neq('decision', 'dismissed').eq('is_test', false),
  ]);

  const productBySku = {};
  (products || []).forEach(p => { productBySku[p.sku_code] = p; });

  const liveForecast = {};
  (revForecasts || []).forEach(r => {
    const m = r.forecast_month.slice(0, 7);
    if (!liveForecast[m]) liveForecast[m] = {};
    liveForecast[m][r.channel] = Number(r.forecast_revenue);
  });
  // Live mix: same single current value applied to every forward month (no per-month override
  // lookup here, unlike the Revenue tab's scenario machinery) -- a deliberate simplification
  // consistent with Alex's "simplified schedule" framing for this tab.
  const liveMix = { shopify: {}, amazon: {} };
  (forecastParams || []).forEach(fp => {
    liveMix[fp.channel] = liveMix[fp.channel] || {};
    liveMix[fp.channel][fp.product_id] = {};
    months.forEach(m => {
      liveMix[fp.channel][fp.product_id][m] = { revenue_pct: Number(fp.revenue_pct), avg_selling_price: Number(fp.avg_selling_price) };
    });
  });

  // Every active vendor link per component (not just preferred) -- supports multiple vendors UI.
  const vendorsByComponentId = {};
  (componentVendors || []).forEach(cv => {
    if (!vendorsByComponentId[cv.component_id]) vendorsByComponentId[cv.component_id] = [];
    vendorsByComponentId[cv.component_id].push(cv);
  });

  // The REAL PO-recommendation engine's per-component net need, keyed by product_id + component
  // name -- exactly answers "will recommendations be based on future forecasted POs?": yes, this
  // IS that calculation (po_recommendations.py's expand_to_component_pos(), already computed for
  // the Overview tab), surfaced here rather than rebuilt. Kept visibly separate from this tab's
  // own simplified estimate, never silently merged into one number.
  const backendRecByProductAndComponent = {};
  (activeRecs || []).forEach(rec => {
    (rec.component_recs || []).forEach(cr => {
      backendRecByProductAndComponent[`${rec.product_id}::${cr.component_name}`] = { ...cr, urgency: rec.urgency, last_responsible_date: rec.last_responsible_date };
    });
  });

  const rows = (componentQoh || []).map(c => {
    const product = productBySku[c.product_sku];
    const demandUnits = product
      ? window.RevenueLogic.computeMonthlyDemandUnits({ product: { product_id: product.id }, months, channelData: liveForecast, mixData: liveMix })
      : months.map(() => 0);
    const consumption = demandUnits.map(d => d * (c.qty_per_unit || 1));
    const startQty = (c.qty_on_hand || 0) + (c.qty_in_flight || 0);
    const runOutMonthIndex = window.RevenueLogic.computeComponentRunout(startQty, consumption);
    const allVendorLinks = (vendorsByComponentId[c.component_id] || []).slice().sort((a, b) => (b.is_preferred ? 1 : 0) - (a.is_preferred ? 1 : 0));
    const preferred = allVendorLinks.find(v => v.is_preferred) || allVendorLinks[0];
    const leadDays = preferred?.lead_days ?? preferred?.vendors?.default_lead_days ?? 56;
    const cadenceDays = preferred?.contact_cadence_days ?? preferred?.vendors?.default_cadence_days ?? 14;
    const status = window.RevenueLogic.componentOrderStatus({ runOutMonthIndex, leadDays, cadenceDays });
    const backendRec = product ? backendRecByProductAndComponent[`${product.id}::${c.component_name}`] : null;
    return { c, product, preferred, allVendorLinks, leadDays, cadenceDays, status, runOutMonthIndex, demandUnits, consumption, startQty, backendRec };
  });

  // Alex (2026-11-03): this tab is built entirely by iterating raw components, so a product with
  // NO linked components (Night Oil Patches is tracked via product_id directly in
  // inventory_ledger, by design -- see sync_componentry_ledger.py's SINGLE_COMPONENT_SKU_TO_PRODUCT)
  // has no row here at all and can look like it's missing. That's correct for this tab (there's
  // no raw component to show), but make it visible rather than silent.
  const skusWithComponents = new Set((componentQoh || []).map(c => c.product_sku));
  const singleComponentProducts = (products || []).filter(p => p.product_type === 'root' && !skusWithComponents.has(p.sku_code));
  const singleComponentNotice = singleComponentProducts.length
    ? `<div class="card muted" style="padding:10px 14px; margin-top:10px; font-size:13px;">
        ${singleComponentProducts.map(p => p.display_name).join(', ')} ${singleComponentProducts.length === 1 ? 'is' : 'are'} tracked
        directly (no separate raw-component breakdown) — see the Overview tab for current stock
        and open orders.
      </div>`
    : '';
  window._componentsCache = { rows, months, singleComponentNotice };

  renderComponentsTable();
}

function renderComponentsTable() {
  const { rows, months, singleComponentNotice } = window._componentsCache || { rows: [], months: [], singleComponentNotice: '' };
  const el = document.getElementById('tab-components');
  const productFilter = window._componentsProductFilter || 'all';

  const uniqueProducts = [...new Map(rows.filter(r => r.product).map(r => [r.product.sku_code, r.product.display_name])).entries()]
    .sort((a, b) => productSortRank(a[1]) - productSortRank(b[1]) || a[1].localeCompare(b[1]));

  let filtered = productFilter === 'all' ? rows : rows.filter(r => r.c.product_sku === productFilter);
  filtered = filtered.slice().sort((a, b) =>
    window.RevenueLogic.componentStatusRank(a.status) - window.RevenueLogic.componentStatusRank(b.status)
    || a.c.component_name.localeCompare(b.c.component_name)
  );

  const statusPill = { ORDER_NOW: 'bad', ORDER_SOON: 'watch', OK: 'good' };
  const statusLabel = { ORDER_NOW: 'Order Now', ORDER_SOON: 'Order Soon', OK: 'OK' };
  const tableRows = filtered.map(r => {
    const { c, preferred, allVendorLinks, leadDays, cadenceDays, status, runOutMonthIndex, backendRec } = r;
    const hasShortfallSignal = backendRec && backendRec.net_need > 0;
    return [
      `<strong>${c.component_name}</strong>`,
      `${c.product_name}<br><span class="muted" style="font-size:11px;">${c.product_sku}</span>`,
      (c.qty_on_hand || 0).toLocaleString(),
      (c.qty_in_flight || 0).toLocaleString(),
      `<button class="btn btn-ghost" style="padding:3px 6px; font-size:12px;" onclick="manageComponentVendors('${c.component_id}')">

      `<button class="btn btn-ghost" style="padding:3px 6px; font-size:12px;" onclick="manageComponentVendors('${c.component_id}')">${leadDays}d</button>`,
      `${cadenceDays}d`,
      `<button class="btn btn-ghost" style="padding:0;" onclick="showComponentStatusDetail('${c.component_id}')">
        <span class="pill ${statusPill[status]}">${statusLabel[status]}</span>${hasShortfallSignal && status === 'OK' ? ' <span class="pill watch" title="The full PO-recommendation engine flags a real component shortfall — click for detail">⚠</span>' : ''}
      </button>`,
      runOutMonthIndex == null ? '<span class="muted">beyond 6 months</span>' : `~${monthLabelLong(months[runOutMonthIndex])}`,
      canEdit() ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="orderComponentFromComponentsTab('${c.component_id}', '${r.product?.id || ''}')">+ Order</button>` : '',
    ];
  });

  el.innerHTML = `
    <div class="card" style="padding:14px 16px;">
      <div class="section-label" style="margin:0 0 2px;">Active Component Levels</div>
      <div class="muted" style="font-size:12px; margin-bottom:10px;">
        One row per raw component. Status is a simplified estimate: it projects each component's
        on-hand + in-flight quantity against the root product's current revenue forecast (live
        forecast only — not scenario-aware) and compares the runout date to the vendor's lead time
        + contact cadence. Click Status for the full rationale, including what the real
        PO-recommendation engine (Overview tab) separately says. Sorted Order Now / Order Soon / OK.
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <select id="components-product-filter" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:13px;" onchange="setComponentsProductFilter(this.value)">
          <option value="all" ${productFilter === 'all' ? 'selected' : ''}>All products</option>
          ${uniqueProducts.map(([sku, name]) => `<option value="${sku}" ${productFilter === sku ? 'selected' : ''}>${name}</option>`).join('')}
        </select>
      </div>
      ${tableRows.length
        ? kpiTable(['Component', 'Product', 'QOH', 'In-Flight', 'Vendor', 'Lead Time', 'Cadence', 'Status', 'Runs Out', ''], tableRows, null, null, [2, 3, 4, 5, 6, 7, 8, 9])
        : '<div class="empty-state">No components match this filter.</div>'}
    </div>
    ${singleComponentNotice}
  `;
}

function showComponentStatusDetail(componentId) {
  const { rows, months } = window._componentsCache || { rows: [], months: [] };
  const r = rows.find(row => row.c.component_id === componentId);
  if (!r) return;
  const { c, preferred, leadDays, cadenceDays, status, runOutMonthIndex, consumption, startQty, backendRec } = r;
  const statusLabel = { ORDER_NOW: 'Order Now', ORDER_SOON: 'Order Soon', OK: 'OK' };

  let running = startQty;
  const monthRows = months.map((m, i) => {
    running -= consumption[i];
    return `<tr><td style="padding:4px 8px;">${monthLabelShort(m)}</td><td style="padding:4px 8px;">${Math.round(consumption[i]).toLocaleString()}</td><td style="padding:4px 8px; ${running < 0 ? 'color:var(--bad-text);' : ''}">${Math.round(running).toLocaleString()}</td></tr>`;
  }).join('');

  const recommendationSentence = status === 'ORDER_NOW'
    ? `Order now — projected to run out around ${monthLabelLong(months[runOutMonthIndex])}, which is inside ${preferred?.vendors?.vendor_name || 'the vendor'}'s ${leadDays}-day lead time.`
    : status === 'ORDER_SOON'
    ? `Start the conversation soon — projected to run out around ${monthLabelLong(months[runOutMonthIndex])}, which is within one contact-cadence window (${cadenceDays}d) past the ${leadDays}-day lead time.`
    : `No action needed right now — ${runOutMonthIndex == null ? "doesn't project to run out within the 6-month horizon" : `runout (${monthLabelLong(months[runOutMonthIndex])}) is comfortably beyond lead time + cadence`}.`;

  const body = `
    <div style="font-size:14px; line-height:1.5;">
      <div style="padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:8px;"><strong>Recommendation:</strong> ${recommendationSentence}</div>

      <div class="section-label" style="margin:0 0 4px; font-size:12px;">Full Recommendation Engine (Overview tab)</div>
      ${backendRec ? `
        <div class="muted" style="font-size:13px; margin-bottom:4px;">
          Netted against a real active PO-shortfall recommendation
          (<span class="urgency-badge urgency-${backendRec.urgency}" style="font-size:10px;">${backendRec.urgency}</span>,
          due by ${fmtDate(backendRec.last_responsible_date)}) — accounts for the actual forecasted finished-good PO,
          not just smoothed continuous demand.
        </div>
        <div style="font-size:13px; margin-bottom:8px;">Net need: <strong>${(backendRec.net_need || 0).toLocaleString()}</strong> · MOQ: ${(backendRec.moq || 0).toLocaleString()} · <strong>Order ${(backendRec.order_qty || 0).toLocaleString()} units from ${backendRec.vendor}</strong></div>
      ` : `<div class="muted" style="font-size:13px; margin-bottom:8px;">No active PO-shortfall recommendation currently references this component.</div>`}

      <details>
        <summary>Show this tab's quick estimate</summary>
        <div class="muted" style="font-size:12px; margin-bottom:6px;">
          Starting stock: ${(c.qty_on_hand || 0).toLocaleString()} on hand + ${(c.qty_in_flight || 0).toLocaleString()} in-flight
          = <strong>${startQty.toLocaleString()}</strong> available, consumed at ${c.qty_per_unit || 1} unit${c.qty_per_unit === 1 ? '' : 's'}/finished unit against the root product's live revenue forecast.
        </div>
        <table style="width:100%; font-size:13px; border-collapse:collapse; margin-bottom:6px;">
          <thead><tr><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Month</th><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Consumed</th><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Running Balance</th></tr></thead>
          <tbody>${monthRows}</tbody>
        </table>
        <div class="muted" style="font-size:12px;">Vendor lead time: ${leadDays} days. Contact cadence: ${cadenceDays} days.</div>
      </details>
    </div>
  `;
  showDetail(`${c.component_name} — Why "${statusLabel[status]}"?`, body, 'wide');
}

// ---------- Component vendor management (multiple vendors per component, lead time/cadence/MOQ edits) ----------
async function manageComponentVendors(componentId) {
  const { rows } = window._componentsCache || { rows: [] };
  const row = rows.find(r => r.c.component_id === componentId);
  if (!row) return;
  const componentName = row.c.component_name;

  const [{ data: links }, { data: allVendors }] = await Promise.all([
    sb.from('component_vendors').select('*, vendors(vendor_name)').eq('component_id', componentId),
    sb.from('vendors').select('id, vendor_name').eq('is_active', true).order('vendor_name'),
  ]);
  const sortedLinks = (links || []).slice().sort((a, b) => (b.is_preferred ? 1 : 0) - (a.is_preferred ? 1 : 0));
  const linkedVendorIds = new Set(sortedLinks.map(l => l.vendor_id));
  const unlinkedVendors = (allVendors || []).filter(v => !linkedVendorIds.has(v.id));

  const rowsHtml = sortedLinks.map(l => `
    <div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; flex-wrap:wrap;">
      <input type="radio" name="preferred-vendor" ${l.is_preferred ? 'checked' : ''} ${canEdit() ? '' : 'disabled'} onchange="setPreferredComponentVendor('${componentId}','${l.id}')" title="Set as preferred">
      <div style="flex:1; min-width:100px;"><strong>${l.vendors?.vendor_name}</strong>${l.is_preferred ? ' <span class="pill good" style="font-size:10px;">preferred</span>' : ''}</div>
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:12px;" onclick="editComponentVendorField('${l.id}','lead_days','Lead Time (days, blank = use vendor default)',${l.lead_days ?? 'null'})">${l.lead_days != null ? l.lead_days + 'd lead' : 'default lead'}</button>` : `<span class="muted">${l.lead_days != null ? l.lead_days + 'd lead' : 'default lead'}</span>`}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:12px;" onclick="editComponentVendorField('${l.id}','contact_cadence_days','Contact Cadence (days, blank = use vendor default)',${l.contact_cadence_days ?? 'null'})">${l.contact_cadence_days != null ? l.contact_cadence_days + 'd cadence' : 'default cadence'}</button>` : ''}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:12px;" onclick="editComponentVendorField('${l.id}','moq','MOQ (blank = none)',${l.moq ?? 'null'})">${l.moq != null ? 'MOQ ' + l.moq : 'no MOQ'}</button>` : ''}
      ${canDelete() && sortedLinks.length > 1 ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:12px; color:var(--bad-text);" onclick="removeComponentVendor('${l.id}','${componentId}')">Remove</button>` : ''}
    </div>
  `).join('');

  const addSection = canEdit()
    ? (unlinkedVendors.length ? `
      <div style="margin-top:12px; display:flex; gap:6px; align-items:center;">
        <select id="add-component-vendor-select" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--border); font-size:13px;">
          ${unlinkedVendors.map(v => `<option value="${v.id}">${v.vendor_name}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" style="padding:5px 10px; font-size:13px;" onclick="addComponentVendor('${componentId}')">+ Add Vendor</button>
      </div>
    ` : '<div class="muted" style="font-size:12px; margin-top:8px;">All active vendors are already linked to this component.</div>')
    : '';

  showDetail(`${componentName} — Vendors`, `${rowsHtml || '<div class="muted">No vendors linked yet.</div>'}${addSection}`);
}

async function setPreferredComponentVendor(componentId, linkId) {
  await sb.from('component_vendors').update({ is_preferred: false }).eq('component_id', componentId);
  const { error } = await sb.from('component_vendors').update({ is_preferred: true }).eq('id', linkId);
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

async function editComponentVendorField(linkId, field, label, currentVal) {
  const input = await showPromptModal(label, null, currentVal ?? '', 'number');
  if (input === null) return;
  const val = input === '' ? null : Number(input);
  const { data: before } = await sb.from('component_vendors').select('*').eq('id', linkId).single();
  const { data: link, error } = await sb.from('component_vendors').update({ [field]: val }).eq('id', linkId).select('*, components(component_name)').single();
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  await logAction('component_vendors', linkId, 'update', `Edited ${link.components?.component_name || 'component'}'s ${field.replace(/_/g, ' ')}: ${before?.[field] ?? '—'} → ${val ?? '—'}`, before, link);
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  if (link) await manageComponentVendors(link.component_id);
}

async function addComponentVendor(componentId) {
  const vendorId = document.getElementById('add-component-vendor-select')?.value;
  if (!vendorId) return;
  const { data, error } = await sb.from('component_vendors').insert({ component_id: componentId, vendor_id: vendorId, is_preferred: false }).select('*, vendors(vendor_name), components(component_name)').single();
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  await logAction('component_vendors', data.id, 'create', `Added vendor ${data.vendors?.vendor_name || ''} to ${data.components?.component_name || 'component'}`, null, data);
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

async function removeComponentVendor(linkId, componentId) {
  if (!(await showConfirmModal('Remove this vendor link?', 'This does not affect past orders, only future vendor selection for this component.', 'Remove'))) return;
  const { data: before } = await sb.from('component_vendors').select('*, vendors(vendor_name), components(component_name)').eq('id', linkId).single();
  const { error } = await sb.from('component_vendors').delete().eq('id', linkId);
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  if (before) {
    const { vendors, components, ...beforeRaw } = before;
    await logAction('component_vendors', linkId, 'delete', `Removed vendor ${vendors?.vendor_name || ''} from ${components?.component_name || 'component'}`, beforeRaw, null);
  }
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

// Reuses the Overview tab's existing Add Order flow (same creation path as "+ Add Order" ->
// "Component Order"), pre-selecting the product/component so it's a one-click start from here.
async function orderComponentFromComponentsTab(componentId, productId) {
  if (!canEdit()) { await showConfirmModal('Not allowed', 'You do not have permission to create orders.', { okOnly: true }); return; }
  if (!window._addOrderLookups) {
    const [{ data: products }, { data: vendors }] = await Promise.all([
      sb.from('products').select('id, sku_code, display_name, is_active'),
      sb.from('vendors').select('id, vendor_name').order('vendor_name'),
    ]);
    window._addOrderLookups = {
      products: (products || []).sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name)),
      vendors: vendors || [],
    };
  }
  await showAddOrderForm('componentry');
  const productSel = document.getElementById('add-order-product');
  if (productSel && productId) { productSel.value = productId; refreshAddOrderComponents(); }
  const compSel = document.getElementById('add-order-component');
  if (compSel) compSel.value = componentId;
}

// Alex (2026-10-22): "Outside of scenarios I should be able to initiate a draft and commit a PO
// to see how that solves the problem" -- answered via clarify: committed directly against LIVE,
// no scenario wrapper, as its own separate creation path. Reuses the exact same Add Order flow
// used elsewhere (Overview "+ Add Order", Components "+ Order") -- a real inventory_ledger row,
// visible immediately with full vendor/tracking info in the Overview tab's Open Orders list, and
// correctly picked up as a real finished-good receipt in this tab's own projection (the
// order_type='finished_good' filter fixed earlier this session). Optionally pre-filled with a
// recommended qty/month/vendor -- "If the Status is Issue it should also come with a recommended
// PO initiation with all info filled out."
async function initiateLivePoFromOutlook(productId, recommendedQty, recommendedMonth, recommendedVendorId) {
  if (!canEdit()) { await showConfirmModal('Not allowed', 'You do not have permission to create orders.', { okOnly: true }); return; }
  if (!window._addOrderLookups) {
    const [{ data: products }, { data: vendors }] = await Promise.all([
      sb.from('products').select('id, sku_code, display_name, is_active'),
      sb.from('vendors').select('id, vendor_name').order('vendor_name'),
    ]);
    window._addOrderLookups = {
      products: (products || []).sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name)),
      vendors: vendors || [],
    };
  }
  await showAddOrderForm('finished_good');
  const productSel = document.getElementById('add-order-product');
  if (productSel) {
    // `add-order-product` is now a multi-select for finished_good -- select just the
    // recommended product and trigger the qty-rows refresh so its input actually appears.
    Array.from(productSel.options).forEach(o => { o.selected = (o.value === productId); });
    refreshAddOrderQtyRows();
  }
  if (recommendedQty) {
    const qtyInput = document.querySelector(`#add-order-qty-rows input[data-product-id="${productId}"]`);
    if (qtyInput) qtyInput.value = recommendedQty;
  }
  if (recommendedMonth) document.getElementById('add-order-eta').value = recommendedMonth + '-01';
  const vendorSel = document.getElementById('add-order-vendor');
  if (vendorSel && recommendedVendorId) vendorSel.value = recommendedVendorId;
  if (recommendedQty || recommendedMonth) {
    const note = document.createElement('div');
    note.className = 'muted';
    note.style.cssText = 'font-size:12px; margin-bottom:-4px;';
    note.textContent = 'Pre-filled from the Inventory Outlook recommendation — review and adjust before saving.';
    const container = document.getElementById('add-order-product')?.closest('label')?.parentElement;
    if (container) container.insertBefore(note, container.firstChild);
  }
}

function showRecalcDecisionModal(changedFieldLabels) {
  return new Promise(resolve => {
    document.getElementById('detail-modal-backdrop')?.remove();
    const el = document.createElement('div');
    el.id = 'detail-modal-backdrop';
    el.className = 'detail-modal-backdrop';
    const finish = (val) => { el.remove(); resolve(val); };
    el.onclick = (e) => { if (e.target === el) finish(null); };
    el.innerHTML = `
      <div class="detail-modal" style="max-width:480px;">
        <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">Apply this change now, or just going forward?</div>
        <div style="font-size:14px; line-height:1.5; margin-bottom:12px;">
          You changed <strong>${changedFieldLabels.join(', ')}</strong>, which feeds into existing recommendations and order deadlines.
        </div>
        <div style="font-size:14px; line-height:1.5; margin-bottom:16px; color:var(--muted);">
          <strong>Apply now</strong> re-runs the recommendation engine immediately (takes about 15 seconds) so today's recommendations reflect the new value right away.<br>
          <strong>Going forward only</strong> saves the change but leaves today's recommendations as-is — the daily scheduled run (noon UTC) will pick it up naturally tomorrow.
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-primary" id="recalc-now-btn">Apply now (~15s)</button>
          <button class="btn btn-ghost" id="recalc-later-btn">Going forward only</button>
          <button class="btn btn-ghost" id="recalc-cancel-btn">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(el);
    document.getElementById('recalc-now-btn').onclick = () => finish('now');
    document.getElementById('recalc-later-btn').onclick = () => finish('later');
    document.getElementById('recalc-cancel-btn').onclick = () => finish(null);
  });
}

    ${catalogAccordion('bundles', 'Catalog — Bundles', 'Click a bundle to expand and edit which root products it contains.', false, newBundleBtn)}
    ${catalogAccordion('vendors', 'Catalog — Vendors', 'Click a vendor to expand lead time, contacts, components supplied, and notes.', false, newVendorBtn)}
    ${catalogAccordion('components', 'Catalog — Components', "Click a component to expand notes and vendors. Same underlying rows as the ones nested under Products above.", false, newComponentBtn)}
  `;
  await Promise.all([renderCatalogVendors(), renderCatalogProducts(), renderCatalogBundles(), renderCatalogComponents()]);
}

function catalogAccordion(id, title, subtitle, openDefault, headerActionHtml) {
  window._catalogAccordionOpen = window._catalogAccordionOpen || {};
  if (!(id in window._catalogAccordionOpen)) window._catalogAccordionOpen[id] = !!openDefault;
  const open = window._catalogAccordionOpen[id];
  return `
    <div class="card" style="padding:0; margin-bottom:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:10px;">
        <div style="flex:1; padding-right:10px; cursor:pointer;" onclick="toggleCatalogAccordion('${id}')">
          <div class="section-label" style="margin:0;">${title}</div>
          ${subtitle ? `<div class="muted" style="font-size:13px; margin-top:3px; font-weight:400; text-transform:none; letter-spacing:normal;">${subtitle}</div>` : ''}
        </div>
        ${headerActionHtml || ''}
        <span class="muted" id="catalog-accordion-caret-${id}" style="font-size:14px; white-space:nowrap; cursor:pointer;" onclick="toggleCatalogAccordion('${id}')">${open ? '▾ Collapse' : '▸ Expand'}</span>
      </div>
      <div id="catalog-accordion-body-${id}" style="${open ? 'padding:0 16px 14px 16px;' : 'display:none; padding:0 16px 14px 16px;'}"></div>
    </div>
  `;
}

// Pure CSS toggle -- content is rendered once by renderCatalog() and stays in the DOM; opening
// or closing a section never refetches or rebuilds anything, so it can't glitch.
function toggleCatalogAccordion(id) {
  window._catalogAccordionOpen = window._catalogAccordionOpen || {};
  const open = !window._catalogAccordionOpen[id];
  window._catalogAccordionOpen[id] = open;
  const body = document.getElementById(`catalog-accordion-body-${id}`);
  const caret = document.getElementById(`catalog-accordion-caret-${id}`);
  if (body) body.style.display = open ? '' : 'none';
  if (caret) caret.textContent = open ? '▾ Collapse' : '▸ Expand';
}

// Alex (2026-11-04): "I need the same button with vendors and components. I like the look and
// feel of the tab, let's extrapolate the interaction to the vendors and components within this
// tab." -- Vendors moves from a flat always-visible kpiTable to the same click-row-to-expand
// pattern as Products/Bundles: a minimal collapsed row (name, type, active, components-supplied
// count), click to reveal lead/cadence, contacts, components managed, and notes inline. Existing
// detail modals (lead time, contacts, notes, manage components) are reused unchanged -- only the
// row/expand shell around them changed, per Alex's "I like the look and feel" (don't reinvent
// the parts that already work).
function renderCatalogVendorsTable() {
  const { vendors, allContacts, componentVendors } = window._catalogVendorsCache || { vendors: [], allContacts: [], componentVendors: [] };
  const el = document.getElementById('catalog-accordion-body-vendors');
  if (!el) return;
  const canAct = canEdit();

  const openVendorIds = Array.from(el.querySelectorAll('[id^="cv-detail-"]')).filter(r => r.style.display !== 'none').map(r => r.id.replace('cv-detail-', ''));

  const contactsByVendor = {};
  allContacts.forEach(c => { (contactsByVendor[c.vendor_id] = contactsByVendor[c.vendor_id] || []).push(c); });
  const componentsByVendor = {};
  componentVendors.forEach(cv => { (componentsByVendor[cv.vendor_id] = componentsByVendor[cv.vendor_id] || []).push(cv); });

  const rows = vendors.map(v => {
    const isComponentSupplier = v.vendor_type === 'component_supplier';
    const contacts = contactsByVendor[v.id] || [];
    const primaryCount = contacts.filter(c => c.is_primary_poc).length;
    const contactPillLabel = contacts.length ? `${contacts.length} on file${primaryCount ? ` (${primaryCount} primary)` : ''}` : 'Missing';
    const notesPillLabel = v.notes ? 'On File' : 'Missing';
    const vendorNameSafe = (v.vendor_name || '').replace(/'/g, "\\'");
    const suppliedComponents = componentsByVendor[v.id] || [];

    const nameHtml = canAct
      ? `<span class="pill clickable-pill good" style="font-size:14px;" onclick="event.stopPropagation(); editVendorNameInline('${v.id}')">${v.vendor_name}</span>`
      : `<span style="font-size:14px;">${v.vendor_name}</span>`;
    const typeCell = isComponentSupplier ? 'Component Supplier' : 'Finished-Good Mfr';
    const activeCell = canAct
      ? `<input type="checkbox" id="cat-vendor-active-${v.id}" ${v.is_active ? 'checked' : ''} onchange="saveCatalogVendor('${v.id}')" onclick="event.stopPropagation();" />`
      : (v.is_active ? '<span class="pill good">Active</span>' : '<span class="pill bad">Inactive</span>');
    const componentCountCell = isComponentSupplier ? `${suppliedComponents.length} component${suppliedComponents.length === 1 ? '' : 's'}` : '<span class="muted">—</span>';

    // Collapsed row stays minimal (name, type, active, a count) -- everything else (type select,
    // lead/cadence, contacts, components managed, notes) only appears once expanded, matching
    // Products' "SKU/stock strip on expand" pattern.
    const typeSelectHtml = canAct
      ? `<select id="cat-vendor-type-${v.id}" onchange="saveCatalogVendor('${v.id}')" style="padding:4px 6px; border-radius:6px; border:1px solid var(--border); font-size:13px;">
          <option value="component_supplier" ${isComponentSupplier ? 'selected' : ''}>Component Supplier</option>
          <option value="finished_good_manufacturer" ${!isComponentSupplier ? 'selected' : ''}>Finished-Good Mfr</option>
        </select>`
      : typeCell;
    const leadHtml = canAct
      ? `<span class="pill clickable-pill ${v.default_lead_days ? 'good' : 'watch'}" onclick="showVendorLeadTimeModal('${v.id}')">${v.default_lead_days ? v.default_lead_days + 'd / ' + (v.default_cadence_days || '—') + 'd' : 'Missing'}</span>`
      : `${v.default_lead_days ?? '—'}d lead / ${v.default_cadence_days ?? '—'}d cadence`;
    const contactHtml = canAct
      ? `<span class="pill clickable-pill ${contacts.length ? 'good' : 'watch'}" onclick="showVendorContactsModal('${v.id}', '${vendorNameSafe}')">${contactPillLabel}</span>`
      : (contacts.map(c => c.name).join(', ') || '—');
    const notesHtml = canAct
      ? `<span class="pill clickable-pill ${v.notes ? 'good' : 'watch'}" onclick="showVendorNotesModal('${v.id}', '${vendorNameSafe}')">${notesPillLabel}</span>`
      : (v.notes || '—');
    const componentsManageHtml = isComponentSupplier
      ? (canAct ? `<button class="btn btn-ghost" style="padding:3px 9px; font-size:12px;" onclick="showManageComponentsModal('${v.id}', '${vendorNameSafe}')">Manage Components</button>` : suppliedComponents.map(cv => cv.components?.component_name).filter(Boolean).join(', ') || '—')
      : '<span class="muted">Not a component supplier</span>';

    const nestedHtml = `
      <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; padding:6px 0 10px; border-bottom:1px solid var(--border); margin-bottom:8px;">
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Type</span><br>${typeSelectHtml}</div>
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Lead / Cadence</span><br>${leadHtml}</div>
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Contacts</span><br>${contactHtml}</div>
        <div><span class="muted" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">Notes</span><br>${notesHtml}</div>
      </div>
      <div class="section-label" style="margin:0 0 6px;">Components Supplied</div>
      <div style="font-size:14px;">${componentsManageHtml}</div>
      ${canAct ? `<button class="btn btn-ghost" style="font-size:12px; color:var(--bad-text); margin-top:10px;" onclick="cascadeDeleteVendor('${v.id}', '${vendorNameSafe}')">Delete Vendor</button>` : ''}
    `;

    return `
      <tr id="cv-row-${v.id}" style="cursor:pointer;" onclick="toggleCatalogVendorExpand('${v.id}')">
        <td style="padding:6px 6px; border-bottom:1px solid var(--border);"><span class="muted" id="cv-caret-${v.id}">▸</span></td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);" onclick="event.stopPropagation();">${nameHtml}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${typeCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${activeCell}</td>
        <td style="padding:6px 10px; border-bottom:1px solid var(--border);">${componentCountCell}</td>
      </tr>
      <tr id="cv-detail-${v.id}" style="display:none;"><td colspan="5" style="padding:2px 10px 14px 32px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.015);" onclick="event.stopPropagation();">${nestedHtml}</td></tr>
    `;
  }).join('');

  el.innerHTML = `
    <div class="muted" style="font-size:12px; margin-bottom:6px;">
      Click a name to rename it; click a row to expand lead time, contacts, components, and notes.
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%; font-size:14px; border-collapse:collapse;">
        <thead><tr>
          <th style="padding:6px 6px; width:18px;"></th>
          ${['Name', 'Type', 'Active', 'Components'].map(h => `<th style="padding:6px 10px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="muted" style="padding:10px;">No vendors found.</td></tr>'}</tbody>
      </table>
    </div>
  `;
  openVendorIds.forEach(id => toggleCatalogVendorExpand(id));
}

        <option value="slack">Slack</option>

    if (error) { await showConfirmModal('Something went wrong', 'Create failed: ' + error.message, { okOnly: true, danger: true }); return; }
    await logAction('vendors', data.id, 'create', `Created new vendor ${vendor_name}`, null, data);
    el.remove();
    await renderCatalogVendors();
  };
}
