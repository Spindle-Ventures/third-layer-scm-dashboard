<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Layer · Supply Chain Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #F2EFE9;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --muted: #8C867D;
    --border: #E5E0D8;
    --accent: #5C4A36;
    --accent-light: #8A7257;
    --good-bg: #EAF3EC;
    --good-text: #3F6B35;
    --bad-bg: #F6E8E6;
    --bad-text: #A33B2E;
    --watch-bg: #FBF3E3;
    --watch-text: #96631A;
  }
  * { box-sizing: border-box; }
  /* Alex (2026-11-10, round 3): "The difference in text size, boldness, feel is too choppy
     throughout the dashboard visuals, it should flow better... bold only the data points that
     could drive action/decisions." One documented type scale, used consistently instead of ad-hoc
     per-component sizes:
       - Page title: 32px/600 (h1.title)
       - Modal/dialog title: 17px/700, Playfair Display serif (.detail-modal's first child)
       - Section label (ALL CAPS divider): 13px/700, --muted (.section-label)
       - Table header: 14px/600, --muted (th)
       - Table body / card body text: 14px (td, most card content)
       - KPI tile number: 20px/700 (.kpi-value) -- the size every KPI tile on Overview actually
         renders at; the class itself must match, not be overridden per-tile (that drift IS the
         "choppy" bug -- a class nobody uses at its own declared size isn't a real type scale).
       - Secondary/muted caption text: 12-13px, --muted, normal weight
     Bold (700) is reserved for: KPI tile numbers, table-cell totals/margins that represent a
     real decision input (PC1/PC2/PC3, safety stock, overdue counts), and modal/section titles.
     Bold should NOT be used on body copy, static labels, or numbers that are purely informational
     context (e.g. a vendor's lead time shown inside an already-bold detail block doesn't need a
     second layer of bold) -- if everything is bold, bold stops meaning "pay attention here." */
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Playfair Display', serif; }
  header {
    padding: 18px 40px 0 40px;
  }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
  h1.title { font-size: 32px; font-weight: 600; margin: 2px 0 2px 0; }
  .subtitle { color: var(--muted); font-size: 16px; margin-bottom: 8px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .snapshot-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; color: var(--muted);
  }
  nav.tabs {
    display: flex; gap: 24px; border-bottom: 1px solid var(--border);
    padding: 0 40px; margin-top: 4px;
  }
  nav.tabs button {
    background: none; border: none; font-family: 'Inter'; font-size: 16px; font-weight: 500;
    color: var(--muted); padding: 10px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 16px 44px 40px 44px; max-width: 1800px; margin: 0 auto; }
  .section-label {
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
    margin: 14px 0 6px 0; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px;
  }
  /* Alex (2026-10-27): "needs to be available, accessible, and render well on a mobile device."
     Every table on the dashboard lives inside a .card -- making the card itself horizontally
     scrollable (rather than letting a wide table force the whole PAGE to scroll sideways) is the
     single highest-leverage fix: every existing table gets usable on a narrow screen for free,
     with zero changes to any individual table's markup. */
  .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
  }
  .kpi-card { display: flex; flex-direction: column; gap: 3px; }
  .kpi-label { font-size: 15px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 20px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; width: fit-content;
  }
  .pill.good { background: var(--good-bg); color: var(--good-text); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
  .pill.watch { background: var(--watch-bg); color: var(--watch-text); }
  /* Alex (2026-11-05, three rounds): "increase the font sizes" / "use screen real estate better"
     / "the spacing on the font is also not optimized ... enhance everywhere ... text is enlarged
     and spacing is more completely used" / "fonts and spacing are still bad - fonts/buttons
     should be bigger leaving much less open space" -- round 3 pushes further: base text, labels,
     buttons, and column headers moved up again; section/card margins and padding TIGHTENED
     (rather than widened) so the larger text displaces whitespace instead of adding to it, per
     his explicit "much less open space" framing; main content area widened again
     (1680px->1800px). */
  table { width: 100%; border-collapse: collapse; font-size: 17px; }
  th { text-align: left; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase;
       letter-spacing: 0.04em; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .urgency-badge { font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; letter-spacing: 0.03em; }
  .urgency-CRITICAL { background: var(--bad-bg); color: var(--bad-text); }
  .urgency-WARNING { background: var(--watch-bg); color: var(--watch-text); }
  .urgency-WATCH { background: #EFEAE2; color: var(--accent-light); }
  .urgency-OK { background: var(--good-bg); color: var(--good-text); }
  .btn {
    font-family: 'Inter'; font-size: 15px; font-weight: 600; padding: 9px 16px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    cursor: pointer; color: var(--ink);
  }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #4a3c2c; }
  .btn-ghost:hover { background: #F7F4EE; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: min(360px, 92vw); text-align: center; }
  input[type=email] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'Inter'; font-size: 14px; margin: 14px 0; box-sizing: border-box;
  }
  .muted { color: var(--muted); font-size: 15px; }

  /* Info icon trigger only -- the actual tooltip is a single reusable position:fixed element
     (#global-tooltip, built in JS below) appended to <body>, NOT nested inside this span.
     Alex (2026-10-23): "When I hover over the information on 'Lead Time' the screen cuts off
     some of the text." Root cause: the old nested-absolute tooltip was clipped by
     .detail-modal's own `overflow-y: auto` (an absolutely-positioned descendant is clipped by
     the nearest ancestor with overflow != visible, even though position:absolute normally
     escapes layout) -- position:fixed on <body> escapes that entirely, and JS clamps it to the
     viewport so it can never run off any edge either. */
  .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; background: var(--border);
    color: var(--muted); font-size: 12px; font-style: normal; cursor: help; position: relative;
    flex-shrink: 0;
  }
  #global-tooltip {
    display: none; position: fixed; z-index: 9999;
    width: 320px; max-width: 80vw; background: #2B2622; color: #F4EFE6;
    padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3); text-align: left; font-weight: 400;
  }

  /* Floating Manny chat widget (Alex, 2026-10-22: "a little icon that will travel with you
     whichever tab you're on ... I want it to look and feel like an interaction right on the
     screen"). Fixed position so it survives tab switches -- lives outside #main, inside #app. */
  #manny-chat-fab {
    position: fixed; bottom: 22px; right: 22px; width: 54px; height: 54px; border-radius: 50%;
    background: #E31837; color: #fff; border: 2px solid #FFB612; cursor: pointer; font-size: 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); z-index: 2000; display: flex; align-items: center;
    justify-content: center; transition: transform 0.15s ease; padding: 6px;
  }
  #manny-chat-fab img { width: 100%; height: 100%; object-fit: contain; }
  #manny-chat-fab:hover { transform: scale(1.06); }
  #manny-chat-panel {
    position: fixed; bottom: 86px; right: 22px; width: 340px; max-width: calc(100vw - 32px);
    height: 460px; max-height: calc(100vh - 120px); background: var(--card); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25); z-index: 2000; display: flex; flex-direction: column;
    overflow: hidden;
  }
  #manny-chat-panel.hidden { display: none; }
  #manny-chat-header {
    padding: 12px 14px; background: #2B2622; color: #F4EFE6; display: flex;
    align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #manny-chat-header .btn-ghost:hover { background: rgba(244,239,230,0.18) !important; }
  #manny-chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .manny-chat-bubble { max-width: 85%; padding: 8px 11px; border-radius: 12px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .manny-chat-bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .manny-chat-bubble.manny { align-self: flex-start; background: #F0EBE1; color: #2B2622; border-bottom-left-radius: 3px; }
  #manny-chat-input-row { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
  #manny-chat-input {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px;
    font-family: 'Inter'; resize: none;
  }
  @keyframes manny-chat-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .sparkline-wrap { width: 100%; height: 36px; margin-top: 6px; }
  .hidden { display: none !important; }
  .role-badge { font-size: 12px; color: var(--muted); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .empty-state { color: var(--muted); font-size: 14px; padding: 30px; text-align: center; }
  .clickable-pill { cursor: pointer; }
  .clickable-pill:hover { filter: brightness(0.95); }
  .detail-modal-backdrop {
    position: fixed; inset: 0; background: rgba(44,42,38,0.35); display: flex; align-items: center;
    justify-content: center; z-index: 1000;
  }
  .detail-modal {
    background: var(--card); border-radius: 14px; padding: 20px 24px; max-width: 640px;
    width: min(640px, 92vw);
    max-height: 88vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  /* Alex (2026-11-11): "The vendor contacts due popup screen, the 'why' column has 25+ rows of
     wrapped text... Make the column wider." Root cause, confirmed live in the DOM: this base
     class hardcodes `width: min(640px, 92vw)`, which wins over any inline `max-width` a caller
     sets (width is more specific than max-width when both apply to the same box) -- so EVERY
     'wide' showDetail(...) call (Open Recs, Overdue, Vendor Contacts Due, QC Run, Trend Chart)
     has been silently stuck at 640px this whole time despite requesting 1180px. The colWidths
     fixes from rounds 12-14 were computing correct relative proportions, just squeezed into a
     container 540px narrower than intended. Fixed by also setting `width` (not just max-width)
     inline whenever size === 'wide', so the 1180px cap actually takes effect. */
  .detail-modal.wide {
    width: min(1180px, 92vw);
  }
  /* Collapsible "show the math" sections (Alex, 2026-10-22: "optimize each popup for minimal
     scrolling") -- native <details>/<summary>, zero extra JS, zero height until expanded. */
  .detail-modal details { margin-top: 10px; }
  .detail-modal details summary {
    cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 4px 0; list-style: revert; user-select: none;
  }
  .detail-modal details[open] summary { margin-bottom: 4px; }

  /* Alex (2026-10-27): "needs to be available, accessible, and render well on a mobile device."
     Core responsive pass -- header/nav/spacing collapse at phone widths; tables/modals already
     made overflow-safe above (card overflow-x:auto, detail-modal width:min(...)). */
  @media (max-width: 760px) {
    header { padding: 14px 14px 0 14px; }
    main { padding: 12px 10px 28px 10px; }
    .top-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .top-actions { flex-wrap: wrap; gap: 8px; row-gap: 6px; }
    h1.title { font-size: 21px; }
    nav.tabs {
      padding: 0 10px; gap: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      flex-wrap: nowrap; scrollbar-width: thin;
      /* Alex's screenshot showed "Landed Orde..." cut off at the screen edge with zero hint
         that there's more to scroll to. A fade mask is the standard affordance for a
         horizontally-scrolling nav strip -- makes the cutoff look intentional. */
      mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
    }
    nav.tabs button { white-space: nowrap; padding: 12px 4px; font-size: 15px; } /* bigger tap target + more legible */
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .kpi-card { padding: 4px; } /* the whole tile is clickable (.clickable-pill) -- give it room to be an easy, deliberate tap */
    .kpi-value { font-size: 20px; }
    .kpi-label { font-size: 14px; }

    /* REAL BUG, found from Alex's screenshot (not guessed): #recs-grid is a fixed
       `grid-template-columns: 1fr 1fr` -- CSS Grid tracks don't shrink below a cell's
       min-content width by default, so a dense recommendation card (urgency pill + "Decide"
       button + shortfall text) forced its column wider than the viewport, which looked like a
       half-broken "horizontal scroll" with the second card and its Decide button cut off.
       Fix: stack to a single column on mobile so every card renders at full, uncramped width. */
    #recs-grid { grid-template-columns: 1fr !important; }

    /* The floating Manny chat FAB is position:fixed (always bottom-right of the viewport, not
       the page) -- Alex's screenshot showed it sitting directly over a recommendation card's
       Decide button at his scroll position. Shrinking it + nudging it in reduces how much
       content it can cover without losing the "always reachable" point of the widget. */
    #manny-chat-fab { width: 46px; height: 46px; bottom: 16px; right: 14px; font-size: 18px; }
    table { font-size: 14px; }
    th, td { padding: 9px 10px; }

    /* Alex (2026-10-27): "design the mobile outlook with buttons and text size and actions
       optimized." Every .btn -- including the dense inline-styled ⋯/Decide table-action buttons,
       which set their own padding/font-size inline and so don't inherit a class-level padding
       bump -- gets a real minimum tap target (Apple/Google guidance is ~44px; 40px here balances
       that against not blowing out table row height on a dense Overview table). min-height/
       min-width only, never touching the inline padding/font-size that each button already sets. */
    .btn { min-height: 40px; min-width: 40px; box-sizing: border-box; }

    /* Checkboxes (bulk-select column) are easy to miss at native size on a touchscreen. */
    input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }

    /* Prevent iOS Safari's automatic zoom-on-focus, which fires on any text input rendered
       below 16px -- several inline-edit inputs (ETA date, qty, tracking) set 11-14px explicitly,
       which inline styles would otherwise win over a plain class rule. */
    input, select, textarea { font-size: 16px !important; }

    /* Button rows (Save/Cancel, bulk-action bars, etc.) are mostly `display:flex; gap:8px`
       inline with no wrap -- fine at desktop widths, but two 40px-tall buttons with real labels
       can overflow a 360px-wide modal. Wrap any flex row that directly contains 2+ buttons,
       without having to touch each inline style individually. */
    div:has(> .btn + .btn) { flex-wrap: wrap !important; }

    /* Detail modals become a bottom sheet on mobile -- full width, flush to the bottom edge,
       rounded top corners only. This is a deliberate mobile pattern (not just "doesn't
       overflow"): it puts the Close/primary action within comfortable one-handed thumb reach
       instead of requiring a reach to a small centered box. */
    .detail-modal-backdrop { align-items: flex-end; }
    .detail-modal {
      width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; padding: 18px 16px 24px 16px;
      max-height: 85vh;
    }
  }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="brand">THIRD LAYER</div>
    <h1 class="title" style="font-size:22px;">Supply Chain Manager</h1>
    <p class="muted">Sign in with your @spindle.ventures email — you'll get a magic link, no password needed.</p>
    <input type="email" id="login-email" placeholder="you@spindle.ventures" />
    <button class="btn btn-primary" style="width:100%;" onclick="sendMagicLink()">Send magic link</button>
    <p class="muted" id="login-status" style="margin-top:14px;"></p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="top-row">
    <div>
      <div class="brand">THIRD LAYER</div>
      <h1 class="title serif">Supply Chain Manager</h1>
    </div>
    <div class="top-actions">
      <div class="subtitle" id="subtitle-date" style="margin-right:4px;"></div>
      <span class="role-badge" id="user-badge"></span>
      <span class="snapshot-pill" id="snapshot-pill">Loading…</span>
      <button class="btn btn-ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="revenue">Revenue</button>
    <button class="tab-btn" data-tab="components">Components</button>
    <button class="tab-btn" data-tab="landed">Landed Orders</button>
    <button class="tab-btn" data-tab="catalog">Catalog</button>
    <button class="tab-btn" data-tab="activity">Activity Log</button>
  </nav>
</header>

<main>
  <div id="tab-overview" class="tab-panel"></div>
  <div id="tab-revenue" class="tab-panel hidden"></div>
  <div id="tab-components" class="tab-panel hidden"></div>
  <div id="tab-landed" class="tab-panel hidden"></div>
  <div id="tab-activity" class="tab-panel hidden"></div>
  <div id="tab-catalog" class="tab-panel hidden"></div>
</main>

<!-- Floating Manny chat widget -- lives at the #app level (not inside any tab-panel), so it's
     present and in the same state no matter which tab is active. See renderMannyChat* functions
     and migrations/023_dashboard_chat.sql for the full design. -->
<button id="manny-chat-fab" onclick="toggleMannyChat()" title="Chat with Manny"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Kansas_City_Chiefs_logo.svg" alt="Chat with Manny"></button>
<div id="manny-chat-panel" class="hidden">
  <div id="manny-chat-header">
    <div><strong>Manny</strong><div class="muted" style="font-size:11px; color:#C9BFAF;">Ask about anything on this dashboard</div></div>
    <div style="display:flex; gap:4px; align-items:center;">
      <button class="btn btn-ghost" style="padding:2px 8px; font-size:12px; color:#F4EFE6; background:transparent; border-color:rgba(244,239,230,0.4);" onclick="startNewMannyChat()" title="Archive this conversation and start fresh">New chat</button>
      <button class="btn btn-ghost" style="padding:2px 8px; font-size:14px; color:#F4EFE6; background:transparent; border-color:rgba(244,239,230,0.4);" onclick="toggleMannyChat()">✕</button>
    </div>
  </div>
  <div id="manny-chat-messages"></div>
  <div id="manny-chat-input-row">
    <textarea id="manny-chat-input" rows="1" placeholder="Type a message…" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMannyChatMessage();}"></textarea>
    <button class="btn btn-primary" style="padding:8px 12px; font-size:13px;" onclick="sendMannyChatMessage()">Send</button>
  </div>
</div>
</div>

<script type="module">
  // Loads the unit-tested pure business-logic module (dashboard/lib/revenue-logic.js, 100% test
  // coverage -- see test/revenue-logic.test.js and CHANGELOG.md) and exposes it to the classic
  // (non-module) script below, since inline onclick="..." handlers throughout this file require
  // function names to be on `window`, which ES module bindings are not by default.
  import * as RevenueLogic from './lib/revenue-logic.js';
  window.RevenueLogic = RevenueLogic;
</script>
<script>
// ---- Config: fill in your Supabase project URL + anon (public) key ----
const SUPABASE_URL = "https://rvbferpfrgkayxuujpna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2YmZlcnBmcmdrYXl4dXVqcG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDc2NjUsImV4cCI6MjEwODA4MzY2NX0._UNtJphO40WvJfoDqQ612Vi1Wx78D2S6FVl2-VMt76w";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Alex (2026-11-06): "When I click on percentage of revenue I don't think we need to wait to
// hover over to bring in the values maybe on top of the bars." Registered globally but OFF by
// default (datalabels.display: false in Chart.defaults) so every existing chart is untouched
// unless it explicitly turns labels on per-dataset -- avoids silently cluttering charts Alex
// didn't flag.
if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);
Chart.defaults.set('plugins.datalabels', { display: false });

let currentUserRow = null;

// ---------- Auth ----------
async function sendMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  const statusEl = document.getElementById('login-status');
  if (!email) { statusEl.textContent = 'Enter an email address.'; return; }
  statusEl.textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });

// Alex (2026-10-27): "buttons under each section" -- the daily digest's Landing-section button
// links here as ?tab=overview&highlight=<ledgerId1,ledgerId2,...>, reusing the existing
// scrollToOrderRow() "Take me there" behavior (switches to Overview, clears filters, scrolls +
// briefly highlights). Multiple ids (several orders landing the same day) each get a quick
// highlight flash in sequence so none of them get missed.
function applyUrlDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const highlight = params.get('highlight');
  if (!highlight) return;
  const ids = highlight.split(',').map(s => s.trim()).filter(Boolean);
  if (!ids.length) return;
  // scrollToOrderRow already switches to Overview + clears filters; only need to call it once
  // (for the first id) to land in the right place, then flash the rest in place without re-
  // scrolling away from where the user is looking.
  scrollToOrderRow(ids[0]);
  ids.slice(1).forEach((id, i) => {
    setTimeout(() => {
      const row = document.getElementById('row-' + id);
      if (!row) return;
      row.style.transition = 'background-color 0.3s';
      const prevBg = row.style.backgroundColor;
      row.style.backgroundColor = 'var(--watch-bg)';
      setTimeout(() => { row.style.backgroundColor = prevBg; }, 1800);
    }, (i + 1) * 400);
  });
}

// ---------- Manny chat widget ----------
// Alex (2026-10-22): "a little icon that will travel with you whichever tab you're on ... I want
// it to look and feel like an interaction right on the screen." Real architecture (Manny's only
// internet-reachable endpoint is its own separate admin dashboard, not something this static site
// can call directly): sending a message inserts a row into dashboard_chat_messages; a Postgres
// trigger (migrations/023_dashboard_chat.sql) posts it straight into Slack via an Incoming
// Webhook -- no server of Manny's involved. Manny's replies are written back into the same table
// (by a human reading Slack, via a trusted DB connection that RLS prevents browser clients from
// using) and arrive in the panel live via a Supabase Realtime subscription -- genuinely two-way,
// not just a link out to Slack.
let mannyChatChannel = null;
async function initMannyChat() {
  const { data: history } = await sb.from('dashboard_chat_messages').select('*').eq('archived', false).order('created_at', { ascending: true }).limit(100);
  const el = document.getElementById('manny-chat-messages');
  el.innerHTML = (history && history.length)
    ? history.map(renderMannyChatBubble).join('')
    : `<div class="muted" style="font-size:13px; text-align:center; margin-top:20px;">Ask Manny anything about this dashboard — forecasts, inventory, components, how something's calculated. Your message goes straight to #supplychainbuild in Slack.</div>`;
  el.scrollTop = el.scrollHeight;

  if (mannyChatChannel) sb.removeChannel(mannyChatChannel);
  mannyChatChannel = sb
    .channel('dashboard-chat-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dashboard_chat_messages' }, (payload) => {
      const msgEl = document.getElementById('manny-chat-messages');
      if (!msgEl) return;
      msgEl.insertAdjacentHTML('beforeend', renderMannyChatBubble(payload.new));
      msgEl.scrollTop = msgEl.scrollHeight;
      // If the panel is closed when Manny replies, bounce the icon so it's noticeable.
      if (payload.new.sender === 'manny' && document.getElementById('manny-chat-panel').classList.contains('hidden')) {
        const fab = document.getElementById('manny-chat-fab');
        fab.style.animation = 'none';
        requestAnimationFrame(() => { fab.style.animation = 'manny-chat-bounce 0.6s ease 2'; });
      }
    })
    .subscribe();
}

function renderMannyChatBubble(m) {
  const who = m.sender === 'manny' ? 'Manny' : (m.sender_email ? m.sender_email.split('@')[0] : 'You');
  const text = String(m.message).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `<div class="manny-chat-bubble ${m.sender === 'manny' ? 'manny' : 'user'}"><div style="font-size:11px; opacity:0.65; margin-bottom:2px;">${who}</div>${text}</div>`;
}

function toggleMannyChat() {
  const panel = document.getElementById('manny-chat-panel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    document.getElementById('manny-chat-input').focus();
    const msgEl = document.getElementById('manny-chat-messages');
    msgEl.scrollTop = msgEl.scrollHeight;
  }
}

async function startNewMannyChat() {
  if (!(await showConfirmModal('Start a new conversation?', 'This archives the current chat (it stays in the database, just hidden) and clears Manny\'s memory of it -- the next message starts fresh.', 'Start New'))) return;
  const { error } = await sb.from('dashboard_chat_messages').update({ archived: true }).eq('archived', false);
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  const el = document.getElementById('manny-chat-messages');
  el.innerHTML = `<div class="muted" style="font-size:13px; text-align:center; margin-top:20px;">New conversation started.</div>`;
}

async function sendMannyChatMessage() {
  const input = document.getElementById('manny-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || null;
  const { error } = await sb.from('dashboard_chat_messages').insert({
    sender: 'user', sender_email: currentUserRow?.email || null, message: text,
    context: { tab: activeTab, url: window.location.href },
  });
  input.disabled = false;
  input.focus();
  if (error) {
    const msgEl = document.getElementById('manny-chat-messages');
    msgEl.insertAdjacentHTML('beforeend', `<div class="muted" style="font-size:12px; text-align:center;">Failed to send: ${error.message}</div>`);
  }
  // No optimistic local append here -- the Realtime subscription above renders this exact row
  // (and Manny's eventual reply) the same way, so there's only one code path for the UI, and no
  // risk of a duplicated/mismatched bubble if the insert is slow or fails after all.
}

// ---------- Tabs ----------
// Alex (2026-11-05): "when I click away from any chrome tab and then click back, the dashboard
// shouldn't have to reload the screen." Tested directly: a simulated background/foreground cycle
// fires zero re-renders already (the 2026-10-21 fix -- onAuthStateChange only acts on SIGNED_IN/
// INITIAL_SESSION -- already stops Supabase's periodic TOKEN_REFRESHED from re-triggering
// loadApp()). What remains outside this page's control is Chrome's OWN memory-saving tab
// discard: a background tab left idle long enough (especially with many tabs open) gets fully
// unloaded by the browser and reloads from scratch on return -- that's a real browser reload, not
// a JS bug, and no page-level code can prevent it. The practical mitigation is making an
// unavoidable reload land you back where you were: persist the active tab in sessionStorage (and
// restore it on boot, right before checkSession()) so a forced reload never resets you to
// Overview. Revenue's own scenario/view/filter state already survives reload via the component
// data model it re-derives from the DB (scenario selection isn't yet persisted client-side --
// that's a separate, larger piece of state than tab selection and not what was reported here).
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
    try { sessionStorage.setItem('tl_active_tab', btn.dataset.tab); } catch (e) {}
  });
});
function restoreActiveTab() {
  let saved = null;
  try { saved = sessionStorage.getItem('tl_active_tab'); } catch (e) {}
  if (!saved) return;
  const btn = document.querySelector(`.tab-btn[data-tab="${saved}"]`);
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-' + saved).classList.remove('hidden');
}

function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtMoney2(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y}`;
}
function fmtDateTime(ts) {
  const dt = new Date(ts);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  const time = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${mm}/${dd}/${yyyy} ${time}`;
}
// Prompts the user for a date in MM/DD/YYYY (matching Alex's display-format requirement) and
// converts it to the ISO YYYY-MM-DD format Postgres date columns need internally.
async function promptDateMMDDYYYY(message, currentIso) {
  const input = await showPromptModal(message, null, currentIso || '', 'date');
  if (!input) return null;
  return input;
}
function todayIso() { return new Date().toISOString().slice(0, 10); }
function monthName(isoDate) {
  const [y, m] = isoDate.split('-');
  return new Date(Number(y), Number(m) - 1, 1).toLocaleString('en-US', { month: 'long' });
}

function buildRecommendationNarrative(r) {
  const outlook = r.monthly_outlook || [];
  if (outlook.length === 0) {
    return `${r.shortfall_qty} units projected short by ${fmtDate(r.shortfall_month)}. Place an order by ${fmtDate(r.last_responsible_date)} (lead time ${r.lead_days} days).`;
  }

  const current = r.current_qoh != null ? r.current_qoh.toLocaleString() : 'an unknown number of';
  let sentence = `We currently have ${current} units on hand.`;

  // Any planned receipt between now and the shortfall month, in order.
  const receipts = outlook.filter(m => m.receipts > 0 && m.month <= r.shortfall_month);
  receipts.forEach(rec => {
    sentence += ` We're planning on a receipt of ${rec.receipts.toLocaleString()} units landing by ${fmtDate(rec.month)}.`;
  });

  // Demand for each month up to and including the shortfall month, in plain language.
  const relevantMonths = outlook.filter(m => m.month <= r.shortfall_month);
  if (relevantMonths.length > 0) {
    const demandPhrases = relevantMonths.map(m => `${m.demand.toLocaleString()} in ${monthName(m.month)}`);
    sentence += ` Based on current revenue projections, we expect to sell through ${demandPhrases.join(', ')}.`;
  }

  sentence += ` At that pace, we'll fall ${r.shortfall_qty.toLocaleString()} units below the ${outlook[0].safety_stock ? outlook[0].safety_stock.toLocaleString() : ''} unit safety stock target by ${fmtDate(r.shortfall_month)} unless more is ordered. Recommended: place ${r.recommended_order_qty.toLocaleString()} units by ${fmtDate(r.last_responsible_date)}${r.days_until_deadline < 0 ? ` (already ${-r.days_until_deadline} day(s) overdue)` : ` (${r.days_until_deadline} day(s) from now)`}.`;

  return sentence;
}

// Alex (2026-10-23, round 3): "The reasoning for the recommendation can take up the space next
// to 'Shortfall'." A short, single-line version of the narrative above for the compact card --
// fills the space previously used by the "On hand: N" badge, which is still visible in the full
// popup (click the urgency badge) for anyone who wants it.
function buildRecShortReason(r) {
  if (r.problem_type === 'shortfall' && r.shortfall_qty != null && r.shortfall_month) {
    return `${r.shortfall_qty.toLocaleString()} short by ${fmtDate(r.shortfall_month)}`;
  }
  if (r.problem_type === 'vendor_delay') {
    return r.shortfall_month ? `Vendor delay risks a shortfall by ${fmtDate(r.shortfall_month)}` : 'Vendor delay puts the timeline at risk';
  }
  if (r.problem_type === 'overdue_contact') {
    return 'Vendor check-in is overdue';
  }
  if (r.problem_type === 'safety_stock_review') {
    return 'Safety stock policy due for review';
  }
  return r.shortfall_qty != null ? `${r.shortfall_qty.toLocaleString()} units short` : 'Needs a decision';
}

// Alex (2026-11-10, round 14): "review all popup boxes and optimize spacing for no scrolling
// left or right or up or down." Confirmed with Alex: for popups holding a genuinely long table
// (Activity Log, Overdue Orders, Vendor Contacts Due, Open Recommendations, etc.) the outer
// popup chrome (title, Close button) should NEVER scroll -- only the table/content area gets its
// own internal scrollbar, so the popup itself stays fixed on screen. Previously the whole
// `.detail-modal` (title + body + Close button all together) scrolled as one block whenever the
// table was long enough to exceed 88vh, which visually read as "the whole popup scrolls."
function showDetail(title, body, size) {
  const existing = document.getElementById('detail-modal-backdrop');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const maxWidth = size === 'wide' ? '1180px' : '640px';
  const wideClass = size === 'wide' ? ' wide' : '';
  el.innerHTML = `
    <div class="detail-modal${wideClass}" style="max-width:${maxWidth}; display:flex; flex-direction:column; overflow:hidden;">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px; flex-shrink:0;">${title}</div>
      <div style="font-size:14px; color:var(--ink); line-height:1.5; overflow-y:auto; flex:1; min-height:0;">${body}</div>
      <button class="btn btn-ghost" style="margin-top:16px; flex-shrink:0;" onclick="document.getElementById('detail-modal-backdrop').remove()">Close</button>
    </div>
  `;
  document.body.appendChild(el);
}

// Alex (2026-10-22): "The actions button should pop up the actions popup box right next to the
// icon when clicked and stick there when scrolling." A small action-list popup (Actions menu on
// an order row) reads wrong as a big centered modal -- it should anchor to the exact icon that
// opened it. Uses document-flow `position:absolute` coordinates (not `fixed`), so the menu scrolls
// together with its anchor row rather than staying pinned to one spot on screen while the row
// scrolls away underneath it.
function showAnchoredMenu(anchorEl, itemsHtml) {
  document.getElementById('anchored-menu')?.remove();
  document.getElementById('anchored-menu-backdrop')?.remove();
  const rect = anchorEl.getBoundingClientRect();
  const menuWidth = 190;
  const left = Math.min(rect.left + window.scrollX, document.documentElement.scrollWidth - menuWidth - 12);
  const backdrop = document.createElement('div');
  backdrop.id = 'anchored-menu-backdrop';
  backdrop.style.cssText = 'position:fixed; inset:0; z-index:2500; background:transparent;';
  backdrop.onclick = () => { backdrop.remove(); menu.remove(); };
  const menu = document.createElement('div');
  menu.id = 'anchored-menu';
  menu.className = 'card';
  menu.style.cssText = `position:absolute; top:${rect.bottom + window.scrollY + 4}px; left:${left}px; width:${menuWidth}px; z-index:2501; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,0.22);`;
  menu.innerHTML = itemsHtml;
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);
}
function closeAnchoredMenu() {
  document.getElementById('anchored-menu')?.remove();
  document.getElementById('anchored-menu-backdrop')?.remove();
}

// Styled replacements for window.prompt()/confirm() -- same detail-modal visual language as the
// rest of the dashboard, matching Alex's request (2026-10-21) to drop the browser-chrome dialogs.
function showPromptModal(title, message, defaultValue, inputType) {
  return new Promise(resolve => {
    document.getElementById('detail-modal-backdrop')?.remove();
    const el = document.createElement('div');
    el.id = 'detail-modal-backdrop';
    el.className = 'detail-modal-backdrop';
    const finish = (val) => { el.remove(); resolve(val); };
    el.onclick = (e) => { if (e.target === el) finish(null); };
    const safeDefault = defaultValue != null ? String(defaultValue).replace(/"/g, '&quot;') : '';
    const isTextarea = inputType === 'textarea';
    el.innerHTML = `
      <div class="detail-modal" style="max-width:480px;">
        <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">${title}</div>
        ${message ? `<div style="font-size:14px; color:var(--muted); margin-bottom:10px; line-height:1.4;">${message}</div>` : ''}
        ${isTextarea
          ? `<textarea id="prompt-modal-input" rows="3" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin-bottom:14px; font-family:inherit;">${safeDefault}</textarea>`
          : `<input id="prompt-modal-input" type="${inputType || 'text'}" value="${safeDefault}" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin-bottom:14px;" />`}
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="prompt-modal-ok">OK</button>
          <button class="btn btn-ghost" id="prompt-modal-cancel">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(el);
    const input = document.getElementById('prompt-modal-input');
    input.focus();
    if (input.select) input.select();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isTextarea) { e.preventDefault(); finish(input.value); }
      if (e.key === 'Escape') finish(null);
    });
    document.getElementById('prompt-modal-ok').onclick = () => finish(input.value);
    document.getElementById('prompt-modal-cancel').onclick = () => finish(null);
  });
}

// Info icon + viewport-clamped tooltip (Alex, 2026-10-22: "move the text ... to an information
// icon that pops up when hovered over"; fixed 2026-10-23 for the clipping issue -- see the CSS
// comment on #global-tooltip above for why this moved off pure-CSS). `html` may contain markup.
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}
function infoIcon(html) {
  return `<span class="info-icon" data-tip="${escapeAttr(html)}" onmouseenter="showGlobalTooltip(this)" onmouseleave="hideGlobalTooltip()">ⓘ</span>`;
}
function showGlobalTooltip(iconEl) {
  let tip = document.getElementById('global-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'global-tooltip';
    document.body.appendChild(tip);
  }
  tip.innerHTML = iconEl.dataset.tip || '';
  tip.style.display = 'block';
  tip.style.left = '-9999px'; tip.style.top = '-9999px'; // measure off-screen first
  const iconRect = iconEl.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  const margin = 10;
  let left = iconRect.left;
  if (left + tipRect.width > window.innerWidth - margin) left = window.innerWidth - tipRect.width - margin;
  if (left < margin) left = margin;
  let top = iconRect.bottom + 6;
  if (top + tipRect.height > window.innerHeight - margin) top = iconRect.top - tipRect.height - 6;
  if (top < margin) top = margin;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}
function hideGlobalTooltip() {
  const tip = document.getElementById('global-tooltip');
  if (tip) tip.style.display = 'none';
}

function kpiTable(headers, rows, wrapIdx, colWidths, noWrapCols) {
  if (rows.length === 0) return '<div class="muted">Nothing here right now.</div>';
  const idx = wrapIdx != null ? wrapIdx : headers.length - 1;
  const noWrapSet = new Set(noWrapCols || []);
  const colgroup = colWidths ? `<colgroup>${colWidths.map(w => `<col style="width:${w || 'auto'};">`).join('')}</colgroup>` : '';
  const cellStyle = (ci) => {
    if (noWrapSet.has(ci)) return `padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;`;
    if (colWidths && colWidths[ci]) return `padding:10px 12px; border-bottom:1px solid var(--border); white-space:normal; word-break:break-word;`;
    return `padding:10px 12px; border-bottom:1px solid var(--border); white-space:${ci === idx ? 'normal' : 'nowrap'}; ${ci === idx ? 'min-width:380px;' : ''}`;
  };
  return `
    <table style="width:100%; font-size:15px; border-collapse:collapse; table-layout:${colWidths ? 'fixed' : 'auto'};">
      ${colgroup}
      <thead><tr>${headers.map(h => `<th style="padding:11px 12px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr style="background:${i % 2 === 0 ? 'transparent' : 'rgba(0,0,0,0.02)'};">${r.map((c, ci) => `<td style="${cellStyle(ci)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
}

function showRecsKpiDetail() {

    r.products.display_name,
    `<span class="urgency-badge urgency-${r.urgency}">${r.urgency}</span>`,
    PROBLEM_LABELS[r.problem_type] || r.problem_type,
    r.decision,
  ]);
  // Alex (2026-11-10, round 14): real overflow found live -- "Decision" is open text that can
  // run long (a full recommendation sentence), but with no colWidths every column defaulted to
  // nowrap except the last, so Product/Urgency/Problem forced the table past 640px with no wide
  // text column getting the room it needed. Narrow, fixed-content columns get tight explicit
  // widths; Decision (the one open-text column) gets the rest via null + 'wide' sizing.
  showDetail('Open Recommendations', kpiTable(

function showOverdueKpiDetail() {

    [2, 3]
  ), 'wide');
}

function showContactsKpiDetail() {
  const { contactsDueOrSoon } = window._kpiContext || { contactsDueOrSoon: [] };
  const today = new Date().toISOString().slice(0, 10);
  const rows = contactsDueOrSoon
    .slice()
    .sort((a, b) => (a.next_contact || '').localeCompare(b.next_contact || ''))
    .map(o => {
      const overdue = o.next_contact < today;
      return [
        o.vendor_name || '—',
        `<strong>${o.product_name}</strong>`,
        o.internal_ref || o.vendor_po_number || '<span class="muted">none on file</span>',
        `<strong>${fmtDate(o.eta)}</strong>`,
        `<span class="pill ${overdue ? 'bad' : 'watch'}">${fmtDate(o.next_contact)}</span>`,
        buildActionDetail(o),
        // Alex (2026-10-23): "I don't see the vendor contacts due that shows the message
        // prepped to send to the vendor." -- a dedicated button opening the ready-to-copy
        // outreach text, separate from "Why" (which explains the situation to US).
        `<button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="showVendorMessagePopup('${o.ledger_id}')">Message</button>`,
        `<button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="scrollToOrderRow('${o.ledger_id}')">Take me there</button>`,
      ];
    });
  showDetail('Vendor Contacts Due — next 7 days', kpiTable(
    ['Vendor', 'Product', 'Order #', 'ETA', 'Next Contact', 'Why', '', ''],
    rows, 5,
    ['100px', '130px', '90px', '85px', '105px', null, '95px', '100px'],
    [3, 6, 7]
  ), 'wide');
}

function showQcKpiDetail() {
  const { lastQc } = window._kpiContext || { lastQc: null };
  if (!lastQc) { showDetail('Data Last Updated', 'No QC run has been logged yet.'); return; }
  const checks = lastQc.checks && lastQc.checks.length > 0
    ? lastQc.checks
    : (lastQc.failures || []).map(f => ({ check: f.check, passed: false, detail: f.detail }));
  const rows = checks.map(c => [
    c.check,
    `<span class="pill ${c.passed ? 'good' : 'bad'}">${c.passed ? 'Pass' : 'Fail'}</span>`,
    c.detail || '',
  ]);
  // Alex (2026-11-10, round 14): real overflow found live (912px content in a 625px modal) --
  // "Check" names can be long ("3b. Projection staleness (informational)") and "Detail" is open
  // text that can run to a full paragraph for the adversarial/informational checks. 'wide' +
  // explicit widths, Detail as the one column that gets the rest of the room.
  showDetail(`QC Run — ${fmtDateTime(lastQc.run_at)}`, kpiTable(
    ['Check', 'Result', 'Detail'], rows, 2, ['220px', '80px', null], [1]
  ), 'wide');
}

// ---------- Overview ----------
async function renderOverview() {
  const el = document.getElementById('tab-overview');
  const todayIso = new Date().toISOString().slice(0, 10);
  const monthStartIso = todayIso.slice(0, 7) + '-01';
  const [{ data: recs }, { data: pos }, { data: openOrders }, { data: qcRuns }, { data: invSnapshot }, { data: qohRows }, { data: revActuals }, { data: revForecasts }, { data: allActiveProducts }] = await Promise.all([
    sb.from('agent_recommendations').select('*, products(sku_code, display_name)').neq('decision', 'dismissed').order('days_until_deadline', { ascending: true }),
    sb.from('purchase_orders').select('*').in('status', ['draft', 'pending_approval', 'approved', 'placed', 'in_transit']),
    sb.from('open_orders_by_product').select('*'),
    sb.from('qc_runs').select('*').order('run_at', { ascending: false }).limit(1),
    sb.from('product_inventory_snapshot').select('*, products(sku_code)'),
    sb.from('product_qoh').select('product_id, sku_code, display_name, safety_stock_qty, safety_stock_basis, safety_stock_detail'),
    sb.from('revenue_actuals').select('channel, gross_revenue, revenue_date').gte('revenue_date', monthStartIso).lte('revenue_date', todayIso),
    sb.from('revenue_forecasts').select('channel, forecast_revenue').eq('forecast_month', monthStartIso),
    // Alex (2026-11-03): "Somehow we've lost all progress on the night oil patches - they should
    // be there and treated as a product. We shouldn't have lost that progress." Real root cause,
    // NOT data loss: every inventory_ledger row for TL007 landed or was cancelled, so it has
    // zero rows in open_orders_by_product (that view is open-orders-only, by design) -- the
    // product silently disappeared from Overview's product filter AND its own group, because
    // both were built by iterating `openOrders`, never the actual product list. Fetching every
    // active root product here (not just ones with an open order) lets applyOpenOrdersFilter
    // render a real "no open orders right now" group instead of nothing at all.
    sb.from('products').select('sku_code, display_name').eq('is_active', true).eq('product_type', 'root'),
  ]);

  window._allActiveProductsCache = allActiveProducts || [];


  window._invSnapshotBySku = {};
  (invSnapshot || []).forEach(s => {
    const sku = s.products?.sku_code;
    if (!sku) return;
    if (!window._invSnapshotBySku[sku]) window._invSnapshotBySku[sku] = {};
    window._invSnapshotBySku[sku][s.channel] = s.qty;
  });
  window._safetyStockBySku = {};
  window._safetyStockBasisBySku = {};
  window._safetyStockDetailBySku = {};
  window._productBySku = {};
  (qohRows || []).forEach(r => {
    window._safetyStockBySku[r.sku_code] = r.safety_stock_qty;
    window._safetyStockBasisBySku[r.sku_code] = r.safety_stock_basis;
    window._safetyStockDetailBySku[r.sku_code] = r.safety_stock_detail;
    window._productBySku[r.sku_code] = { product_id: r.product_id, display_name: r.display_name };
  });

  // Revenue MTD vs forecast pace -- same methodology as daily_digest.py's get_revenue_pacing():
  // pro-rate the full-month forecast by days-elapsed-so-far and compare to actual MTD gross
  // revenue. Never fabricates a baseline if no forecast row exists for the current month.
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysElapsed = now.getDate();
  const todayDateStr = now.toISOString().slice(0, 10);
  const revenuePacing = {};
  ['shopify', 'amazon'].forEach(channel => {
    const chanActuals = (revActuals || []).filter(r => r.channel === channel);
    const mtd = chanActuals.reduce((sum, r) => sum + Number(r.gross_revenue || 0), 0);
    const forecastRow = (revForecasts || []).find(r => r.channel === channel);
    if (!forecastRow) {
      revenuePacing[channel] = { mtd, noForecast: true };
      return;
    }
    const forecastFullMonth = Number(forecastRow.forecast_revenue);
    const expectedPace = daysInMonth ? (forecastFullMonth / daysInMonth) * daysElapsed : 0;
    const pctOfGoal = forecastFullMonth > 0 ? (mtd / forecastFullMonth) * 100 : 0;
    const pctOfPace = expectedPace > 0 ? (mtd / expectedPace) * 100 : 0;

    // "How were we pacing yesterday" -- reconstruct the same pctOfPace figure as of yesterday
    // (MTD excluding today's partial day, days-elapsed minus 1), so the two are directly
    // comparable on the same methodology. Day 1 of the month has no meaningful "yesterday"
    // (that's last month's pacing, a different goal entirely), so it's left undefined.
    let pctOfPaceYesterday = null;
    let mtdYesterday = null;
    let expectedPaceYesterday = null;
    if (daysElapsed > 1) {
      mtdYesterday = chanActuals.filter(r => r.revenue_date < todayDateStr).reduce((sum, r) => sum + Number(r.gross_revenue || 0), 0);
      expectedPaceYesterday = (forecastFullMonth / daysInMonth) * (daysElapsed - 1);
      pctOfPaceYesterday = expectedPaceYesterday > 0 ? (mtdYesterday / expectedPaceYesterday) * 100 : null;
    }

    revenuePacing[channel] = { mtd, forecastFullMonth, expectedPace, pctOfGoal, pctOfPace, pctOfPaceYesterday, mtdYesterday, expectedPaceYesterday, daysElapsed, daysInMonth };
  });
  window._revenuePacing = revenuePacing;
  window._revenuePacingMonthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });

  const today = new Date().toISOString().slice(0, 10);
  const in7Days = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);

  const activeRecs = (recs || []).filter(r => r.urgency !== 'OK');
  const criticalCount = activeRecs.filter(r => r.urgency === 'CRITICAL').length;
  const overdueOrders = (openOrders || []).filter(o => o.action_needed === 'Overdue');
  const overdueCount = overdueOrders.length;
  // "Vendor Contacts Due" = overdue contacts + anything coming up in the next 7 days, so Alex can
  // see what communications are coming, not just what's already late.
  const contactsDueOrSoon = (openOrders || []).filter(o => o.order_status !== 'paused' && o.next_contact && o.next_contact <= in7Days);
  const contactDueCount = contactsDueOrSoon.length;
  const lastQc = (qcRuns && qcRuns[0]) || null;
  const needsActionCount = (openOrders || []).filter(o => o.action_needed !== 'On Track').length;

  const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  window._kpiContext = { activeRecs, overdueOrders, contactsDueOrSoon, lastQc };
  const pacingRow = (channel, label) => {
    const p = revenuePacing[channel];
    if (p.noForecast) {
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
          <div style="width:70px; font-size:13px; font-weight:600;">${label}</div>
          <div style="flex:1; font-size:13px;" class="muted">No forecast set for ${monthLabel} — MTD actual ${fmtMoney(p.mtd)}</div>
          <button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="editRevenueForecast('${channel}')">+ Set forecast</button>
        </div>
      `;
    }
    const barColor = p.pctOfPace >= 95 ? 'var(--good-text)' : (p.pctOfPace >= 80 ? 'var(--watch-text)' : 'var(--bad-text)');
    const fillPct = Math.min(100, p.pctOfGoal);
    const paceLabel = p.pctOfPace >= 100 ? `${(p.pctOfPace - 100).toFixed(0)}% ahead of pace` : `${(100 - p.pctOfPace).toFixed(0)}% behind pace`;
    // Day-over-day trend: how pctOfPace moved since yesterday's equivalent snapshot. "—" on day 1
    // of the month, since there's no same-basis "yesterday" to compare against. Made clickable
    // (Alex, 2026-10-22: "more explanatory on the comparison to yesterday") -- the badge itself
    // stays compact, full plain-language explanation lives in showPacingTrendDetail's popup.
    let trendHtml = '<span class="muted" style="font-size:12px;">—</span>';
    if (p.pctOfPaceYesterday != null) {
      const delta = p.pctOfPace - p.pctOfPaceYesterday;
      const trendColor = delta > 0.5 ? 'var(--good-text)' : (delta < -0.5 ? 'var(--bad-text)' : 'var(--text-muted, #8A7257)');
      const arrow = delta > 0.5 ? '▲' : (delta < -0.5 ? '▼' : '▬');
      trendHtml = `<button class="btn btn-ghost clickable-pill" style="padding:2px 6px; font-size:12px; font-weight:700; color:${trendColor}; border-color:transparent; background:transparent;" onclick="showPacingTrendDetail('${channel}')">${arrow} ${Math.abs(delta).toFixed(0)} pt${Math.abs(delta) >= 1.5 ? 's' : ''} vs yesterday</button>`;
    }
    return `
      <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
        <div style="width:70px; font-size:13px; font-weight:600;">${label}</div>
        <div style="position:relative; flex:1; background:var(--border); border-radius:6px; height:24px; overflow:hidden;">
          <div style="position:absolute; inset:0; width:${fillPct}%; background:${barColor}; height:100%; border-radius:6px;"></div>
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:${fillPct < 30 ? 'var(--ink)' : '#fff'}; text-shadow:${fillPct < 30 ? 'none' : '0 1px 3px rgba(0,0,0,0.55)'}; white-space:nowrap; padding:0 6px;">
            ${fmtMoney(p.mtd)} of ${fmtMoney(p.forecastFullMonth)} goal — ${paceLabel}
          </div>
        </div>
        <div style="width:42px; text-align:right; font-size:14px; font-weight:700; color:${barColor};">${p.pctOfGoal.toFixed(0)}%</div>
        <div style="width:120px; text-align:right;">${trendHtml}</div>
        <button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="editRevenueForecast('${channel}')">✎</button>
      </div>
    `;
  };

  el.innerHTML = `
    <div class="card" style="padding:10px 14px; margin-bottom:14px;">
      <div class="section-label" style="margin:0 0 2px;">Revenue Pacing — ${monthLabel}</div>
      ${pacingRow('shopify', 'Shopify')}
      ${pacingRow('amazon', 'Amazon')}
    </div>

    <div class="section-label">At a Glance</div>
    <div class="kpi-grid">
      <div class="card kpi-card clickable-pill" onclick="showRecsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Open Recommendations</div>
          <div class="kpi-value">${activeRecs.length}</div>
        </div>
        <div class="pill ${criticalCount > 0 ? 'bad' : 'good'}">${criticalCount} critical</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showOverdueKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Overdue Orders</div>
          <div class="kpi-value">${overdueCount}</div>
        </div>
        <div class="pill ${overdueCount > 0 ? 'bad' : 'good'}">${overdueCount > 0 ? 'past ETA, not landed' : 'none overdue'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showContactsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Vendor Contacts Due</div>
          <div class="kpi-value">${contactDueCount}</div>
        </div>
        <div class="pill ${contactDueCount > 0 ? 'watch' : 'good'}">${contactDueCount > 0 ? 'due now or within 7 days' : 'none in next 7 days'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showQcKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Data Last Updated</div>
          <div class="kpi-value" style="font-size:14px;">${lastQc ? fmtDateTime(lastQc.run_at) : '—'}</div>
        </div>
        <div class="pill ${lastQc && lastQc.all_clear ? 'good' : 'bad'}">${lastQc ? (lastQc.all_clear ? 'QC: all clear' : 'QC: discrepancy found') : 'no QC run yet'}</div>
      </div>
    </div>

    <div class="section-label">Agentic Recommendations — Validate or Dismiss</div>
    <div id="recs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:18px;"></div>

    <div class="section-label">Open Orders by Product — ${needsActionCount} need attention</div>
    <div class="card" style="padding: 12px 16px; margin-bottom: 10px;">
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:14px; font-weight:500;">Product:
          <select id="filter-product" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All products</option>
          </select>
        </label>
        <label style="font-size:14px; font-weight:500;">Order Type:
          <select id="filter-type" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All types</option>
            <option value="finished_good">Finished Good</option>
            <option value="componentry">Component</option>
          </select>
        </label>
        <label style="font-size:14px; font-weight:500;">Status:
          <select id="filter-order-status" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All</option>
            <option value="committed">Committed</option>
            <option value="paused">Paused</option>
          </select>
        </label>
        <label style="font-size:14px; font-weight:500;">Contact Scheduled For:
          <input type="date" id="filter-contact-date" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:4px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';" />
          <button class="btn btn-ghost" style="padding:3px 8px; font-size:12px; margin-left:4px;" onclick="document.getElementById('filter-contact-date').value=''; applyOpenOrdersFilter();" title="Clear date filter">✕</button>
        </label>
        <button class="btn ${window._needsActionFilter !== false ? 'btn-primary' : 'btn-ghost'}" id="needs-action-toggle-btn" style="padding:5px 10px; font-size:13px;" onclick="toggleNeedsActionFilter()" title="${window._needsActionFilter !== false ? 'Currently filtered to items needing attention' : 'Currently showing every open order'}">⚑ ${window._needsActionFilter !== false ? 'Show All Orders' : 'Show Needs-Attention Only'}</button>
        <button class="btn btn-ghost" id="reveal-order-data-btn" style="padding:5px 10px; font-size:13px;" onclick="toggleRevealOrderData()" title="Show/hide Order # and Tracking values inline">👁 ${window._revealOrderData ? 'Hide' : 'Reveal'} Order # / Tracking</button>
        ${canEdit() ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:13px;" onclick="showAddOrderMenu()">+ Add Order</button>` : ''}
      </div>
    </div>
    <div id="open-orders-groups"></div>
  `;

  window._openOrdersCache = openOrders || [];
  const productSelect = document.getElementById('filter-product');
  // Union of products with an open order AND every active product, so one with zero open orders
  // (e.g. everything landed/cancelled) still appears in the filter instead of silently vanishing.
  const uniqueProductsMap = new Map((openOrders || []).map(o => [o.product_sku, o.product_name]));
  (window._allActiveProductsCache || []).forEach(p => { if (!uniqueProductsMap.has(p.sku_code)) uniqueProductsMap.set(p.sku_code, p.display_name); });
  const uniqueProducts = [...uniqueProductsMap.entries()];
  uniqueProducts.sort((a, b) => productSortRank(a[1]) - productSortRank(b[1]) || a[1].localeCompare(b[1]));
  // Preserve filter selections across re-renders (e.g. after an action) instead of resetting them.
  const prevProduct = window._filterState?.product || 'all';
  const prevType = window._filterState?.type || 'all';
  const prevStatus = window._filterState?.status || 'all';
  const prevContactDate = window._filterState?.contactDate || ''; // default null/empty per Alex's request
  productSelect.innerHTML = '<option value="all">All products</option>' + uniqueProducts.map(([sku, name]) => `<option value="${sku}" ${sku === prevProduct ? 'selected' : ''}>${name} (${sku})</option>`).join('');
  document.getElementById('filter-type').value = prevType;
  document.getElementById('filter-order-status').value = prevStatus;
  document.getElementById('filter-contact-date').value = prevContactDate;
  if (window._needsActionFilter === undefined) window._needsActionFilter = true;

  applyOpenOrdersFilter();

  window._recsCache = recs || [];
  const grid = document.getElementById('recs-grid');
  if (!recs || recs.length === 0) {
    grid.innerHTML = `<div class="card empty-state" style="grid-column: 1 / -1;">No open recommendations — nothing needs a decision today.</div>`;
  } else {
    // Alex (2026-10-23, round 3): "The reasoning for the recommendation can take up the space
    // next to 'Shortfall', the action button should be more intuitive ... The three dots isn't
    // intuitive." Replaced "On hand: N" with the short plain-language reason; replaced "..." with
    // a labeled "Decide" button so it reads as the actionable control, not a generic overflow menu.
    grid.innerHTML = recs.map(r => `
      <div class="card" id="rec-card-${r.id}" style="padding:8px 10px; ${r.is_test ? 'border:2px dashed var(--watch-text);' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1px;">
          <div style="font-size:14px;"><strong>${r.products.display_name}</strong> <span class="muted" style="font-size:12px;">${r.products.sku_code}</span></div>
          <div style="text-align:right; display:flex; align-items:center; gap:5px;">
            ${r.is_test ? '<span class="pill watch" style="font-size:10px;" title="Synthetic data for UI testing only -- not a real finding">⚠ TEST</span>' : ''}
            <span class="urgency-badge urgency-${r.urgency} clickable-pill" title="Click to see what's going on" onclick="showRecommendationDetail('${r.id}')" style="font-size:11px; padding:2px 7px;">${r.urgency}</span>
            ${canEdit() ? `<button type="button" class="btn btn-primary" style="padding:3px 9px; font-size:12px; line-height:1.3; white-space:nowrap;" title="Decide: Pending, Approved, or Dismissed" onclick="showRecActionsMenu('${r.id}', this)">Decide ▾</button>` : ''}
          </div>
        </div>
        <!-- Alex (2026-10-22): "The buttons top right should have a well thought out contextual
             reason presented simply" -- a one-line, plain-language reason for the urgency level,
             right under the badge, so "why is this CRITICAL" is answered at a glance without a
             click-through. Kept as-is per Alex (2026-10-23): "I like the subtext under the status." -->
        <div class="muted" style="font-size:11px; text-align:right; margin-bottom:4px;">${
          r.days_until_deadline < 0
            ? `Past deadline by ${Math.abs(r.days_until_deadline)} day${Math.abs(r.days_until_deadline) === 1 ? '' : 's'}`
            : r.days_until_deadline <= 14
              ? `Only ${r.days_until_deadline} day${r.days_until_deadline === 1 ? '' : 's'} left to decide`
              : `${r.days_until_deadline} days until deadline — time to plan`
        }</div>
        <div style="display:flex; gap:6px; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:nowrap;">
          <span class="pill" style="font-size:12px; padding:2px 8px; flex-shrink:0;">${PROBLEM_LABELS[r.problem_type] || r.problem_type}</span>
          <span class="muted" style="font-size:12px; text-align:right;">${buildRecShortReason(r)}</span>
        </div>
        ${!canEdit() ? `<span class="pill ${r.decision === 'approved' ? 'good' : r.decision === 'dismissed' ? 'bad' : 'watch'}" style="font-size:12px;">${r.decision}</span>` : ''}
      </div>
    `).join('');
  }
}

function canEdit() {
  return currentUserRow && (currentUserRow.role === 'editor' || currentUserRow.role === 'admin');
}
function canDelete() {
  return currentUserRow && currentUserRow.role === 'admin';
}

function applyOpenOrdersFilter() {
  const all = window._openOrdersCache || [];
  const productFilter = document.getElementById('filter-product').value;
  const typeFilter = document.getElementById('filter-type').value;
  const statusFilter = document.getElementById('filter-order-status').value; // per Alex: moved off the table into a filter, like Product/Order Type
  const contactDateFilter = document.getElementById('filter-contact-date').value; // '' = no filter (default null, per Alex's request)
  const onlyAction = window._needsActionFilter !== false;
  window._filterState = { product: productFilter, type: typeFilter, status: statusFilter, contactDate: contactDateFilter };

  const filtered = all.filter(o => {
    if (productFilter !== 'all' && o.product_sku !== productFilter) return false;
    if (typeFilter !== 'all' && o.order_type !== typeFilter) return false;
    if (statusFilter !== 'all' && (statusFilter === 'paused') !== (o.order_status === 'paused')) return false;
    if (contactDateFilter && o.next_contact !== contactDateFilter) return false;
    if (onlyAction && o.action_needed === 'On Track') return false;
    return true;
  });

  const groupsEl = document.getElementById('open-orders-groups');

  const byProduct = new Map();
  filtered.forEach(o => {
    if (!byProduct.has(o.product_sku)) byProduct.set(o.product_sku, { name: o.product_name, rows: [] });
    byProduct.get(o.product_sku).rows.push(o);
  });

  // Alex (2026-11-03): an active product with zero OPEN orders right now (e.g. everything
  // landed/cancelled) still needs its own group -- showing current inventory and an explicit
  // "no open orders" message -- instead of disappearing from the page entirely. Only add these
  // when the product filter and needs-action filter wouldn't already exclude every real order
  // for a DIFFERENT reason (type/status/contact-date filters don't apply to a product with no
  // rows at all, so those are fine to ignore here).
  if (!onlyAction) {
    (window._allActiveProductsCache || []).forEach(p => {
      if (productFilter !== 'all' && p.sku_code !== productFilter) return;
      if (!byProduct.has(p.sku_code)) byProduct.set(p.sku_code, { name: p.display_name, rows: [] });
    });
  }

  if (byProduct.size === 0) {
    groupsEl.innerHTML = `<div class="card empty-state">Nothing matches these filters${onlyAction ? ' — try the "Show All Orders" button' : ''}.</div>`;
    return;
  }


  groupsEl.innerHTML = [...byProduct.entries()].sort((a, b) => productSortRank(a[1].name) - productSortRank(b[1].name) || a[1].name.localeCompare(b[1].name)).map(([sku, group]) => {
    // Alex (2026-11-10): "finished good PO's should be first, then component orders under."
    // Within each product's group, sort finished-good rows ahead of componentry rows (stable
    // otherwise -- doesn't reorder within either group beyond that).
    const sortedRows = group.rows.slice().sort((a, b) => {
      const rank = (o) => (o.order_type === 'componentry' ? 1 : 0);
      return rank(a) - rank(b);
    });
    const inv = (window._invSnapshotBySku || {})[sku] || {};
    const safetyStock = (window._safetyStockBySku || {})[sku];
    const invColor = (qty) => {
      if (qty == null || safetyStock == null) return 'var(--ink)';
      if (qty < safetyStock) return 'var(--bad-text)';
      if (qty < safetyStock * 1.25) return 'var(--watch-text)';
      return 'var(--good-text)';
    };
    const shopifyQty = inv.shopify != null ? inv.shopify.toLocaleString() : '—';
    const amazonQty = inv.amazon != null ? inv.amazon.toLocaleString() : 'not connected';
    const shopifyColor = invColor(inv.shopify);

    return `
    <div class="card" style="padding:0; margin-bottom:10px; overflow-x:auto;">
      <div style="padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; white-space:nowrap; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <div><strong>${group.name}</strong> <span class="muted" style="font-size:13px;">${sku}</span></div>
          <span style="font-size:14px;">Current Inventory — Shopify: <strong style="font-size:15px; color:${shopifyColor};">${shopifyQty}</strong>${safetyStock != null ? ` <span class="pill clickable-pill watch" style="font-size:12px;" onclick="showSafetyStockDetail('${sku}')">safety stock ${safetyStock.toLocaleString()}</span>` : ''}</span>
          <span style="font-size:14px;">Amazon: <strong style="font-size:15px; color:var(--ink);">${amazonQty}</strong></span>
        </div>
        <span class="muted" style="font-size:13px;">${group.rows.length} open order(s)</span>
      </div>
      ${group.rows.length === 0
        ? `<div class="empty-state" style="padding:14px;">No open orders right now — everything has landed or been cancelled. Use "+ Add Order" above to place a new one.</div>`
        : `<table style="white-space:nowrap;">
        <thead><tr><th><input type="checkbox" onchange="toggleSelectAllInGroup(this, '${sku}')" title="Select all in this group" /></th><th></th><th>Order Type</th><th>Component</th><th>Order Health</th><th>ETA</th><th style="${window._revealOrderData ? 'min-width:140px;' : ''}">Order #</th><th>Vendor</th><th>Qty</th><th style="white-space:normal; ${window._revealOrderData ? 'min-width:220px;' : ''}">Tracking</th><th>Contact Schedule</th></tr></thead>
        <tbody>${sortedRows.map(o => renderOpenOrderRow(o)).join('')}</tbody>
      </table>`}
    </div>
  `;
  }).join('');
  renderBulkContactBar();
}

// Alex (2026-10-22): "I want the ability to select multiple rows on the overview tab and update
// the contact schedule." Per-row checkboxes feed a single global selection set so the user can
// pick rows across different product groups, then set one contact date for all of them at once.
window._selectedOrderIds = window._selectedOrderIds || new Set();
function toggleOrderSelect(ledgerId, checked) {

  else window._selectedOrderIds.delete(ledgerId);

}
function toggleSelectAllInGroup(headerCheckbox, sku) {
  const rows = (window._openOrdersCache || []).filter(o => o.product_sku === sku);
  rows.forEach(o => {
    if (headerCheckbox.checked) window._selectedOrderIds.add(o.ledger_id);
