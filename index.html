// ---------- Revenue (scenario modeling) ----------
function monthKey(d) { return d.toISOString().slice(0, 7); }
function monthLabelShort(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'short', year: '2-digit' }); }
// Alex (2026-11-06): "I also need to see more clearly 'actuals' vs 'projected' when talking
// about the current month." The current month is the one case where a single column is a BLEND
// (actual-so-far + assumption for the rest, per channelMonthBasis) rather than purely one or the
// other -- flagging it directly in the header, instead of only inside each cell's hover/click
// detail, makes that blended nature visible without having to click anything.
function monthLabelShortWithCurrentFlag(key) {
  const currentKey = new Date().toISOString().slice(0, 7);
  const label = monthLabelShort(key);
  return key === currentKey ? `${label}<br><span style="font-size:10px; font-weight:600; color:var(--accent-light);">actual + proj.</span>` : label;
}
function monthLabelLong(key) { return new Date(key + '-02').toLocaleString('en-US', { month: 'long', year: 'numeric' }); }
function nextSixMonths() {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < 6; i++) { out.push(monthKey(d)); d.setMonth(d.getMonth() + 1); }
  return out;
}

// Alex (2026-11-05): "pull in columns for last x number of months up to 6 months to look at
// trends myself." The N real calendar months immediately BEFORE the current (first forecast)
// month, oldest-first, so they read left-to-right into the existing forward months.
function priorMonths(n) {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < n; i++) { d.setMonth(d.getMonth() - 1); out.unshift(monthKey(d)); }
  return out;
}

async function renderRevenue() {
  const el = document.getElementById('tab-revenue');
  el.innerHTML = `<div class="card empty-state">Loading revenue data…</div>`;

  const todayIso = new Date().toISOString().slice(0, 10);
  // Alex (2026-11-06): "You should also have data back 12 months for the core 3 products so
  // going back 6 months shouldn't be an issue for most." The UI's trailing-history selector caps
  // at 6 months, but the fetch window was only pulling 5 months back -- widened to 12 so every
  // selector option (including a future "12 mo" option) has real data behind it for every
  // product with that much history (verified: TL001/TL002/TL003/TL004/TL005/TL006/TL007 each
  // have 14 real months in historical_revenue_pct going back to Oct 2025; TL-010 has 13).
  const histStartIso = (() => { const d = new Date(); d.setMonth(d.getMonth() - 12); d.setDate(1); return d.toISOString().slice(0, 10); })();
  const months = nextSixMonths();

  const [{ data: products }, { data: revActuals }, { data: revForecasts }, { data: forecastParams }, { data: openOrders }, { data: scenarios }, { data: vendors }, { data: componentQoh }, { data: activeRecs }, { data: invSnapshot }, { data: committedScenarioPOs }, { data: historicalPct }, { data: manualAdj }] = await Promise.all([
    sb.from('product_qoh').select('*'),
    sb.from('revenue_actuals').select('channel, gross_revenue, shipping_revenue, revenue_date').gte('revenue_date', histStartIso),
    sb.from('revenue_forecasts').select('channel, forecast_month, forecast_revenue').gte('forecast_month', months[0] + '-01'),
    sb.from('forecast_params').select('channel, revenue_pct, avg_selling_price, revenue_pct_rationale, asp_rationale, product_id, products(sku_code, display_name)').eq('is_active', true),
    sb.from('open_orders_by_product').select('product_sku, qty, eta, order_type').not('eta', 'is', null).eq('order_type', 'finished_good'),
    sb.from('revenue_scenarios').select('*').order('created_at', { ascending: false }),
    sb.from('vendors').select('*').eq('is_active', true).order('vendor_name'),
    sb.from('component_qoh').select('*'),
    sb.from('agent_recommendations').select('product_id, urgency, shortfall_month, shortfall_qty, last_responsible_date, recommended_order_qty, problem_type, decision').eq('is_test', false),
    sb.from('product_inventory_snapshot').select('channel, qty, products(sku_code)').eq('channel', 'shopify'),
    sb.from('purchase_orders').select('*, vendors(vendor_name, default_lead_days), products(sku_code, display_name), revenue_scenarios(name)').not('source_scenario_id', 'is', null).order('created_at', { ascending: false }),
    sb.from('historical_revenue_pct').select('product_id, channel, month, gross_sales, total_sales, net_items_sold').gte('month', histStartIso).eq('channel', 'shopify'),
    sb.from('manual_throughput_adjustments').select('*'),
  ]);

  // Shopify's live inventory API is the canonical source of truth for finished-good QOH (same
  // rule demand_engine.py and the Overview tab follow, per Alex's 2026-10-20 decision) --
  // product_qoh.qty_on_hand only reflects inventory_ledger rows, which several live Shopify SKUs
  // (e.g. Day Spray, Night Oil 50ml) never had an opening-balance entry for and would otherwise
  // read as a false 0. Override qty_on_hand with the live snapshot wherever one exists; fall back
  // to the ledger-derived value only for products not yet live in Shopify (e.g. unlaunched
  // deodorant SKUs), which have no snapshot row at all.
  const liveQtyBySku = {};
  (invSnapshot || []).forEach(s => {
    const sku = s.products?.sku_code;
    if (sku) liveQtyBySku[sku] = s.qty;
  });
  const productsWithLiveQty = (products || []).map(p =>
    liveQtyBySku[p.sku_code] != null ? { ...p, qty_on_hand: liveQtyBySku[p.sku_code] } : p
  );

  const monthlyActual = {};
  let shopifyGrossTrailing = 0, shopifyShippingTrailing = 0;
  (revActuals || []).forEach(r => {
    const m = r.revenue_date.slice(0, 7);
    if (!monthlyActual[m]) monthlyActual[m] = { shopify: 0, amazon: 0 };
    monthlyActual[m][r.channel] = (monthlyActual[m][r.channel] || 0) + Number(r.gross_revenue || 0);
    if (r.channel === 'shopify') {
      shopifyGrossTrailing += Number(r.gross_revenue || 0);
      shopifyShippingTrailing += Number(r.shipping_revenue || 0);
    }
  });
  // Alex (2026-10-22): "Why in the % of Revenue aren't the percentages equal to 100%? Is it due
  // to shipping as a % of revenue?" -- yes, almost entirely. forecast_params.revenue_pct is each
  // product's share of TOTAL (gross) Shopify revenue, same basis as the source spreadsheet, and
  // gross revenue includes shipping -- which isn't attributed to any product line. So the SKUs'
  // percentages summing to ~92% rather than 100% is expected, not a data error; the gap is the
  // trailing-6-month actual shipping share. Surfaced on the Total row instead of silently
  // flagging it red. Amazon has no separate shipping line in the ledger (already gross-only), so
  // its gap is just rounding and is held to a tighter tolerance.
  const shippingShareByChannel = {
    shopify: window.RevenueLogic.computeShippingShare(shopifyGrossTrailing, shopifyShippingTrailing),
    amazon: 0,
  };
  // Historical ASP, from real Shopify order data (not an assumption) -- Alex (2026-10-22): "you
  // should have historical information to drive average selling price projections and put
  // context into the pop up box." Alex (2026-10-22, data-confidence follow-up): "The metric in our
  // source sheet takes total sales divided by net units sold. The database uses gross sales
  // divided by net units sold ... I'd like to convert to use total sales." ASP now reads
  // total_sales (net_sales + shipping + taxes -- Shopify's "what the customer actually paid"
  // figure), matching the source sheet's methodology; verified against live ShopifyQL data,
  // gross-based ASP ran 12-20% high across every SKU vs. total-sales-based. gross_sales is still
  // used separately for the revenue-mix-% calculation below, which Alex did not ask to change.
  const historicalAspByProduct = {}; // product_id -> [{month, asp, units}] oldest..newest, Shopify only
  (historicalPct || []).forEach(h => {
    if (!h.net_items_sold || h.total_sales == null) return;
    if (!historicalAspByProduct[h.product_id]) historicalAspByProduct[h.product_id] = [];
    historicalAspByProduct[h.product_id].push({ month: h.month.slice(0, 7), asp: Number(h.total_sales) / Number(h.net_items_sold), units: h.net_items_sold });
  });
  Object.values(historicalAspByProduct).forEach(arr => arr.sort((a, b) => a.month.localeCompare(b.month)));
  // Alex (2026-11-05): "based on historical data/trends" for the % of Revenue popup too, same
  // ask as ASP got on 2026-10-22. This product's share of TOTAL gross Shopify revenue for that
  // real month (gross_sales / monthlyActual[m].shopify) -- same basis as forecast_params.revenue_pct
  // (see the shippingShareByChannel note above), so it's directly comparable to the projected %.
  const historicalPctByProduct = {}; // product_id -> [{month, pct}] oldest..newest, Shopify only
  (historicalPct || []).forEach(h => {
    if (h.gross_sales == null) return;
    const channelTotal = monthlyActual[h.month.slice(0, 7)]?.shopify;
    if (!channelTotal) return;
    if (!historicalPctByProduct[h.product_id]) historicalPctByProduct[h.product_id] = [];
    historicalPctByProduct[h.product_id].push({ month: h.month.slice(0, 7), pct: Number(h.gross_sales) / channelTotal });
  });
  Object.values(historicalPctByProduct).forEach(arr => arr.sort((a, b) => a.month.localeCompare(b.month)));
  const liveForecast = {};
  (revForecasts || []).forEach(r => {
    const m = r.forecast_month.slice(0, 7);
    if (!liveForecast[m]) liveForecast[m] = {};
    liveForecast[m][r.channel] = Number(r.forecast_revenue);
  });
  const liveMix = { shopify: {}, amazon: {} };
  (forecastParams || []).forEach(fp => {
    liveMix[fp.channel] = liveMix[fp.channel] || {};
    liveMix[fp.channel][fp.product_id] = { revenue_pct: Number(fp.revenue_pct), avg_selling_price: Number(fp.avg_selling_price), revenue_pct_rationale: fp.revenue_pct_rationale || null, asp_rationale: fp.asp_rationale || null };
  });
  // Real receipts for the Inventory Outlook -- FINISHED GOOD production runs only. Alex
  // (2026-10-22): flagged "Night Oil 415ml showing 132k landing" and "46k of Armpit Mud in
  // January" as entirely incorrect, with no real POs placed/in the works for 2027. Root cause:
  // open_orders_by_product mixes finished-good production runs AND raw COMPONENT orders (bottles,
  // lids, jars, corks -- which still need to go through production before becoming finished
  // units) in one view with an order_type column, and this fetch was pulling ALL rows regardless
  // of type. Verified against live data: Armpit Mud's "46k" was exactly 23,000 (Black Lid
  // component order) + 23,000 (Glass Jar component order) for the SAME finished-good PO, with
  // ZERO real finished-good quantity -- confirming Alex's "no real 2027 POs" claim for that
  // product. Night Oil's "132k" was 55,000 (bottle) + 55,000 (cork) + the one real 22,000
  // finished-good run. Now filtered server-side to order_type='finished_good' in the fetch above.
  const receipts = {}; // { product_sku: { month: qty } }, finished-good only
  (openOrders || []).forEach(o => {
    const m = o.eta.slice(0, 7);
    if (!receipts[o.product_sku]) receipts[o.product_sku] = {};
    receipts[o.product_sku][m] = (receipts[o.product_sku][m] || 0) + (o.qty || 0);
  });

  // Alex (2026-10-22): "I need to be able to manually account for [holiday-box throughput]...
  // currently the only way I could in the system is to raise the revenue targets." Shaped as
  // [product_id][month] -> additional_units for computeProjection's manualAdjustments param.
  const manualThroughputAdjustments = {};
  (manualAdj || []).forEach(a => {
    const m = a.month.slice(0, 7);
    if (!manualThroughputAdjustments[a.product_id]) manualThroughputAdjustments[a.product_id] = {};
    manualThroughputAdjustments[a.product_id][m] = a.additional_units;
  });

  window._revState = {
    products: productsWithLiveQty || [], monthlyActual, liveForecast, liveMix, receipts, months,
    scenarios: scenarios || [], selectedScenarioId: window._revState?.selectedScenarioId || 'live',
    draftChannel: null, draftMix: null,
    vendors: vendors || [], componentQoh: componentQoh || [],
    // activeRecFullByProduct/activeRecByProduct: ACTIVE (non-dismissed) only -- drives urgency
    // sort/pills and the "engine disagrees" flag. anyRecFullByProduct: every rec regardless of
    // decision, including dismissed -- so the Status popup can always show "the real engine found
    // this, here's what happened to it" rather than silently hiding a dismissed finding (Alex,
    // 2026-10-22: "why doesn't it show up in the Product Mix Inventory outlook as an issue").
    activeRecByProduct: Object.fromEntries((activeRecs || []).filter(r => r.decision !== 'dismissed').map(r => [r.product_id, r.urgency])),
    activeRecFullByProduct: Object.fromEntries((activeRecs || []).filter(r => r.decision !== 'dismissed').map(r => [r.product_id, r])),
    anyRecFullByProduct: Object.fromEntries((activeRecs || []).map(r => [r.product_id, r])),
    draftPOs: [],
    committedScenarioPOs: committedScenarioPOs || [],
    shippingShareByChannel, historicalAspByProduct, historicalPctByProduct,
    manualThroughputAdjustments, manualThroughputAdjustmentsRaw: manualAdj || [],
    showHistory: window._revState?.showHistory || 0, // 2026-11-05: 0/3/6 trailing months shown alongside the mix table
  };

  await selectRevenueScenario(window._revState.selectedScenarioId, true);
}

async function selectRevenueScenario(scenarioId, skipFetch) {
  const S = window._revState;
  S.selectedScenarioId = scenarioId;

  if (scenarioId === 'live') {
    S.draftPOs = [];
    S.draftChannel = {};
    S.months.forEach(m => { S.draftChannel[m] = { shopify: S.liveForecast[m]?.shopify ?? null, amazon: S.liveForecast[m]?.amazon ?? null }; });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        if (!base) return;
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => { S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price, revenue_pct_rationale: base.revenue_pct_rationale || null, asp_rationale: base.asp_rationale || null }; });
      });
    });
  } else if (!skipFetch || !S.draftChannel) {
    const [{ data: chanRows }, { data: mixRows }, { data: poRows }] = await Promise.all([
      sb.from('revenue_scenario_channel').select('*').eq('scenario_id', scenarioId),
      sb.from('revenue_scenario_mix').select('*').eq('scenario_id', scenarioId),
      sb.from('revenue_scenario_po').select('*').eq('scenario_id', scenarioId).order('eta_month'),
    ]);
    S.draftPOs = poRows || [];
    S.draftChannel = {};
    S.months.forEach(m => {
      const shopRow = (chanRows || []).find(r => r.channel === 'shopify' && r.forecast_month.slice(0, 7) === m);
      const amzRow = (chanRows || []).find(r => r.channel === 'amazon' && r.forecast_month.slice(0, 7) === m);
      S.draftChannel[m] = {
        shopify: shopRow ? Number(shopRow.forecast_revenue) : (S.liveForecast[m]?.shopify ?? null),
        amazon: amzRow ? Number(amzRow.forecast_revenue) : (S.liveForecast[m]?.amazon ?? null),
      };
    });
    S.draftMix = { shopify: {}, amazon: {} };
    ['shopify', 'amazon'].forEach(ch => {
      S.products.forEach(p => {
        const base = S.liveMix[ch]?.[p.product_id];
        S.draftMix[ch][p.product_id] = {};
        S.months.forEach(m => {
          const row = (mixRows || []).find(r => r.channel === ch && r.product_id === p.product_id && r.forecast_month.slice(0, 7) === m);
          if (row) S.draftMix[ch][p.product_id][m] = { revenue_pct: Number(row.revenue_pct), avg_selling_price: Number(row.avg_selling_price), revenue_pct_rationale: row.revenue_pct_rationale || null, asp_rationale: row.asp_rationale || null };
          else if (base) S.draftMix[ch][p.product_id][m] = { revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price, revenue_pct_rationale: base.revenue_pct_rationale || null, asp_rationale: base.asp_rationale || null };
        });
      });
    });
  }
  renderRevenueBody();
}

function currentScenario() {
  const S = window._revState;
  if (S.selectedScenarioId === 'live') return null;
  return S.scenarios.find(s => s.id === S.selectedScenarioId);
}

function isEditable() {
  const sc = currentScenario();
  return canEdit() && sc && sc.status === 'draft';
}

function canEditChannel() {
  const S = window._revState;
  return canEdit() && (S.selectedScenarioId === 'live' || isEditable());
}

async function createRevenueScenario() {
  if (!canEdit()) return;
  const name = await showPromptModal('New Scenario', 'e.g. "Holiday push", "Conservative Q1"', '');
  if (!name) return;
  const { data, error } = await sb.from('revenue_scenarios').insert({ name, status: 'draft', created_by: currentUserRow?.email || 'dashboard' }).select().single();
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  // Seed from the live numbers currently in window._revState so it starts as an exact copy.
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ scenario_id: data.id, channel: ch, forecast_month: m + '-01', forecast_revenue: val });
  }));
  if (chanRows.length) await sb.from('revenue_scenario_channel').insert(chanRows);
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    const base = S.liveMix[ch]?.[p.product_id];
    if (!base) return;
    S.months.forEach(m => mixRows.push({ scenario_id: data.id, product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: base.revenue_pct, avg_selling_price: base.avg_selling_price }));
  }));
  if (mixRows.length) await sb.from('revenue_scenario_mix').insert(mixRows);
  S.scenarios.unshift(data);
  await selectRevenueScenario(data.id);
}

async function deleteRevenueScenario(scenarioId) {
  if (!(await showConfirmModal('Delete this draft scenario?', 'This cannot be undone.', 'Delete'))) return;
  const { error } = await sb.from('revenue_scenarios').delete().eq('id', scenarioId);
  if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
  window._revState.scenarios = window._revState.scenarios.filter(s => s.id !== scenarioId);
  await selectRevenueScenario('live');
}

async function commitRevenueScenario() {
  const sc = currentScenario();
  if (!sc) return;
  if (!(await showConfirmModal(`Commit "${sc.name}" as the live forecast?`, 'This will update revenue_forecasts and the monthly product-mix assumptions that drive PO/component recommendations. Changes take full effect on the next pipeline run.', 'Commit'))) return;
  const S = window._revState;
  const chanRows = [];
  S.months.forEach(m => ['shopify', 'amazon'].forEach(ch => {
    const val = S.draftChannel?.[m]?.[ch];
    if (val != null) chanRows.push({ channel: ch, forecast_month: m + '-01', forecast_revenue: val, created_by: currentUserRow?.email || 'dashboard' });
  }));
  const mixRows = [];
  ['shopify', 'amazon'].forEach(ch => S.products.forEach(p => {
    S.months.forEach(m => {
      const v = S.draftMix[ch][p.product_id]?.[m];
      if (v) mixRows.push({ product_id: p.product_id, channel: ch, forecast_month: m + '-01', revenue_pct: v.revenue_pct, avg_selling_price: v.avg_selling_price, revenue_pct_rationale: v.revenue_pct_rationale || null, asp_rationale: v.asp_rationale || null, source_scenario_id: sc.id, committed_at: new Date().toISOString() });
    });
  }));
  const [{ error: e1 }, { error: e2 }, { error: e3 }] = await Promise.all([
    chanRows.length ? sb.from('revenue_forecasts').upsert(chanRows, { onConflict: 'channel,forecast_month' }) : Promise.resolve({ error: null }),
    mixRows.length ? sb.from('forecast_params_monthly').upsert(mixRows, { onConflict: 'product_id,channel,forecast_month' }) : Promise.resolve({ error: null }),
    sb.from('revenue_scenarios').update({ status: 'committed', committed_at: new Date().toISOString() }).eq('id', sc.id),
  ]);
  if (e1 || e2 || e3) { await showConfirmModal('Something went wrong', 'Commit failed: ' + (e1 || e2 || e3).message, { okOnly: true, danger: true }); return; }

  // Materialize any draft POs modeled in this scenario into real purchase_orders +
  // inventory_ledger rows (landed=false, scheduled production_run) -- per Alex's explicit choice
  // (2026-10-22): draft POs commit together with the scenario they were modeled against, becoming
  // real open orders the Overview tab / demand engine pick up from here on.
  let poMaterializeError = null;
  for (const po of (S.draftPOs || [])) {
    const product = S.products.find(pr => pr.product_id === po.product_id);
    const internalRef = `SCEN-${sc.id.slice(0, 8)}-${(product?.sku_code || po.product_id).toString().slice(0, 12)}-${po.eta_month}`;
    const { data: poRow, error: poErr } = await sb.from('purchase_orders').insert({
      internal_ref: internalRef, vendor_id: po.vendor_id, product_id: po.product_id,
      qty_ordered: po.qty, status: 'draft', eta_date: po.eta_month, source_scenario_id: sc.id,
      notes: `Created from Revenue tab scenario "${sc.name}" (committed ${new Date().toISOString().slice(0, 10)}).${po.notes ? ' ' + po.notes : ''}`,
      created_by: currentUserRow?.email || 'dashboard',
    }).select().single();
    if (poErr) { poMaterializeError = poErr; continue; }
    const { error: ledgerErr } = await sb.from('inventory_ledger').insert({
      event_date: po.eta_month, event_type: 'production_run', product_id: po.product_id,
      vendor_id: po.vendor_id, po_id: poRow.id, qty_in: po.qty, landed: false, eta: po.eta_month,
      notes: `Scheduled via Revenue tab scenario "${sc.name}".`,
      created_by: currentUserRow?.email || 'dashboard',
    });
    if (ledgerErr) poMaterializeError = ledgerErr;
  }
  if (poMaterializeError) {
    await showConfirmModal('Something went wrong', `Scenario committed, but one or more draft POs failed to materialize into real purchase orders: ${poMaterializeError.message}. Check the Purchase Orders / Overview tabs and re-create them manually if needed.`, { okOnly: true, danger: true });
  }

  await showConfirmModal('Notice', `"${sc.name}" is now the live forecast${S.draftPOs?.length ? `, and ${S.draftPOs.length} draft PO(s) are now real (status: draft) purchase orders` : ''}. Overview-tab recommendations and inventory projections will reflect it after the next daily pipeline run.`, { okOnly: true });
  await renderRevenue();
  await renderOverview();
}

async function editDraftChannelMonth(channel, month) {
  if (!canEditChannel()) { await showConfirmModal('Not allowed', 'You do not have permission to edit forecast numbers.', { okOnly: true }); return; }
  const S = window._revState;
  const isLive = S.selectedScenarioId === 'live';
  const current = S.draftChannel[month]?.[channel];
  const input = await showPromptModal(`${channel === 'shopify' ? 'Shopify' : 'Amazon'} Forecast`, `${isLive ? 'Live forecast' : 'Scenario forecast'} for ${monthLabelLong(month)} ($)`, current ?? '', 'number');
  if (input === null) return;
  const val = Number(String(input).replace(/[^0-9.]/g, ''));
  if (!val || val <= 0) { await showConfirmModal('Check your input', 'Enter a positive number.', { okOnly: true }); return; }
  S.draftChannel[month][channel] = val;
  const label = `${channel === 'shopify' ? 'Shopify' : 'Amazon'} forecast, ${monthLabelShort(month)}`;
  if (isLive) {
    S.liveForecast[month] = { ...(S.liveForecast[month] || {}), [channel]: val };
    const { data: before } = await sb.from('revenue_forecasts').select('*').eq('channel', channel).eq('forecast_month', month + '-01').maybeSingle();
    const { data: after, error } = await sb.from('revenue_forecasts').upsert(
      { channel, forecast_month: month + '-01', forecast_revenue: val, created_by: currentUserRow?.email || 'dashboard' },
      { onConflict: 'channel,forecast_month' }
    ).select().single();
    if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
    await logAction('revenue_forecasts', after.id, before ? 'update' : 'create', `Edited ${label} (live): ${before ? fmtMoney(before.forecast_revenue) : '—'} → ${fmtMoney(val)}`, before, after);
    renderOverview();
  } else {
    const { data: before } = await sb.from('revenue_scenario_channel').select('*').eq('scenario_id', S.selectedScenarioId).eq('channel', channel).eq('forecast_month', month + '-01').maybeSingle();
    const { data: after } = await sb.from('revenue_scenario_channel').upsert(
      { scenario_id: S.selectedScenarioId, channel, forecast_month: month + '-01', forecast_revenue: val },
      { onConflict: 'scenario_id,channel,forecast_month' }
    ).select().single();
    if (after) await logAction('revenue_scenario_channel', after.id, before ? 'update' : 'create', `Edited ${label} (${currentScenario()?.name}): ${before ? fmtMoney(before.forecast_revenue) : '—'} → ${fmtMoney(val)}`, before, after);
  }
  renderRevenueBody();
}

function showMixCellDetail(view, channel, productId, month) {

  const p = S.products.find(pr => pr.product_id === productId);
  const cur = S.draftMix[channel][productId]?.[month] || {};
  const editable = isEditable();
  const isPct = view === 'pct';
  const valueLine = isPct ? `${((cur.revenue_pct || 0) * 100).toFixed(1)}% of ${channel === 'shopify' ? 'Shopify' : 'Amazon'} revenue` : fmtMoney2(cur.avg_selling_price || 0);
  const rationale = isPct ? cur.revenue_pct_rationale : cur.asp_rationale;

  if (!isPct) {
    // Alex (2026-11-05, two rounds): first "I still don't like the average selling price visual
    // ... I don't understand it" (dropped the comparison chart/sentence -- done). Then "I also
    // like the average selling price pop up, but is the first text the calculated average? Make
    // it more clear and return a recommended average selling price and the actual selling price
    // with an expandable and contractable drop down." Answer to his question: no -- that number
    // was always the PROJECTED/ASSUMED ASP for this month (the draft scenario's input value),
    // never a calculated average of anything -- which is exactly the confusion. Now explicitly
    // labeled as such, with two new real numbers surfaced plainly: "Recommended ASP" (trailing
    // 3-month actual average, same horizon generate_month_end_scenario.py uses) and "Most recent
    // actual ASP" (last real month, Shopify). Full monthly history moved into a <details>
    // dropdown (same native expand/collapse pattern already used elsewhere in this file) instead
    // of always being shown.
    // Alex (2026-11-06): "The ASP pop up clarity is better - let's simplify even further."
    // Cut the paragraph-of-text rationale entirely -- the two labeled number blocks (Projected,
    // Recommended, Most Recent Actual) already say everything that paragraph was saying in
    // prose, so keeping both was the redundancy. Down to: one plain "Projected ASP" line, the
    // two real-number blocks, the collapsed history, and Edit.
    const history = channel === 'shopify' ? (S.historicalAspByProduct[productId] || []) : [];
    const last3 = history.length ? history.slice(-3).reduce((s, h) => s + h.asp, 0) / Math.min(3, history.length) : null;
    const lastActual = history.length ? history[history.length - 1] : null;
    const recommendedBlock = (last3 != null || lastActual) ? `
      <div style="display:flex; gap:18px; flex-wrap:wrap; margin:10px 0; padding:10px; background:#F7F4EE; border-radius:8px;">
        ${last3 != null ? `<div><div class="muted" style="font-size:12px;">Recommended (3-mo avg)</div><div style="font-size:19px; font-weight:700;">${fmtMoney2(last3)}</div></div>` : ''}
        ${lastActual ? `<div><div class="muted" style="font-size:12px;">Actual (${monthLabelShort(lastActual.month)})</div><div style="font-size:19px; font-weight:700;">${fmtMoney2(lastActual.asp)}</div></div>` : ''}
      </div>
    ` : `<div class="muted" style="font-size:13px; margin:8px 0;">No historical actual-ASP data${channel === 'amazon' ? ' for Amazon yet' : ' yet'}.</div>`;
    const historyBlock = history.length ? `
      <details style="margin-top:4px;">
        <summary>Monthly history (${history.length} mo)</summary>
        <table style="width:100%; font-size:14px; border-collapse:collapse; margin-top:6px;">
          ${history.map(h => `<tr><td style="padding:3px 6px;">${monthLabelShort(h.month)}</td><td style="padding:3px 6px; text-align:right;">${fmtMoney2(h.asp)}</td><td class="muted" style="padding:3px 6px; text-align:right;">${h.units.toLocaleString()} units</td></tr>`).join('')}
        </table>
      </details>
    ` : '';
    const body = `
      <div class="muted" style="font-size:12px;">Projected for ${monthLabelLong(month)}</div>
      <div style="font-size:19px; margin-bottom:8px;"><strong>${valueLine}</strong></div>
      ${recommendedBlock}
      ${historyBlock}
      ${editable ? `<button class="btn btn-primary" style="margin-top:10px;" onclick="document.getElementById('detail-modal-backdrop').remove(); editDraftAsp('${channel}','${productId}','${month}')">Edit</button>` : '<div class="muted" style="font-size:13px; margin-top:10px;">Switch to a draft scenario to edit.</div>'}
    `;
    showDetail(`${p?.display_name} — ${monthLabelLong(month)} — Avg Selling Price`, body);
    return;
  }

  // Alex (2026-10-22 / 2026-11-05): "you should have historical information to drive average
  // selling price projections and put context into the pop up box" / "[the % popup] should be
  // data visualization driven as opposed to a bunch of text. How can I know by clicking this why
  // the number is what it is quickly and based on historical data/trends?" -- real trailing-month
  // history (Shopify only; see historicalPctByProduct for the "no Amazon data" limit) renders as
  // a Chart.js bar chart (same library already used for the Overview safety-stock popup -- no
  // new dependency), with the projected month appended as its own bar so history and projection
  // sit on one visual timeline instead of a separate text table. A plain-English "why" sentence
  // is computed from the comparison, replacing the old wall of text. (ASP got this same treatment
  // earlier today but was reverted per Alex's explicit feedback above -- this comparison-sentence
  // pattern stays on the % of Revenue popup only, which he did not flag.)
  const history = channel === 'shopify' ? (S.historicalPctByProduct[productId] || []) : [];
  const chartId = `mix-detail-chart-${Math.random().toString(36).slice(2)}`;

  let whyHtml = '';
  if (history.length) {
    const recent = history.slice(-3);
    const avgRecent = recent.reduce((s, h) => s + h.pct, 0) / recent.length;
    const curVal = cur.revenue_pct || 0;
    const diff = curVal - avgRecent;
    const pctDiff = avgRecent > 0.0001 ? (diff / avgRecent) * 100 : 0;
    const direction = pctDiff > 2 ? 'higher' : pctDiff < -2 ? 'lower' : 'in line with';
    const fmtVal = (v) => `${(v * 100).toFixed(1)}%`;
    whyHtml = (Math.abs(pctDiff) > 2)
      ? `<div style="font-size:14px; line-height:1.5; margin-bottom:4px;">This month's projection (<strong>${fmtVal(curVal)}</strong>) is <strong>${Math.abs(Math.round(pctDiff))}% ${direction}</strong> than the trailing 3-month actual average of ${fmtVal(avgRecent)}.</div>`
      : `<div style="font-size:14px; line-height:1.5; margin-bottom:4px;">This month's projection (<strong>${fmtVal(curVal)}</strong>) is ${direction} the trailing 3-month actual average of ${fmtVal(avgRecent)}.</div>`;
  } else {
    whyHtml = `<div class="muted" style="font-size:13px; margin-bottom:4px;">No historical actual data available${channel === 'amazon' ? ' for Amazon yet' : ' for this product yet'} to compare against.</div>`;
  }

  const chartBlock = history.length ? `
    <div style="display:flex; align-items:center; gap:14px; margin:8px 0 2px;">
      <span style="display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);"><span style="width:10px; height:10px; border-radius:2px; background:#8A7257; display:inline-block;"></span>Actual</span>
      <span style="display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);"><span style="width:10px; height:10px; border-radius:2px; background:#C9A876; display:inline-block;"></span>Projected</span>
    </div>
    <div style="height:190px; margin:4px 0 10px;"><canvas id="${chartId}"></canvas></div>
  ` : '';

  const body = `
    <div style="font-size:19px; margin-bottom:4px;"><strong>${valueLine}</strong></div>
    ${whyHtml}
    ${chartBlock}
    <details ${rationale ? '' : 'open'} style="margin-top:2px;">
      <summary>Written rationale</summary>
      <div class="muted" style="font-size:15px; line-height:1.4; margin:4px 0 8px;">${rationale ? rationale : '<em>No rationale recorded yet.</em>'}</div>
    </details>
    ${editable ? `<button class="btn btn-primary" onclick="document.getElementById('detail-modal-backdrop').remove(); editDraftMixPct('${channel}','${productId}','${month}')">Edit</button>` : '<div class="muted" style="font-size:13px;">Switch to a draft scenario to edit.</div>'}
  `;
  showDetail(`${p?.display_name} — ${monthLabelLong(month)} — Revenue Share`, body);

  if (history.length) {
    const canvas = document.getElementById(chartId);
    if (canvas) {
      const projLabel = `${monthLabelShort(month)} (proj.)`;
      const labels = [...history.map(h => monthLabelShort(h.month)), projLabel];
      const values = [...history.map(h => h.pct * 100), (cur.revenue_pct || 0) * 100];
      const colors = [...history.map(() => '#8A7257'), '#C9A876'];
      // Alex (2026-11-06): "When I click on percentage of revenue I don't think we need to wait
      // to hover over to bring in the values maybe on top of the bars." Datalabels plugin prints
      // each bar's % directly above it -- tooltip stays as a fallback for exact precision, but
      // the number is now visible at a glance with zero interaction. Actual-vs-projected is
      // already one bar per month (not two side-by-side series) distinguished purely by color --
      // this IS the "layered" treatment Alex asked for applied everywhere else, kept here.
      new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets: [{ data: values.map(v => Math.round(v * 100) / 100), backgroundColor: colors }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { top: 22 } },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y.toFixed(1)}%` } },
            datalabels: {
              display: true, anchor: 'end', align: 'top', offset: 2,
              font: { size: 12, weight: '700' }, color: '#2C2A26',
              formatter: (v) => `${v.toFixed(1)}%`,
            },
          },
          scales: {
            x: { ticks: { font: { size: 12 } } },
            // Audit (2026-11-05, knowledge-work-data-viz checklist "bar charts start at zero"):
            // without beginAtZero, Chart.js auto-scales to the data's min/max.
            y: { beginAtZero: true, ticks: { font: { size: 11 }, callback: (v) => `${v}%` } },
          },
        },
      });
    }
  }
}

function channelMonthBasis(month, channel) {
  const S = window._revState;
  const now = new Date();
  const currentKey = now.toISOString().slice(0, 7);
  const hasActual = !!(S.monthlyActual[month] && S.monthlyActual[month][channel]);
  if (month < currentKey) return hasActual ? { tag: 'actual', detail: 'Closed month — full actual revenue.' } : { tag: 'no data', detail: 'No actuals recorded for this month yet.' };
  if (month === currentKey) return hasActual ? { tag: 'MTD actual', detail: 'Blends actual revenue so far this month with the assumption for the remainder — tightens daily as more actuals land.' } : { tag: 'assumption', detail: 'No actuals yet this month — this is a manual assumption.' };
  return { tag: 'assumption', detail: 'Future month — manual assumption until it becomes the current month, at which point actuals start anchoring it.' };
}

function computeProjection(channelData, mixData) {
  // Delegates to the unit-tested dashboard/lib/revenue-logic.js (window.RevenueLogic) -- this
  // wrapper only adapts the live dashboard's window._revState into the plain arguments that pure
  // function expects. See test/revenue-logic.test.js for the real coverage of the math itself.
  //
  // monthlyActualToDate = S.monthlyActual: for the CURRENT (in-progress) month this holds actual
  // revenue recorded so far; future months have no entry. Passing it through makes the demand
  // calc count only the REMAINING (not-yet-happened) portion of the current month against the
  // starting inventory -- which is a LIVE "as of today" QOH, not an official month-start count,
  // and therefore already reflects whatever has sold so far this month. Without this, the current
  // month's demand would be double-counted (Alex, 2026-10-22: flagged this exact mismatch between
  // the source spreadsheet's month-start model and the dashboard's live QOH).
  const S = window._revState;
  return window.RevenueLogic.computeProjection({
    products: S.products,
    months: S.months,
    channelData,
    mixData,
    realReceipts: S.receipts,
    draftPOs: S.draftPOs,
    monthlyActualToDate: S.monthlyActual,
    manualAdjustments: S.manualThroughputAdjustments,
  });
}

function showThroughputDetail(productId, month) {
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  const monthIdx = S.months.indexOf(month);
  const isCurrentMonth = monthIdx === 0;
  const projection = computeProjection(S.draftChannel, S.draftMix);
  // "Starting inventory" for the CURRENT month is a LIVE count as of right now -- not an official
  // month-start snapshot the way the source spreadsheet modeled it (Alex, 2026-10-22). Label it
  // explicitly as "as of today" so it's never confused with a month-start figure. For every later
  // month, "starting inventory" genuinely IS last month's calculated end-of-month result.
  const startingInv = isCurrentMonth ? p.qty_on_hand : projection[p.sku_code][monthIdx - 1];
  const realReceipts = (S.receipts[p.sku_code] || {})[month] || 0;
  const draftReceiptsHere = (S.draftPOs || []).filter(po => po.product_id === productId && po.eta_month.slice(0, 7) === month);
  const draftReceiptsQty = draftReceiptsHere.reduce((s, po) => s + po.qty, 0);
  const receipts = realReceipts + draftReceiptsQty;

  const channelRows = ['shopify', 'amazon'].map(ch => {
    const mix = S.draftMix[ch][productId]?.[month];
    const chanRev = S.draftChannel[month]?.[ch];
    if (!mix || chanRev == null) return null;
    const basis = channelMonthBasis(month, ch);
    const actualToDate = isCurrentMonth ? (S.monthlyActual[month]?.[ch] || 0) : 0;
    // Only the REMAINING (not-yet-happened) revenue drives remaining demand for the current
    // month, since today's live QOH already reflects whatever already sold this month.
    const remainingChanRev = isCurrentMonth ? Math.max(chanRev - actualToDate, 0) : chanRev;
    const units = (remainingChanRev * mix.revenue_pct) / mix.avg_selling_price;
    const pace = isCurrentMonth
      ? window.RevenueLogic.computeMtdPaceUnits({ mtdActualRevenue: actualToDate, revenuePct: mix.revenue_pct, avgSellingPrice: mix.avg_selling_price, fullMonthProjectedUnits: (chanRev * mix.revenue_pct) / mix.avg_selling_price })
      : null;
    return { channel: ch === 'shopify' ? 'Shopify' : 'Amazon', chanRev, remainingChanRev, pct: mix.revenue_pct, asp: mix.avg_selling_price, units, basis, pace };
  }).filter(Boolean);
  const totalUnits = channelRows.reduce((s, r) => s + r.units, 0);
  const totalRemainingRevenue = channelRows.reduce((s, r) => s + r.remainingChanRev * r.pct, 0);
  // Alex (2026-10-22): "we may need to manually estimate inventory throughput ... currently the
  // only way I could in the system is to raise the revenue targets which will raise all of the
  // inventory throughput ... per product." A standalone units-only lever, independent of the
  // revenue mix math above -- added/subtracted straight into the EOM calc, never touches revenue.
  const manualAdj = S.manualThroughputAdjustments?.[productId]?.[month] || 0;
  const manualAdjRow = (S.manualThroughputAdjustmentsRaw || []).find(a => a.product_id === productId && a.month.slice(0, 7) === month);
  const endingInv = startingInv - totalUnits - manualAdj + receipts;
  // Alex (2026-10-22): "it's a little unclear to me as to what was the full month's throughput vs
  // what's been sold so far vs what's planned to be sold with any inventory landing ... I'd love
  // for it to be a little more simply said." One plain summary line, computed once, shown before
  // the per-channel math detail (kept below for anyone who wants to see how it was built).
  const soldSoFarUnits = isCurrentMonth ? channelRows.reduce((s, r) => s + (r.pace?.impliedUnits || 0), 0) : null;
  const fullMonthUnits = isCurrentMonth ? soldSoFarUnits + totalUnits : null;

  const body = `
    <div style="font-size:14px; line-height:1.5;">
      ${isCurrentMonth ? `
        <div style="margin-bottom:10px; padding:10px; background:#F7F4EE; border-radius:8px;">
          <div style="font-weight:600; margin-bottom:6px; font-size:13px;">This month, in plain terms:</div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">Full month's target</span><strong>${Math.round(fullMonthUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">— Already sold so far this month</span><strong>${Math.round(soldSoFarUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0; border-top:1px solid var(--border); margin-top:2px; padding-top:4px;"><span class="muted">= Still planned to sell (rest of month)</span><strong>${Math.round(totalUnits).toLocaleString()} units</strong></div>
          <div style="display:flex; justify-content:space-between; padding:2px 0;"><span class="muted">+ Inventory landing this month</span><strong>${receipts.toLocaleString()} units</strong></div>
        </div>
      ` : ''}
      <div style="padding:6px 0; display:flex; justify-content:space-between; font-size:15px;"><span><strong>Projected end-of-month</strong></span><strong style="color:${endingInv < (p.safety_stock_qty || 0) ? 'var(--bad-text)' : 'var(--good-text)'};">${Math.round(endingInv).toLocaleString()}</strong></div>
      <div class="muted" style="font-size:12px;">Starting (${isCurrentMonth ? 'today, live' : 'prior month EOM'}): ${Math.round(startingInv).toLocaleString()} · Safety stock: ${(p.safety_stock_qty || 0).toLocaleString()}</div>

      ${draftReceiptsHere.length ? `
        <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
          <div class="section-label" style="margin:0 0 4px; font-size:12px;">Draft POs landing this month (${currentScenario()?.name || ''})</div>
          ${draftReceiptsHere.map(po => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:13px;">
              <span>${po.qty.toLocaleString()} units${po.notes ? ` — <span class="muted">${po.notes}</span>` : ''}</span>
              ${isEditable() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:12px; color:var(--bad-text);" onclick="deleteDraftPo('${po.id}')">Remove</button>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <details>
        <summary>Show the math${isCurrentMonth ? ' ("already sold so far" is implied from actual revenue at the assumed mix %, not a measured count)' : ''}</summary>
        ${channelRows.map(r => `
          <div style="padding:5px 0; border-bottom:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between;"><strong>${r.channel}</strong><span class="pill ${r.basis.tag === 'actual' ? 'good' : (r.basis.tag === 'MTD actual' ? 'watch' : '')}" title="${r.basis.detail}">${r.basis.tag}</span></div>
            <div class="muted" style="font-size:12px; margin-top:2px;">
              ${isCurrentMonth
                ? `${fmtMoney(r.chanRev)} full-month forecast − ${fmtMoney(S.monthlyActual[month]?.[r.channel === 'Shopify' ? 'shopify' : 'amazon'] || 0)} already actual = ${fmtMoney(r.remainingChanRev)} remaining × ${(r.pct * 100).toFixed(1)}% mix share ÷ ${fmtMoney2(r.asp)} ASP = <strong>${Math.round(r.units).toLocaleString()} units still to come</strong>`
                : `${fmtMoney(r.chanRev)} channel revenue × ${(r.pct * 100).toFixed(1)}% mix share ÷ ${fmtMoney2(r.asp)} ASP = <strong>${Math.round(r.units).toLocaleString()} units</strong> (${fmtMoney(r.chanRev * r.pct)})`
              }
            </div>
          </div>
        `).join('')}
        <div style="padding:5px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:13px;">
          <span>${isCurrentMonth ? 'Remaining demand (rest of month)' : 'Total implied demand'}</span><strong>${Math.round(totalUnits).toLocaleString()} units (${fmtMoney(totalRemainingRevenue)})</strong>
        </div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:13px;"><span>Starting inventory (${isCurrentMonth ? 'today, live' : 'prior month EOM'})</span><strong>${Math.round(startingInv).toLocaleString()}</strong></div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:13px;"><span>+ Incoming receipts${isCurrentMonth ? ' (rest of month)' : ' this month'}${draftReceiptsQty ? ' <span class="pill watch" style="margin-left:4px;">incl. draft PO</span>' : ''}</span><strong>${receipts.toLocaleString()}${realReceipts && draftReceiptsQty ? ` <span class="muted" style="font-weight:400;">(${realReceipts.toLocaleString()} confirmed + ${draftReceiptsQty.toLocaleString()} draft)</span>` : ''}</strong></div>
        <div style="padding:5px 0; display:flex; justify-content:space-between; font-size:13px;"><span>− Units sold (above)</span><strong>${Math.round(totalUnits).toLocaleString()}</strong></div>
        ${manualAdj ? `<div style="padding:5px 0; display:flex; justify-content:space-between; font-size:13px;"><span>${manualAdj > 0 ? '−' : '+'} Manual throughput adjustment${manualAdjRow?.reason ? ` <span class="muted">(${manualAdjRow.reason})</span>` : ''}</span><strong>${Math.abs(manualAdj).toLocaleString()}</strong></div>` : ''}
        <div style="padding:6px 0 0; display:flex; justify-content:space-between; font-size:14px;"><span><strong>= Projected end-of-month</strong></span><strong>${Math.round(endingInv).toLocaleString()}</strong></div>
      </details>

      ${canEdit() ? `
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
          <div class="muted" style="font-size:12px; margin-bottom:4px;">
            ${manualAdj ? `Manual adjustment on file: <strong>${manualAdj > 0 ? 'Deduction' : 'Addition'} of ${Math.abs(manualAdj).toLocaleString()} units</strong>${manualAdjRow?.reason ? ` — ${manualAdjRow.reason}` : ''}` : 'No manual throughput adjustment for this product/month.'}
          </div>
          <button class="btn btn-ghost" style="padding:5px 10px; font-size:13px;" onclick="editManualThroughputAdjustment('${productId}', '${month}')">${manualAdj ? 'Edit' : '+ Add'} Manual Throughput Adjustment</button>
          ${manualAdj ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:13px; color:var(--bad-text);" onclick="deleteManualThroughputAdjustment('${productId}', '${month}')">Remove</button>` : ''}
        </div>
      ` : ''}

      ${isEditable() ? `
        <div style="margin-top:10px;">
          <button class="btn btn-primary" style="padding:6px 12px; font-size:13px;" onclick="document.getElementById('detail-modal-backdrop').remove(); openDraftPoModal('${productId}', '${month}')">+ Draft a PO landing in ${monthLabelShort(month)}</button>
        </div>
      ` : ''}
    </div>
  `;
  showDetail(`${p.display_name} — ${monthLabelLong(month)}${isCurrentMonth ? ' (in progress)' : ' (projected EOM)'}`, body);
}

// Alex (2026-10-22): "We have situations where we may need to manually estimate inventory
// throughput ... currently the only way I could in the system is to raise the revenue targets
// which will raise all of the inventory throughput as they related to the revenue mix per
// product." A standalone units-only override, live (not scenario-scoped) -- same reasoning as the
// live PO initiation path being separate from scenario-attached draft POs.
//
// Alex (2026-11-05): "the manual adjustments feature needs to allow me to designate if it's a
// deduction or an addition. Currently the math makes it an addition to the inventory when I need
// it to be a deduction." Root cause: the stored column (additional_units) is extra DEMAND units,
// so a positive value already reduces projected inventory (more sold = less left) -- but the old
// prompt just asked for one signed number with a "positive = more will move / negative = fewer"
// hint, which inverts the sign a typical user expects ("negative = subtract from inventory" is
// the natural reading, but here negative additional_units actually ADDS inventory back by
// lowering demand). Replaced the single signed-number prompt with an explicit direction choice
// (Addition vs. Deduction) plus an always-positive magnitude, so the user never has to reason
// about the underlying sign convention -- `additional_units` is still what's stored/consumed by
// demand_engine.py and revenue-logic.js unchanged, just computed from (direction, magnitude) here
// instead of typed directly.
async function editManualThroughputAdjustment(productId, month) {
  if (!canEdit()) return;
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  const existing = (S.manualThroughputAdjustmentsRaw || []).find(a => a.product_id === productId && a.month.slice(0, 7) === month);

  document.getElementById('detail-modal-backdrop')?.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const existingDirection = existing && existing.additional_units < 0 ? 'addition' : 'deduction';
  const existingMagnitude = existing ? Math.abs(existing.additional_units) : '';
  el.innerHTML = `
    <div class="detail-modal" style="max-width:460px;">
      <div style="font-weight:700; margin-bottom:6px; font-family:'Playfair Display'; font-size:17px;">${p?.display_name} — Manual Throughput Adjustment</div>
      <div class="muted" style="font-size:13px; margin-bottom:12px; line-height:1.4;">
        For ${monthLabelLong(month)}. This does NOT change revenue targets or any other product --
        it only moves this product's projected end-of-month inventory for this month.
      </div>
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Direction</label>
      <select id="mta-direction-input" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-bottom:12px;">
        <option value="deduction" ${existingDirection === 'deduction' ? 'selected' : ''}>Deduction — reduces projected inventory (e.g. a promo moving extra units)</option>
        <option value="addition" ${existingDirection === 'addition' ? 'selected' : ''}>Addition — increases projected inventory (e.g. a known planned pause in sales)</option>
      </select>
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Units</label>
      <input id="mta-magnitude-input" type="number" min="0" value="${existingMagnitude}" placeholder="e.g. 500" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-bottom:12px;" />
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Reason</label>
      <textarea id="mta-reason-input" rows="2" placeholder='e.g. "November holiday boxes — bundled promo"' style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin-bottom:14px; font-family:inherit;">${(existing?.reason || '').replace(/</g, '&lt;')}</textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="mta-save-btn">Save</button>
        <button class="btn btn-ghost" id="mta-cancel-btn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  document.getElementById('mta-cancel-btn').onclick = () => el.remove();
  document.getElementById('mta-save-btn').onclick = async () => {
    const direction = document.getElementById('mta-direction-input').value;
    const magnitude = Number(document.getElementById('mta-magnitude-input').value);
    const reason = document.getElementById('mta-reason-input').value.trim();
    if (isNaN(magnitude) || magnitude <= 0) { await showConfirmModal('Check your input', 'Enter a positive number of units. Use "Remove" to clear an existing adjustment.', { okOnly: true }); return; }
    const val = direction === 'addition' ? -Math.round(magnitude) : Math.round(magnitude);
    const payload = { product_id: productId, month: month + '-01', additional_units: val, reason: reason || null };
    const { data: after, error } = await sb.from('manual_throughput_adjustments').upsert(payload, { onConflict: 'product_id,month' }).select().single();
    if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
    await logAction('manual_throughput_adjustments', after.id, existing ? 'update' : 'create',
      `${existing ? 'Edited' : 'Added'} manual throughput adjustment for ${p?.display_name}, ${monthLabelShort(month)}: ${existing ? `${existing.additional_units} → ` : ''}${direction === 'addition' ? '+' : '-'}${magnitude} units (${direction})${reason ? ` — ${reason}` : ''}`,
      existing || null, after);
    el.remove();
    await renderRevenue();
  };
}
async function deleteManualThroughputAdjustment(productId, month) {

function showOutlookStatusDetail(productId) {
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  const months = S.months;
  const projections = computeProjection(S.draftChannel, S.draftMix);
  const series = projections[p.sku_code] || [];
  const safety = p.safety_stock_qty || 0;
  const outlookStatus = window.RevenueLogic.computeOutlookStatus({ series, safetyStock: safety });
  const backendRec = S.anyRecFullByProduct?.[productId];
  const backendRecIsActive = backendRec && backendRec.decision !== 'dismissed';
  const isLiveView = S.selectedScenarioId === 'live';
  // Prefer the real PO-recommendation engine's numbers when an ACTIVE one exists; otherwise fall
  // back to this tab's own quick estimate (computeRecommendedPoQty) -- either way, "If the Status
  // is Issue it should come with a recommended PO initiation with all info filled out" (Alex). A
  // DISMISSED backend rec is shown for context only (see body below) -- a human already decided
  // it needs no action, so it must never silently drive what this button pre-fills.
  const fallbackQty = window.RevenueLogic.computeRecommendedPoQty({ series, firstIssueIndex: outlookStatus.firstIssueIndex, safetyStock: safety });
  const recommendedQty = backendRecIsActive ? (backendRec.recommended_order_qty || 0) : fallbackQty;
  const recommendedMonth = backendRecIsActive && backendRec.shortfall_month
    ? backendRec.shortfall_month.slice(0, 7)
    : (outlookStatus.firstIssueIndex != null ? months[outlookStatus.firstIssueIndex] : months[0]);

  const narrative = outlookStatus.status === 'HEALTHY'
    ? `Projected inventory stays at or above safety stock (${safety.toLocaleString()} units) across the full 6-month outlook — no action needed right now.`
    : (outlookStatus.reason === 'negative'
        ? `Projected to go <strong>negative</strong> by ${monthLabelLong(months[outlookStatus.firstIssueIndex])} (${Math.round(series[outlookStatus.firstIssueIndex]).toLocaleString()} units) — a stockout, not just a dip below safety stock.`
        : `Projected to fall <strong>below safety stock</strong> (${safety.toLocaleString()} units) by ${monthLabelLong(months[outlookStatus.firstIssueIndex])} (${Math.round(series[outlookStatus.firstIssueIndex]).toLocaleString()} units projected).`);

  const seriesRows = months.map((m, i) => {
    const v = series[i];
    const flag = v == null ? '' : (v < 0 ? ' ⚠ negative' : (v < safety ? ' ⚠ below safety' : ''));
    return `<tr><td style="padding:3px 8px;">${monthLabelShort(m)}</td><td style="padding:3px 8px; text-align:right; ${v < safety ? 'color:var(--bad-text);' : ''}">${v == null ? '—' : Math.round(v).toLocaleString()}${flag}</td></tr>`;
  }).join('');

  const body = `
    <div style="font-size:14px; line-height:1.5;">
      <div style="margin-bottom:6px;"><span class="pill ${outlookStatus.status === 'HEALTHY' ? 'good' : 'bad'}" style="font-size:13px;">${outlookStatus.status === 'HEALTHY' ? 'Healthy' : 'Issue'}</span></div>
      <div class="muted" style="font-size:13px; margin-bottom:8px;">${narrative} Safety stock: ${safety.toLocaleString()} units.</div>
      <div class="section-label" style="margin:10px 0 4px; font-size:12px;">Recommendation</div>
      ${backendRec ? `
        <div class="muted" style="font-size:13px; margin-bottom:4px;">
          The full PO-recommendation engine (Overview tab) ${backendRecIsActive ? 'already has an active' : 'found a'}
          <span class="urgency-badge urgency-${backendRec.urgency}" style="font-size:10px;">${backendRec.urgency}</span>
          recommendation — shortfall of ${(backendRec.shortfall_qty || 0).toLocaleString()} units by
          ${fmtDate(backendRec.shortfall_month)}${backendRecIsActive ? '.' : `, but it was <strong>dismissed</strong> — a human already reviewed this and decided no action is needed. Shown here for context only; the button below uses this tab's own quick estimate instead.`}
        </div>
        ${backendRecIsActive ? `<div style="font-size:13px; margin-bottom:8px;">Place by <strong>${fmtDate(backendRec.last_responsible_date)}</strong> · Suggested order: <strong>${(backendRec.recommended_order_qty || 0).toLocaleString()} units</strong></div>` : ''}
      ` : outlookStatus.status === 'ISSUE' ? `
        <div class="muted" style="font-size:13px; margin-bottom:8px;">No recommendation from the Overview tab's engine yet — the ${recommendedQty.toLocaleString()}-unit suggestion below is this tab's own quick estimate (enough to bring ${monthLabelShort(months[outlookStatus.firstIssueIndex])}'s projection back up to safety stock).</div>
      ` : ''}
      ${canEdit() && outlookStatus.status === 'ISSUE' ? `
        <button class="btn btn-primary" style="padding:6px 12px; font-size:13px; margin-bottom:4px;" onclick="document.getElementById('detail-modal-backdrop').remove(); ${
          isLiveView
            ? `initiateLivePoFromOutlook('${productId}', ${recommendedQty || 'null'}, '${recommendedMonth}', null)`
            : `openDraftPoModal('${productId}', '${recommendedMonth}')`
        }">${isLiveView ? '+ Initiate Recommended PO' : '+ Draft a PO'}</button>
      ` : ''}
      <details>
        <summary>Show the 6-month projection</summary>
        <table style="width:100%; font-size:13px; border-collapse:collapse;">
          <thead><tr><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Month (EOM)</th><th style="text-align:right; padding:3px 8px; border-bottom:1px solid var(--border);">Projected</th></tr></thead>
          <tbody>${seriesRows}</tbody>
        </table>
      </details>
    </div>
  `;
  showDetail(`${p.display_name} — Status`, body);
}

function showPacingTrendDetail(channel) {
  const p = (window._revenuePacing || {})[channel];
  const label = channel === 'shopify' ? 'Shopify' : 'Amazon';
  const monthLabel = window._revenuePacingMonthLabel || '';
  if (!p || p.noForecast || p.pctOfPaceYesterday == null) {
    showDetail(`${label} — Pacing Trend`, `<div class="muted">No day-over-day comparison available yet (either no forecast is set for ${monthLabel}, or it's the 1st of the month — there's no same-basis "yesterday" to compare against; that would be last month's different goal).</div>`);
    return;
  }
  const delta = p.pctOfPace - p.pctOfPaceYesterday;
  const direction = delta > 0.5 ? 'improved' : (delta < -0.5 ? 'slipped' : 'held steady');
  const narrative = `As of today (day ${p.daysElapsed} of ${p.daysInMonth}), ${label} is pacing at <strong>${p.pctOfPace.toFixed(0)}%</strong> of where it should be to hit the ${monthLabel} goal of ${fmtMoney(p.forecastFullMonth)}. Yesterday (day ${p.daysElapsed - 1}), that same figure was <strong>${p.pctOfPaceYesterday.toFixed(0)}%</strong>. So pace has <strong>${direction}</strong> by ${Math.abs(delta).toFixed(1)} point${Math.abs(delta) >= 1.5 ? 's' : ''} in the last 24 hours.`;
  const methodNote = `"Pace" compares actual MTD revenue to what you'd expect if the month's revenue landed perfectly evenly across every day (full-month goal ÷ days in month × days elapsed). 100% means exactly on track; above 100% means ahead; below means behind. The day-over-day number is the same calculation run one day apart, so it isolates whether the LAST day specifically helped or hurt your pace — not just whether you're ahead or behind overall.`;
  const body = `
    <div style="font-size:14px; line-height:1.6; margin-bottom:10px;">${narrative}</div>
    <table style="width:100%; font-size:13px; border-collapse:collapse; margin-bottom:10px;">
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">MTD revenue (today)</td><td style="padding:3px 8px; text-align:right; font-weight:700;">${fmtMoney(p.mtd)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">MTD revenue (yesterday)</td><td style="padding:3px 8px; text-align:right; font-weight:700;">${fmtMoney(p.mtdYesterday)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">Expected pace (today)</td><td style="padding:3px 8px; text-align:right;">${fmtMoney(p.expectedPace)}</td></tr>
      <tr><td style="padding:3px 8px; color:var(--text-muted,#8A7257);">Expected pace (yesterday)</td><td style="padding:3px 8px; text-align:right;">${fmtMoney(p.expectedPaceYesterday)}</td></tr>
    </table>
    <details><summary>How "pace" is calculated</summary><div class="muted" style="font-size:13px; margin-top:6px; line-height:1.5;">${methodNote}</div></details>
  `;
  showDetail(`${label} — Pacing Trend`, body);
}

// Draft PO modal -- Alex's ask (2026-10-22): model a hypothetical finished-good PO against the
// current draft scenario, see its effect on the 6-month projection immediately, and see (but
// never be blocked by, per Alex's explicit decision) whether componentry on hand/in-flight is
// enough to actually support it.
async function openDraftPoModal(productId, defaultMonth) {
  if (!isEditable()) { await showConfirmModal('Check your input', 'Select or create a draft scenario to add a draft PO.', { okOnly: true }); return; }
  const S = window._revState;
  const p = S.products.find(pr => pr.product_id === productId);
  document.getElementById('detail-modal-backdrop')?.remove();
  const el = document.createElement('div');
  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  const monthOptions = S.months.map(m => `<option value="${m}" ${m === defaultMonth ? 'selected' : ''}>${monthLabelLong(m)}</option>`).join('');
  const defaultVendor = (S.vendors || []).find(v => v.vendor_name === 'Private Label') || (S.vendors || [])[0];
  const vendorOptions = (S.vendors || []).map(v => `<option value="${v.id}" ${v.id === defaultVendor?.id ? 'selected' : ''}>${v.vendor_name}</option>`).join('');
  el.innerHTML = `
    <div class="detail-modal" style="max-width:480px;">
      <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">Draft PO — ${p.display_name}</div>
      <div class="muted" style="font-size:13px; margin-bottom:12px;">Added to scenario "${currentScenario()?.name}". Only affects real inventory once this scenario is committed to live.</div>
      <label class="muted" style="font-size:12px;">Quantity</label>
      <input id="draft-po-qty" type="number" min="1" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;" />
      <label class="muted" style="font-size:12px;">Landing month</label>
      <select id="draft-po-month" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;">${monthOptions}</select>
      <label class="muted" style="font-size:12px;">Vendor</label>
      <select id="draft-po-vendor" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;">${vendorOptions}</select>
      <div id="draft-po-place-date" class="muted" style="font-size:12px; margin:-6px 0 10px;"></div>
      <label class="muted" style="font-size:12px;">Notes (optional)</label>
      <input id="draft-po-notes" type="text" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin:4px 0 10px;" />
      <div id="draft-po-feasibility" style="margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="draft-po-save">Save Draft PO</button>
        <button class="btn btn-ghost" id="draft-po-cancel">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
  const qtyInput = document.getElementById('draft-po-qty');
  qtyInput.focus();
  const updateFeasibility = () => {
    const qty = Number(qtyInput.value) || 0;
    const feasEl = document.getElementById('draft-po-feasibility');
    if (!qty) { feasEl.innerHTML = ''; return; }
    const checks = checkComponentFeasibility(p.sku_code, qty);
    const shortages = checks.filter(c => c.short > 0);
    if (!checks.length) {
      feasEl.innerHTML = `<div class="muted" style="font-size:12px;">No componentry tracked against this product's SKU.</div>`;
    } else if (shortages.length === 0) {
      feasEl.innerHTML = `<div class="pill good" style="font-size:12px;">✓ Enough componentry on hand/in-flight for ${qty.toLocaleString()} units</div>`;
    } else {
      feasEl.innerHTML = `
        <div class="pill bad" style="font-size:12px; margin-bottom:6px;">⚠ Short on componentry for ${qty.toLocaleString()} units — you can still save this draft, but you'll also need component PO(s)</div>
        ${shortages.map(c => `<div class="muted" style="font-size:12px;">${c.component_name}: need ${c.required.toLocaleString()}, have ${c.available.toLocaleString()} on hand/in-flight — short ${c.short.toLocaleString()}</div>`).join('')}
      `;
    }
  };
  qtyInput.addEventListener('input', updateFeasibility);
  const monthSelect = document.getElementById('draft-po-month');
  const vendorSelect = document.getElementById('draft-po-vendor');
  const updatePlaceDate = () => {
    const month = monthSelect.value;
    const vendor = (S.vendors || []).find(v => v.id === vendorSelect.value);
    const placeDateEl = document.getElementById('draft-po-place-date');
    if (!vendor) { placeDateEl.innerHTML = ''; return; }
    const placeBy = window.RevenueLogic.computePlaceByDate(month, vendor.default_lead_days);
    const isPast = placeBy < new Date().toISOString().slice(0, 10);
    placeDateEl.innerHTML = `Place by <strong style="color:${isPast ? 'var(--bad-text)' : 'inherit'};">${fmtDate(placeBy)}</strong> to land in ${monthLabelShort(month)} (${vendor.vendor_name}'s ${vendor.default_lead_days}-day lead time)${isPast ? ' — already past, place immediately' : ''}.`;
  };
  monthSelect.addEventListener('change', updatePlaceDate);
  vendorSelect.addEventListener('change', updatePlaceDate);
  updatePlaceDate();
  const finish = () => el.remove();
  document.getElementById('draft-po-cancel').onclick = finish;
  document.getElementById('draft-po-save').onclick = async () => {
    const qty = Number(qtyInput.value);
    if (!qty || qty <= 0) { await showConfirmModal('Check your input', 'Enter a positive quantity.', { okOnly: true }); return; }
    const month = document.getElementById('draft-po-month').value;
    const vendorId = document.getElementById('draft-po-vendor').value;
    if (!vendorId) { await showConfirmModal('Check your input', 'Select a vendor — required to commit this PO later.', { okOnly: true }); return; }
    const notes = document.getElementById('draft-po-notes').value || null;
    const { data, error } = await sb.from('revenue_scenario_po').insert({
      scenario_id: S.selectedScenarioId, product_id: productId, vendor_id: vendorId,
      qty, eta_month: month + '-01', notes, created_by: currentUserRow?.email || 'dashboard',
    }).select().single();
    if (error) { await showConfirmModal('Something went wrong', 'Failed: ' + error.message, { okOnly: true, danger: true }); return; }
    S.draftPOs.push(data);
    await logAction('revenue_scenario_po', data.id, 'create', `Added draft PO: ${p.display_name}, ${qty.toLocaleString()} units landing ${monthLabelShort(month)} (${currentScenario()?.name})`, null, data);
    finish();
    renderRevenueBody();
  };
}

async function deleteDraftPo(id) {
