<style>
  :root {
    --bg: #F2EFE9;
    --card: #FFFFFF;
    --ink: #2C2A26;
    --muted: #8C867D;
    --border: #E5E0D8;
    --accent: #5C4A36;
    --accent-light: #8A7257;
    --good-bg: #E5EEE0;
    --good-text: #3F6B35;
    --bad-bg: #F3E2E0;
    --bad-text: #A33B2E;
    --watch-bg: #FBF0DD;
    --watch-text: #96631A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Playfair Display', serif; }
  header {
    padding: 18px 40px 0 40px;
  }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
  h1.title { font-size: 26px; font-weight: 600; margin: 2px 0 2px 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .snapshot-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; color: var(--muted);
  }
  nav.tabs {
    display: flex; gap: 24px; border-bottom: 1px solid var(--border);
    padding: 0 40px; margin-top: 6px;
  }
  nav.tabs button {
    background: none; border: none; font-family: 'Inter'; font-size: 14px; font-weight: 500;
    color: var(--muted); padding: 9px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 18px 40px 40px 40px; max-width: 1500px; margin: 0 auto; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
    margin: 18px 0 8px 0; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .kpi-grid {

  .kpi-card { display: flex; flex-direction: column; gap: 4px; }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; width: fit-content;

  .pill.bad { background: var(--bad-bg); color: var(--bad-text); }

  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase;

    border-radius: 8px; border: 1px solid var(--border); background: var(--card);

  .login-wrap {

  /* Hover-only info icon + tooltip (Alex, 2026-10-22: "move the text ... to an information icon
     that pops up when hovered over") -- pure CSS, no JS needed; works anywhere via
     <span class="info-icon">ⓘ<span class="info-tooltip">...</span></span> */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserRow = null;

// ---------- Auth ----------
async function sendMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  const statusEl = document.getElementById('login-status');
  if (!email) { statusEl.textContent = 'Enter an email address.'; return; }

}

async function signOut() {

  window.location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await loadApp(session);
  } else {
    document.getElementById('login-screen').classList.remove('hidden');

async function loadApp(session) {
  const { data: userRow, error } = await sb.from('users').select('*').eq('auth_user_id', session.user.id).single();
  if (error || !userRow) {
    document.getElementById('login-status').textContent = 'Signed in, but no matching user record found — ask an admin to grant access.';

  document.getElementById('snapshot-pill').textContent = 'Snapshot · updated on page load';

  await Promise.all([renderOverview(), renderRevenue(), renderLandedOrders(), renderComponents(), renderActivityLog()]);
  initMannyChat();

// ---------- Manny chat widget ----------
// Alex (2026-10-22): "a little icon that will travel with you whichever tab you're on ... I want
// it to look and feel like an interaction right on the screen." Real architecture (Manny's only
// internet-reachable endpoint is its own separate admin dashboard, not something this static site
// can call directly): sending a message inserts a row into dashboard_chat_messages; a Postgres
// trigger (migrations/023_dashboard_chat.sql) posts it straight into Slack via an Incoming
// Webhook -- no server of Manny's involved. Manny's replies are written back into the same table
// (by a human reading Slack, via a trusted DB connection that RLS prevents browser clients from
// using) and arrive in the panel live via a Supabase Realtime subscription -- genuinely two-way,
// not just a link out to Slack.
let mannyChatChannel = null;
async function initMannyChat() {
  const { data: history } = await sb.from('dashboard_chat_messages').select('*').eq('archived', false).order('created_at', { ascending: true }).limit(100);
  const el = document.getElementById('manny-chat-messages');
  el.innerHTML = (history && history.length)
    ? history.map(renderMannyChatBubble).join('')
    : `<div class="muted" style="font-size:12px; text-align:center; margin-top:20px;">Ask Manny anything about this dashboard — forecasts, inventory, components, how something's calculated. Your message goes straight to #supplychainbuild in Slack.</div>`;
  el.scrollTop = el.scrollHeight;

  if (mannyChatChannel) sb.removeChannel(mannyChatChannel);
  mannyChatChannel = sb
    .channel('dashboard-chat-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dashboard_chat_messages' }, (payload) => {
      const msgEl = document.getElementById('manny-chat-messages');
      if (!msgEl) return;
      msgEl.insertAdjacentHTML('beforeend', renderMannyChatBubble(payload.new));
      msgEl.scrollTop = msgEl.scrollHeight;
      // If the panel is closed when Manny replies, bounce the icon so it's noticeable.
      if (payload.new.sender === 'manny' && document.getElementById('manny-chat-panel').classList.contains('hidden')) {
        const fab = document.getElementById('manny-chat-fab');
        fab.style.animation = 'none';
        requestAnimationFrame(() => { fab.style.animation = 'manny-chat-bounce 0.6s ease 2'; });
      }
    })
    .subscribe();
}

function renderMannyChatBubble(m) {
  const who = m.sender === 'manny' ? 'Manny' : (m.sender_email ? m.sender_email.split('@')[0] : 'You');
  const text = String(m.message).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `<div class="manny-chat-bubble ${m.sender === 'manny' ? 'manny' : 'user'}"><div style="font-size:10px; opacity:0.65; margin-bottom:2px;">${who}</div>${text}</div>`;
}

function toggleMannyChat() {
  const panel = document.getElementById('manny-chat-panel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    document.getElementById('manny-chat-input').focus();
    const msgEl = document.getElementById('manny-chat-messages');
    msgEl.scrollTop = msgEl.scrollHeight;
  }
}

async function startNewMannyChat() {
  if (!(await showConfirmModal('Start a new conversation?', 'This archives the current chat (it stays in the database, just hidden) and clears Manny\'s memory of it -- the next message starts fresh.', 'Start New'))) return;
  const { error } = await sb.from('dashboard_chat_messages').update({ archived: true }).eq('archived', false);
  if (error) { alert('Failed: ' + error.message); return; }
  const el = document.getElementById('manny-chat-messages');
  el.innerHTML = `<div class="muted" style="font-size:12px; text-align:center; margin-top:20px;">New conversation started.</div>`;
}

async function sendMannyChatMessage() {
  const input = document.getElementById('manny-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || null;
  const { error } = await sb.from('dashboard_chat_messages').insert({
    sender: 'user', sender_email: currentUserRow?.email || null, message: text,
    context: { tab: activeTab, url: window.location.href },
  });
  input.disabled = false;
  input.focus();
  if (error) {
    const msgEl = document.getElementById('manny-chat-messages');
    msgEl.insertAdjacentHTML('beforeend', `<div class="muted" style="font-size:11px; text-align:center;">Failed to send: ${error.message}</div>`);
  }
  // No optimistic local append here -- the Realtime subscription above renders this exact row
  // (and Manny's eventual reply) the same way, so there's only one code path for the UI, and no
  // risk of a duplicated/mismatched bubble if the insert is slow or fails after all.
}

document.querySelectorAll('.tab-btn').forEach(btn => {

function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtMoney2(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y}`;
}
function fmtDateTime(ts) {
  const dt = new Date(ts);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  const time = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${mm}/${dd}/${yyyy} ${time}`;
}
// Prompts the user for a date in MM/DD/YYYY (matching Alex's display-format requirement) and
// converts it to the ISO YYYY-MM-DD format Postgres date columns need internally.
async function promptDateMMDDYYYY(message, currentIso) {
  const input = await showPromptModal(message, null, currentIso || '', 'date');
  if (!input) return null;
  return input;
}
function monthName(isoDate) {
  const [y, m] = isoDate.split('-');
  return new Date(Number(y), Number(m) - 1, 1).toLocaleString('en-US', { month: 'long' });
}

function buildRecommendationNarrative(r) {
  const outlook = r.monthly_outlook || [];
  if (outlook.length === 0) {
    return `${r.shortfall_qty} units projected short by ${fmtDate(r.shortfall_month)}. Place an order by ${fmtDate(r.last_responsible_date)} (lead time ${r.lead_days} days).`;
  }

  const current = r.current_qoh != null ? r.current_qoh.toLocaleString() : 'an unknown number of';
  let sentence = `We currently have ${current} units on hand.`;

  // Any planned receipt between now and the shortfall month, in order.
  const receipts = outlook.filter(m => m.receipts > 0 && m.month <= r.shortfall_month);
  receipts.forEach(rec => {
    sentence += ` We're planning on a receipt of ${rec.receipts.toLocaleString()} units landing by ${fmtDate(rec.month)}.`;
  });

  // Demand for each month up to and including the shortfall month, in plain language.
  const relevantMonths = outlook.filter(m => m.month <= r.shortfall_month);
  if (relevantMonths.length > 0) {
    const demandPhrases = relevantMonths.map(m => `${m.demand.toLocaleString()} in ${monthName(m.month)}`);
    sentence += ` Based on current revenue projections, we expect to sell through ${demandPhrases.join(', ')}.`;
  }

  sentence += ` At that pace, we'll fall ${r.shortfall_qty.toLocaleString()} units below the ${outlook[0].safety_stock ? outlook[0].safety_stock.toLocaleString() : ''} unit safety stock target by ${fmtDate(r.shortfall_month)} unless more is ordered. Recommended: place ${r.recommended_order_qty.toLocaleString()} units by ${fmtDate(r.last_responsible_date)}${r.days_until_deadline < 0 ? ` (already ${-r.days_until_deadline} day(s) overdue)` : ` (${r.days_until_deadline} day(s) from now)`}.`;

  return sentence;
}

function showDetail(title, body, size) {
  const existing = document.getElementById('detail-modal-backdrop');
  if (existing) existing.remove();

  el.id = 'detail-modal-backdrop';
  el.className = 'detail-modal-backdrop';

  el.innerHTML = `
    <div class="detail-modal" style="max-width:${maxWidth};">

// Styled replacements for window.prompt()/confirm() -- same detail-modal visual language as the
// rest of the dashboard, matching Alex's request (2026-10-21) to drop the browser-chrome dialogs.
function showPromptModal(title, message, defaultValue, inputType) {
  return new Promise(resolve => {
    document.getElementById('detail-modal-backdrop')?.remove();
    const el = document.createElement('div');
    el.id = 'detail-modal-backdrop';
    el.className = 'detail-modal-backdrop';
    const finish = (val) => { el.remove(); resolve(val); };
    el.onclick = (e) => { if (e.target === el) finish(null); };
    const safeDefault = defaultValue != null ? String(defaultValue).replace(/"/g, '&quot;') : '';
    const isTextarea = inputType === 'textarea';
    el.innerHTML = `
      <div class="detail-modal" style="max-width:480px;">
        <div style="font-weight:700; margin-bottom:10px; font-family:'Playfair Display'; font-size:17px;">${title}</div>
        ${message ? `<div style="font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.4;">${message}</div>` : ''}
        ${isTextarea
          ? `<textarea id="prompt-modal-input" rows="3" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin-bottom:14px; font-family:inherit;">${safeDefault}</textarea>`
          : `<input id="prompt-modal-input" type="${inputType || 'text'}" value="${safeDefault}" style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); font-size:14px; margin-bottom:14px;" />`}
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="prompt-modal-ok">OK</button>
          <button class="btn btn-ghost" id="prompt-modal-cancel">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(el);
    const input = document.getElementById('prompt-modal-input');
    input.focus();
    if (input.select) input.select();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isTextarea) { e.preventDefault(); finish(input.value); }
      if (e.key === 'Escape') finish(null);
    });
    document.getElementById('prompt-modal-ok').onclick = () => finish(input.value);
    document.getElementById('prompt-modal-cancel').onclick = () => finish(null);
  });
}

function showConfirmModal(title, message, confirmLabel) {
  return new Promise(resolve => {
    document.getElementById('detail-modal-backdrop')?.remove();

    el.id = 'detail-modal-backdrop';

}

function kpiTable(headers, rows, wrapIdx, colWidths, noWrapCols) {
  if (rows.length === 0) return '<div class="muted">Nothing here right now.</div>';
  const idx = wrapIdx != null ? wrapIdx : headers.length - 1;
  const noWrapSet = new Set(noWrapCols || []);
  const colgroup = colWidths ? `<colgroup>${colWidths.map(w => `<col style="width:${w || 'auto'};">`).join('')}</colgroup>` : '';
  const cellStyle = (ci) => {
    if (noWrapSet.has(ci)) return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;`;
    if (colWidths && colWidths[ci]) return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:normal; word-break:break-word;`;
    return `padding:8px 10px; border-bottom:1px solid var(--border); white-space:${ci === idx ? 'normal' : 'nowrap'}; ${ci === idx ? 'min-width:380px;' : ''}`;
  };
  return `
    <table style="width:100%; font-size:13px; border-collapse:collapse; table-layout:${colWidths ? 'fixed' : 'auto'};">
      ${colgroup}
      <thead><tr>${headers.map(h => `<th style="padding:8px 10px; text-align:left; border-bottom:2px solid var(--border);">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr style="background:${i % 2 === 0 ? 'transparent' : 'rgba(0,0,0,0.02)'};">${r.map((c, ci) => `<td style="${cellStyle(ci)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
}

    ? lastQc.checks

  const rows = checks.map(c => [
    c.check,
    `<span class="pill ${c.passed ? 'good' : 'bad'}">${c.passed ? 'Pass' : 'Fail'}</span>`,
    c.detail || '',
  ]);
  showDetail(`QC Run — ${fmtDateTime(lastQc.run_at)}`, kpiTable(['Check', 'Result', 'Detail'], rows));
}

// ---------- Overview ----------
async function renderOverview() {
  const el = document.getElementById('tab-overview');
  const todayIso = new Date().toISOString().slice(0, 10);
  const monthStartIso = todayIso.slice(0, 7) + '-01';
  const [{ data: recs }, { data: pos }, { data: openOrders }, { data: qcRuns }, { data: invSnapshot }, { data: qohRows }, { data: revActuals }, { data: revForecasts }] = await Promise.all([
    sb.from('agent_recommendations').select('*, products(sku_code, display_name)').neq('decision', 'dismissed').order('days_until_deadline', { ascending: true }),
    sb.from('purchase_orders').select('*').in('status', ['draft', 'pending_approval', 'approved', 'placed', 'in_transit']),
    sb.from('open_orders_by_product').select('*'),
    sb.from('qc_runs').select('*').order('run_at', { ascending: false }).limit(1),
    sb.from('product_inventory_snapshot').select('*, products(sku_code)'),
    sb.from('product_qoh').select('product_id, sku_code, display_name, safety_stock_qty, safety_stock_basis, safety_stock_detail'),
    sb.from('revenue_actuals').select('channel, gross_revenue, revenue_date').gte('revenue_date', monthStartIso).lte('revenue_date', todayIso),
    sb.from('revenue_forecasts').select('channel, forecast_revenue').eq('forecast_month', monthStartIso),
  ]);

  window._invSnapshotBySku = {};
  (invSnapshot || []).forEach(s => {
    const sku = s.products?.sku_code;
    if (!sku) return;
    if (!window._invSnapshotBySku[sku]) window._invSnapshotBySku[sku] = {};
    window._invSnapshotBySku[sku][s.channel] = s.qty;
  });
  window._safetyStockBySku = {};
  window._safetyStockBasisBySku = {};
  window._safetyStockDetailBySku = {};
  window._productBySku = {};
  (qohRows || []).forEach(r => {
    window._safetyStockBySku[r.sku_code] = r.safety_stock_qty;
    window._safetyStockBasisBySku[r.sku_code] = r.safety_stock_basis;
    window._safetyStockDetailBySku[r.sku_code] = r.safety_stock_detail;
    window._productBySku[r.sku_code] = { product_id: r.product_id, display_name: r.display_name };
  });

  // Revenue MTD vs forecast pace -- same methodology as daily_digest.py's get_revenue_pacing():
  // pro-rate the full-month forecast by days-elapsed-so-far and compare to actual MTD gross
  // revenue. Never fabricates a baseline if no forecast row exists for the current month.
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysElapsed = now.getDate();
  const todayDateStr = now.toISOString().slice(0, 10);
  const revenuePacing = {};
  ['shopify', 'amazon'].forEach(channel => {
    const chanActuals = (revActuals || []).filter(r => r.channel === channel);
    const mtd = chanActuals.reduce((sum, r) => sum + Number(r.gross_revenue || 0), 0);
    const forecastRow = (revForecasts || []).find(r => r.channel === channel);
    if (!forecastRow) {
      revenuePacing[channel] = { mtd, noForecast: true };
      return;
    }
    const forecastFullMonth = Number(forecastRow.forecast_revenue);
    const expectedPace = daysInMonth ? (forecastFullMonth / daysInMonth) * daysElapsed : 0;
    const pctOfGoal = forecastFullMonth > 0 ? (mtd / forecastFullMonth) * 100 : 0;
    const pctOfPace = expectedPace > 0 ? (mtd / expectedPace) * 100 : 0;

    // "How were we pacing yesterday" -- reconstruct the same pctOfPace figure as of yesterday
    // (MTD excluding today's partial day, days-elapsed minus 1), so the two are directly
    // comparable on the same methodology. Day 1 of the month has no meaningful "yesterday"
    // (that's last month's pacing, a different goal entirely), so it's left undefined.
    let pctOfPaceYesterday = null;
    let mtdYesterday = null;
    let expectedPaceYesterday = null;
    if (daysElapsed > 1) {
      mtdYesterday = chanActuals.filter(r => r.revenue_date < todayDateStr).reduce((sum, r) => sum + Number(r.gross_revenue || 0), 0);
      expectedPaceYesterday = (forecastFullMonth / daysInMonth) * (daysElapsed - 1);
      pctOfPaceYesterday = expectedPaceYesterday > 0 ? (mtdYesterday / expectedPaceYesterday) * 100 : null;
    }

    revenuePacing[channel] = { mtd, forecastFullMonth, expectedPace, pctOfGoal, pctOfPace, pctOfPaceYesterday, mtdYesterday, expectedPaceYesterday, daysElapsed, daysInMonth };
  });
  window._revenuePacing = revenuePacing;
  window._revenuePacingMonthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });

  const today = new Date().toISOString().slice(0, 10);
  const in7Days = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);

  const activeRecs = (recs || []).filter(r => r.urgency !== 'OK');
  const criticalCount = activeRecs.filter(r => r.urgency === 'CRITICAL').length;
  const overdueOrders = (openOrders || []).filter(o => o.action_needed === 'Overdue');
  const overdueCount = overdueOrders.length;
  // "Vendor Contacts Due" = overdue contacts + anything coming up in the next 7 days, so Alex can
  // see what communications are coming, not just what's already late.
  const contactsDueOrSoon = (openOrders || []).filter(o => o.order_status !== 'paused' && o.next_contact && o.next_contact <= in7Days);
  const contactDueCount = contactsDueOrSoon.length;
  const lastQc = (qcRuns && qcRuns[0]) || null;
  const needsActionCount = (openOrders || []).filter(o => o.action_needed !== 'On Track').length;

  const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  window._kpiContext = { activeRecs, overdueOrders, contactsDueOrSoon, lastQc };
  const pacingRow = (channel, label) => {
    const p = revenuePacing[channel];
    if (p.noForecast) {
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
          <div style="width:70px; font-size:12px; font-weight:600;">${label}</div>
          <div style="flex:1; font-size:12px;" class="muted">No forecast set for ${monthLabel} — MTD actual ${fmtMoney(p.mtd)}</div>
          <button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="editRevenueForecast('${channel}')">+ Set forecast</button>
        </div>
      `;
    }
    const barColor = p.pctOfPace >= 95 ? 'var(--good-text)' : (p.pctOfPace >= 80 ? 'var(--watch-text)' : 'var(--bad-text)');
    const fillPct = Math.min(100, p.pctOfGoal);
    const paceLabel = p.pctOfPace >= 100 ? `${(p.pctOfPace - 100).toFixed(0)}% ahead of pace` : `${(100 - p.pctOfPace).toFixed(0)}% behind pace`;
    // Day-over-day trend: how pctOfPace moved since yesterday's equivalent snapshot. "—" on day 1
    // of the month, since there's no same-basis "yesterday" to compare against. Made clickable
    // (Alex, 2026-10-22: "more explanatory on the comparison to yesterday") -- the badge itself
    // stays compact, full plain-language explanation lives in showPacingTrendDetail's popup.
    let trendHtml = '<span class="muted" style="font-size:11px;">—</span>';
    if (p.pctOfPaceYesterday != null) {
      const delta = p.pctOfPace - p.pctOfPaceYesterday;
      const trendColor = delta > 0.5 ? 'var(--good-text)' : (delta < -0.5 ? 'var(--bad-text)' : 'var(--text-muted, #8A7257)');
      const arrow = delta > 0.5 ? '▲' : (delta < -0.5 ? '▼' : '▬');
      trendHtml = `<button class="btn btn-ghost clickable-pill" style="padding:2px 6px; font-size:11px; font-weight:700; color:${trendColor}; border-color:transparent; background:transparent;" onclick="showPacingTrendDetail('${channel}')">${arrow} ${Math.abs(delta).toFixed(0)} pt${Math.abs(delta) >= 1.5 ? 's' : ''} vs yesterday</button>`;
    }
    return `
      <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
        <div style="width:70px; font-size:12px; font-weight:600;">${label}</div>
        <div style="position:relative; flex:1; background:var(--border); border-radius:6px; height:24px; overflow:hidden;">
          <div style="position:absolute; inset:0; width:${fillPct}%; background:${barColor}; height:100%; border-radius:6px;"></div>
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.55); white-space:nowrap; padding:0 6px;">
            ${fmtMoney(p.mtd)} of ${fmtMoney(p.forecastFullMonth)} goal — ${paceLabel}
          </div>
        </div>
        <div style="width:42px; text-align:right; font-size:13px; font-weight:700; color:${barColor};">${p.pctOfGoal.toFixed(0)}%</div>
        <div style="width:120px; text-align:right;">${trendHtml}</div>
        <button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="editRevenueForecast('${channel}')">✎</button>
      </div>
    `;
  };

  el.innerHTML = `
    <div class="card" style="padding:10px 14px; margin-bottom:14px;">
      <div class="section-label" style="margin:0 0 2px;">Revenue Pacing — ${monthLabel}</div>
      ${pacingRow('shopify', 'Shopify')}
      ${pacingRow('amazon', 'Amazon')}
    </div>

    <div class="section-label">At a Glance</div>
    <div class="kpi-grid">
      <div class="card kpi-card clickable-pill" onclick="showRecsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Open Recommendations</div>
          <div class="kpi-value" style="font-size:20px;">${activeRecs.length}</div>
        </div>
        <div class="pill ${criticalCount > 0 ? 'bad' : 'good'}">${criticalCount} critical</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showOverdueKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Overdue Orders</div>
          <div class="kpi-value" style="font-size:20px;">${overdueCount}</div>
        </div>
        <div class="pill ${overdueCount > 0 ? 'bad' : 'good'}">${overdueCount > 0 ? 'past ETA, not landed' : 'none overdue'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showContactsKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Vendor Contacts Due</div>
          <div class="kpi-value" style="font-size:20px;">${contactDueCount}</div>
        </div>
        <div class="pill ${contactDueCount > 0 ? 'watch' : 'good'}">${contactDueCount > 0 ? 'due now or within 7 days' : 'none in next 7 days'}</div>
      </div>
      <div class="card kpi-card clickable-pill" onclick="showQcKpiDetail()">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div class="kpi-label">Data Last Updated</div>
          <div class="kpi-value" style="font-size:14px;">${lastQc ? fmtDateTime(lastQc.run_at) : '—'}</div>
        </div>
        <div class="pill ${lastQc && lastQc.all_clear ? 'good' : 'bad'}">${lastQc ? (lastQc.all_clear ? 'QC: all clear' : 'QC: discrepancy found') : 'no QC run yet'}</div>
      </div>
    </div>

    <div class="section-label">Agentic Recommendations — Validate or Dismiss</div>
    <div id="recs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:18px;"></div>

    <div class="section-label">Open Orders by Product — ${needsActionCount} need attention</div>
    <div class="card" style="padding: 12px 16px; margin-bottom: 10px;">
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:13px; font-weight:500;">Product:
          <select id="filter-product" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All products</option>
          </select>
        </label>
        <label style="font-size:13px; font-weight:500;">Order Type:
          <select id="filter-type" onchange="applyOpenOrdersFilter()" style="margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="all">All types</option>
            <option value="finished_good">Finished Good</option>
            <option value="componentry">Component</option>
          </select>
        </label>
        <button class="btn ${window._needsActionFilter !== false ? 'btn-primary' : 'btn-ghost'}" id="needs-action-toggle-btn" style="padding:5px 10px; font-size:12px;" onclick="toggleNeedsActionFilter()" title="${window._needsActionFilter !== false ? 'Currently filtered to items needing attention' : 'Currently showing every open order'}">⚑ ${window._needsActionFilter !== false ? 'Show All Orders' : 'Show Needs-Attention Only'}</button>
        <button class="btn btn-ghost" id="reveal-order-data-btn" style="padding:5px 10px; font-size:12px;" onclick="toggleRevealOrderData()" title="Show/hide Order # and Tracking values inline">👁 ${window._revealOrderData ? 'Hide' : 'Reveal'} Order # / Tracking</button>
        ${canEdit() ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:12px;" onclick="showAddOrderMenu()">+ Add Order</button>` : ''}
      </div>
    </div>
    <div id="open-orders-groups"></div>
  `;

  window._openOrdersCache = openOrders || [];
  const productSelect = document.getElementById('filter-product');
  const uniqueProducts = [...new Map((openOrders || []).map(o => [o.product_sku, o.product_name])).entries()];
  uniqueProducts.sort((a, b) => productSortRank(a[1]) - productSortRank(b[1]) || a[1].localeCompare(b[1]));
  // Preserve filter selections across re-renders (e.g. after an action) instead of resetting them.
  const prevProduct = window._filterState?.product || 'all';
  const prevType = window._filterState?.type || 'all';
  productSelect.innerHTML = '<option value="all">All products</option>' + uniqueProducts.map(([sku, name]) => `<option value="${sku}" ${sku === prevProduct ? 'selected' : ''}>${name} (${sku})</option>`).join('');
  document.getElementById('filter-type').value = prevType;
  if (window._needsActionFilter === undefined) window._needsActionFilter = true;

  applyOpenOrdersFilter();

  window._recsCache = recs || [];
  const grid = document.getElementById('recs-grid');
  if (!recs || recs.length === 0) {
    grid.innerHTML = `<div class="card empty-state" style="grid-column: 1 / -1;">No open recommendations — nothing needs a decision today.</div>`;
  } else {
    grid.innerHTML = recs.map(r => `
      <div class="card" id="rec-card-${r.id}" style="padding:12px 14px; ${r.is_test ? 'border:2px dashed var(--watch-text);' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;">
          <div><strong>${r.products.display_name}</strong> <span class="muted" style="font-size:12px;">${r.products.sku_code}</span></div>
          <div style="text-align:right;">
            ${r.is_test ? '<span class="pill watch" style="font-size:9px; display:block; margin-bottom:3px;" title="Synthetic data for UI testing only -- not a real finding">⚠ TEST DATA</span>' : ''}
            <span class="urgency-badge urgency-${r.urgency}">${r.urgency}</span>
          </div>
        </div>
        <!-- Alex (2026-10-22): "The buttons top right should have a well thought out contextual
             reason presented simply" -- a one-line, plain-language reason for the urgency level,
             right under the badge, so "why is this CRITICAL" is answered at a glance without a
             click-through. -->
        <div class="muted" style="font-size:11px; text-align:right; margin-bottom:6px;">${
          r.days_until_deadline < 0
            ? `Past deadline by ${Math.abs(r.days_until_deadline)} day${Math.abs(r.days_until_deadline) === 1 ? '' : 's'}`
            : r.days_until_deadline <= 14
              ? `Only ${r.days_until_deadline} day${r.days_until_deadline === 1 ? '' : 's'} left to decide`
              : `${r.days_until_deadline} days until deadline — time to plan`
        }</div>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
          <span class="pill clickable-pill watch" onclick="showRecommendationDetail('${r.id}')">${PROBLEM_LABELS[r.problem_type] || r.problem_type}</span>
          <span style="font-size:12px;">Current inventory: <strong style="font-size:14px; color:${(() => { const ss = (window._safetyStockBySku || {})[r.products.sku_code]; if (r.current_qoh == null || ss == null) return 'var(--ink)'; if (r.current_qoh < ss) return 'var(--bad-text)'; if (r.current_qoh < ss * 1.25) return 'var(--watch-text)'; return 'var(--good-text)'; })()};">${r.current_qoh != null ? r.current_qoh.toLocaleString() : '—'}</strong></span>
        </div>
        ${canEdit() ? `
          <select onchange="decideRecommendation('${r.id}', this.value)" style="width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border); font-family:'Inter';">
            <option value="pending" ${r.decision === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="approved" ${r.decision === 'approved' ? 'selected' : ''}>Approved</option>
            <option value="dismissed" ${r.decision === 'dismissed' ? 'selected' : ''}>Dismissed</option>
          </select>
        ` : `<span class="pill ${r.decision === 'approved' ? 'good' : r.decision === 'dismissed' ? 'bad' : 'watch'}">${r.decision}</span>`}
      </div>
    `).join('');
  }
}

function canEdit() {
  return currentUserRow && (currentUserRow.role === 'editor' || currentUserRow.role === 'admin');
}
function canDelete() {
  return currentUserRow && currentUserRow.role === 'admin';
}

function applyOpenOrdersFilter() {
  const all = window._openOrdersCache || [];
  const productFilter = document.getElementById('filter-product').value;
  const typeFilter = document.getElementById('filter-type').value;
  const onlyAction = window._needsActionFilter !== false;
  window._filterState = { product: productFilter, type: typeFilter };

  const filtered = all.filter(o => {
    if (productFilter !== 'all' && o.product_sku !== productFilter) return false;
    if (typeFilter !== 'all' && o.order_type !== typeFilter) return false;
    if (onlyAction && o.action_needed === 'On Track') return false;
    return true;
  });

  const groupsEl = document.getElementById('open-orders-groups');
  if (filtered.length === 0) {
    groupsEl.innerHTML = `<div class="card empty-state">Nothing matches these filters${onlyAction ? ' — try the "Show All Orders" button' : ''}.</div>`;
    return;
  }

  const byProduct = new Map();
  filtered.forEach(o => {
    if (!byProduct.has(o.product_sku)) byProduct.set(o.product_sku, { name: o.product_name, rows: [] });
    byProduct.get(o.product_sku).rows.push(o);
  });

  groupsEl.innerHTML = [...byProduct.entries()].sort((a, b) => productSortRank(a[1].name) - productSortRank(b[1].name) || a[1].name.localeCompare(b[1].name)).map(([sku, group]) => {
    const inv = (window._invSnapshotBySku || {})[sku] || {};
    const safetyStock = (window._safetyStockBySku || {})[sku];
    const invColor = (qty) => {
      if (qty == null || safetyStock == null) return 'var(--ink)';
      if (qty < safetyStock) return 'var(--bad-text)';
      if (qty < safetyStock * 1.25) return 'var(--watch-text)';
      return 'var(--good-text)';
    };
    const shopifyQty = inv.shopify != null ? inv.shopify.toLocaleString() : '—';
    const amazonQty = inv.amazon != null ? inv.amazon.toLocaleString() : 'not connected';
    const shopifyColor = invColor(inv.shopify);

    return `
    <div class="card" style="padding:0; margin-bottom:10px; overflow-x:auto;">
      <div style="padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; white-space:nowrap; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <div><strong>${group.name}</strong> <span class="muted" style="font-size:12px;">${sku}</span></div>
          <span style="font-size:13px;">Current Inventory — Shopify: <strong style="font-size:15px; color:${shopifyColor};">${shopifyQty}</strong>${safetyStock != null ? ` <span class="pill clickable-pill watch" style="font-size:11px;" onclick="showSafetyStockDetail('${sku}')">safety stock ${safetyStock.toLocaleString()}</span>` : ''}</span>
          <span style="font-size:13px;">Amazon: <strong style="font-size:15px; color:var(--ink);">${amazonQty}</strong></span>
        </div>
        <span class="muted" style="font-size:12px;">${group.rows.length} open order(s)</span>
      </div>
      <table style="white-space:nowrap;">
        <thead><tr><th></th><th>Order Type</th><th>Component</th><th>Order Health</th><th>ETA</th><th>Status</th><th>Order #</th><th>Vendor</th><th>Qty</th><th style="white-space:normal;">Tracking</th><th>Contact Schedule</th></tr></thead>
        <tbody>${group.rows.map(o => renderOpenOrderRow(o)).join('')}</tbody>
      </table>
    </div>
  `;
  }).join('');
}

async function showSafetyStockDetail(sku) {
  const product = (window._productBySku || {})[sku];
  const displayName = product?.display_name || sku;
  const basis = (window._safetyStockBasisBySku || {})[sku] || 'No rationale on file — this product may not have enough sales history yet for the calculation.';
  const detail = (window._safetyStockDetailBySku || {})[sku];

  // Alex (2026-10-22): "we just really need easy to follow metrics from the text - right now it's
  // too text heavy as a popup." Lead with a compact metric grid built from the same numbers the
  // prose paragraph is generated from; keep the full sentence available but collapsed, for anyone
  // who wants the narrative "why" rather than just the numbers.
  const metricsHtml = detail ? `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:10px;">
      <div><div class="muted" style="font-size:10px;">SERVICE LEVEL ${infoIcon('The % of the time we want to have enough stock on hand to never run out, assuming demand behaves like it has historically. 98% means we accept roughly a 2% chance of a stockout before the next restock arrives.')}</div><div style="font-size:15px; font-weight:700;">${detail.service_level_pct}%</div></div>
      <div><div class="muted" style="font-size:10px;">LEAD TIME ${infoIcon('How many days it takes to get more of this product\'s components once an order is placed — the longest lead time across its preferred vendors. The longer this is, the more buffer stock is needed to survive a bad forecast.')}</div><div style="font-size:15px; font-weight:700;">${detail.lead_time} days</div></div>
      <div><div class="muted" style="font-size:10px;">DAILY DEMAND VARIANCE (σ) ${infoIcon('Standard deviation of daily unit sales over the sample window below. A bigger number means demand swings more day to day, so more buffer is needed to stay covered even on an unusually high-demand day.')}</div><div style="font-size:15px; font-weight:700;">±${Math.round(detail.sigma).toLocaleString()} units/day</div></div>
      <div><div class="muted" style="font-size:10px;">SAMPLE WINDOW ${infoIcon('How many trailing days of real sales history the demand variance figure is calculated from.')}</div><div style="font-size:15px; font-weight:700;">${detail.n_days_sampled} days</div></div>
      <div><div class="muted" style="font-size:10px;">STATISTICAL SAFETY STOCK ${infoIcon('The formula result before the MOQ buffer: Service Level Z-score × Daily Demand Variance × √(Lead Time). This covers demand uncertainty alone.')}</div><div style="font-size:15px; font-weight:700;">${detail.statistical_qty.toLocaleString()} units</div></div>
      <div><div class="muted" style="font-size:10px;">MOQ BUFFER ${infoIcon('An extra multiplier on top of the statistical figure, because our manufacturer requires minimum order quantities — we can\'t top up in small increments, so a bad read on timing leaves a bigger real-world gap than demand variance alone would suggest.')}</div><div style="font-size:15px; font-weight:700;">${detail.buffer_multiplier}x</div></div>
      <div style="grid-column:1 / -1; border-top:1px solid var(--border); margin-top:2px; padding-top:8px;">
        <div class="muted" style="font-size:10px;">FINAL SAFETY STOCK ${infoIcon('Statistical Safety Stock × MOQ Buffer — the actual number this product\'s inventory is checked against everywhere on the dashboard.')}</div><div style="font-size:19px; font-weight:800; color:var(--accent);">${detail.recommended_qty.toLocaleString()} units</div>
      </div>
    </div>
    <details style="margin-bottom:12px;"><summary>Read the full explanation</summary><div class="muted" style="font-size:12px; margin-top:6px; line-height:1.5;">${basis}</div></details>
  ` : `<div style="margin-bottom:12px;">${basis}</div>`;

  let sellThroughBody = '<div class="muted">Loading sell-through data…</div>';
  showDetail(`${displayName} — Safety Stock`, `${metricsHtml}<div id="safety-stock-sellthrough">${sellThroughBody}</div>`);

  if (!product?.product_id) return;
  const todayIso = new Date().toISOString().slice(0, 10);
  const since90 = new Date(); since90.setDate(since90.getDate() - 90);
  const [{ data: histRows }, { data: projRows }] = await Promise.all([
    sb.from('historical_revenue_pct').select('month, net_items_sold').eq('product_id', product.product_id).eq('channel', 'shopify').gte('month', since90.toISOString().slice(0, 7) + '-01'),
    sb.from('monthly_projections').select('projection_month, projected_demand').eq('product_id', product.product_id).gte('projection_month', todayIso.slice(0, 7) + '-01').order('projection_month'),
  ]);

  const actualUnits90 = (histRows || []).reduce((s, r) => s + (Number(r.net_items_sold) || 0), 0);
  const avgDaily = actualUnits90 / 90;

  const monthsSorted = [...(projRows || [])].sort((a, b) => a.projection_month.localeCompare(b.projection_month));
  const next3 = monthsSorted.slice(0, 3).reduce((s, r) => s + (Number(r.projected_demand) || 0), 0);
  const next6 = monthsSorted.slice(0, 6).reduce((s, r) => s + (Number(r.projected_demand) || 0), 0);

  const textHtml = `
    <div style="line-height:1.7; font-size:13px;">
      <div style="margin-bottom:6px;"><strong>Average sell-through (last 90 days):</strong> ${avgDaily.toFixed(1)} units/day — ${Math.round(actualUnits90).toLocaleString()} units total.</div>
      <div style="margin-bottom:6px;"><strong>Projected sell-through (next 90 days):</strong> ${Math.round(next3).toLocaleString()} units.</div>
      <div><strong>Projected sell-through (next 180 days):</strong> ${Math.round(next6).toLocaleString()} units.</div>
    </div>
    <div style="height:110px; margin-top:14px;"><canvas id="safety-stock-chart"></canvas></div>
    <div id="safety-stock-action" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:13px;"></div>
  `;
  const el = document.getElementById('safety-stock-sellthrough');
  if (el) el.innerHTML = textHtml;

  const canvas = document.getElementById('safety-stock-chart');
  if (canvas) {
    new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['Last 90d (actual)', 'Next 90d (projected)', 'Next 180d (projected)'],
        datasets: [{
          data: [Math.round(actualUnits90), Math.round(next3), Math.round(next6)],
          backgroundColor: ['#8A7257', '#C9A876', '#C9A876'],
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 11 } } } },
      },
    });
  }

  // Recommended action -- driven by the same recommendation engine behind the Overview tab,
  // so this never disagrees with it; not a separately-derived heuristic.
  const actionEl = document.getElementById('safety-stock-action');
  if (actionEl) {
    const activeRec = (window._recsCache || []).find(r => r.products?.sku_code === sku && r.urgency !== 'OK');
    if (activeRec) {
      actionEl.innerHTML = `<strong>Recommended action:</strong> Consider placing a PO — order ${(activeRec.recommended_order_qty || 0).toLocaleString()} units by ${fmtDate(activeRec.last_responsible_date)}${activeRec.days_until_deadline < 0 ? ` (already ${-activeRec.days_until_deadline} day(s) overdue)` : ''}. <span class="pill clickable-pill watch" onclick="document.getElementById('detail-modal-backdrop').remove(); showRecommendationDetail('${activeRec.id}')">See full recommendation</span>`;
    } else {
      actionEl.innerHTML = `<strong>Recommended action:</strong> None — the recommendation engine isn't flagging a shortfall for this product right now.`;
    }
  }
}

function productSortRank(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('night oil')) return 0;
  if (n.includes('day spray')) return 1;
  if (n.includes('mud') || n.includes('armpit mud')) return 2;
  if (n.includes('deodorant')) return 3;
  return 4;
}

function componentShortLabel(name) {
  if (!name) return '—';
  const n = name.toLowerCase();
  if (n.includes('dropper')) return 'Droppers';
  if (n.includes('bottle')) return 'Bottles';
  if (n.includes('jar')) return 'Jars';
  if (n.includes('label')) return 'Labels';
  if (n.includes('lid')) return 'Lids';
  if (n.includes('stopper')) return 'Stoppers';
  if (n.includes('ring')) return 'Rings';
  if (n.includes('cap')) return 'Caps';
  if (n.includes('patch')) return 'Patches';
  if (n.includes('pump')) return 'Pumps';
  return name.split(' ').pop();
}

function actionPillClass(action) {
  if (action === 'Overdue') return 'bad';
  if (action === 'On Track') return 'good';
  if (action === 'Paused') return 'watch';
  return 'watch'; // Contact Due, ETA Soon
}

function buildActionDetail(o) {
  const today = new Date().toISOString().slice(0, 10);
  const itemLabel = o.order_type === 'componentry' ? (o.component_name || 'this component') : o.product_name;
  const vendorLabel = o.vendor_name || 'the vendor';
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const qtyFmt = o.qty != null ? o.qty.toLocaleString() : 'an unknown number of';
  const contactWho = o.vendor_contact_name || o.vendor_contact_email
    ? `${o.vendor_contact_name || ''}${o.vendor_contact_name && o.vendor_contact_email ? ' at ' : ''}${o.vendor_contact_email || ''}`
    : vendorLabel;

  const whatOrder = `${qtyFmt} units of ${itemLabel}`;
  const updateClause = o.notes
    ? `The last update we have${o.last_contacted ? ` (${fmtDate(o.last_contacted)})` : ''} is: "${o.notes}."`
    : `There's no update logged${o.placed_date ? ` since it was placed on ${fmtDate(o.placed_date)}` : ''}.`;

  if (o.order_status === 'paused') {
    return `${whatOrder} — this order is paused, so it won't trigger overdue or contact alerts until it's resumed. ${updateClause}`;
  }

  if (o.eta && o.eta < today && !o.landed) {
    const daysOverdue = daysBetween(o.eta, today);
    return `${whatOrder} were due <strong>${fmtDate(o.eta)}</strong> and still haven't landed — that's <strong>${daysOverdue} day(s) late</strong>. ${updateClause} Worth confirming with ${contactWho} to see what's actually going on.`;
  }

  if (o.next_contact && o.next_contact < today) {
    const daysOverdue = daysBetween(o.next_contact, today);
    return `We were supposed to check in with ${vendorLabel} about ${itemLabel} by <strong>${fmtDate(o.next_contact)}</strong>, and that's now <strong>${daysOverdue} day(s) overdue</strong>. ${updateClause} Worth reaching out to ${contactWho} now.`;
  }

  if (o.eta && daysBetween(today, o.eta) <= 14 && daysBetween(today, o.eta) >= 0) {
    const daysUntil = daysBetween(today, o.eta);
    return `${whatOrder} are expected to land <strong>${fmtDate(o.eta)}</strong> — about ${daysUntil} day(s) out. ${updateClause} Worth confirming shipment/tracking with ${contactWho} before it lands.`;
  }

  // On Track
  const nextContactPhrase = o.next_contact ? `we've got a check-in scheduled for ${fmtDate(o.next_contact)}.` : `there's no next check-in scheduled yet.`;
  return `${whatOrder} are on track${o.eta ? `, expected ${fmtDate(o.eta)}` : ''}. ${updateClause} Looking ahead, ${nextContactPhrase}`;
}

function renderPoNumberCell(o, canAct) {

    return canAct
      ? `<button class="btn btn-ghost" style="padding:4px 10px; font-size:12px;" onclick="editPoNumber('${o.ledger_id}')">${value || '+ Add'}</button>`

  }
  return `<span class="pill clickable-pill ${value ? 'good' : 'watch'}" onclick="showPoNumberDetail('${o.ledger_id}')">${value ? 'On File' : 'Missing'}</span>`;
}

function renderTrackingCell(o, canAct) {
  const value = o.tracking_info || null;
  if (window._revealOrderData) {
    return canAct
      ? `<button class="btn btn-ghost" style="padding:4px 10px; font-size:12px; white-space:normal; word-break:break-word;" onclick="editTracking('${o.ledger_id}')">${value || '+ Add'}</button>`
      : (value || '—');
  }
  return `<span class="pill clickable-pill ${value ? 'good' : 'watch'}" onclick="showTrackingDetail('${o.ledger_id}')">${value ? 'On File' : 'Missing'}</span>`;
}

function renderContactScheduleCell(o) {
  const today = new Date().toISOString().slice(0, 10);
  let label, cls;
  if (o.next_contact) {
    label = fmtDate(o.next_contact);
    cls = o.next_contact < today ? 'bad' : 'watch';
  } else if (o.last_contacted) {
    label = `Last ${fmtDate(o.last_contacted)}`;
    cls = 'watch';
  } else {
    label = 'None scheduled';
    cls = 'watch';
  }
  return `<span class="pill clickable-pill ${cls}" onclick="showContactScheduleDetail('${o.ledger_id}')">${label}</span>`;
}

function showContactScheduleDetail(ledgerId) {
  const o = (window._openOrdersCache || []).find(r => r.ledger_id === ledgerId);
  if (!o) return;
  const vendorLabel = o.vendor_name || 'the vendor';
  const rows = [];
  if (o.last_contacted || o.notes) {
    rows.push([fmtDate(o.last_contacted), 'Last contact', o.notes || '<span class="muted">No result logged</span>']);
  }
  if (o.next_contact) {
    rows.push([fmtDate(o.next_contact), 'Next contact', '<span class="muted">Upcoming</span>']);
  }
  const ledgerTable = rows.length > 0
    ? kpiTable(['Date', 'Type', 'Result'], rows, 2)
    : '<div class="muted">No contact history logged for this order yet.</div>';
  const body = `
    ${ledgerTable}
    ${canEdit() ? `
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="document.getElementById('detail-modal-backdrop').remove(); editLastContact('${ledgerId}')">Log a contact</button>

async function createNewOrder(type) {
  const productId = document.getElementById('add-order-product').value;
  const componentId = type === 'componentry' ? document.getElementById('add-order-component').value : null;
  const vendorId = document.getElementById('add-order-vendor').value || null;
  const qty = Number(document.getElementById('add-order-qty').value);
  const eta = document.getElementById('add-order-eta').value || null;
  const orderNumber = document.getElementById('add-order-number').value || null;
  const tracking = document.getElementById('add-order-tracking').value || null;
  const notes = document.getElementById('add-order-notes').value || null;

  if (!qty || qty <= 0) { alert('Enter a quantity greater than 0.'); return; }
  if (type === 'componentry' && !componentId) { alert('Select a component.'); return; }

  const payload = {
    event_date: new Date().toISOString().slice(0, 10),
    event_type: type === 'componentry' ? 'component_order' : 'production_run',
    product_id: type === 'componentry' ? null : productId,
    component_id: type === 'componentry' ? componentId : null,
    vendor_id: vendorId,
    qty_in: qty,
    eta,
    landed: false,
    order_status: 'open',
    order_number: orderNumber,
    tracking_info: tracking,
    notes,
  };
  const { data: inserted, error } = await sb.from('inventory_ledger').insert(payload).select().single();
  if (error) { alert('Failed: ' + error.message); return; }
  document.getElementById('detail-modal-backdrop')?.remove();
  const product = (window._addOrderLookups.products || []).find(p => p.id === productId);
  await logAction('inventory_ledger', inserted.id, 'create', `Added new ${type === 'componentry' ? 'component' : 'finished-good'} order: ${product?.display_name || 'order'}, ${qty.toLocaleString()} units`, null, inserted);
  await Promise.all([renderOverview(), renderComponents(), window._revState ? renderRevenue() : null]);
}

// ---------- Activity log / undo ----------
async function logAction(tableName, recordId, action, description, beforeData, afterData) {
  const { data, error } = await sb.from('activity_log').insert({
    table_name: tableName, record_id: recordId, action, description,
    before_data: beforeData, after_data: afterData, performed_by: currentUserRow?.email || 'dashboard',
  }).select().single();
  if (!error && data) showUndoToast(data.id, description);
}

function showUndoToast(logId, description) {
  document.getElementById('undo-toast')?.remove();
  const toast = document.createElement('div');
  toast.id = 'undo-toast';
  toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2b2420; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; display:flex; align-items:center; gap:12px; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,0.35); max-width:520px;';
  toast.innerHTML = `<span>${description}</span><button style="background:#fff; color:#2b2420; padding:4px 10px; font-size:12px; border-radius:6px; border:none; cursor:pointer; white-space:nowrap;" onclick="undoAction('${logId}')">Undo</button>`;
  document.body.appendChild(toast);
  setTimeout(() => { if (document.getElementById('undo-toast') === toast) toast.remove(); }, 10000);
}

async function undoAction(logId) {
  const { data: log, error } = await sb.from('activity_log').select('*').eq('id', logId).single();
  if (error || !log) { alert('Could not load this action.'); return; }
  if (log.undone) { alert('This action was already undone.'); return; }
  document.getElementById('undo-toast')?.remove();

  if (log.action === 'delete') {
    const { error: insErr } = await sb.from(log.table_name).insert(log.before_data);
    if (insErr) { alert('Undo failed: ' + insErr.message); return; }
  } else if (log.action === 'create') {
    await sb.from(log.table_name).delete().eq('id', log.record_id);
  } else if (log.action === 'split') {
    await sb.from(log.table_name).update({ qty_in: log.before_data.qty_in }).eq('id', log.record_id);
    if (log.after_data?.new_row_id) await sb.from(log.table_name).delete().eq('id', log.after_data.new_row_id);
  } else {
    const { id, ...rest } = log.before_data;
    await sb.from(log.table_name).update(rest).eq('id', log.record_id);
  }
  await sb.from('activity_log').update({ undone: true, undone_at: new Date().toISOString(), undone_by: currentUserRow?.email || 'dashboard' }).eq('id', logId);
  // Undo now applies everywhere (Alex, 2026-10-22: "The undo button functionality should exist
  // everywhere") -- refresh every tab that might show the reverted data, not just Overview/Landed
  // Orders, since an undo can now originate from the Revenue tab (channel/mix/ASP edits, draft
  // POs) or the Components tab (vendor edits) too.
  await Promise.all([
    renderOverview(),
    renderLandedOrders(),
    renderComponents(),
    window._revState ? renderRevenue() : null,
  ]);
  const activityTab = document.getElementById('tab-activity');
  if (activityTab && !activityTab.classList.contains('hidden')) await renderActivityLog();
}

async function mutateLedgerRow(ledgerId, payload, description) {
  const { data: before, error: fetchErr } = await sb.from('inventory_ledger').select('*').eq('id', ledgerId).single();
  if (fetchErr) { alert('Failed: ' + fetchErr.message); return false; }
  const { error } = await sb.from('inventory_ledger').update(payload).eq('id', ledgerId);
  if (error) { alert('Failed: ' + error.message); return false; }
  await logAction('inventory_ledger', ledgerId, 'update', description, before, { ...before, ...payload });
  return true;
}

  let filtered = productFilter === 'all' ? all : all.filter(r => r.product_sku === productFilter);

    if (sortMode === 'date_desc') return (b.date_landed || '').localeCompare(a.date_landed || '');
    if (sortMode === 'date_asc') return (a.date_landed || '').localeCompare(b.date_landed || '');
    if (sortMode === 'qty_desc') return (b.qty || 0) - (a.qty || 0);
    if (sortMode === 'product') return productSortRank(a.product_name) - productSortRank(b.product_name) || a.product_name.localeCompare(b.product_name);
    return 0;
  });

  const rows = filtered.map(r => [
    canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:13px; line-height:1;" onclick="showLandedOrderActionsMenu('${r.ledger_id}')" title="Actions">⋯</button>` : '',

}

// ---------- Components ----------
// Alex (2026-10-22): "we want to have the active component levels with a simplified schedule or
// analysis of how to order them." Scope confirmed with Alex: one row per component (QOH,
// in-flight, vendor, lead time, cadence) plus a simple three-tier status flag -- ORDER_NOW /
// ORDER_SOON / OK -- derived from the SAME root-product 6-month revenue projections the Revenue
// tab uses (live forecast only, not scenario-aware), NOT a full expand_to_component_pos()-style
// exact-date netting. See dashboard/lib/revenue-logic.js's computeComponentRunout/
// componentOrderStatus (unit-tested, 100% coverage) for the actual math.
//
// 2026-10-22 follow-up (Alex): filter by product, edit lead times, support multiple vendors per
// component, initiate a component order from here, and a status pop-out explaining the math PLUS
// whatever the real PO-recommendation engine (Overview tab, agent_recommendations.component_recs
// -- already does exact expand_to_component_pos() netting against actual forecasted shortfall
// POs) separately says about this component, surfaced rather than silently merged into one number.
async function renderComponents() {
  const el = document.getElementById('tab-components');
  el.innerHTML = `<div class="card empty-state">Loading component levels…</div>`;

  const months = nextSixMonths();
  const [{ data: componentQoh }, { data: componentVendors }, { data: products }, { data: revForecasts }, { data: forecastParams }, { data: activeRecs }] = await Promise.all([
    sb.from('component_qoh').select('*'),
    sb.from('component_vendors').select('*, vendors(vendor_name, default_lead_days, default_cadence_days)'),
    sb.from('products').select('id, sku_code, display_name, product_type'),
    sb.from('revenue_forecasts').select('channel, forecast_month, forecast_revenue').gte('forecast_month', months[0] + '-01'),
    sb.from('forecast_params').select('channel, revenue_pct, avg_selling_price, product_id').eq('is_active', true),
    sb.from('agent_recommendations').select('product_id, urgency, last_responsible_date, recommended_order_qty, component_recs').neq('decision', 'dismissed').eq('is_test', false),
  ]);

  const productBySku = {};
  (products || []).forEach(p => { productBySku[p.sku_code] = p; });

  const liveForecast = {};
  (revForecasts || []).forEach(r => {
    const m = r.forecast_month.slice(0, 7);
    if (!liveForecast[m]) liveForecast[m] = {};
    liveForecast[m][r.channel] = Number(r.forecast_revenue);
  });
  // Live mix: same single current value applied to every forward month (no per-month override
  // lookup here, unlike the Revenue tab's scenario machinery) -- a deliberate simplification
  // consistent with Alex's "simplified schedule" framing for this tab.
  const liveMix = { shopify: {}, amazon: {} };
  (forecastParams || []).forEach(fp => {
    liveMix[fp.channel] = liveMix[fp.channel] || {};
    liveMix[fp.channel][fp.product_id] = {};
    months.forEach(m => {
      liveMix[fp.channel][fp.product_id][m] = { revenue_pct: Number(fp.revenue_pct), avg_selling_price: Number(fp.avg_selling_price) };
    });
  });

  // Every active vendor link per component (not just preferred) -- supports multiple vendors UI.
  const vendorsByComponentId = {};
  (componentVendors || []).forEach(cv => {
    if (!vendorsByComponentId[cv.component_id]) vendorsByComponentId[cv.component_id] = [];
    vendorsByComponentId[cv.component_id].push(cv);
  });

  // The REAL PO-recommendation engine's per-component net need, keyed by product_id + component
  // name -- exactly answers "will recommendations be based on future forecasted POs?": yes, this
  // IS that calculation (po_recommendations.py's expand_to_component_pos(), already computed for
  // the Overview tab), surfaced here rather than rebuilt. Kept visibly separate from this tab's
  // own simplified estimate, never silently merged into one number.
  const backendRecByProductAndComponent = {};
  (activeRecs || []).forEach(rec => {
    (rec.component_recs || []).forEach(cr => {
      backendRecByProductAndComponent[`${rec.product_id}::${cr.component_name}`] = { ...cr, urgency: rec.urgency, last_responsible_date: rec.last_responsible_date };
    });
  });

  const rows = (componentQoh || []).map(c => {
    const product = productBySku[c.product_sku];
    const demandUnits = product
      ? window.RevenueLogic.computeMonthlyDemandUnits({ product: { product_id: product.id }, months, channelData: liveForecast, mixData: liveMix })
      : months.map(() => 0);
    const consumption = demandUnits.map(d => d * (c.qty_per_unit || 1));
    const startQty = (c.qty_on_hand || 0) + (c.qty_in_flight || 0);
    const runOutMonthIndex = window.RevenueLogic.computeComponentRunout(startQty, consumption);
    const allVendorLinks = (vendorsByComponentId[c.component_id] || []).slice().sort((a, b) => (b.is_preferred ? 1 : 0) - (a.is_preferred ? 1 : 0));
    const preferred = allVendorLinks.find(v => v.is_preferred) || allVendorLinks[0];
    const leadDays = preferred?.lead_days ?? preferred?.vendors?.default_lead_days ?? 56;
    const cadenceDays = preferred?.contact_cadence_days ?? preferred?.vendors?.default_cadence_days ?? 14;
    const status = window.RevenueLogic.componentOrderStatus({ runOutMonthIndex, leadDays, cadenceDays });
    const backendRec = product ? backendRecByProductAndComponent[`${product.id}::${c.component_name}`] : null;
    return { c, product, preferred, allVendorLinks, leadDays, cadenceDays, status, runOutMonthIndex, demandUnits, consumption, startQty, backendRec };
  });
  window._componentsCache = { rows, months };

  renderComponentsTable();
}

  let filtered = productFilter === 'all' ? rows : rows.filter(r => r.c.product_sku === productFilter);

    window.RevenueLogic.componentStatusRank(a.status) - window.RevenueLogic.componentStatusRank(b.status)
    || a.c.component_name.localeCompare(b.c.component_name)
  );

  const statusPill = { ORDER_NOW: 'bad', ORDER_SOON: 'watch', OK: 'good' };

    return [
      `<strong>${c.component_name}</strong>`,
      `${c.product_name}<br><span class="muted" style="font-size:10px;">${c.product_sku}</span>`,
      (c.qty_on_hand || 0).toLocaleString(),
      (c.qty_in_flight || 0).toLocaleString(),
      `<button class="btn btn-ghost" style="padding:3px 6px; font-size:11px;" onclick="manageComponentVendors('${c.component_id}')">
        ${preferred?.vendors?.vendor_name || '<span class="muted">none set</span>'}${allVendorLinks.length > 1 ? ` <span class="muted">(+${allVendorLinks.length - 1})</span>` : ''}
      </button>`,
      `<button class="btn btn-ghost" style="padding:3px 6px; font-size:11px;" onclick="manageComponentVendors('${c.component_id}')">${leadDays}d</button>`,
      `${cadenceDays}d`,
      `<button class="btn btn-ghost" style="padding:0;" onclick="showComponentStatusDetail('${c.component_id}')">
        <span class="pill ${statusPill[status]}">${statusLabel[status]}</span>${hasShortfallSignal && status === 'OK' ? ' <span class="pill watch" title="The full PO-recommendation engine flags a real component shortfall — click for detail">⚠</span>' : ''}
      </button>`,
      runOutMonthIndex == null ? '<span class="muted">beyond 6 months</span>' : `~${monthLabelLong(months[runOutMonthIndex])}`,
      canEdit() ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:11px;" onclick="orderComponentFromComponentsTab('${c.component_id}', '${r.product?.id || ''}')">+ Order</button>` : '',
    ];
  });

  el.innerHTML = `
    <div class="card" style="padding:14px 16px;">
      <div class="section-label" style="margin:0 0 2px;">Active Component Levels</div>
      <div class="muted" style="font-size:11px; margin-bottom:10px;">
        One row per raw component. Status is a simplified estimate: it projects each component's
        on-hand + in-flight quantity against the root product's current revenue forecast (live
        forecast only — not scenario-aware) and compares the runout date to the vendor's lead time
        + contact cadence. Click Status for the full rationale, including what the real
        PO-recommendation engine (Overview tab) separately says. Sorted Order Now / Order Soon / OK.
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <select id="components-product-filter" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:12px;" onchange="setComponentsProductFilter(this.value)">
          <option value="all" ${productFilter === 'all' ? 'selected' : ''}>All products</option>
          ${uniqueProducts.map(([sku, name]) => `<option value="${sku}" ${productFilter === sku ? 'selected' : ''}>${name}</option>`).join('')}
        </select>
      </div>
      ${tableRows.length
        ? kpiTable(['Component', 'Product', 'QOH', 'In-Flight', 'Vendor', 'Lead Time', 'Cadence', 'Status', 'Runs Out', ''], tableRows, null, null, [2, 3, 4, 5, 6, 7, 8, 9])
        : '<div class="empty-state">No components match this filter.</div>'}
    </div>
  `;
}

function showComponentStatusDetail(componentId) {
  const { rows, months } = window._componentsCache || { rows: [], months: [] };
  const r = rows.find(row => row.c.component_id === componentId);
  if (!r) return;
  const { c, preferred, leadDays, cadenceDays, status, runOutMonthIndex, consumption, startQty, backendRec } = r;
  const statusLabel = { ORDER_NOW: 'Order Now', ORDER_SOON: 'Order Soon', OK: 'OK' };

  let running = startQty;
  const monthRows = months.map((m, i) => {
    running -= consumption[i];
    return `<tr><td style="padding:4px 8px;">${monthLabelShort(m)}</td><td style="padding:4px 8px;">${Math.round(consumption[i]).toLocaleString()}</td><td style="padding:4px 8px; ${running < 0 ? 'color:var(--bad-text);' : ''}">${Math.round(running).toLocaleString()}</td></tr>`;
  }).join('');

  const recommendationSentence = status === 'ORDER_NOW'
    ? `Order now — projected to run out around ${monthLabelLong(months[runOutMonthIndex])}, which is inside ${preferred?.vendors?.vendor_name || 'the vendor'}'s ${leadDays}-day lead time.`
    : status === 'ORDER_SOON'
    ? `Start the conversation soon — projected to run out around ${monthLabelLong(months[runOutMonthIndex])}, which is within one contact-cadence window (${cadenceDays}d) past the ${leadDays}-day lead time.`
    : `No action needed right now — ${runOutMonthIndex == null ? "doesn't project to run out within the 6-month horizon" : `runout (${monthLabelLong(months[runOutMonthIndex])}) is comfortably beyond lead time + cadence`}.`;

  const body = `
    <div style="font-size:13px; line-height:1.5;">
      <div style="padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:8px;"><strong>Recommendation:</strong> ${recommendationSentence}</div>

      <div class="section-label" style="margin:0 0 4px; font-size:11px;">Full Recommendation Engine (Overview tab)</div>
      ${backendRec ? `
        <div class="muted" style="font-size:12px; margin-bottom:4px;">
          Netted against a real active PO-shortfall recommendation
          (<span class="urgency-badge urgency-${backendRec.urgency}" style="font-size:9px;">${backendRec.urgency}</span>,
          due by ${fmtDate(backendRec.last_responsible_date)}) — accounts for the actual forecasted finished-good PO,
          not just smoothed continuous demand.
        </div>
        <div style="font-size:12px; margin-bottom:8px;">Net need: <strong>${(backendRec.net_need || 0).toLocaleString()}</strong> · MOQ: ${(backendRec.moq || 0).toLocaleString()} · <strong>Order ${(backendRec.order_qty || 0).toLocaleString()} units from ${backendRec.vendor}</strong></div>
      ` : `<div class="muted" style="font-size:12px; margin-bottom:8px;">No active PO-shortfall recommendation currently references this component.</div>`}

      <details>
        <summary>Show this tab's quick estimate</summary>
        <div class="muted" style="font-size:11px; margin-bottom:6px;">
          Starting stock: ${(c.qty_on_hand || 0).toLocaleString()} on hand + ${(c.qty_in_flight || 0).toLocaleString()} in-flight
          = <strong>${startQty.toLocaleString()}</strong> available, consumed at ${c.qty_per_unit || 1} unit${c.qty_per_unit === 1 ? '' : 's'}/finished unit against the root product's live revenue forecast.
        </div>
        <table style="width:100%; font-size:12px; border-collapse:collapse; margin-bottom:6px;">
          <thead><tr><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Month</th><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Consumed</th><th style="text-align:left; padding:3px 8px; border-bottom:1px solid var(--border);">Running Balance</th></tr></thead>
          <tbody>${monthRows}</tbody>
        </table>
        <div class="muted" style="font-size:11px;">Vendor lead time: ${leadDays} days. Contact cadence: ${cadenceDays} days.</div>
      </details>
    </div>
  `;
  showDetail(`${c.component_name} — Why "${statusLabel[status]}"?`, body, 'wide');
}

// ---------- Component vendor management (multiple vendors per component, lead time/cadence/MOQ edits) ----------
async function manageComponentVendors(componentId) {
  const { rows } = window._componentsCache || { rows: [] };
  const row = rows.find(r => r.c.component_id === componentId);
  if (!row) return;
  const componentName = row.c.component_name;

  const [{ data: links }, { data: allVendors }] = await Promise.all([
    sb.from('component_vendors').select('*, vendors(vendor_name)').eq('component_id', componentId),
    sb.from('vendors').select('id, vendor_name').eq('is_active', true).order('vendor_name'),
  ]);
  const sortedLinks = (links || []).slice().sort((a, b) => (b.is_preferred ? 1 : 0) - (a.is_preferred ? 1 : 0));
  const linkedVendorIds = new Set(sortedLinks.map(l => l.vendor_id));
  const unlinkedVendors = (allVendors || []).filter(v => !linkedVendorIds.has(v.id));

  const rowsHtml = sortedLinks.map(l => `
    <div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; flex-wrap:wrap;">
      <input type="radio" name="preferred-vendor" ${l.is_preferred ? 'checked' : ''} ${canEdit() ? '' : 'disabled'} onchange="setPreferredComponentVendor('${componentId}','${l.id}')" title="Set as preferred">
      <div style="flex:1; min-width:100px;"><strong>${l.vendors?.vendor_name}</strong>${l.is_preferred ? ' <span class="pill good" style="font-size:9px;">preferred</span>' : ''}</div>
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:11px;" onclick="editComponentVendorField('${l.id}','lead_days','Lead Time (days, blank = use vendor default)',${l.lead_days ?? 'null'})">${l.lead_days != null ? l.lead_days + 'd lead' : 'default lead'}</button>` : `<span class="muted">${l.lead_days != null ? l.lead_days + 'd lead' : 'default lead'}</span>`}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:11px;" onclick="editComponentVendorField('${l.id}','contact_cadence_days','Contact Cadence (days, blank = use vendor default)',${l.contact_cadence_days ?? 'null'})">${l.contact_cadence_days != null ? l.contact_cadence_days + 'd cadence' : 'default cadence'}</button>` : ''}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:11px;" onclick="editComponentVendorField('${l.id}','moq','MOQ (blank = none)',${l.moq ?? 'null'})">${l.moq != null ? 'MOQ ' + l.moq : 'no MOQ'}</button>` : ''}
      ${canDelete() && sortedLinks.length > 1 ? `<button class="btn btn-ghost" style="padding:2px 6px; font-size:11px; color:var(--bad-text);" onclick="removeComponentVendor('${l.id}','${componentId}')">Remove</button>` : ''}
    </div>
  `).join('');

  const addSection = canEdit()
    ? (unlinkedVendors.length ? `
      <div style="margin-top:12px; display:flex; gap:6px; align-items:center;">
        <select id="add-component-vendor-select" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--border); font-size:12px;">
          ${unlinkedVendors.map(v => `<option value="${v.id}">${v.vendor_name}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="addComponentVendor('${componentId}')">+ Add Vendor</button>
      </div>
    ` : '<div class="muted" style="font-size:11px; margin-top:8px;">All active vendors are already linked to this component.</div>')
    : '';

  showDetail(`${componentName} — Vendors`, `${rowsHtml || '<div class="muted">No vendors linked yet.</div>'}${addSection}`);
}

async function setPreferredComponentVendor(componentId, linkId) {
  await sb.from('component_vendors').update({ is_preferred: false }).eq('component_id', componentId);
  const { error } = await sb.from('component_vendors').update({ is_preferred: true }).eq('id', linkId);
  if (error) { alert('Failed: ' + error.message); return; }
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

async function editComponentVendorField(linkId, field, label, currentVal) {
  const input = await showPromptModal(label, null, currentVal ?? '', 'number');
  if (input === null) return;
  const val = input === '' ? null : Number(input);
  const { data: before } = await sb.from('component_vendors').select('*').eq('id', linkId).single();
  const { data: link, error } = await sb.from('component_vendors').update({ [field]: val }).eq('id', linkId).select('*, components(component_name)').single();
  if (error) { alert('Failed: ' + error.message); return; }
  await logAction('component_vendors', linkId, 'update', `Edited ${link.components?.component_name || 'component'}'s ${field.replace(/_/g, ' ')}: ${before?.[field] ?? '—'} → ${val ?? '—'}`, before, link);
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  if (link) await manageComponentVendors(link.component_id);
}

async function addComponentVendor(componentId) {
  const vendorId = document.getElementById('add-component-vendor-select')?.value;
  if (!vendorId) return;
  const { data, error } = await sb.from('component_vendors').insert({ component_id: componentId, vendor_id: vendorId, is_preferred: false }).select('*, vendors(vendor_name), components(component_name)').single();
  if (error) { alert('Failed: ' + error.message); return; }
  await logAction('component_vendors', data.id, 'create', `Added vendor ${data.vendors?.vendor_name || ''} to ${data.components?.component_name || 'component'}`, null, data);
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

async function removeComponentVendor(linkId, componentId) {
  if (!(await showConfirmModal('Remove this vendor link?', 'This does not affect past orders, only future vendor selection for this component.', 'Remove'))) return;
  const { data: before } = await sb.from('component_vendors').select('*, vendors(vendor_name), components(component_name)').eq('id', linkId).single();
  const { error } = await sb.from('component_vendors').delete().eq('id', linkId);
  if (error) { alert('Failed: ' + error.message); return; }
  if (before) {
    const { vendors, components, ...beforeRaw } = before;
    await logAction('component_vendors', linkId, 'delete', `Removed vendor ${vendors?.vendor_name || ''} from ${components?.component_name || 'component'}`, beforeRaw, null);
  }
  document.getElementById('detail-modal-backdrop')?.remove();
  await renderComponents();
  await manageComponentVendors(componentId);
}

// Reuses the Overview tab's existing Add Order flow (same creation path as "+ Add Order" ->

// order_type='finished_good' filter fixed earlier this session). Optionally pre-filled with a
// recommended qty/month/vendor -- "If the Status is Issue it should also come with a recommended

async function initiateLivePoFromOutlook(productId, recommendedQty, recommendedMonth, recommendedVendorId) {
  if (!canEdit()) { alert('You do not have permission to create orders.'); return; }
  if (!window._addOrderLookups) {
    const [{ data: products }, { data: vendors }] = await Promise.all([
      sb.from('products').select('id, sku_code, display_name').eq('is_active', true),
      sb.from('vendors').select('id, vendor_name').order('vendor_name'),
    ]);
    window._addOrderLookups = {
      products: (products || []).sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name)),
      vendors: vendors || [],
    };
  }
  await showAddOrderForm('finished_good');
  const productSel = document.getElementById('add-order-product');
  if (productSel) productSel.value = productId;

  }
}
