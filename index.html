    { key: 'units', label: 'Units (Throughput)' },
    { key: 'outlook', label: 'Inventory Outlook' },
  ].map(v => `<button class="btn ${mixView === v.key ? 'btn-primary' : 'btn-ghost'}" style="padding:5px 10px; font-size:13px;" onclick="setRevenueMixView('${v.key}')">${v.label}</button>`).join(' ');

  if (!S.mixSort) S.mixSort = { shopify: { key: 'revenue', dir: 'desc' }, amazon: { key: 'revenue', dir: 'desc' } };
  const mixFilterText = (S.mixFilterText || '').trim().toLowerCase();

  function productMixMetrics(channel, p) {
    return window.RevenueLogic.productMixMetrics({ channel, product: p, months, draftMix: S.draftMix, draftChannel: S.draftChannel });
  }

  // Alex (2026-10-22): "the sort by picklist values don't make sense in combination with some of
  // the different views" -- e.g. sorting by "% Share" while looking at the Units view doesn't
  // correspond to what's on screen. Options are now scoped to what's actually visible in the
  // current view (plus Revenue/Name, which are always meaningful regardless of view), and the
  // sort key auto-follows the view when you switch views (see setRevenueMixView) unless you've
  // deliberately picked something else since.
  const mixSortOptionsByView = {
    pct: [{ key: 'pct', label: '% Share (current month)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
    asp: [{ key: 'asp', label: 'Avg Selling Price (current)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
    units: [{ key: 'units', label: 'Units (6-mo total)' }, { key: 'revenue', label: 'Revenue (6-mo total)' }, { key: 'name', label: 'Product Name' }],
  };
  const mixSortOptions = mixSortOptionsByView[mixView] || mixSortOptionsByView.units;

  // Alex (2026-11-05): "I also want to be able to filter by multi select skus so I can look at
  // only patches and 14oz for example." Separate from the existing free-text filter (kept as-is,
  // ANDed together) -- a dedicated checkbox-list picker scoped to the SKUs actually present in
  // the Product Mix table (S.liveMix), so there's never a stale SKU in the list for a product
  // that's been retired/inactive.
  const selectedSkuIds = S.mixSkuFilter && S.mixSkuFilter.length ? new Set(S.mixSkuFilter) : null;
  const skuFilterBar = `
    <button class="btn btn-ghost" style="padding:5px 10px; font-size:13px;" onclick="toggleMixSkuFilterMenu(event)">
      SKUs${selectedSkuIds ? ` <span class="pill good" style="margin-left:4px;">${selectedSkuIds.size}</span>` : ''} ▾
    </button>
    ${selectedSkuIds ? `<button class="btn btn-ghost" style="padding:4px 8px; font-size:12px;" onclick="setMixSkuFilter([])">Clear</button>` : ''}
  `;

  // Alex (2026-11-06): "we can remove ... the filter by products open text now that we have the
  // multiselect picklist." Free-text filter input removed; the SKU multi-select picker (below)
  // is now the only product filter on this table.
  const mixFilterBar = skuFilterBar;

  const mixSortControls = (channel) => {
    const sort = S.mixSort[channel];
    return `
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <span class="muted" style="font-size:12px;">Sort by:</span>
        <select style="padding:3px 6px; font-size:12px; border-radius:6px; border:1px solid var(--border);" onchange="setMixSortKey('${channel}', this.value)">
          ${mixSortOptions.map(o => `<option value="${o.key}" ${sort.key === o.key ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="toggleMixSortDir('${channel}')">${sort.dir === 'desc' ? '↓ High → Low' : '↑ Low → High'}</button>
      </div>
    `;
  };

  const mixTable = (channel) => {
    const sort = S.mixSort[channel];
    let prods = S.products.filter(p => S.liveMix[channel]?.[p.product_id]);
    if (mixFilterText) prods = prods.filter(p => p.display_name.toLowerCase().includes(mixFilterText) || (p.sku_code || '').toLowerCase().includes(mixFilterText));
    if (selectedSkuIds) prods = prods.filter(p => selectedSkuIds.has(p.product_id));
    const withMetrics = prods.map(p => ({ p, metrics: productMixMetrics(channel, p) }));
    // sort.key may be left over from a different view (e.g. 'pct' while now viewing ASP) if the
    // user switched views via setRevenueMixView's "don't clobber a deliberate choice" rule after
    // having picked something odd; fall back to this view's primary metric rather than erroring.
    const effectiveSortKey = mixSortOptions.some(o => o.key === sort.key) ? sort.key : mixSortOptions[0].key;
    const orderedProds = window.RevenueLogic.sortByMetric(
      withMetrics.map(x => ({ item: x.p, metrics: x.metrics })),
      { key: effectiveSortKey, dir: sort.dir, nameOf: (item) => item.display_name, fallbackRank: (item) => productSortRank(item.display_name) }
    );
    if (!orderedProds.length) return mixSortControls(channel) + `<div class="empty-state" style="padding:10px; font-size:13px;">No products match this filter.</div>`;
    // Alex (2026-11-05): trailing-history columns -- Shopify only (no equivalent Amazon
    // ingestion, same limit as the ASP/pct popups already carried). Amazon gets a plain "no
    // history" cell per column instead of silently showing nothing or fabricating a number.
    // Alex (2026-11-06): "The month over month change should be simply a green or red with a
    // percentage change from last month. Right now it's only showing on current month - it
    // should show for any historical months being presented. I don't get any value out of the
    // percentage change vs actual." Rebuilt as one combined, left-to-right value series per
    // product (real trailing-history months first, then the projected/draft months), so every
    // column -- history AND projected -- gets a delta vs. whatever column sits immediately to
    // its left on screen. No more "vs actual" special case; it's always just "vs the previous
    // column shown," period.
    const seriesValue = (p, m, isHistory, isPctView) => {
      if (isHistory) {
        if (channel !== 'shopify') return null;
        const hist = isPctView ? S.historicalPctByProduct[p.product_id] : S.historicalAspByProduct[p.product_id];
        const row = (hist || []).find(h => h.month === m);
        return row ? (isPctView ? row.pct : row.asp) : null;
      }
      const mix = S.draftMix[channel][p.product_id]?.[m];
      if (!mix) return null;
      return isPctView ? mix.revenue_pct : mix.avg_selling_price;
    };
    // Alex (2026-11-06): "I want to see it represented as simply a comparison from last month
    // not the true percentage increase." Switched off relative (compound) % change -- a swing
    // from 24% to 18% was reading as a dramatic "-25%" when the simple, useful fact is "-6 pts."
    // % of Revenue now shows a plain percentage-POINT difference; ASP shows a plain dollar
    // difference. Both are "this vs. last month," not "growth rate."
    const momDelta = (p, colIndex, isPctView) => {
      if (!S.showMoMDelta || colIndex === 0) return '';
      const allCols = [...historyMonths.map(m => ({ m, isHistory: true })), ...months.map(m => ({ m, isHistory: false }))];
      const curVal = seriesValue(p, allCols[colIndex].m, allCols[colIndex].isHistory, isPctView);
      const prevVal = seriesValue(p, allCols[colIndex - 1].m, allCols[colIndex - 1].isHistory, isPctView);
      if (curVal == null || prevVal == null) return '';
      const up = curVal > prevVal;
      const color = up ? 'var(--good-text)' : (curVal < prevVal ? 'var(--bad-text)' : 'var(--muted)');
      if (isPctView) {
        const ptsDiff = (curVal - prevVal) * 100;
        if (Math.abs(ptsDiff) < 0.05) return `<div style="font-size:11px; font-weight:700; color:var(--muted); margin-top:2px;">flat</div>`;
        return `<div style="font-size:11px; font-weight:700; color:${color}; margin-top:2px;">${up ? '+' : ''}${ptsDiff.toFixed(1)} pts</div>`;
      }
      const dollarDiff = curVal - prevVal;
      if (Math.abs(dollarDiff) < 0.005) return `<div style="font-size:11px; font-weight:700; color:var(--muted); margin-top:2px;">flat</div>`;
      return `<div style="font-size:11px; font-weight:700; color:${color}; margin-top:2px;">${up ? '+' : ''}${fmtMoney2(dollarDiff)}</div>`;
    };
    // Alex (2026-11-06): "If the product wasn't sold yet - let's have a label there instead of it
    // being blank." A history column with no row is ambiguous between "not launched yet" and
    // "launched but zero units" -- distinguish using the product's EARLIEST real history month
    // (if we have ANY row for it at all, elsewhere in the fetched window) vs. truly no row ever.
    const earliestHistoryMonth = (p) => {
      const hist = mixView === 'asp' || mixView === 'units' ? S.historicalAspByProduct[p.product_id] : S.historicalPctByProduct[p.product_id];
      return hist && hist.length ? hist[0].month : null;
    };
    const historyCell = (p, m, colIndex) => {
      if (channel !== 'shopify') return '<span class="muted" style="font-size:11px;">No Amazon history</span>';
      const earliest = earliestHistoryMonth(p);
      const notYetLaunched = earliest != null && m < earliest;
      if (mixView === 'pct') {
        const row = (S.historicalPctByProduct[p.product_id] || []).find(h => h.month === m);
        if (row) return `<span style="font-size:13px;"><strong>${(row.pct * 100).toFixed(1)}%</strong>${momDelta(p, colIndex, true)}</span>`;
        return notYetLaunched ? '<span class="muted" style="font-size:12px;">Not sold yet</span>' : '<span class="muted">—</span>';
      }
      if (mixView === 'asp') {
        const row = (S.historicalAspByProduct[p.product_id] || []).find(h => h.month === m);
        if (row) return `<span style="font-size:13px;"><strong>${fmtMoney2(row.asp)}</strong>${momDelta(p, colIndex, false)}</span>`;
        return notYetLaunched ? '<span class="muted" style="font-size:12px;">Not sold yet</span>' : '<span class="muted">—</span>';
      }
      if (mixView === 'units') {
        const row = (S.historicalAspByProduct[p.product_id] || []).find(h => h.month === m);
        if (row) return `<span style="font-size:13px;"><strong>${row.units.toLocaleString()}</strong></span>`;
        return notYetLaunched ? '<span class="muted" style="font-size:12px;">Not sold yet</span>' : '<span class="muted">—</span>';
      }
      return '<span class="muted">—</span>';
    };
    const rows = orderedProds.map(p => [
      `<span class="pill clickable-pill good" style="font-size:15px; font-weight:700;" onclick="showProductTrendChart('${p.product_id}','${channel}')" title="Click to see the % of Revenue trend line for this product">${p.display_name}</span>`,
      ...historyMonths.map((m, hi) => historyCell(p, m, hi)),
      ...months.map((m, mi) => {
        const mix = S.draftMix[channel][p.product_id]?.[m];
        const chanRev = S.draftChannel[m]?.[channel];
        if (!mix) return '<span class="muted">—</span>';
        const colIndex = historyMonths.length + mi;
        if (mixView === 'pct') {
          return `<button class="btn btn-ghost" style="padding:4px 7px; font-size:14px; display:flex; flex-direction:column; align-items:center;" onclick="showMixCellDetail('pct','${channel}','${p.product_id}','${m}')"><strong>${(mix.revenue_pct * 100).toFixed(1)}%</strong>${momDelta(p, colIndex, true)}</button>`;
        }
        if (mixView === 'asp') {
          // Alex (2026-11-05): "The icon and the red or green text under the price is what's not
          // necessary" -- the ALWAYS-ON up/down arrow + colored $/% delta line is gone; this
          // button only shows one again when the opt-in toggle above is on, and (2026-11-06)
          // simplified to plain green/red % with no icon, consistent with the history columns.
          return `<button class="btn btn-ghost" style="padding:4px 7px; font-size:14px; display:flex; flex-direction:column; align-items:center;" onclick="showMixCellDetail('asp','${channel}','${p.product_id}','${m}')"><strong>${fmtMoney2(mix.avg_selling_price)}</strong>${momDelta(p, colIndex, false)}</button>`;
        }
        if (chanRev == null) return '<span class="muted">—</span>';
        const units = Math.round((chanRev * mix.revenue_pct) / mix.avg_selling_price);
        return `<button class="btn btn-ghost" style="padding:4px 7px; font-size:14px;" onclick="showThroughputDetail('${p.product_id}','${m}')"><strong>${units.toLocaleString()}</strong></button>`;
      }),
    ]);
    if (mixView === 'pct') {
      const totals = months.map(m => orderedProds.reduce((s, p) => s + (S.draftMix[channel][p.product_id]?.[m]?.revenue_pct || 0), 0) * 100);
      const historyTotals = historyMonths.map(m => channel === 'shopify'
        ? orderedProds.reduce((s, p) => s + ((S.historicalPctByProduct[p.product_id] || []).find(h => h.month === m)?.pct || 0), 0) * 100
        : null);
      // Alex (2026-10-22): "Why ... aren't the percentages equal to 100%? Is it due to shipping?"
      // Yes (for Shopify) -- revenue_pct is each product's share of TOTAL gross revenue, and gross
      // revenue includes shipping, which no product line claims a share of. Show the expected
      // shipping/other share alongside the product total instead of just flagging a bare "bad" pill
      // whenever product-only % falls short of 100 by roughly that amount.
      const shippingPct = (S.shippingShareByChannel?.[channel] || 0) * 100;
      const expectedTotal = 100 - shippingPct;
      rows.push([
        `<em>Product Total</em>${shippingPct > 0.5 ? `<br><span class="muted" style="font-size:11px;">+ ~${shippingPct.toFixed(1)}% shipping/other (trailing actual, not in any product's %)</span>` : ''}`,
        ...historyTotals.map(t => t == null ? '<span class="muted" style="font-size:11px;">—</span>' : `<span class="pill" style="font-size:11px;">${t.toFixed(1)}%</span>`),
        ...totals.map(t => {
          const diffFromExpected = Math.abs(t - expectedTotal);
          const ok = diffFromExpected < 2.5;
          const title = shippingPct > 0.5
            ? `${t.toFixed(1)}% product + ~${shippingPct.toFixed(1)}% shipping ≈ ${(t + shippingPct).toFixed(1)}% of gross revenue`
            : `${t.toFixed(1)}% of gross revenue`;
          return `<span class="pill ${ok ? 'good' : 'bad'}" title="${title}">${t.toFixed(1)}%</span>`;
        }),
      ]);
    }
    const allColWidths = historyMonths.length ? [monthColWidths[0], ...historyColWidths, ...monthColWidths.slice(1)] : monthColWidths;
    const noWrapCols = Array.from({ length: historyMonths.length + 6 }, (_, i) => i + 1);
    return mixSortControls(channel) + kpiTable(['Product', ...historyMonths.map(m => monthLabelShort(m)), ...months.map(monthLabelShortWithCurrentFlag)], rows, null, allColWidths, noWrapCols);
  };


  // ---------- Inventory Outlook & Draft POs (compact, one row per product) ----------
  // Root products only -- Alex (2026-10-22): "this should only be for the root products, not
  // bundles ... we don't create POs per the bundle." Bundles (product_type='bundle', e.g. the
  // Day+Night Set) have no QOH/PO of their own; their inventory depends entirely on the root
  // products they're built from, which already appear in this table on their own rows.
  let outlookProducts = S.products
    .filter(p => p.product_type === 'root')
    .filter(p => S.liveMix.shopify?.[p.product_id] || S.liveMix.amazon?.[p.product_id]);
  if (mixFilterText) outlookProducts = outlookProducts.filter(p => p.display_name.toLowerCase().includes(mixFilterText) || (p.sku_code || '').toLowerCase().includes(mixFilterText));
  if (selectedSkuIds) outlookProducts = outlookProducts.filter(p => selectedSkuIds.has(p.product_id));
  outlookProducts = outlookProducts
    .slice()
    .sort((a, b) => {
      const ua = window.RevenueLogic.urgencyRank(S.activeRecByProduct[a.product_id]);
      const ub = window.RevenueLogic.urgencyRank(S.activeRecByProduct[b.product_id]);
      return ua - ub || (productSortRank(a.display_name) - productSortRank(b.display_name));
    });
  const projections = computeProjection(S.draftChannel, S.draftMix);
  // Alex (2026-10-22): "it's unclear to me what those numbers represent — are they ending month
  // inventory numbers? ... [and confusion about] starting month inventory and now you can pull
  // starting inventory as of today." Answer: yes, every month column is a projected
  // END-of-month figure (headers now say "EOM" explicitly) -- and a separate, non-projected
  // "Today" column shows the live current QOH those projections start from, so the live snapshot
  // is never confused with either a month-start or month-end number.
  const outlookRows = outlookProducts.map(p => {
    const series = projections[p.sku_code] || [];
    const urgency = S.activeRecByProduct[p.product_id];
    const nameCell = `<strong>${p.display_name}</strong>${urgency ? ` <span class="urgency-badge urgency-${urgency}" style="margin-left:4px; font-size:10px; padding:1px 5px;">${urgency}</span>` : ''}`;
    const todayCell = `<div style="text-align:center; font-size:12px;"><strong>${Math.round(p.qty_on_hand || 0).toLocaleString()}</strong><br><span class="muted" style="font-size:10px;">live, today</span></div>`;
    const cells = months.map((m, i) => {
      const eom = series[i];
      const hasDraft = (S.draftPOs || []).some(po => po.product_id === p.product_id && po.eta_month.slice(0, 7) === m);
      if (eom == null) return '<span class="muted">—</span>';
      const safety = p.safety_stock_qty || 0;
      const bg = eom < 0 ? 'var(--bad-bg)' : (eom < safety ? '#EFEAE2' : 'transparent');
      const color = eom < 0 ? 'var(--bad-text)' : (eom < safety ? 'var(--accent-light)' : 'inherit');
      return `<button class="btn btn-ghost" style="padding:4px 6px; font-size:12px; display:flex; flex-direction:column; align-items:center; line-height:1.25; background:${bg}; color:${color}; border-color:transparent;" onclick="showThroughputDetail('${p.product_id}','${m}')" title="${monthLabelLong(m)}${i === 0 ? ' — month in progress, projected from today' : ' — projected end-of-month'}">
        <span><strong>${Math.round(eom).toLocaleString()}</strong></span>
        ${i === 0 ? '<span style="font-size:10px;">in progress</span>' : ''}
        ${hasDraft ? '<span style="font-size:10px;">+draft</span>' : ''}
      </button>`;
    });
    // Alex (2026-10-22): "to the right of EOM Mar 27 let's have a Status where it'll show healthy
    // or an issue and then a pop up box with the recommendations."
    const outlookStatus = window.RevenueLogic.computeOutlookStatus({ series, safetyStock: p.safety_stock_qty || 0 });
    // "Why doesn't it show up in the Product Mix Inventory outlook as an issue" (Alex, 2026-10-22)
    // -- this tab's own quick continuous-demand estimate and the real lead-time/MOQ-aware
    // PO-recommendation engine (Overview tab) can genuinely disagree. When the real engine has an
    // ACTIVE (non-dismissed) finding but this tab's own quick check says Healthy, flag it visibly
    // right on the pill rather than only in the popup -- so a disagreement is never silently
    // invisible at a glance.
    const activeBackendRec = S.activeRecFullByProduct?.[p.product_id];
    const disagrees = outlookStatus.status === 'HEALTHY' && !!activeBackendRec;
    const statusCell = `<button class="btn btn-ghost" style="padding:0;" onclick="showOutlookStatusDetail('${p.product_id}')" title="${disagrees ? 'The Overview tab recommendation engine has an active finding for this product that this quick check does not catch -- click for details.' : ''}">
      <span class="pill ${outlookStatus.status === 'HEALTHY' ? 'good' : 'bad'}">${outlookStatus.status === 'HEALTHY' ? 'Healthy' : 'Issue'}</span>${disagrees ? ' <span class="pill watch" style="margin-left:2px;">⚠ engine disagrees</span>' : ''}
    </button>`;
    // Alex (2026-10-22): "Outside of scenarios I should be able to initiate a draft and commit a
    // PO to see how that solves the problem" -- answered via clarify: committed directly against
    // live (no scenario wrapper), as its own separate path from the scenario-based draft PO flow
    // above. On "Live Forecast" this button creates a REAL order immediately; on a draft scenario
    // it still models a hypothetical via openDraftPoModal as before.
    const isLiveView = S.selectedScenarioId === 'live';
    const actionCell = !canEdit()
      ? '<span class="muted" style="font-size:11px;">—</span>'
      : isLiveView
      ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="initiateLivePoFromOutlook('${p.product_id}', null, '${months[0]}', null)">+ Initiate PO</button>`
      : (isEditable() ? `<button class="btn btn-ghost" style="padding:3px 8px; font-size:12px;" onclick="openDraftPoModal('${p.product_id}', '${months[0]}')">+ Draft PO</button>` : '<span class="muted" style="font-size:11px;">—</span>');
    return [nameCell, todayCell, ...cells, statusCell, actionCell];
  });
  const outlookTable = outlookRows.length
    ? kpiTable(['Product', 'Today', ...months.map(m => `EOM ${monthLabelShort(m)}`), 'Status', ''], outlookRows, null, [monthColWidths[0], '80px', ...monthColWidths.slice(1), '80px', '110px'], [1, 2, 3, 4, 5, 6, 7, 8, 9])
    : `<div class="empty-state" style="padding:10px; font-size:13px;">No products match this filter.</div>`;

  // ---------- Committed POs record (Alex, 2026-10-22: "I'd like to see a record of it") ----------
  // Every real purchase_orders row ever materialized by committing a Revenue tab scenario,
  // regardless of which scenario is currently selected above -- a persistent audit trail, not
  // just something visible while re-viewing the exact scenario that created it.
  const committedPoRows = (S.committedScenarioPOs || []).map(po => {
    const placeBy = po.eta_date && po.vendors?.default_lead_days != null
      ? window.RevenueLogic.computePlaceByDate(po.eta_date, po.vendors.default_lead_days)
      : null;
    return [
      po.revenue_scenarios?.name || '<span class="muted">—</span>',
      `<strong>${po.products?.display_name || '—'}</strong><br><span class="muted" style="font-size:11px;">${po.internal_ref}</span>`,
      (po.qty_ordered || 0).toLocaleString(),
      po.vendors?.vendor_name || '—',
      `<span class="pill ${po.status === 'landed' ? 'good' : 'watch'}">${po.status}</span>`,
      fmtDate(po.eta_date),
      placeBy ? fmtDate(placeBy) : '—',
    ];
  });
  const committedPoTable = committedPoRows.length
    ? kpiTable(['Scenario', 'Product', 'Qty', 'Vendor', 'Status', 'ETA', 'Was due by'], committedPoRows, null, null, [2, 3, 4, 5, 6])
    : null; // card only renders when there's at least one committed PO to show

  el.innerHTML = `
    <div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="section-label" style="margin:0;">Scenario:</div>
      <select id="scenario-select" style="padding:5px 8px; border-radius:6px; border:1px solid var(--border); font-size:14px;" onchange="selectRevenueScenario(this.value)">
        ${scenarioOptions}
      </select>
      ${sc ? `<span class="pill ${sc.status === 'draft' ? 'watch' : 'good'}">${sc.status}</span>` : `<span class="muted" style="font-size:13px;">read-only — create a scenario to model changes</span>`}
      ${canEdit() ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:13px;" onclick="createRevenueScenario()">+ New Scenario</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:13px;" onclick="commitRevenueScenario()">Commit to Live</button>` : ''}
      ${sc && sc.status === 'draft' ? `<button class="btn btn-ghost" style="padding:5px 10px; font-size:13px; color:var(--bad-text);" onclick="deleteRevenueScenario('${sc.id}')">Delete Draft</button>` : ''}
    </div>

    <div class="card" style="padding:14px 16px; margin-bottom:12px;">
      <div class="section-label" style="margin:0 0 2px;">Top-Line Revenue by Channel</div>
      <div class="muted" style="font-size:12px; margin-bottom:8px;">${chanEditable ? 'Click a month to edit.' : 'You do not have permission to edit.'} Tag under each value shows whether it's real actuals, blended MTD, or a manual assumption — assumptions sharpen into actuals as each month closes.</div>
      ${channelTable}
    </div>

    <div class="card" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; gap:6px; margin:0 0 8px;">
        <div class="section-label" style="margin:0;">Product Mix → Inventory Throughput &amp; Outlook</div>

function renderProductTrendChart() {
  const S = window._revState;
  const channel = window._trendChartChannel || 'shopify';
  const monthsBack = window._trendChartMonths || 6;
  const ids = Array.from(window._trendChartProductIds || []);
  if (!ids.length) return;
  const colors = ['#5C4A36', '#8A7257', '#C9A876', '#3F6B35', '#A33B2E', '#96631A'];
  const chartId = 'product-trend-chart';

  const channelToggle = `
    <div style="display:flex; gap:6px;">
      ${['shopify', 'amazon'].map(ch => `<button class="btn ${channel === ch ? 'btn-primary' : 'btn-ghost'}" style="padding:5px 11px; font-size:13px;" onclick="setTrendChartChannel('${ch}')">${ch === 'shopify' ? 'Shopify' : 'Amazon'}</button>`).join('')}
    </div>
  `;
  const periodToggle = `
    <div style="display:flex; gap:6px;">
      ${[3, 6, 12].map(n => `<button class="btn ${monthsBack === n ? 'btn-primary' : 'btn-ghost'}" style="padding:5px 11px; font-size:13px;" onclick="setTrendChartMonths(${n})">${n} mo</button>`).join('')}
    </div>
  `;
  const skuMultiSelectBtn = `<button class="btn btn-ghost" style="padding:5px 10px; font-size:13px;" onclick="toggleTrendChartSkuMenu(event)">SKUs (${ids.length}) ▾</button>`;

  const legendRows = ids.map((pid, i) => {
    const p = S.products.find(pr => pr.product_id === pid);
    return `
      <div style="display:flex; align-items:center; gap:7px; margin:3px 0;">
        <span style="width:12px; height:12px; border-radius:50%; background:${colors[i % colors.length]}; display:inline-block;"></span>
        <span style="font-size:15px; font-weight:600;">${p?.display_name || pid}</span>
        ${ids.length > 1 ? `<button class="btn btn-ghost" style="padding:2px 7px; font-size:11px; margin-left:4px;" onclick="removeProductFromTrendChart('${pid}')">✕</button>` : ''}
      </div>
    `;
  }).join('');

  const body = `
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border);">
      ${channelToggle}
      ${periodToggle}
      ${skuMultiSelectBtn}
    </div>
    <div style="margin-bottom:8px;">${legendRows}</div>
    <div style="height:280px;"><canvas id="${chartId}"></canvas></div>
    <div class="muted" style="font-size:12px; margin-top:8px;">
      Real actual history only (${channel === 'shopify' ? 'Shopify' : 'Amazon'}) -- no future projections. ${channel === 'amazon' ? 'Amazon has no historical ingestion yet -- chart will be empty.' : ''}
    </div>
  `;
  showDetail(`% of Revenue — Trend (${channel === 'shopify' ? 'Shopify' : 'Amazon'})`, body, 'wide');

  const canvas = document.getElementById(chartId);
  if (!canvas) return;
  if (window._trendChartInstance) { window._trendChartInstance.destroy(); window._trendChartInstance = null; }

  // Alex (2026-11-10): "shouldn't include future projections" -- actual history only, no
  // dashed/projected dataset at all. Window is the last N real months that exist in history,
  // not N months counted from today (so it still shows real data even if the most recent ingest
  // is a few days behind), capped at the selected monthsBack toggle.
  const historyMonthSet = new Set();
  ids.forEach(pid => (S.historicalPctByProduct[pid] || []).forEach(h => historyMonthSet.add(h.month)));
  const allMonths = Array.from(historyMonthSet).sort().slice(-monthsBack);
  const labels = allMonths.map(m => monthLabelShort(m));

  const datasets = ids.map((pid, i) => {
    const p = S.products.find(pr => pr.product_id === pid);
    const color = colors[i % colors.length];
    const hist = S.historicalPctByProduct[pid] || [];
    const histByMonth = Object.fromEntries(hist.map(h => [h.month, h.pct * 100]));
    const data = allMonths.map(m => histByMonth[m] ?? null);
    return {
      label: p?.display_name || pid, data,
      borderColor: color, backgroundColor: color, spanGaps: false, tension: 0.15, pointRadius: 4,
    };
  });

  window._trendChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(1) + '%'}` } },
      },
      scales: {
        x: { ticks: { font: { size: 12 } } },
        y: { beginAtZero: true, ticks: { font: { size: 12 }, callback: (v) => `${v}%` } },
      },
    },
  });
}

async function renderInventory() {
  const el = document.getElementById('tab-inventory');
  const { data: products } = await sb.from('product_qoh').select('*').order('sku_code');
  const { data: projections } = await sb.from('monthly_projections').select('*').order('projection_month');

  el.innerHTML = `
    <div class="section-label">Finished Goods — Quantity on Hand &amp; Safety Stock</div>
    <div class="kpi-grid" id="inventory-cards"></div>
  `;
  const cardsEl = document.getElementById('inventory-cards');
  const sortedProducts = [...(products || [])].sort((a, b) => productSortRank(a.display_name) - productSortRank(b.display_name) || a.display_name.localeCompare(b.display_name));
  cardsEl.innerHTML = sortedProducts.map(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const belowSafety = p.qty_on_hand < p.safety_stock_qty;
    const canvasId = 'spark-' + p.product_id;
    return `
      <div class="card kpi-card">
        <div class="kpi-label">${p.display_name}<br><span style="font-weight:400;">${p.sku_code}</span></div>
        <div class="kpi-value">${p.qty_on_hand.toLocaleString()}</div>

        <div class="sparkline-wrap"><canvas id="${canvasId}"></canvas></div>
      </div>
    `;
  }).join('') || `<div class="empty-state">No products found.</div>`;

  (products || []).forEach(p => {
    const projRows = (projections || []).filter(m => m.product_id === p.product_id).sort((a, b) => a.projection_month.localeCompare(b.projection_month));
    const canvas = document.getElementById('spark-' + p.product_id);
    if (!canvas || projRows.length === 0) return;
    new Chart(canvas, {
      type: 'line',
      data: {
        labels: projRows.map(r => r.projection_month),
        datasets: [{
          data: projRows.map(r => r.eom_inventory),
          borderColor: '#8A7257', borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });

}

      </table>
    </div>

    <div class="section-label">Planned Actions &amp; Comms — In-Flight Component Orders</div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Component</th><th>Vendor</th><th>ETA</th><th>Next Contact</th><th>Status</th></tr></thead>
        <tbody>
          ${(ledger || []).map(l => {
            const overdue = l.next_contact && new Date(l.next_contact) < new Date();
            return `
            <tr>
              <td>${l.components ? l.components.component_name : '—'}</td>
              <td>${l.vendors ? l.vendors.vendor_name : '—'}</td>
              <td>${fmtDate(l.eta)}</td>
              <td>${fmtDate(l.next_contact)}</td>
              <td><span class="pill ${overdue ? 'bad' : 'good'}">${overdue ? 'overdue for contact' : 'on track'}</span></td>
            </tr>
          `}).join('') || `<tr><td colspan="5" class="empty-state">No in-flight component orders.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

// ---------- Boot ----------
// Only (re)render the whole app on an actual sign-in — NOT on every auth event. Supabase fires
// TOKEN_REFRESHED periodically (including when the browser tab regains focus/visibility), and
// re-running loadApp() on that event was wiping all filter selections every time Alex switched
// away and back to the tab (found 2026-10-21). SIGNED_IN/INITIAL_SESSION only fire once per
// actual login, which is the only time we need a full rebuild.
sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) loadApp(session);
});
checkSession();
</script>
</body>
</html>
